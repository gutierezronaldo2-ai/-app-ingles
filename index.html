d studied law, I would have a different job today. I wish I had studied harder."], ["Tom", "If she hadn't moved to London, she wouldn't know so many people. Without her, I'd have been lonely."], ["Ana", "Without your help, I would have failed. I wish I had known sooner."], ["Tom", "If we had taken the train, we wouldn't be late now. But for the traffic, we'd be fine."], ["Ana", "Should we have left earlier? If we had, we wouldn't be rushing now."], ["Tom", "I wish I had listened. If I were more patient, I'd have accepted it."], ["Ana", "Agreed. I'll be more careful next time. If I make the same mistake, I'll be annoyed."], ["Tom", "Good. Let's plan better."]], "c1-u5-lec1": [["Ana", "The study will analyse the effects of sleep on memory."], ["Tom", "The results indicate a strong link, but we can't assume the sample is representative."], ["Ana", "That's a fair point. We need to establish whether the participants were similar."], ["Tom", "The data seem to suggest a trend, though it's too early to draw firm conclusions."], ["Ana", "I'd argue the evidence indicates a clear pattern. We should analyse it further."], ["Tom", "Agreed. Let's establish a baseline first."], ["Ana", "Good. We can assume the method is reliable, once we check it."], ["Tom", "I'll review the protocol and report back."]], "c1-u5-lec2": [["Ana", "The study will analyse the effects of sleep on memory. We can't assume the sample is representative."], ["Tom", "The results indicate a strong link, but it's too early to draw firm conclusions."], ["Ana", "Our hypothesis is supported by the evidence, but the approach needs refining. Would you agree?"], ["Tom", "The new approach changed our findings significantly. Is the sample large enough?"], ["Ana", "It's a reasonable concern. The hypothesis may need revision, but the data suggest a clear pattern."], ["Tom", "The evidence is strong, though. I'd say the approach is sound."], ["Ana", "Let's present the findings with a clear hypothesis and a note on the approach."], ["Tom", "Good idea. Please include the limitations too."]], "c1-u5-lec3": [["Ana", "The data was incomplete. Nevertheless, we reached a conclusion. We should analyse it once more."], ["Tom", "Consequently, reviewers may question the sample. Furthermore, the timing was unusual."], ["Ana", "Nevertheless, the results are robust. Moreover, the effect size is large, which suggests a real link."], ["Tom", "That's true. However, we should acknowledge the limitations of the hypothesis."], ["Ana", "Consequently, we'll add a section on the data gaps. The evidence then supports the hypothesis more clearly."], ["Tom", "Good. Furthermore, we should explain how we handled the missing values."], ["Ana", "Nevertheless, I think the paper is strong."], ["Tom", "I agree. Let's send it on Friday."]], "c1-u5-lec4": [["Ana", "We have conducted research on this topic for two years. The data suggest a clear trend."], ["Tom", "It's hard to draw conclusions from such limited data. However, the sample was well chosen."], ["Ana", "The teams reached a consensus after a long discussion. Nevertheless, some doubts remain."], ["Tom", "Perhaps, but we need to conduct further research before we publish. Consequently, we should wait."], ["Ana", "Agreed. We should draw conclusions only where the evidence is clear."], ["Tom", "Let's also ask an external reviewer to check our reasoning. The hypothesis needs fresh eyes."], ["Ana", "Good idea. That would strengthen the paper."], ["Tom", "I'll contact them this afternoon."]], "c1-u5-lec5": [["Ana", "The difference between the groups is statistically significant. The hypothesis is supported."], ["Tom", "Is it substantial, though, or just significant on paper?"], ["Ana", "It's relevant to our question, and the increase is substantial. Consequently, the policy case is stronger."], ["Tom", "Fair. I'd call it a meaningful effect, but not a dramatic one. The evidence suggests it."], ["Ana", "That's a reasonable description. The data is relevant to the policy debate."], ["Tom", "Agreed. We should describe it carefully, given the limitations."], ["Ana", "Yes. Let's use \"significant\" only where the test supports it."], ["Tom", "Good. I'll revise that paragraph tonight."]], "c1-u5-lec6": [["Ana", "Smoking tends to increase the risk, but the data appear to be limited. Nevertheless, it's worth analysing."], ["Tom", "The results seem to support our view, though I wouldn't claim too much."], ["Ana", "That's wise. The findings appear to suggest a link rather than a cause. Moreover, the hypothesis is not proven."], ["Tom", "Exactly. We should avoid saying the effect is certain."], ["Ana", "Agreed. I'd suggest \"may indicate\" rather than \"proves\". Consequently, reviewers will trust it more."], ["Tom", "Good. That's a more cautious and accurate claim."], ["Ana", "It tends to be safer in academic writing."], ["Tom", "Yes, reviewers appreciate that."]], "c1-u5-lec7": [["Ana", "The study suggests a significant correlation between sleep and memory. Nevertheless, the sample was small."], ["Tom", "Researchers attribute the result to several factors, so we should be careful. Consequently, the conclusion must be cautious."], ["Ana", "The evidence appears to support the hypothesis, and the difference is substantial. Moreover, the teams reached a consensus."], ["Tom", "Smoking tends to increase the risk, and the data indicate it, though it's limited."], ["Ana", "Agreed. Nevertheless, the conclusion is sound. Consequently, we can publish."], ["Tom", "Let's finalise the abstract, then."], ["Ana", "Good. I'll send you the draft tonight."], ["Tom", "Perfect. Thanks for the careful work."]], "c1-u6-lec1": [["Ana", "Admittedly, the plan is expensive. However, it would reduce traffic within a year."], ["Tom", "Granted that it's expensive, the plan has clear advantages for the city."], ["Ana", "Those advantages are real, but the costs fall on the taxpayers."], ["Tom", "Admittedly, that's a concern. However, the long-term savings are considerable."], ["Ana", "Granted that the savings exist, the timing is still a problem."], ["Tom", "I see your point. However, delaying would only make it worse."], ["Ana", "Fair enough. I'd want a clear budget before I agree."], ["Tom", "Agreed. Let's review the figures together."]], "c1-u6-lec2": [["Ana", "The plan will create jobs, and that's a strong argument. Admittedly, the costs are high."], ["Tom", "That may be true, but it doesn't prove the plan is the best option. Granted that jobs matter, the budget matters too."], ["Ana", "Our research shows the jobs would be temporary. However, the results are not final."], ["Tom", "That may be true, but the construction phase alone would support hundreds of families."], ["Ana", "That may be true, but the cost per job is very high. Admittedly, that's a rough estimate."], ["Tom", "That's a fair point, but it doesn't settle the question."], ["Ana", "I'd still like to see better evidence. Granted, the data are promising."], ["Tom", "Fair. Let's look at the data together."]], "c1-u6-lec3": [["Ana", "The plan will reduce pollution, won't it? Admittedly, that's the official claim."], ["Tom", "On the contrary, the evidence shows pollution would stay the same. The claim may be true for some areas, but not all."], ["Ana", "Far from helping, the new road could increase traffic in the centre. Granted, it's a small road."], ["Tom", "Far from being a solution, it might simply move the problem somewhere else. However, the surveys seem positive."], ["Ana", "On the contrary, the surveys suggest people would use the bus more."], ["Tom", "The surveys were carried out in the wealthy districts only."], ["Ana", "That's a good point. Far from representative, the sample was limited."], ["Tom", "Exactly. We need broader data."]], "c1-u6-lec4": [["Ana", "Above all, we must protect the most vulnerable residents. Granted, the budget is tight."], ["Tom", "What's more, the plan would leave many small shops without customers. The council says it will help them; on the contrary, it's a big risk."], ["Ana", "What's more, the deadline for the consultation is next week. However, there's still time."], ["Tom", "Above all, the decision should be transparent to the public. That may be true, but people need clear figures."], ["Ana", "What's more, the council hasn't published the full costs."], ["Tom", "That's a serious problem. Above all, people deserve clear information."], ["Ana", "I agree. The case for the plan is weak without it."], ["Tom", "Exactly. Let's put that in our response."]], "c1-u6-lec5": [["Ana", "Is it really the case that the plan will reduce congestion? Admittedly, the data look promising."], ["Tom", "It can be argued that congestion would simply shift to the nearby streets. Above all, we need to check that."], ["Ana", "Is it really the case that the council has considered alternatives? I have my doubts."], ["Tom", "It can be argued that they haven't. The report doesn't mention any."], ["Ana", "Is it really the case that the public supports the plan? Far from it, the petition suggests otherwise."], ["Tom", "That may be true, but it's just one petition."], ["Ana", "Then we should question the assumptions behind the whole proposal."], ["Tom", "Agreed. Let's list them."]], "c1-u6-lec6": [["Ana", "This argument is arguably the weakest in the proposal. Granted, it's not the only one."], ["Tom", "It's arguably the strongest point, though. The data supports it."], ["Ana", "The cost estimate is arguably too optimistic. Is it really the case that the figures are complete?"], ["Tom", "Arguably, the timing is the bigger problem. On the contrary, the costs seem fine."], ["Ana", "We could argue that the plan is unfair to local businesses. Above all, they need support."], ["Tom", "Which is precisely why the council should consult them."], ["Ana", "True. Arguably, the consultation should come first."], ["Tom", "I'd agree with that."]], "c1-u6-lec7": [["Ana", "I admit that the plan is expensive. However, it saves time in the long run."], ["Tom", "Although the costs are high, the benefits are clear. Is it really the case that the costs are final?"], ["Ana", "Admittedly, the rules in the plan are strict. Above all, they protect people. On the contrary, some say they're too strict."], ["Tom", "That may be true, but what's more, the results are good."], ["Ana", "Granted that the results are good, we still need the budget. It can be argued that the budget comes first."], ["Tom", "Fair. Let's ask for the figures on Monday."], ["Ana", "Agreed. Arguably, that's the sensible step."], ["Tom", "Yes, let's do that."]], "c1-u7-lec1": [["Ana", "Shall we go through the agenda first?"], ["Tom", "Yes. Let's start with the budget, then the timeline. I'll send the minutes afterwards."], ["Ana", "Good. Can we also agree on the action points before we finish?"], ["Tom", "Absolutely. I'll take notes on who is responsible for each one."], ["Ana", "The agenda is long today. Can we keep the discussion focused?"], ["Tom", "Of course. Let's move quickly through the first two items."], ["Ana", "Thanks. I'll make sure the minutes reach everyone by Friday."], ["Tom", "Perfect. That works for me."]], "c1-u7-lec2": [["Ana", "Shall we go through the agenda first? I'll make sure the minutes reach everyone by Friday."], ["Tom", "Yes. Let's start with the budget, then the timeline. I'll send the minutes afterwards."], ["Ana", "Good. I also sent you an email: I'm writing to follow up on our meeting last Tuesday. Please find the revised proposal attached."], ["Tom", "Thanks for your email. Let me know if anything needs clarifying."], ["Ana", "We'd appreciate it if you could review the budget section. Could you also agree on the action points?"], ["Tom", "Of course. I'll get back to you by the end of the week."], ["Ana", "Please find the updated timeline attached as well. Thank you, I look forward to hearing from you."], ["Tom", "Likewise. Best regards."]], "c1-u7-lec3": [["Ana", "We'd be willing to lower the price if you commit to a longer contract. Shall we agree the terms today?"], ["Tom", "Would you consider a shorter delivery time instead? I'll make sure the team is ready."], ["Ana", "We could consider it, but the price would have to stay the same."], ["Tom", "That's fair. Would you be willing to split the cost of the training?"], ["Ana", "We'd be willing to split it, provided the schedule is confirmed."], ["Tom", "Good. Would you consider meeting next week to finalise the terms?"], ["Ana", "Yes, we would. Let's do that."], ["Tom", "Great. I'll send you a calendar invite."]], "c1-u7-lec4": [["Ana", "I'd like to follow up on the email I sent last week. Please find my notes attached."], ["Tom", "Of course. Let's move on to the next point, then come back to that."], ["Ana", "Before we move on, can we confirm the deadline? Would you be willing to extend it?"], ["Tom", "Yes, we'd be willing to. The deadline is now the end of May. Let's move on to the budget."], ["Ana", "Just to follow up, who is handling the supplier contract?"], ["Tom", "I am. I'll make sure I follow up with them tomorrow."], ["Ana", "Perfect. Let's move on, then."], ["Tom", "Agreed."]], "c1-u7-lec5": [["Ana", "Our sales grew by ten percent last year, and our revenue reached two million. Let's look at the details next."], ["Tom", "That's encouraging. However, profit margins were lower than expected."], ["Ana", "Yes, the costs grew faster than our revenue, which is a concern. Would you consider cutting some of them?"], ["Tom", "Let's look at where the growth came from, and where we can improve profit."], ["Ana", "The main growth came from the new markets."], ["Tom", "Good. If we keep investing there, the profit should recover."], ["Ana", "I agree. I'll follow up with finance on next year's forecast."], ["Tom", "Let's confirm that with the finance team."]], "c1-u7-lec6": [["Ana", "Could you send me the minutes of the last meeting? Please find my notes attached as well."], ["Tom", "Of course. Let me walk you through the new plan first, though."], ["Ana", "Please do. Could you also send the revised figures? We'd be willing to review them today, provided they're complete."], ["Tom", "I'll send them today. Let me walk you through the main changes."], ["Ana", "That would help. Could you explain the timeline too?"], ["Tom", "Certainly. The first phase starts in June, and I'll make sure you get the details."], ["Ana", "Thanks. That's very clear."], ["Tom", "Glad it helps. I'll send everything this afternoon."]], "c1-u7-lec7": [["Ana", "The meeting is scheduled for Monday. I'm writing to follow up on the proposal."], ["Tom", "We need to reach a consensus before the deadline. Would you be willing to meet earlier?"], ["Ana", "Yes, I'd be willing to meet earlier. Could you send the minutes? I'd like to walk through the plan again."], ["Tom", "Of course. Let me walk you through the budget first. Our sales grew, so the figures should be positive."], ["Ana", "Good. Would you consider moving the deadline by a week?"], ["Tom", "We'd be willing to, provided the client agrees."], ["Ana", "Let's go through the action points, then, and move on afterwards."], ["Tom", "Agreed. I'll send the summary afterwards."]], "c1-u8-lec1": [["Ana", "Income inequality is a serious issue in many countries, including ours."], ["Tom", "True, although poverty has fallen in our neighbourhood over the last decade."], ["Ana", "That's good news, but integration is still a challenge for some families."], ["Tom", "Agreed. Inequality has increased in some areas, and that affects community life."], ["Ana", "Local programmes seem to help. Are they making a difference?"], ["Tom", "Some are. Integration takes time, but the results are promising."], ["Ana", "I hope the government keeps investing in them."], ["Tom", "So do I. It's an issue that affects everyone."]], "c1-u8-lec2": [["Ana", "Some customs are disappearing from small villages, as young people move to the city. Although it's sad, it's natural."], ["Tom", "Technology has had an impact on traditions too. Many festivals are now online."], ["Ana", "That's a mixed blessing. Traditions can survive, but they tend to change."], ["Tom", "Exactly. The festival in my village still happens every year, though it's smaller now."], ["Ana", "Income inequality is a serious issue in many countries, including ours. Does the festival help with that?"], ["Tom", "I think so. Although poverty has fallen in our neighbourhood, the festival brings people together."], ["Ana", "I'd like to see more young people get involved."], ["Tom", "They are, especially through social media. It's a new way of keeping traditions alive."]], "c1-u8-lec3": [["Ana", "It's widely believed that social media has changed how we talk to each other. Some customs have changed too."], ["Tom", "It has, although I'm not convinced it's entirely negative. Traditions tend to adapt."], ["Ana", "Many people feel it's made conversations shallower. It's said that inequality also affects access to the internet."], ["Tom", "Some do. However, it's also widely believed that technology has improved access to information."], ["Ana", "True. Both things can be true at the same time."], ["Tom", "Exactly. The question is how we use it."], ["Ana", "I'd agree. It's a matter of habit."], ["Tom", "That's a fair way to put it."]], "c1-u8-lec4": [["Ana", "Young people tend to move to big cities for work. Inequality is likely to rise if that continues."], ["Tom", "They're likely to stay there longer now, given the housing market. It's widely believed that prices are high."], ["Ana", "Integration is likely to take time, especially in those areas. Although the programmes help, progress is slow."], ["Tom", "Agreed. Traditions tend to survive best in smaller communities."], ["Ana", "Customs are likely to change as people move more. Social media may speed that up."], ["Tom", "That's probably true. But change doesn't always mean loss."], ["Ana", "I think you're right. Communities tend to adapt."], ["Tom", "Yes, they usually find a way."]], "c1-u8-lec5": [["Ana", "As far as tourism is concerned, the town has changed a lot in ten years. Traditions are likely to attract more visitors."], ["Tom", "In terms of jobs, the city is improving, although unevenly."], ["Ana", "As far as housing is concerned, prices are still a problem for young people. Inequality tends to be worst there."], ["Tom", "Agreed. In terms of education, though, the schools have improved."], ["Ana", "As far as the environment is concerned, there's a long way to go."], ["Tom", "True. In terms of transport, the new lines have helped."], ["Ana", "So overall, progress is mixed. It's widely believed that the next decade will decide it."], ["Tom", "That's a fair summary."]], "c1-u8-lec6": [["Ana", "The campaign aims to raise awareness of the problem among families. As far as I know, it's well funded."], ["Tom", "The new law will have an impact on schools too, although its details are still unclear."], ["Ana", "I hope it will raise awareness of the issue in the wider community. Widely believed or not, we need proof."], ["Tom", "It could have an impact on how people think about inequality. Some customs may change too."], ["Ana", "Local media can help raise awareness, too."], ["Tom", "Absolutely. Coverage has a real impact on public opinion."], ["Ana", "Then we should support the campaign."], ["Tom", "Agreed. Let's share it."]], "c1-u8-lec7": [["Ana", "Poverty and inequality remain serious challenges in many cities. It's widely believed they are getting worse."], ["Tom", "Social media has changed how young people communicate, and it is likely to affect politics too."], ["Ana", "As far as poverty is concerned, the campaign aims to raise awareness. Some customs help, though."], ["Tom", "Young people tend to move to cities, and that is likely to raise housing prices."], ["Ana", "Widely believed or not, the figures are clear."], ["Tom", "Agreed. In terms of policy, we should act now."], ["Ana", "Let's raise awareness, then."], ["Tom", "Good. I'll share the report."]], "c1-u9-lec1": [["Ana", "The new policy will affect the whole team, and it's had a strong effect on morale."], ["Tom", "I'm not surprised. Even the weather can affect the harvest, and that has an effect on prices too, so a policy can affect morale."], ["Ana", "Did the decision affect your schedule?"], ["Tom", "It did. Its effect was smaller than I expected, though."], ["Ana", "The changes will affect everyone differently."], ["Tom", "True. The effect on the younger staff is the biggest concern."], ["Ana", "I hope it won't affect the results too much."], ["Tom", "Let's monitor the effect over a few months."]], "c1-u9-lec2": [["Ana", "The new policy will affect the whole team. Its effect on morale could be strong."], ["Tom", "I'm not surprised. Even the weather can affect the harvest, and that has an effect on prices too, so a policy can affect morale."], ["Ana", "His answer seemed to imply that he was guilty. Did the decision affect your schedule?"], ["Tom", "I'd infer from his tone that he was defensive, not guilty. It did affect me, though."], ["Ana", "Her silence implies that she disagrees with the plan. The changes will affect everyone differently."], ["Tom", "What does your email imply about the deadline?"], ["Ana", "I infer that it has moved, but it's not written clearly."], ["Tom", "Exactly. I'd read it the same way. Let's not infer too much."]], "c1-u9-lec3": [["Ana", "From your voice, I can infer that you were upset this morning. Did it affect your work?"], ["Tom", "Yes, but I don't want that to imply anything about the project. It had little effect on the team."], ["Ana", "From the data, we can infer a clear trend. The policy's effect is visible."], ["Tom", "I infer from the emails that the team is tired and needs a break."], ["Ana", "From her silence, we can infer that she was not convinced."], ["Tom", "Possibly. Let's not infer her opinion; let's ask her."], ["Ana", "Good point. I'll ask her in the meeting."], ["Tom", "Let me know what she says."]], "c1-u9-lec4": [["Ana", "There are few people in the office on Fridays. I infer they're working from home."], ["Tom", "That's true. I have a few ideas for the project, though. Do you think they affect the timeline?"], ["Ana", "I think so. There are few options left, so we need to choose quickly. The effect on sales could be big."], ["Tom", "I have few questions, but I'd like a few more details. Let's start with a few of the simplest ones."], ["Ana", "A few of our clients have already agreed."], ["Tom", "That's a good sign. Few companies would say no."]], "c1-u9-lec5": [["Ana", "There is little hope left for the old plan. A few people still believe in it, though."], ["Tom", "I have a little time before the meeting, so let's talk quickly."], ["Ana", "There is little time, but we have a little money for the new idea. Few teams would manage that."], ["Tom", "There is little progress so far, but a little is better than nothing."], ["Ana", "Little did we expect such a reaction. It seems to have affected them badly."], ["Tom", "Little wonder. The idea needs a little more work."], ["Ana", "Then let's take a little break and come back to it."], ["Tom", "Good idea. A little rest will help."]], "c1-u9-lec6": [["Ana", "We need to make a decision by Friday. I'll do the research, and it implies more work for me."], ["Tom", "I'll do the research this afternoon, and you can make the final call."], ["Ana", "She made a mistake in the figures, so she'll do the report again."], ["Tom", "We must make a plan and do the work properly this time. Few people do that well."], ["Ana", "What did you do about the supplier?"], ["Tom", "I made a phone call and did the paperwork. Now we just have to make the payment."], ["Ana", "Good. Let's do the rest tomorrow."], ["Tom", "Agreed. We'll make progress then."]], "c1-u9-lec7": [["Ana", "Please lie down for a while if you feel tired. The stress has affected you."], ["Tom", "Thanks. Can you lay the documents on the table first? I infer you want them now."], ["Ana", "Yes, please. The new policy had a positive effect on sales, and few people expected that."], ["Tom", "That is good news. Even the weather may affect the harvest, and her speech affected the audience too."], ["Ana", "Did you lay the report on my desk?"], ["Tom", "Yes, I laid it there this morning. Did you read it? A few lines made me think."], ["Ana", "Not yet. I'll lie on the sofa and read it after lunch."], ["Tom", "Sounds like a plan."]], "c1-u10-lec1": [["Ana", "I've read your draft. Moreover, the argument is clear, but the conclusion needs work."], ["Tom", "Thanks. Consequently, I'll rewrite the final section."], ["Ana", "The policy failed to reduce costs. Moreover, it increased delays."], ["Tom", "Consequently, the budget was reviewed. Furthermore, the report recommends changes."], ["Ana", "Furthermore, the data is outdated, so the decision is premature."], ["Tom", "Agreed. Consequently, we should update the figures."], ["Ana", "Moreover, we should check the references."], ["Tom", "Good idea. I'll do that before we submit."]], "c1-u10-lec2": [["Ana", "I've read your draft. Moreover, the argument is clear, but the conclusion needs work."], ["Tom", "Thanks. Consequently, I'll rewrite the final section."], ["Ana", "In formal writing, you should use \"do not\" instead of \"don't\". Furthermore, avoid \"can't\"."], ["Tom", "And \"it is\" rather than \"it's\", I suppose. Moreover, I'll avoid informal words like \"a lot\"."], ["Ana", "Exactly. Use \"cannot\" instead of \"can't\". Consequently, the tone will be more formal."], ["Tom", "I'll replace \"they're\" with \"they are\" throughout."], ["Ana", "Also avoid \"they're\" in the conclusion."], ["Tom", "Well done. Thanks. I'll check the rest of the draft."]], "c1-u10-lec3": [["Ana", "The study suggests that prices will rise over the next decade. Moreover, it does not say why."], ["Tom", "This essay examines the main causes of inflation. The essay does not explain the policy, so I'd add that."], ["Ana", "The report concludes that the policy failed to meet its aims. Consequently, the government should review it."], ["Tom", "The data suggest a clear trend, and the authors argue it is structural."], ["Ana", "The paper examines three cases and concludes that the method is effective."], ["Tom", "Furthermore, it suggests further research on the long-term effects."], ["Ana", "Good. Let's use \"examines\" in the introduction."], ["Tom", "I'll revise the abstract accordingly."]], "c1-u10-lec4": [["Ana", "It has been decided that the project will start in May. Consequently, the budget must be ready."], ["Tom", "It has been agreed that the budget will be reviewed. The study suggests it's needed."], ["Ana", "It has been suggested that the policy should change. Moreover, the team must act."], ["Tom", "It has been argued that the results are not conclusive. The authors examine the reasons."], ["Ana", "It is generally accepted that the deadline is tight."], ["Tom", "Yes. It could be argued that we need more time, too."], ["Ana", "Let's write that in the report."], ["Tom", "Agreed. I'll add it to the summary."]], "c1-u10-lec5": [["Ana", "The implementation of the new system took two months. Moreover, it has been agreed that it will continue."], ["Tom", "The analysis of the data was completed last week. It has been suggested that we use it."], ["Ana", "The development of the plan required careful consultation. Furthermore, the reduction of costs was key."], ["Tom", "The reduction of costs was the main goal of the review. Consequently, the data were reviewed."], ["Ana", "Our recommendation is the adoption of a phased approach."], ["Tom", "Good. The evaluation of the results will follow in June."], ["Ana", "That reads much more formally."], ["Tom", "Yes. It sounds like a proper report now."]], "c1-u10-lec6": [["Ana", "It could be argued that the reform was necessary, although the evidence is mixed."], ["Tom", "It could be argued that the study is limited by its sample size. It has been suggested that it's too small."], ["Ana", "It could be argued that the budget was too small from the start. The implementation was also delayed."], ["Tom", "The results appear to suggest a trend, but further evidence is needed."], ["Ana", "It is possible that the policy had some effect, though it is hard to prove."], ["Tom", "That's the cautious tone reviewers want."], ["Ana", "Yes. We should avoid overstating the conclusions."], ["Tom", "Agreed. Let's keep the claims measured."]], "c1-u10-lec7": [["Ana", "Furthermore, the evidence supports this view. Let's finalise it."], ["Tom", "Consequently, the government should review the law, as the report recommends."], ["Ana", "In conclusion, change is necessary, though it may take time. It has been suggested that the process is slow."], ["Tom", "It has been decided that the review will start in May, so we need the final draft soon."], ["Ana", "Moreover, we should check the references before submitting. The analysis of the references is quick."], ["Tom", "Agreed. I'll do it this evening."], ["Ana", "Thanks. I'll read it again in the morning."], ["Tom", "Good plan."]], "c2-u1-lec1": [["Ana", "Did you see Laura at the party? I hardly recognised her."], ["Tom", "Nearly everyone was surprised. She looked completely different with short hair."], ["Ana", "We were nearly the last to arrive, weren't we? Almost everyone was there already."], ["Tom", "Almost all of us were late, so nobody noticed. Hardly anyone knows her well, actually. She is almost always quiet."], ["Ana", "I hardly recognised her brother, either. He looked completely different."], ["Tom", "Her brother? I hardly know him. Are we nearly ready to go?"], ["Ana", "Almost. We have hardly any time left."], ["Tom", "Then let's say goodbye."]], "c2-u1-lec2": [["Ana", "Did you hear about the new manager? I hardly know her, but I hear she is great."], ["Tom", "Actually, I worked with her last year. She is currently leading the sales team."], ["Ana", "Actually, I thought she was in Madrid. Is she still based there?"], ["Tom", "Currently, she is working from London. Almost everyone in the team likes her."], ["Ana", "That's good news. The company is currently hiring new staff, nearly fifty people."], ["Tom", "Nearly fifty? I can hardly believe it."], ["Ana", "Actually, it's true. Hardly a week goes by without a new hire."], ["Tom", "Fine. Actually, I think the budget is tight, though."]], "c2-u1-lec3": [["Ana", "It was a sensible decision to wait, actually. Almost nobody agreed at first."], ["Tom", "I hardly think waiting was the right thing. Still, I'm sensitive about the timing."], ["Ana", "Please don't be sensitive about it. Currently the team is nearly ready."], ["Tom", "That's sensible. Actually, I think we should check the figures first."], ["Ana", "Agreed. Hardly anyone would disagree with a sensible plan."], ["Tom", "True. Still, the manager is very sensitive about budget questions."], ["Ana", "Then we should be careful. Actually, I'll speak to her first."], ["Tom", "Sensible again. Let's do that."]], "c2-u1-lec4": [["Ana", "We eventually found the hotel, after nearly two hours. Possibly it was closed."], ["Tom", "Eventually we arrived, but I hardly remember the route. Actually, I think we took the wrong road."], ["Ana", "Possibly, but the staff were sensible about it and helped us."], ["Tom", "Eventually the manager will sort it out. Currently, nothing is clear."], ["Ana", "Can you possibly help me tomorrow? Hardly anyone else knows the system."], ["Tom", "I can possibly come in the morning. Actually, nearly all my tasks are done."], ["Ana", "Eventually we'll finish the project, possibly by Friday."], ["Tom", "Possibly. Let's keep it sensible and check it again."]], "c2-u1-lec5": [["Ana", "I'm dying to see the new film everyone is talking about. Have you seen it?"], ["Tom", "Not yet, but I hardly have time. Actually, I'm currently reading a sensitive novel."], ["Ana", "Oh, I literally cannot wait. Eventually, we should go together."], ["Tom", "Sensible plan. Possibly this weekend, if it's not too busy."], ["Ana", "I'm dying to see it, and nearly everyone I know has seen it already."], ["Tom", "Hardly anyone! Honestly, I'm dying for a good story too."], ["Ana", "Then let's book the tickets now."], ["Tom", "Agreed. I'm dying to see it, too."]], "c2-u1-lec6": [["Ana", "The wine complements the meal well. Actually, it's the best pairing I've had."], ["Tom", "The waiter gave me a compliment on my choice. Nearly everyone at the table agreed."], ["Ana", "Eventually the chef came to our table. Possibly she wanted a compliment too."], ["Tom", "Hardly anyone compliments the staff, so it's sensible to thank her."], ["Ana", "I'm dying to try the dessert now. It should complement the wine."], ["Tom", "Currently, I think the menu is fine. I'm sensitive about the price, though."], ["Ana", "Actually, the price is fair. That's a compliment to the restaurant."], ["Tom", "Agreed. I'll give them a compliment on the way out."]], "c2-u1-lec7": [["Ana", "Did you notice at the team dinner? The team hardly ever complained. Nearly everyone agreed, although almost half the staff were absent."], ["Tom", "Actually, the manager was sensible about it. Currently, we're waiting for the report."], ["Ana", "I'm dying to see the final results. Eventually, we'll know if it works."], ["Tom", "Possibly next week. Did you give the chef a compliment at the dinner?"], ["Ana", "Yes, and the wine complements the meal perfectly."], ["Tom", "That's a nice compliment. Our manager barely spoke during the meeting, though."], ["Ana", "Hardly surprising. She's sensitive about the timing."], ["Tom", "Sensible of her. Let's talk again tomorrow."]], "c2-u2-lec1": [["Tom", "How was the exam, Ana?"], ["Ana", "It was a piece of cake, honestly."], ["Tom", "Really? I finished in ten minutes. Was the reading hard?"], ["Ana", "No, it was a piece of cake. I barely had to think."], ["Tom", "Nice. I'm nervous about the next test, though."], ["Ana", "Don't be. The next test will be a piece of cake too."], ["Tom", "I hope so. Sooner or later I'll stop worrying."], ["Ana", "You'll be fine. Maybe even better than me."], ["Tom", "Thanks. You are very kind."]], "c2-u2-lec2": [["Ana", "Let's talk about something light to break the ice before the meeting."], ["Tom", "Good idea. I can't wait to hear how your holiday went."], ["Ana", "It was a piece of cake to plan. Our hotel was pretty much perfect."], ["Tom", "Pretty much? What was wrong?"], ["Ana", "Barely anything, really. The breakfast was a bit cold."], ["Tom", "Let's break the ice with that story, then. At the moment everyone is arriving."], ["Ana", "I'm nervous about presenting today."], ["Tom", "Don't be. Just start with a joke."]], "c2-u2-lec3": [["Ana", "You hit the nail on the head! That's exactly the problem."], ["Tom", "Thanks. I'm not sure it's a good solution, though."], ["Ana", "Maybe not, but it's a piece of cake to test. Let's try it."], ["Tom", "Sooner or later the client will agree, I hope. Few people expect a fast answer."], ["Ana", "I can't wait to see the result. At the moment we're pretty much ready."], ["Tom", "Right, we just need the final figures. Just about done."], ["Ana", "Break the ice with them tomorrow, then. They'll love the idea."], ["Tom", "Agreed. And you hit the nail on the head about the client, too."]], "c2-u2-lec4": [["Ana", "That restaurant costs an arm and a leg. The price is crazy."], ["Tom", "I agree. The food was excellent, though."], ["Ana", "Maybe, but I don't think it's worth it. Close to thirty euros for a salad!"], ["Tom", "Wise of you to say that. Sooner or later we'll find somewhere cheaper."], ["Ana", "I can't wait to try somewhere new, but not one that costs an arm and a leg."], ["Tom", "You hit the nail on the head there. Let's look for a cheaper place this week."], ["Ana", "At the moment I'm trying to save money, so yes. Cooking at home is a piece of cake."], ["Tom", "Good. Let's break the ice with the others tomorrow and suggest it."]], "c2-u2-lec5": [["Ana", "I can't come today. I'm feeling under the weather."], ["Tom", "Sorry to hear that. Are you still coming to the meeting next week? It will be a piece of cake, just a chat to break the ice with the new client."], ["Ana", "Maybe, if I'm better. I barely slept last night."], ["Tom", "That sounds like a rough night. Rest up."], ["Ana", "Thanks. Most people at work have the same cold. The doctor costs an arm and a leg, though."], ["Tom", "You hit the nail on the head: the whole clinic is overpriced. Sooner or later it will pass."], ["Ana", "Right. I'll email you if I'm better."], ["Tom", "Please do. I can't wait to hear your report."]], "c2-u2-lec6": [["Ana", "Who spilled the beans about the surprise party? I told you not to tell anyone."], ["Tom", "Sorry, I didn't mean to. I barely said a word."], ["Ana", "Most people know now, though. Sooner or later Laura will find out. She was under the weather, so at least she won't hear it today."], ["Tom", "Maybe Laura already knows. You hit the nail on the head: the party costs an arm and a leg, so everyone was talking about it."], ["Ana", "I really want to keep it secret. Let's break the ice with Laura by inviting her to lunch, then."], ["Tom", "Right. Let's not spill any more beans."], ["Ana", "Agreed. It was a piece of cake to keep it quiet before."], ["Tom", "Hardly anyone noticed, I'd say. Anyway, I'm sorry."]], "c2-u2-lec7": [["Ana", "Did you notice Laura? She didn't say a word, but it was a piece of cake to understand her mood."], ["Tom", "Hit the nail on the head. She was under the weather yesterday."], ["Ana", "Wise, then, not to come. Sooner or later she'll tell us."], ["Tom", "Maybe, but she's touchy about her news. Don't spill the beans."], ["Ana", "No way! I can't wait to know, but I'll keep quiet."], ["Tom", "Good. Her new flat costs an arm and a leg, I heard."], ["Ana", "Please don't break the ice with that story today."], ["Tom", "Okay, I'll break the ice with the weather instead."]], "c2-u3-lec1": [["Ana", "It was Maria who won the prize. Did you hear?"], ["Tom", "No, I didn't. I thought it was John who won."], ["Ana", "It was the team that did most of the work, not John."], ["Tom", "Few people knew that until the manager announced it."], ["Ana", "Most people were surprised. It was Maria's idea, maybe the best one."], ["Tom", "Maybe, but I'm not sure. It was the client who decided, I think."], ["Ana", "Sooner or later they'll decide. I can't wait to see the final result."], ["Tom", "Agreed. It was a piece of cake for her, anyway."]], "c2-u3-lec2": [["Ana", "What I need is a holiday. Honestly, I'm exhausted."], ["Tom", "What we need is a clear plan. I think the trip is a good idea."], ["Ana", "It was the manager who suggested it, maybe for the same reason."], ["Tom", "What you need is rest, and what I need is coffee. Not the same thing!"], ["Ana", "What I want is a quiet week. Most things at work are urgent."], ["Tom", "What's urgent is the report. Sooner or later we'll finish it."], ["Ana", "What the manager said was right. I'm touchy about the timing, though."], ["Tom", "Agreed. What we need is to break the ice with the client first."]], "c2-u3-lec3": [["Ana", "I do like your new car! Where did you get it?"], ["Tom", "Thanks. I got it from a dealer near the office. I do apologise for being late, by the way. It was the traffic that delayed me."], ["Ana", "No problem. Did you ask Maria about the figures? She does know the answer. I don't think she'd forget."], ["Tom", "What I need is a clear plan, and I do think the plan works."], ["Ana", "It does seem right. Sooner or later we'll agree, I'm sure."], ["Tom", "I do wish we had started earlier, though."], ["Ana", "What I want is a holiday. I do need one, honestly."], ["Tom", "You do deserve one. Let's book it."]], "c2-u3-lec4": [["Ana", "It was the rain that ruined the picnic. Honestly, I'm not surprised."], ["Tom", "It was the wind that made it worse, I think."], ["Ana", "That's not the point. Most people went home early."], ["Tom", "Maybe, but I do think the picnic was a good idea."], ["Ana", "It was the cold that bothered me."], ["Tom", "What I need is a warm drink now. Sooner or later the sun will come out."], ["Ana", "Let's cheer everyone up with a joke about the weather, then."], ["Tom", "It was the weather that ruined our plan, not the people. You hit the nail on the head, Ana."]], "c2-u3-lec5": [["Ana", "All I want is some sleep. I can't wait to get home."], ["Tom", "All we need is a bit more time. Honestly, the report is just about finished."], ["Ana", "What I want is a holiday, but all I can do is work."], ["Tom", "It was the deadline that made it so stressful."], ["Ana", "All I need is a little peace and quiet."], ["Tom", "Few of us have that. Maybe next week."], ["Ana", "Right now, all I can think about is the report."], ["Tom", "Sooner or later we'll finish. Let's have coffee first, I do need one."]], "c2-u3-lec6": [["Ana", "Such was the crowd that we left early. Honestly, it was impossible to move."], ["Tom", "Not until later did I realise how many people had come."], ["Ana", "It was the noise that made it worse. Most people complained."], ["Tom", "Such was the noise that I barely heard you speak."], ["Ana", "Not until the end did we find a quiet corner."], ["Tom", "In the end we did, maybe the best part of the night."], ["Ana", "All I want now is some sleep."], ["Tom", "Agreed. What I need is a long rest. I do think it was worth it, though."]], "c2-u3-lec7": [["Ana", "Did Laura tell you? It was the manager who made the final decision."], ["Tom", "No, she didn't. Not until the report was finished did we relax, though."], ["Ana", "Little did Laura realise the consequences."], ["Tom", "Such was the pressure that nobody slept. All we want is a quiet week."], ["Ana", "It was the deadline that caused it, not the manager."], ["Tom", "Few people agreed. In the end we did, though."], ["Ana", "What I like is that you do say what you think."], ["Tom", "Agreed. Let's talk to the team tomorrow."]], "c2-u4-lec1": [["Ana", "We will look into the problem next week. It's already on the agenda."], ["Tom", "The company will investigate the complaint. I barely expected that."], ["Ana", "Maybe, but the team is pretty much ready to review it."], ["Tom", "Please look into the figures first, then we can investigate further."], ["Ana", "At the moment we are checking the data, so it's a good approach."], ["Tom", "Agreed. Sooner or later the report will be finished."], ["Ana", "I can't wait to see the outcome."], ["Tom", "Let's investigate it together, then."]], "c2-u4-lec2": [["Tom", "I would like to request more information about the course."], ["Ana", "Certainly. Are you also interested in the software?"], ["Tom", "Yes, we wish to purchase the software. Could you assist us with the price? Could we get a discount?"], ["Ana", "Certainly. Few people ask for a discount, so I'm pleased you did. I'd be grateful if you could confirm the order."], ["Tom", "Maybe we can agree a deal. Right now, the budget is tight, so I will look into it."], ["Ana", "Understood. Please look into the matter and let me know."], ["Tom", "I will look into it. Thank you for your assistance."]], "c2-u4-lec3": [["Ana", "Dear Mr Smith, thank you for your letter. Yours sincerely, Ana."], ["Tom", "Dear Sir or Madam, I am writing to request a refund. Yours faithfully, Tom."], ["Ana", "Few people use \"faithfully\" now, but it's correct when you don't know the name."], ["Tom", "Maybe, but I'd still use it for a formal letter. It makes sense."], ["Ana", "Most letters I write start with a name."], ["Tom", "Sooner or later I'll learn that. At the moment I'm practising closings."], ["Ana", "Please request a reply by Friday. We will look into it. Yours sincerely."], ["Tom", "I would appreciate it. Yours faithfully."]], "c2-u4-lec4": [["Ana", "Hey, what's up? Let's catch up soon."], ["Tom", "Not much. I barely have time, but I'd love to catch up."], ["Ana", "Cheers! I can't wait to hear your news."], ["Tom", "I'm moving next month. I'll look into hiring a van. Maybe you can help."], ["Ana", "Sure, I'd be glad to assist, it'd be a piece of cake. Most people help out."], ["Tom", "Sooner or later I'll have the boxes packed. At the moment I'm really busy."], ["Ana", "Let's grab a coffee on Friday. Yours sincerely, Ana, ha!"], ["Tom", "Ha! Cheers! See you Friday."]], "c2-u4-lec5": [["Ana", "I'm absolutely knackered after the trip. I'm starving!"], ["Tom", "Hey, what's up? Not surprising. You look under the weather."], ["Ana", "Maybe, but let's grab a bite. Most places are closed."], ["Tom", "I'll look into some places nearby. I'm starving too."], ["Ana", "It was a piece of cake to get here, but the traffic was awful."], ["Tom", "It was the traffic that made me knackered, too. Sooner or later we'll find something."], ["Ana", "Let's go, then. I could really do with a sandwich. Could you assist me with the map, please?"], ["Tom", "Good plan. Cheers!"]], "c2-u4-lec6": [["Ana", "Could you assist me with something? I would be grateful if you could send the report."], ["Tom", "Of course. I would appreciate it if you could confirm the date too."], ["Ana", "Certainly. Would it be possible to meet on Thursday, maybe at ten?"], ["Tom", "Yes, that would suit me. Few people ask so politely."], ["Ana", "Thank you. I'd be grateful for any notes you have."], ["Tom", "Kindly forward them to me by Friday."], ["Ana", "Will do. Could you look into the figures for me as well?"], ["Tom", "I will look into them. Thank you for your patience. Yours sincerely, Tom."]], "c2-u4-lec7": [["Ana", "I would appreciate it if you could forward the document at your earliest convenience."], ["Tom", "Certainly. Kindly confirm your attendance, too."], ["Ana", "No problem. Sooner or later we'll sort out the details."], ["Tom", "I'm knackered, but I'll look into it today."], ["Ana", "What's up with the delay? Most people are waiting."], ["Tom", "It was the traffic that caused it, maybe."], ["Ana", "Cheers for the update. Could you assist me with the figures?"], ["Tom", "Of course. I'd be grateful if you'd send me the final version too. Yours sincerely, Tom."]], "c2-u5-lec1": [["Ana", "Oh, great. Another delay. Honestly, this meeting is a joke."], ["Tom", "Yeah, great. That's exactly what we needed today."], ["Ana", "I'm not really happy, though. Few people are on time."], ["Tom", "Most people are in the room now, luckily."], ["Ana", "Oh, wonderful, the projector broke again."], ["Tom", "Sarcasm again? I think it's funny."], ["Ana", "Sooner or later they'll fix it. Maybe before lunch."], ["Tom", "Maybe. Let's not hold our breath."]], "c2-u5-lec2": [["Ana", "The food was not bad. It was excellent."], ["Tom", "Not bad at all. Most guests said the view was quite something."], ["Ana", "Close to perfect, that hotel. \"Nice\" barely covers it."], ["Tom", "Oh, great, minus five. It's a bit chilly out there, to be fair."], ["Ana", "Maybe the coldest week of the year."], ["Tom", "Sooner or later we'll get warm. Good plan to wear a coat."], ["Ana", "The meeting was not terrible, to be fair."], ["Tom", "Not exactly a glowing review, but I'll take it."]], "c2-u5-lec3": [["Ana", "I've told you a million times. Stop leaving the lights on."], ["Tom", "Sorry, I forgot again. I'm dying of hunger, though. Can we eat first?"], ["Ana", "Honestly, I've been waiting for ages. About an hour!"], ["Tom", "It wasn't ages. I'm starving, and I'd literally eat anything."], ["Ana", "Oh, brilliant. I've told you a million times about the printer, too."], ["Tom", "Sooner or later I'll learn. Maybe by next year."], ["Ana", "Honestly, it's not the end of the world."], ["Tom", "Ha! It was the most important meal of my life. Sorry."]], "c2-u5-lec4": [["Ana", "Brilliant idea, really. Let's put the report on the floor."], ["Tom", "Oh, sure. That's a good plan, I suppose."], ["Ana", "Most people said it was the best idea, though."], ["Tom", "Not the best, I'd say. It was a bit of a mistake, to be fair. I've told you a million times."], ["Ana", "Sooner or later we'll clean it up. Maybe tomorrow."], ["Tom", "What a fantastic plan. Really brilliant."], ["Ana", "Stop the sarcasm. I want to fix it now."], ["Tom", "Fine, fine. Let's get on with it and clean up."]], "c2-u5-lec5": [["Ana", "Dry humour is funny because it is calm and understated. The joke was delivered without a smile."], ["Tom", "Few people laughed, though. Oh, brilliant, a room full of statues. It's not bad, to be fair."], ["Ana", "Maybe, but I think it was brilliant. It was the best line of the day."], ["Tom", "It was the calm delivery that made it funny."], ["Ana", "Sooner or later they'll get it. I can't wait to tell the joke again."], ["Tom", "Please don't. Such a joke only works once."], ["Ana", "Fine. Let's try something else, then."], ["Tom", "Good plan."]], "c2-u5-lec6": [["Ana", "I'm reading a book about anti-gravity. It's impossible to put down!"], ["Tom", "Ha, that's a pun. Oh, great, a million more are coming. That one is not bad, to be fair."], ["Ana", "Most people groan at puns, though. Brilliant, I know."], ["Tom", "Few people can resist them, maybe, said without a smile."], ["Ana", "Sooner or later you'll agree that puns are funny."], ["Tom", "What's the double meaning, then? Tell me."], ["Ana", "Put down means both to place it and to stop reading."], ["Tom", "Right. I can't wait to tell that to my sister."]], "c2-u5-lec7": [["Ana", "Oh great, another meeting on a Friday evening. Sure, I'd love to work through the weekend."], ["Tom", "Yeah, right, as if that will happen. I've told you a million times that Fridays are for the pub. It's a bit late, to be fair."], ["Ana", "Brilliant idea, really, to book it at six. Few people asked for overtime, and most of us are knackered."], ["Tom", "Maybe, but I'll look into it. Let's lighten the mood with a pun."], ["Ana", "Please, not another pun. Dry humour only, please, said without a smile."], ["Tom", "Wise of you. Sooner or later I'll stop."], ["Ana", "I can't wait to go home."], ["Tom", "Agreed. What a week it has been."]], "c2-u6-lec1": [["Ana", "Her voice was music, honestly. I could listen for hours."], ["Tom", "The sky was a grey blanket over the city that morning."], ["Ana", "That's a metaphor, not a simile, because there is no \"like\"."], ["Tom", "Few people notice the difference, but yes, you're right."], ["Ana", "Most lines in the poem use one."], ["Tom", "In the end the blanket lifted, and the sun came out."], ["Ana", "Maybe the most beautiful line I've read this year."], ["Tom", "Agreed. Let's discuss it more tomorrow."]], "c2-u6-lec2": [["Ana", "He was as brave as a lion when he faced the manager."], ["Tom", "Anna runs like the wind. Practically nobody can catch her."], ["Ana", "Not surprising. Her voice was music, too."], ["Tom", "That's a metaphor, though, not a simile."], ["Ana", "You're right. Like the wind, she was fast."], ["Tom", "Sooner or later she'll win the race, I'm sure."], ["Ana", "Maybe. She's as quick as a fox."], ["Tom", "Agreed. Let's use that comparison in our report."]], "c2-u6-lec3": [["Ana", "The wind whispered through the trees all night."], ["Tom", "The river sang in the night. I could barely sleep."], ["Ana", "The city slept like a giant, close to silent."], ["Tom", "Personification gives things human actions, doesn't it?"], ["Ana", "Yes. Maybe the best example is the wind. The night was a dark blanket."], ["Tom", "Sooner or later the trees will answer back, though. Ha."], ["Ana", "Don't take it so seriously, Tom."], ["Tom", "Wise of you. Let's talk about the poem."]], "c2-u6-lec4": [["Ana", "The writer argues that cities are lonely places. The city is a grey blanket."], ["Tom", "The author suggests that change is necessary. The streets whisper it at night."], ["Ana", "Few people agree with the writer completely, though. He is as stubborn as a mule."], ["Tom", "Most critics do, maybe."], ["Ana", "In the end the argument becomes clear, I think."], ["Tom", "At the moment the author is working on a new book."], ["Ana", "Right. I can't wait to read the next chapter."], ["Tom", "Let's compare what the writer argues with what the author suggests."]], "c2-u6-lec5": [["Ana", "The story is set in a small village that sleeps like a giant. By the time he arrived, the show had started."], ["Tom", "Few people knew the village. The writer argues that it was a quiet blanket over old memories."], ["Ana", "It was the train that delayed him, about two hours."], ["Tom", "Maybe, but he had already missed the start. By then the crowd had gone, and the streets whispered."], ["Ana", "In the end the crowd returned, I think."], ["Tom", "At the moment the village is quiet, honestly. It was lively back then."], ["Ana", "Smart to set it there, then."], ["Tom", "I can't wait to find out how it ends."]], "c2-u6-lec6": [["Ana", "The mood of the poem is melancholic, as quiet as a grave. The author describes the city as a sleeping giant."], ["Tom", "We can infer the meaning from context, I think."], ["Ana", "Few people would call it happy, though."], ["Tom", "Most lines feel sad."], ["Ana", "Maybe, but the ending is hopeful. The writer argues that change is possible."], ["Tom", "In the end the city wakes up, so it's not all sad. By the last line, the night had passed."], ["Ana", "Good reading. The context supports that."], ["Tom", "Agreed. Let's summarise the tone in two words."]], "c2-u6-lec7": [["Ana", "Did you read that poem? Her smile was a ray of sunshine in the grey room."], ["Tom", "Time is a thief that steals our years, as the poem says."], ["Ana", "The city slept like a giant, didn't it?"], ["Tom", "No surprise. The writer argues that memory is precious."], ["Ana", "Most lines have a metaphor."], ["Tom", "Maybe, but the mood stays melancholic. By the end, the city had woken up. I infer hope at the end."], ["Ana", "Sooner or later we'll agree on the tone."], ["Tom", "Agreed. I can't wait to discuss it again."]], "c2-u7-lec1": [["Tom", "I think the idea is sound."], ["Ana", "I take your point, but I still disagree. Few studies support it. Most studies point the other way."], ["Tom", "I take your point, but the data are incomplete."], ["Ana", "Maybe, but I'm not convinced by the argument."], ["Tom", "Sooner or later we'll see the results, I suppose."], ["Ana", "Agreed. I can't wait to see them."], ["Tom", "Let's disagree politely, then."]], "c2-u7-lec2": [["Ana", "Where's the evidence for that claim? What's your source for those figures?"], ["Tom", "The data come from the 2024 survey. It's in the report."], ["Ana", "Not convincing. Maybe the sample was small."], ["Tom", "Most of the respondents agreed, though."], ["Ana", "I'm not convinced. In the end we need a bigger study."], ["Tom", "Fair point. I take your point about the sample."], ["Ana", "Please support the claim with sources next time."], ["Tom", "Will do. I'll send you the references."]], "c2-u7-lec3": [["Ana", "It is highly unlikely that the plan will work. There is little chance of success."], ["Tom", "Not really, I'd say. It's a good plan."], ["Ana", "Maybe, but the budget is tiny."], ["Tom", "Most experts think it could work, though."], ["Ana", "Where's the evidence for that, though?"], ["Tom", "Sooner or later we'll know. At the moment the test is running."], ["Ana", "I can't wait to see the result. It's highly unlikely it passes, though."], ["Tom", "Let's see. I take your point about the budget."]], "c2-u7-lec4": [["Ana", "If I could just come in here for a moment. Sorry to interrupt, but I think..."], ["Tom", "Of course, go ahead."], ["Ana", "Thank you. The evidence is barely complete."], ["Tom", "I take your point about the sample, but most studies say otherwise. Could you give me the source?"], ["Ana", "Maybe the sample was small, but the trend is clear."], ["Tom", "In the end we can test it. Please, let me finish."], ["Ana", "Sorry. Go ahead."], ["Tom", "Thank you. It's highly unlikely the plan fails if we check the data."]], "c2-u7-lec5": [["Tom", "The cost is the main problem. The timing too."], ["Ana", "Sorry to interrupt, but what you're saying is that the cost is too high. Is that right?"], ["Tom", "Yes. I'm not saying we should cancel, but the deadline is close."], ["Ana", "So, what you're saying is that we should wait."], ["Tom", "Not really. I'm saying we should check the figures first. Where's the evidence for the current cost?"], ["Ana", "I take your point. Most people would agree with that, maybe. Let's summarise the options."], ["Tom", "Okay. What you're saying is that we need more evidence, and it's highly unlikely we decide today."]], "c2-u7-lec6": [["Tom", "Right now, I still think the budget is too high. Where's the evidence that it works?"], ["Ana", "What you're saying is that we can't afford it. I take your point, but it's highly unlikely we'll agree."], ["Tom", "Maybe. I respect your opinion, though. Few people would disagree with that."], ["Ana", "Sorry to interrupt, but I think we both have good points. Let's agree to differ on this one."], ["Tom", "Close. Sooner or later we'll test the plan, and we'll see."], ["Ana", "Agreed. Let's agree to differ and move on."], ["Tom", "Agreed. Let's agree to differ politely."]], "c2-u7-lec7": [["Ana", "I see where you are coming from, but I'm not convinced by your evidence."], ["Tom", "Granted, the policy has flaws, yet its aims are sound."], ["Ana", "Sorry to interrupt, but where's the source for that claim?"], ["Tom", "No problem. It's highly unlikely you'll find better data."], ["Ana", "What you're saying is that the plan is safe. Is that right?"], ["Tom", "Yes. I take your point about the budget."], ["Ana", "Maybe, but I'm still not sure. Let's agree to differ."], ["Tom", "Fair. Sooner or later we'll see the results."]], "c2-u8-lec1": [["Ana", "Did you take a photograph yesterday? The photography class starts today."], ["Tom", "I did, but I'd like to record the lesson too."], ["Ana", "Maybe the teacher will record it for us."], ["Tom", "Honestly, I'm not sure. Most students asked for the record."], ["Ana", "In the end the record was available, and the photograph came out well."], ["Tom", "Few problems, then. I can't wait to see the photography work."], ["Ana", "At the moment the class is great, so keep going."], ["Tom", "Agreed. Let's look at the photographs together."]], "c2-u8-lec2": [["Ana", "I want to go to the market today. Do you want to come?"], ["Tom", "I'd love to. Honestly, I barely have time, but I'll try."], ["Ana", "We can buy some fruit and bread. Most things are cheap there."], ["Tom", "Maybe, but I'm on a budget. Sooner or later I'll save money."], ["Ana", "The market is a piece of cake to reach by bus."], ["Tom", "Good plan. I'm longing for some fresh food. I'd like to take a photograph of the stalls, too."], ["Ana", "At the moment the stalls are open till two, so let's go soon."], ["Tom", "Right. Let's go now."]], "c2-u8-lec3": [["Ana", "I want to go to the cinema, and I'd like to see the new film."], ["Tom", "Great, I want to come too. I'm going to invite Laura."], ["Ana", "Maybe she has to work. Few people are free on Friday."], ["Tom", "Sooner or later we'll find a time. Most people can manage Saturday."], ["Ana", "I want to buy the tickets online, if it makes sense."], ["Tom", "Agreed. I can't wait to see it."], ["Ana", "At the moment the price is fair, so let's book now."], ["Tom", "Okay, I'll book them tonight. I'd also like to take a photograph of the poster."]], "c2-u8-lec4": [["Ana", "Are you coming to the party tonight? Where is it? Few people know."], ["Tom", "Yes, I am. Most people know it's at Laura's house. Maybe."], ["Ana", "Sooner or later I'm going to ask her. Is she free tonight?"], ["Tom", "At the moment I don't know, but I want to go."], ["Ana", "Honestly, that's a fair question. What time does it start?"], ["Tom", "Eight. Shall I call her now?"]], "c2-u8-lec5": [["Ana", "Turn off the light, please. I'll pick up the report later."], ["Tom", "Okay. Few people use the old lamp anyway."], ["Ana", "Just about done with the report. I want to print it and take a photograph of the last page."], ["Tom", "Maybe tomorrow. I'll collect the copies myself."], ["Ana", "Can you turn off the heater, too?"], ["Tom", "Sure. I'm longing for a cup of tea, by the way."], ["Ana", "At the moment the kettle is on. Let's pick up the copies at seven."], ["Tom", "Agreed. Turn off the lights when you leave."]], "c2-u8-lec6": [["Ana", "The k in knife is silent. Did you cut the lamb with a knife?"], ["Tom", "Honestly, I'm not sure. The h in honest is silent too."], ["Ana", "Few people notice those silent letters. Most people learn them late."], ["Tom", "Maybe, but the b in lamb is silent, I know that."], ["Ana", "Sooner or later you'll get used to it. The w in write is silent too."], ["Tom", "Smart to learn them. I can't wait to read more. Is it PHOtograph or phoTOgraph?"], ["Ana", "PHOtograph, with the stress first. At the moment I'm writing a list of silent letters."], ["Tom", "Great. Let's write the list together."]], "c2-u8-lec7": [["Ana", "The word protest is stressed on the first syllable when it is a noun, like record and photograph."], ["Tom", "Few people pronounce it differently, but yes, that's right for the noun. Is it the same for the verb?"], ["Ana", "When it is a verb, the stress moves to the second syllable. Maybe it's easy to remember."], ["Tom", "Sooner or later I'll get it right. I want to practise the weak forms too: do you want to go, with \"to\" as a schwa?"], ["Ana", "Exactly. Turn off the lights when you leave, and link it: \"turn off\" sounds like \"tur-noff\". The k in knife is silent, as usual."], ["Tom", "Ha! Good. Let's pick up the list tomorrow."]], "c2-u9-lec1": [["Ana", "This essay argues that public transport should be free. Is that clear enough?"], ["Tom", "Not really. The thesis statement should appear in the introduction."], ["Ana", "Yes, I put it there. Most paragraphs support it."], ["Tom", "Maybe, but the argument needs a clearer claim."], ["Ana", "Sooner or later the reader will see the point, I think."], ["Tom", "Fair, but make it sharper."], ["Ana", "At the moment my introduction is too long. I can't wait to cut it."], ["Tom", "Agreed. Keep the thesis, cut the rest."]], "c2-u9-lec2": [["Ana", "Public transport reduces traffic. That's my topic sentence."], ["Tom", "Good. Then you need evidence. A study found that cities with buses have fewer cars."], ["Ana", "Not the only study, but it's pretty much the strongest one."], ["Tom", "Maybe. Now the explanation: this shows that good transport changes behaviour."], ["Ana", "Right. Each paragraph should argue for the thesis."], ["Tom", "In the end the reader sees the whole argument."], ["Ana", "At the moment I have six paragraphs like this."], ["Tom", "Great. Let's check that each one supports the thesis."]], "c2-u9-lec3": [["Ana", "According to Smith (2020), prices will rise. Jones (2019) cites the same figures."], ["Tom", "Good. Few people check the year, but it matters."], ["Ana", "Most references need the year, maybe even the page."], ["Tom", "Sooner or later you'll learn the format. Use the author's name only in the text."], ["Ana", "Right. My thesis cites the study too, I think."], ["Tom", "Yes, and the topic sentence should mention the evidence."], ["Ana", "At the moment I'm checking all the sources."], ["Tom", "Agreed. I can't wait to see the final bibliography."]], "c2-u9-lec4": [["Ana", "Many researchers obtained similar results. Avoid \"a lot of\" and \"get\" in academic writing."], ["Tom", "Few of my sentences are that informal now. Most are fixed."], ["Ana", "Maybe, but check the first paragraph again. Sooner or later it will read well."], ["Tom", "According to Smith (2020), prices will rise, so I used \"obtain\" there."], ["Ana", "Right. The thesis should use formal words, too."], ["Tom", "Agreed. At the moment I'm replacing \"get\" with \"obtain\"."], ["Ana", "Good. I'm longing for a clean draft."], ["Tom", "Let's finish the draft tonight."]], "c2-u9-lec5": [["Ana", "Rural areas have few buses. In contrast, cities have frequent services."], ["Tom", "Similarly, rural areas struggle with costs. Few rural routes run on weekends."], ["Ana", "However, most cities have a bus lane, maybe two."], ["Tom", "Therefore, according to Smith (2020), the thesis holds, I think. Public transport should be free."], ["Ana", "Sooner or later I'll add a transition in every paragraph."], ["Tom", "Right. At the moment the links are too weak."], ["Ana", "Agreed. Shall we check the logic together?"], ["Tom", "Yes. Let's go through the paragraphs again."]], "c2-u9-lec6": [["Ana", "This study has shown that free transport increases use. Further research is needed."], ["Tom", "No surprise. Similarly, most studies say the same."], ["Ana", "Maybe, but the thesis is clear now. Sooner or later the reader will agree."], ["Tom", "Good conclusion. According to Smith (2020), the trend continues."], ["Ana", "At the moment the conclusion is short, and I can't wait to add more."], ["Tom", "Don't. Further research is the best closing point."], ["Ana", "Agreed. Let's send the essay tonight."], ["Tom", "Okay. I'll check the references first."]], "c2-u9-lec7": [["Ana", "This essay argues that technology reshapes social bonds, both for better and for worse."], ["Tom", "The evidence suggests a cautious optimism, which is a good approach."], ["Ana", "Few people would disagree. Most studies agree."], ["Tom", "According to Smith (2020), the bonds are weaker, though. Maybe."], ["Ana", "However, in contrast, Jones (2019) finds stronger ties online."], ["Tom", "Sooner or later we'll decide. At the moment the data are mixed."], ["Ana", "I can't wait to finish this essay."], ["Tom", "Let's keep the thesis, add that this study has shown mixed results, and check the references."]], "c2-u10-lec1": [["Ana", "Good morning, everyone. Today I'm going to talk about climate policy."], ["Tom", "Sounds good. Have you prepared the agenda slide?"], ["Ana", "Yes. Few presenters do that, but I think it helps."], ["Tom", "Agreed. Most people in the room will want a clear structure."], ["Ana", "Sooner or later they'll see the three main points. Maybe, that is."], ["Tom", "Right. At the moment the audience is settling down, so start now."], ["Ana", "Thanks. Welcome, and let's begin."], ["Tom", "Good luck. I can't wait to hear it."]], "c2-u10-lec2": [["Ana", "Today I'm going to talk about climate policy. First of all, I'll give a short background. Moving on to the next point, let's look at the data."], ["Tom", "Good. Finally, we'll look at the recommendations."], ["Ana", "Very little time for questions. Let's keep it brief."], ["Tom", "Just about done with the background. Maybe move on now."], ["Ana", "Sooner or later we'll reach the conclusion, I think."], ["Tom", "At the moment you're on slide three. Moving on, then?"], ["Ana", "Yes. First of all, let me summarise this section."], ["Tom", "Great. I can't wait to see the chart."]], "c2-u10-lec3": [["Ana", "Today I'm going to talk about the figures. As you can see on this slide, they increased. This chart shows the trend clearly."], ["Tom", "No surprise, but most countries show the same line."], ["Ana", "Maybe, but I'd like to point to the blue bar."], ["Tom", "As you can see, the increase is small after 2020."], ["Ana", "In the end the trend levels out, I think."], ["Tom", "Good way to put it. At the moment the chart is clear."], ["Ana", "First of all, the scale matters. Moving on to the next slide."], ["Tom", "Good. I can't wait to see the next one."]], "c2-u10-lec4": [["Ana", "Today I'm going to talk about prices. Have you ever wondered why they keep rising? It's a question we should all ask."], ["Tom", "Few people ask that in a meeting, which is why it's good to start with it."], ["Ana", "Most people in this room have noticed it at the shops."], ["Tom", "Maybe, but the answer is complicated. Sooner or later we'll see why."], ["Ana", "First of all, let's look at the figures, shall we? As you can see on this slide, they tell a clear story."], ["Tom", "Good opening. At the moment the audience is engaged."], ["Ana", "I can't wait to hear their answers."], ["Tom", "Then ask them. Have you ever wondered why it rises?"]], "c2-u10-lec5": [["Tom", "What is the real cost of the plan?"], ["Ana", "That's a good question. I'm not sure, but I'll get back to you by email."], ["Tom", "Few people would know that off the top of their head."], ["Ana", "Maybe the data are not in the report. As you can see on this slide, only the estimate is included."], ["Tom", "Most people will ask about the cost, though."], ["Ana", "Sooner or later we'll have a clear answer. For now, let's follow up later."], ["Tom", "Good approach. At the moment the time is short."], ["Ana", "I'll make a note and follow up with the audience. Moving on, are there more questions?"], ["Tom", "Agreed. I can't wait to hear the next question."]], "c2-u10-lec6": [["Ana", "To wrap up, let me repeat the main point. As you can see on this slide, prices rise with costs. Have you ever wondered why?"], ["Tom", "Few speakers repeat it, but it helps. Most people remember it then."], ["Ana", "Are there any questions? If I'm not sure about an answer, I'll get back to you by email."], ["Tom", "Maybe, a few people have their hands up."], ["Ana", "Sooner or later we'll close the session. At the moment I could really do with a coffee."], ["Tom", "Right. First question, please: why do prices rise?"], ["Ana", "That's a good question. I'll get back to you by email. Thank you for listening, everyone."], ["Tom", "Well done. That was a good talk."]], "c2-u10-lec7": [["Ana", "Good morning, everyone. Today I want to talk about three ideas. Have you ever wondered why prices rise? Let me start with that question."], ["Tom", "Sounds good. Few people start that way, but it works."], ["Ana", "First of all, as you can see on const SB_TOKEN_KEY = 'sb-aswrpenrptbwyhghhctq-auth-token';   // donde la librería de la nube guarda la sesión en el móvil
let UID_ACTUAL = '';
let USER = null, HAY_SESION = false, AUTH_COMPROBANDO = false;
function esLS(t){ try { return t === window.localStorage; } catch(e){ return false; } }
Storage.prototype.getItem = function(k){
  if (esLS(this) && POR_USUARIO.indexOf(k) >= 0) return UID_ACTUAL ? LS_GET.call(this, k + '-' + UID_ACTUAL) : null;
  return LS_GET.apply(this, arguments);
};
Storage.prototype.setItem = function(k, v){
  if (esLS(this) && POR_USUARIO.indexOf(k) >= 0) { if (!UID_ACTUAL) return; return LS_SET.call(this, k + '-' + UID_ACTUAL, v); }
  return LS_SET.apply(this, arguments);
};
Storage.prototype.removeItem = function(k){
  if (esLS(this) && POR_USUARIO.indexOf(k) >= 0) { if (!UID_ACTUAL) return; return LS_REMOVE.call(this, k + '-' + UID_ACTUAL); }
  return LS_REMOVE.apply(this, arguments);
};
function leerSesionLocal(){
  try { const x = JSON.parse(LS_GET.call(window.localStorage, SB_TOKEN_KEY) || 'null');
    if (x && x.user && x.user.id && x.access_token) return {user: x.user, expira: (+x.expires_at || 0) * 1000}; } catch(e){}
  return null;
}
(function(){                    // ¿hay sesión guardada en este móvil? (antes de leer el progreso, para saber de quién es)
  const g = leerSesionLocal();
  if (g) { USER = g.user; if (g.expira >= Date.now() || !navigator.onLine) { HAY_SESION = true; UID_ACTUAL = g.user.id; } else AUTH_COMPROBANDO = true; }
})();

function dayStr(d){ return d.toISOString().slice(0,10); }
function touch(){
  const t = dayStr(new Date());
  if (S.streak.last === t) return;
  const y = dayStr(new Date(Date.now() - 864e5));
  S.streak.count = (S.streak.last === y) ? S.streak.count + 1 : 1;   // sin castigo: solo cuenta la racha
  S.streak.last = t;
  save();
}

// ---------- utilidades ----------
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>'); }
function go(h){ location.hash = h.slice(1); }

// ---------- voz ----------
function tts(text, cb){
  if (!('speechSynthesis' in window)) { if (cb) cb(); else alert('Este navegador no puede leer en voz alta.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = 0.9;
  if (cb) { u.onend = cb; u.onerror = cb; }
  const v = speechSynthesis.getVoices().find(x => /^en[-_]/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function lectureText(uid, n){
  const l = U(uid).lessons.find(x => x.n === n);
  const lec = l && l.sections.find(s => /^Lectura/.test(s.key));
  return lec ? lec.items.join(' ').replace(/→/g, '. ').replace(/\*/g, '') : '';
}
let CUR_AUDIO = null;
function speakLesson(uid, n, cb){
  const text = lectureText(uid, n);
  if (!text) { if (cb) cb(); return; }
  let done = false, fin = false;
  const end = () => { if (!fin) { fin = true; if (cb) cb(); } };
  const fb = () => { if (!done) { done = true; tts(text, end); } };
  if (CUR_AUDIO) { try { CUR_AUDIO.pause(); } catch(e){} }
  const src = `audio/${uid}-lec${n}.mp3`;
  const a = new Audio(src);   // si existe el audio de VoiceStudio, se usa
  CUR_AUDIO = a;
  a.playbackRate = 0.8;   // velocidad más lenta y clara para aprender
  let fallado = false;
  const fallo = () => { if (fallado) return; fallado = true; audioFalla(src, fb, () => { avisoAudio(); end(); }); };   // sin conexión y sin descargar: aviso; otro fallo: voz del navegador, como antes
  a.onerror = fallo;
  a.onended = end;
  a.play().catch(fallo);
}
