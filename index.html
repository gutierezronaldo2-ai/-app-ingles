<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi inglés</title>
<meta name="theme-color" content="#7c5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi inglés">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6ff;--card:#fff;--ink:#1d2350;--muted:#6b72a1;--a:#7c5cff;--ok:#1fbf75;--bad:#ff5c7a;
--soft:#e6e9ff;--soft2:#eef0ff;--line:#d9dcff;--okbg:#e9fbf2;--okbg2:#dff8ec;--okink:#137a4d;--badbg:#fff0f3;--badink:#c2284b;--gold:#fff3c4;--shadow:rgba(29,35,80,.08)}
:root[data-theme=dark]{--bg:#12142b;--card:#1d2040;--ink:#e8eaff;--muted:#a3a9d6;--a:#9a82ff;--ok:#2fd38a;--bad:#ff7a93;
--soft:#2a2e5a;--soft2:#262a52;--line:#3a3f78;--okbg:#14382b;--okbg2:#14382b;--okink:#6ff0b4;--badbg:#431d2b;--badink:#ff9db1;--gold:#5a4a14;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#7c5cff,#2fb8ff);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;cursor:pointer}
.stats span{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;margin-left:6px;font-size:14px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--a);color:#fff;font-size:15px;cursor:pointer;margin:4px 6px 4px 0}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px var(--shadow);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.level{cursor:pointer;transition:transform .15s}
.level:hover{transform:translateY(-2px)}
.lvl-code{font-size:28px;font-weight:800;color:var(--a)}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:linear-gradient(90deg,var(--ok),#7ee0a8);transition:width .4s}
.crumb{color:var(--muted);font-size:14px;margin:4px 0 10px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);margin-bottom:10px;box-shadow:0 1px 6px var(--shadow);cursor:pointer}
.row:hover{outline:2px solid var(--line)}
.row.locked{opacity:.5;cursor:not-allowed}
.row.locked:hover{outline:none}
.tag{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--soft2);white-space:nowrap}
.tag.ok{background:var(--okbg2);color:var(--okink)}
h2{margin:4px 0 10px;font-size:22px}
h3{margin:14px 0 6px;color:var(--a);font-size:16px}
.sec p{margin:6px 0}
.sec ul{margin:6px 0 0 18px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;font-weight:600;min-height:1.5em}
.fb.ok{color:var(--okink)}
.fb.bad{color:var(--badink)}
.speak{margin-left:8px;font-size:18px;background:none;border:0;cursor:pointer;vertical-align:middle}
.stem{font-size:18px;line-height:1.6}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--a);margin:0 4px}
.big{font-size:24px;font-weight:800;text-align:center;margin:8px 0}
.center{text-align:center}
.hide{display:none}
.badge{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;background:var(--soft2)}
.badge.on{background:var(--gold)}
.themebtn{background:rgba(255,255,255,.22);border:0;border-radius:999px;padding:4px 12px;font-size:16px;cursor:pointer;color:#fff}
.bar.big{height:18px;margin:10px 0 4px}
.bar.big div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0}
.pcap{color:var(--muted);font-size:14px;margin-bottom:10px}
.mini{height:6px;margin-top:6px;width:120px}
.cont{display:block;width:100%;padding:20px 16px;font-size:20px;font-weight:800;border-radius:18px;margin:0 0 14px;text-align:left;box-shadow:0 6px 18px rgba(124,92,255,.35)}
.cont small{display:block;font-weight:500;font-size:14px;opacity:.9;margin-top:2px}
.rep{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.rep-title{font-weight:800;color:var(--a);margin-bottom:6px}
.rep-text{font-size:18px;line-height:2;margin:6px 0 10px}
.w{display:inline-block;padding:0 5px;border-radius:6px;margin:0 1px}
.w.ok{background:var(--okbg);color:var(--okink);font-weight:600}
.w.bad{background:var(--badbg);color:var(--badink);font-weight:600;text-decoration:underline}
.score{font-size:34px;font-weight:800;margin:6px 0}
.score.ok{color:var(--okink)}.score.bad{color:var(--badink)}
.ver{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 4px}
@media (max-width:480px){.stem{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1 onclick="go('#/')">🎓 Mi inglés</h1>
  <div class="stats" id="stats"></div>
  <button class="themebtn" id="themebtn" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">🌙</button>
</header>
<main id="app"></main>

<script>
const DATA = {"levels": [{"code": "A1", "name": "Básico"}, {"code": "A2", "name": "Elemental"}, {"code": "B1", "name": "Intermedio"}, {"code": "B2", "name": "Intermedio alto"}, {"code": "C1", "name": "Avanzado"}, {"code": "C2", "name": "Dominio"}], "units": [{"id": "a1-u1", "level": "A1", "num": 1, "title": "Presentarse", "meta": "", "lessons": [{"n": 1, "title": "Yo soy o yo estoy (I am)", "sections": [{"key": "Tema", "items": ["*I am* para decir quién eres."]}, {"key": "Vocabulario", "items": ["name (nombre), from (de), teacher (profesor), happy (feliz), friend (amigo)"]}, {"key": "Lectura", "items": ["Hi, my name is Ana. I am from Mexico. I am a teacher. I am happy today."]}, {"key": "Notas", "items": ["*I am* = yo soy / yo estoy.", "*I am from* = soy de (origen).", "*I am a teacher* = soy profesor. Usamos *a* antes de una profesión."]}, {"key": "Preguntas", "items": ["What is her name? Where is she from? What is her job?"]}, {"key": "Ejercicio", "items": ["Completa con *am*: I ___ happy. I ___ a student."]}, {"key": "Respuestas", "items": ["am, am"]}, {"key": "Habla en voz alta", "items": ["\"Hi, my name is ___. I am from ___. I am a ___.\""]}], "exercise": null}, {"n": 2, "title": "No soy o no estoy (negativo)", "sections": [{"key": "Tema", "items": ["*I am not* y *is not* para decir lo que no eres."]}, {"key": "Vocabulario", "items": ["doctor (médico), student (estudiante), chef (cocinero)"]}, {"key": "Lectura", "items": ["I am not a doctor. I am a student. My friend Tom is not a student. He is a chef."]}, {"key": "Notas", "items": ["*I am not* = no soy / no estoy.", "*He is not* = él no es. Se puede escribir *isn't*.", "*She is not* = ella no es. Se puede escribir *isn't*."]}, {"key": "Preguntas", "items": ["Is Tom a student? What is Tom's job?"]}, {"key": "Ejercicio", "items": ["Escribe la negación: I am a doctor → I ___ a doctor. She is a chef → She ___ a chef."]}, {"key": "Respuestas", "items": ["am not, is not (isn't)"]}, {"key": "Habla en voz alta", "items": ["\"I am not a ___. I am a ___.\""]}], "exercise": null}, {"n": 3, "title": "Preguntas con to be", "sections": [{"key": "Tema", "items": ["hacer preguntas con *am, is, are*."]}, {"key": "Vocabulario", "items": ["yes (sí), no (no), Spain (España)"]}, {"key": "Lectura (diálogo)", "items": ["Are you from Spain? → No, I am not. I am from Italy.", "Is she a teacher? → Yes, she is."]}, {"key": "Notas", "items": ["Para preguntar, el verbo va primero: *Are you...?* / *Is he...?*", "Respuesta corta: *Yes, I am.* / *No, she isn't.*"]}, {"key": "Preguntas", "items": ["Is the speaker from Spain? Is she a teacher?"]}, {"key": "Ejercicio", "items": ["Forma la pregunta: you / from Spain → ___ you from Spain?"]}, {"key": "Respuestas", "items": ["Are"]}, {"key": "Habla en voz alta", "items": ["\"Are you ___? Yes, I am. / No, I am not.\""]}], "exercise": null}, {"n": 4, "title": "Mi, tu, su (possessives)", "sections": [{"key": "Tema", "items": ["*my, your, his, her* para hablar de lo que es de alguien."]}, {"key": "Vocabulario", "items": ["house (casa), bag (bolsa), car (coche)"]}, {"key": "Lectura", "items": ["This is my house. Your bag is blue. His car is red. Her name is Lucy."]}, {"key": "Notas", "items": ["*my* = mi", "*your* = tu / su (de usted)", "*his* = su (de él)", "*her* = su (de ella)"]}, {"key": "Preguntas", "items": ["What color is his car? What is her name?"]}, {"key": "Ejercicio", "items": ["Elige: ___ name is Tom. (my / his / her) → **his**"]}, {"key": "Respuesta", "items": ["his"]}, {"key": "Habla en voz alta", "items": ["\"This is my ___. His name is ___. Her name is ___.\""]}], "exercise": {"stem": "Elige: ___ name is Tom.", "options": ["my", "his", "her"], "answer": "his"}}, {"n": 5, "title": "Países y profesiones", "sections": [{"key": "Tema", "items": ["decir de qué país eres y a qué te dedicas."]}, {"key": "Vocabulario", "items": ["Países: Spain (España), Mexico (México), Italy (Italia), France (Francia)", "Profesiones: nurse (enfermero/a), engineer (ingeniero/a), driver (conductor/a), chef (cocinero/a)"]}, {"key": "Lectura", "items": ["I am from France. I am an engineer. My sister is from Mexico. She is a nurse."]}, {"key": "Notas", "items": ["Antes de una profesión que empieza con vocal (a, e, i, o, u) usamos *an*: *an engineer*.", "Antes de consonante usamos *a*: *a nurse*."]}, {"key": "Preguntas", "items": ["Where is the speaker from? What is the sister's job?"]}, {"key": "Ejercicio", "items": ["Elige *a* o *an*: I am ___ engineer. She is ___ nurse."]}, {"key": "Respuestas", "items": ["an, a"]}, {"key": "Habla en voz alta", "items": ["\"I am from ___. I am a/an ___.\""]}], "exercise": null}, {"n": 6, "title": "Números y edad", "sections": [{"key": "Tema", "items": ["números del 1 al 20 y decir tu edad."]}, {"key": "Vocabulario", "items": ["one (1), two (2), three (3), four (4), five (5), ten (10), fifteen (15), twenty (20), years old (años de edad)"]}, {"key": "Lectura", "items": ["I am twenty-five years old. My brother is twelve years old. My cat is three."]}, {"key": "Notas", "items": ["*I am ___ years old* = tengo ___ años.", "Los números se unen con guion: *twenty-five*."]}, {"key": "Preguntas", "items": ["How old is the brother? How old is the cat?"]}, {"key": "Ejercicio", "items": ["Escribe el número: seven = ___ (7), twelve = ___ (12)"]}, {"key": "Respuestas", "items": ["7, 12"]}, {"key": "Habla en voz alta", "items": ["\"I am ___ years old.\""]}], "exercise": null}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Hi, I am Ana. I am from Mexico. I am a teacher. I am not a doctor."]}, {"key": "Tema", "items": ["juntar todo lo visto para presentarte."]}, {"key": "Repaso rápido", "items": ["I am, I am not, am/is/are en preguntas, my/his/her, a/an, números."]}, {"key": "Actividad de habla (en voz alta)", "items": ["\"Hi, my name is ___. I am ___ years old. I am from ___. I am a ___. My ___ is ___.\""]}, {"key": "Actividad escrita", "items": ["escribe tu presentación en 5 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 am, 2 is, 3 not, 4 Are, 5 my, 6 His, 7 an, 8 a, 9 years, 10 is"]}, {"key": "Nota", "items": ["en la pregunta 9 la respuesta es *years*, porque se usa plural con números mayores de uno.", "Nota: los textos son originales."]}], "exercise": null}], "exam": [{"stem": "I ___ a teacher.", "options": ["am", "is", "are"], "answer": "am"}, {"stem": "She ___ a student.", "options": ["am", "is", "are"], "answer": "is"}, {"stem": "I am ___ a doctor.", "options": ["not", "no", "isn't"], "answer": "not"}, {"stem": "___ you from Spain?", "options": ["Am", "Is", "Are"], "answer": "Are"}, {"stem": "This is ___ house.", "options": ["my", "his", "her"], "answer": "my"}, {"stem": "___ name is Tom.", "options": ["My", "His", "Her"], "answer": "His"}, {"stem": "I am ___ engineer.", "options": ["a", "an"], "answer": "an"}, {"stem": "He is ___ nurse.", "options": ["a", "an"], "answer": "a"}, {"stem": "I am twenty ___ old.", "options": ["years", "year", "yeah"], "answer": "years"}, {"stem": "She ___ from Mexico.", "options": ["am", "is", "are"], "answer": "is"}]}, {"id": "a1-u2", "level": "A1", "num": 2, "title": "Mi rutina", "meta": "", "lessons": [{"n": 1, "title": "Hago cosas todos los días (I, you, we, they)", "sections": [{"key": "Tema", "items": ["presente simple con *I, you, we, they*."]}, {"key": "Vocabulario", "items": ["wake up (despertarse), work (trabajar), study (estudiar), watch TV (ver la tele), go to bed (irse a dormir)"]}, {"key": "Lectura", "items": ["I wake up at seven. I work in an office. We study English after work. They watch TV at night."]}, {"key": "Notas", "items": ["En presente simple, con *I, you, we, they* usamos el verbo sin cambios: *I work*, *they study*.", "Es para rutinas y hábitos, no para lo que pasa ahora."]}, {"key": "Preguntas", "items": ["What time do you wake up? Where does the speaker work?"]}, {"key": "Ejercicio", "items": ["Elige la forma correcta: I ___ (wake up / wakes up) at seven. They ___ (study / studies) at night."]}, {"key": "Respuestas", "items": ["wake up, study"]}, {"key": "Habla en voz alta", "items": ["\"I wake up at ___. I work/study ___.\""]}], "exercise": null}, {"n": 2, "title": "Él y ella (he, she, it)", "sections": [{"key": "Tema", "items": ["añadir **-s** en tercera persona: *he, she, it*."]}, {"key": "Vocabulario", "items": ["go (ir), have (tener / comer), watch (ver), do (hacer)"]}, {"key": "Lectura", "items": ["He works in a hospital. She goes to the gym on Monday. It has four legs. My brother watches TV every night."]}, {"key": "Notas", "items": ["*he, she, it* + verbo con **-s**: *he works*, *she plays*.", "Con *go, do, watch* añadimos **-es**: *she goes*, *he does*, *it watches*.", "*have* cambia a *has*: *she has a car*."]}, {"key": "Preguntas", "items": ["Where does he work? What does she do on Monday?"]}, {"key": "Ejercicio", "items": ["Completa: She ___ (go) to school. He ___ (have) a dog."]}, {"key": "Respuestas", "items": ["goes, has"]}, {"key": "Habla en voz alta", "items": ["\"He works ___. She goes ___.\""]}], "exercise": null}, {"n": 3, "title": "No lo hago (negativo)", "sections": [{"key": "Tema", "items": ["*I don't* y *he / she doesn't* para decir lo que no haces."]}, {"key": "Vocabulario", "items": ["smoke (fumar), drink (beber), eat meat (comer carne)"]}, {"key": "Lectura", "items": ["I don't drink coffee. She doesn't work on Sunday. We don't watch TV in the morning. He doesn't eat meat."]}, {"key": "Notas", "items": ["*I, you, we, they* + *don't* + verbo: *I don't work*.", "*he, she, it* + *doesn't* + verbo sin **-s**: *she doesn't work* (no *works*)."]}, {"key": "Preguntas", "items": ["Does the speaker drink coffee? Does she work on Sunday?"]}, {"key": "Ejercicio", "items": ["Elige don't o doesn't: I ___ smoke. She ___ drink tea."]}, {"key": "Respuestas", "items": ["don't, doesn't"]}, {"key": "Habla en voz alta", "items": ["\"I don't ___. He doesn't ___.\""]}], "exercise": null}, {"n": 4, "title": "¿Haces...? ¿Hace...? (preguntas)", "sections": [{"key": "Tema", "items": ["preguntas con *do* y *does*."]}, {"key": "Vocabulario", "items": ["usually (normalmente), morning (mañana), evening (tarde / noche)"]}, {"key": "Lectura (diálogo)", "items": ["Do you work in the morning? → Yes, I do.", "Does she study at night? → No, she doesn't."]}, {"key": "Notas", "items": ["Preguntas con *I, you, we, they*: **Do** + sujeto + verbo. *Do you work?*", "Preguntas con *he, she, it*: **Does** + sujeto + verbo sin **-s**. *Does she work?*", "Respuesta corta: *Yes, I do.* / *No, she doesn't.*"]}, {"key": "Preguntas", "items": ["Does the speaker work in the morning? Does she study at night?"]}, {"key": "Ejercicio", "items": ["Forma la pregunta: ___ you like tea? / ___ she live here?"]}, {"key": "Respuestas", "items": ["Do, Does"]}, {"key": "Habla en voz alta", "items": ["\"Do you ___? Yes, I do. / No, I don't.\""]}], "exercise": null}, {"n": 5, "title": "¿A qué hora? (horas)", "sections": [{"key": "Tema", "items": ["decir la hora y usar *at* con horas."]}, {"key": "Vocabulario", "items": ["What time is it? (¿Qué hora es?), o'clock (en punto), half past (y media), quarter past (y cuarto)"]}, {"key": "Lectura", "items": ["What time is it? It is seven o'clock. I wake up at half past six. I have lunch at twelve. I go to bed at ten."]}, {"key": "Notas", "items": ["Para preguntar la hora: *What time is it?*", "Con horas usamos **at**: *at seven*, *at half past six*.", "*o'clock* solo se usa con horas exactas: *seven o'clock*."]}, {"key": "Preguntas", "items": ["What time does the speaker wake up? When does he have lunch?"]}, {"key": "Ejercicio", "items": ["Elige at: I wake up ___ seven. We have dinner ___ nine."]}, {"key": "Respuestas", "items": ["at, at"]}, {"key": "Habla en voz alta", "items": ["\"I wake up at ___. I go to bed at ___.\""]}], "exercise": null}, {"n": 6, "title": "Siempre, a veces, nunca (frecuencia)", "sections": [{"key": "Tema", "items": ["adverbios de frecuencia: *always, usually, often, sometimes, never*."]}, {"key": "Vocabulario", "items": ["always (siempre), usually (normalmente), often (a menudo), sometimes (a veces), never (nunca)"]}, {"key": "Lectura", "items": ["I always have coffee in the morning. I usually walk to work. I sometimes cook dinner. I never drink soda."]}, {"key": "Notas", "items": ["El adverbio va **antes** del verbo: *I always work*, *she never sleeps late*.", "Con *to be*, el adverbio va **después**: *I am always happy*.", "*never* ya es negativo: no uses *don't* con él. Di *I never drink*, no *I don't never drink*."]}, {"key": "Preguntas", "items": ["Does the speaker drink soda? What does he have in the morning?"]}, {"key": "Ejercicio", "items": ["Pon el adverbio en su lugar: I (usually) walk to work. → I usually walk to work. She (never) eats fast food. → ___."]}, {"key": "Respuesta", "items": ["She never eats fast food."]}, {"key": "Habla en voz alta", "items": ["\"I always ___. I sometimes ___. I never ___.\""]}], "exercise": null}, {"n": 7, "title": "Repaso y hablar de un día", "sections": [{"key": "Lectura de repaso", "items": ["I work every day. She works in a school. We don't work on Sunday. Do you work at night?"]}, {"key": "Tema", "items": ["juntar lo visto para contar un día normal."]}, {"key": "Repaso rápido", "items": ["presente simple (*I work / she works*), negativos (*don't / doesn't*), preguntas (*do / does*), horas (*at seven*), frecuencia (*always, never*)."]}, {"key": "Actividad de habla (en voz alta)", "items": ["\"I wake up at ___. I usually ___ in the morning. I ___ at ___. I never ___. I go to bed at ___.\""]}, {"key": "Actividad escrita", "items": ["escribe tu día en 5 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 wake up, 2 goes, 3 watch, 4 doesn't, 5 don't, 6 Do, 7 Does, 8 at, 9 always, 10 never", "Nota: los textos son originales."]}], "exercise": rro)"]}, {"key": "Lectura", "items": ["I have a sister. She has two dogs. We have a big house. My parents have a car."]}, {"key": "Notas", "items": ["*I, you, we, they* + **have**.", "*he, she, it* + **has**."]}, {"key": "Preguntas", "items": ["How many dogs does she have? What do the parents have?"]}, {"key": "Ejercicio", "items": ["She ___ a cat. / We ___ a garage. → **has, have**"]}, {"key": "Habla", "items": ["\"I have a ___. My family has ___.\""]}], "exercise": null}, {"n": 3, "title": "No hay / No tengo (negativo)", "sections": [{"key": "Tema", "items": ["decir lo que no hay o no tienes."]}, {"key": "Vocabulario", "items": ["garden (jardín), pet (mascota), sofa (sofá)"]}, {"key": "Lectura", "items": ["There isn't a garden in my house. There aren't any pets. I don't have a car. She doesn't have a brother."]}, {"key": "Notas", "items": ["*There isn't* (una cosa) / *there aren't* (varias).", "*I don't have* / *she doesn't have*."]}, {"key": "Preguntas", "items": ["Is there a garden? Does the speaker have a car?"]}, {"key": "Ejercicio", "items": ["There ___ a sofa. (isn't / aren't) → **isn't**. She ___ a car. (don't have / doesn't have) → **doesn't have**"]}, {"key": "Habla", "items": ["\"There isn't a ___. I don't have a ___.\""]}], "exercise": {"stem": "There ___ a sofa. (isn't / aren't) → **isn't**. She ___ a car.", "options": ["don't have", "doesn't have"], "answer": "doesn't have"}}, {"n": 4, "title": "Preguntas sobre casa y familia", "sections": [{"key": "Tema", "items": ["preguntar *Is there...?, Are there...?, Do you have...?*"]}, {"key": "Vocabulario", "items": ["bathroom (baño), garage (garaje)"]}, {"key": "Lectura (diálogo)", "items": ["Is there a garden? → Yes, there is.", "Do you have a pet? → No, I don't."]}, {"key": "Notas", "items": ["*Is there* / *Are there* al principio de la pregunta.", "*Do* para *I, you, we, they*. *Does* para *he, she, it*."]}, {"key": "Preguntas", "items": ["Is there a bathroom? Does she have a brother?"]}, {"key": "Ejercicio", "items": ["___ there a bathroom? → **Is**. ___ she have a brother? → **Does**"]}, {"key": "Habla", "items": ["\"Is there a ___? Do you have a ___?\""]}], "exercise": null}, {"n": 5, "title": "Mi familia", "sections": [{"key": "Tema", "items": ["nombrar a los miembros de la familia."]}, {"key": "Vocabulario", "items": ["mother (madre), father (padre), grandmother (abuela), son (hijo), daughter (hija), aunt (tía), uncle (tío), cousin (primo/prima)"]}, {"key": "Lectura", "items": ["My mother is a doctor. My father is an engineer. My grandmother lives with us. I have an aunt and an uncle."]}, {"key": "Notas", "items": ["*My* = mi (lo que es mío).", "*lives* = vive. Con *he, she, it* añadimos **-s**."]}, {"key": "Preguntas", "items": ["What is the mother's job? Who lives with the speaker?"]}, {"key": "Ejercicio", "items": ["My ___ is my father's sister. → **aunt**. My ___ is my mother's son. → **brother**"]}, {"key": "Habla", "items": ["\"My ___ is a ___. I have a ___.\""]}], "exercise": null}, {"n": 6, "title": "Describir la casa (adjetivos)", "sections": [{"key": "Tema", "items": ["decir cómo es algo: *big, small, new, old, nice*."]}, {"key": "Vocabulario", "items": ["big (grande), small (pequeño), new (nuevo), old (viejo), nice (bonito/agradable)"]}, {"key": "Lectura", "items": ["My house is small but nice. It has a new kitchen. The garden is big."]}, {"key": "Notas", "items": ["El adjetivo va **antes** del sustantivo: *a big house*, no *a house big*.", "Los adjetivos no cambian en plural: *big houses*."]}, {"key": "Preguntas", "items": ["Is the house big? What is new in the house?"]}, {"key": "Ejercicio", "items": ["Pon el adjetivo en su sitio: house / big / a → **a big house**"]}, {"key": "Habla", "items": ["\"My house is ___. It has a ___ ___.\""]}], "exercise": null}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["There is a sofa in the living room. There are two bedrooms. Is there a garden? Yes, there is."]}, {"key" , restaurante, precios."]}, {"key": "Actividad de habla (role play)", "items": ["Eres cliente en una tienda. Pide 2 cosas, pregunta el precio y paga."]}, {"key": "Actividad escrita", "items": ["escribe tu lista de compra en 5 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 some, 2 any, 3 much, 4 many, 5 I'd, 6 breakfast, 7 menu, 8 cheap, 9 much, 10 Can"]}], "exercise": null}], "exam": [{"stem": "I have ___ apples.", "options": ["some", "any"], "answer": "some"}, {"stem": "I don't have ___ milk.", "options": ["some", "any"], "answer": "any"}, {"stem": "How ___ bread do you need?", "options": ["much", "many"], "answer": "much"}, {"stem": "How ___ eggs do you need?", "options": ["much", "many"], "answer": "many"}, {"stem": "___ like a kilo of rice, please.", "options": ["I'd", "I am"], "answer": "I'd"}, {"stem": "For ___ I have toast.", "options": ["breakfast", "dinner"], "answer": "breakfast"}, {"stem": "Can I see the ___?", "options": ["menu", "bill"], "answer": "menu"}, {"stem": "The coffee is ___.", "options": ["cheap", "cheaps"], "answer": "cheap"}, {"stem": "How ___ is it?", "options": ["much", "many"], "answer": "much"}, {"stem": "___ you pay with a card?", "options": ["Can", "Cans"], "answer": "Can"}]}, {"id": "a1-u5", "level": "A1", "num": 5, "title": "Lugares y momentos", "meta": "decir dónde y cuándo pasan las cosas: días, meses, lugares y partes del día.", "lessons": [{"n": 1, "title": "Días (on)", "sections": [{"key": "Tema", "items": ["usar *on* con los días de la semana."]}, {"key": "Vocabulario", "items": ["Monday (lunes), Friday (viernes), Saturday (sábado), Sunday (domingo), weekend (fin de semana)"]}, {"key": "Lectura", "items": ["I work on Monday. I go to the gym on Friday. We relax on the weekend."]}, {"key": "Notas", "items": ["*on* + día: *on Monday*.", "Los días siempre llevan mayúscula."]}, {"key": "Ejercicio", "items": ["I study ___ Tuesday. → **on**"]}, {"key": "Habla", ura (diálogo)", "items": ["How often do you go to the gym? → Twice a week.", "How often do you call your mother? → Every day."]}, {"key": "Notas", "items": ["*How often* = ¿con qué frecuencia?", "*once* = una vez, *twice* = dos veces, *three times* = tres veces."]}, {"key": "Preguntas", "items": ["How often does the speaker go to the gym? How often does he call his mother?"]}, {"key": "Ejercicio", "items": ["I swim ___ a week. (once / every) → **once**"]}, {"key": "Habla", "items": ["\"I ___ a week.\""]}], "exercise": {"stem": "I swim ___ a week.", "options": ["once", "every"], "answer": "once"}}, {"n": 2, "title": "Una rutina completa (presente simple)", "sections": [{"key": "Tema", "items": ["contar una rutina larga con presente simple."]}, {"key": "Vocabulario", "items": ["get up (levantarse), go for a run (salir a correr), commute (ir y volver del trabajo), finish (terminar)"]}, {"key": "Lectura", "items": ["I get up at 6:30. I usually go for a run before breakfast. I commute to work by train. I finish at 5 o'clock."]}, {"key": "Notas", "items": ["Tercera persona lleva **-s**: *she goes*, *he finishes*.", "*before* = antes de. *after* = después de."]}, {"key": "Ejercicio", "items": ["She ___ (go) for a run every morning. → **goes**"]}, {"key": "Habla", "items": ["\"I get up at ___. I usually ___.\""]}], "exercise": null}, {"n": 3, "title": "El fin de semana (on, at the weekend)", "sections": [{"key": "Tema", "items": ["hablar de lo que haces los fines de semana."]}, {"key": "Vocabulario", "items": ["at the weekend (el fin de semana), on Sundays (los domingos), sleep in (dormir hasta tarde), relax (descansar)"]}, {"key": "Lectura", "items": ["At the weekend I sleep in. On Sundays I relax at home. On Saturdays I meet my friends."]}, {"key": "Notas", "items": ["*at the weekend* es la forma más común en A2.", "Para días en plural usamos *on Sundays*."]}, {"key": "Ejercicio", "items": ["I meet my friends ___ Saturdays. → **on**"]}, {"key": "Habla", "items": ["\"At th e"], "answer": "is"}, {"stem": "Check-out is ___ noon.", "options": ["at", "in"], "answer": "at"}, {"stem": "The beach was ___.", "options": ["beautiful", "beautifully"], "answer": "beautiful"}, {"stem": "I really ___ the museum.", "options": ["enjoy", "enjoyed"], "answer": "enjoyed"}, {"stem": "Don't forget your ___.", "options": ["passport", "passports"], "answer": "passport"}]}, {"id": "a2-u4", "level": "A2", "num": 4, "title": "Comparar", "meta": "comparar cosas y personas, y decir cuál es el mejor, el más grande o el más caro.", "lessons": [{"n": 1, "title": "Comparativo corto (-er)", "sections": [{"key": "Tema", "items": ["comparar con adjetivos cortos: *bigger, cheaper, older*."]}, {"key": "Vocabulario", "items": ["big (grande), cheap (barato), old (viejo), fast (rápido), small (pequeño)"]}, {"key": "Lectura", "items": ["My house is bigger than yours. This bag is cheaper than that one. The train is faster than the bus."]}, {"key": "Notas", "items": ["Adjetivo corto + **-er** + *than*: *bigger than*.", "Si termina en *e*, solo añade **-r**: *nice → nicer*."]}, {"key": "Ejercicio", "items": ["My car is ___ (old) than yours. → **older**"]}, {"key": "Habla", "items": ["\"___ is bigger than ___.\""]}], "exercise": null}, {"n": 2, "title": "Comparativo largo (more)", "sections": [{"key": "Tema", "items": ["comparar con adjetivos largos: *more expensive, more interesting*."]}, {"key": "Vocabulario", "items": ["expensive (caro), interesting (interesante), beautiful (bonito), comfortable (cómodo)"]}, {"key": "Lectura", "items": ["This hotel is more expensive than that one. The book is more interesting than the film. This city is more beautiful than mine."]}, {"key": "Notas", "items": ["Adjetivo largo: *more* + adjetivo + *than*.", "No añadas **-er** a adjetivos largos."]}, {"key": "Ejercicio", "items": ["This book is ___ (interesting) than the film. → **more interesting**"]}, {"key": "Habla", "items": ["\"___ is more ___ than ___.\""]}], "exercise": null}, {"n": 3, "t
