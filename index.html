ions": [{"key": "Tema", "items": ["diferenciar quien da una idea de quien la entiende."]}, {"key": "Vocabulario", "items": ["imply (insinuar, dar a entender), infer (deducir), guilty (culpable), tone (tono), angry (enfadado)"]}, {"key": "Lectura", "items": ["His answer seemed to imply that he was guilty. I infer from your tone that you were angry."]}, {"key": "Notas", "items": ["*imply* = la persona que habla da a entender algo.", "*infer* = la persona que escucha deduce algo."]}, {"key": "Ejercicio", "items": ["His answer seemed to ___ that he was guilty. (imply / infer) → **imply**"]}, {"key": "Habla", "items": ["\"You seem to ___. I infer that ___.\""]}], "exercise": {"stem": "His answer seemed to ___ that he was guilty.", "options": ["imply", "infer"], "answer": "imply"}}, {"n": 3, "title": "Infer (deducir a partir de algo)", "sections": [{"key": "Tema", "items": ["practicar *infer* con ejemplos."]}, {"key": "Vocabulario", "items": ["infer (deducir), tone (tono), voice (voz), upset (molesto), silence (silencio)"]}, {"key": "Lectura", "items": ["I infer that you were upset from your voice. From her silence, we can infer that she disagreed."]}, {"key": "Notas", "items": ["*infer from* = deducir a partir de (algo que ves u oyes).", "*imply* nunca va seguido de *from* con este sentido."]}, {"key": "Ejercicio", "items": ["I ___ that you were angry from your tone. (infer / imply) → **infer**"]}, {"key": "Habla", "items": ["\"I infer from ___ that ___.\""]}], "exercise": {"stem": "I ___ that you were angry from your tone.", "options": ["infer", "imply"], "answer": "infer"}}, {"n": 4, "title": "Few y a few (contables)", "sections": [{"key": "Tema", "items": ["usar *few* y *a few* con cosas que se cuentan."]}, {"key": "Vocabulario", "items": ["few (pocos, casi ninguno), a few (algunos, unos pocos), people (personas), room (sala), friends (amigos)"]}, {"key": "Lectura", "items": ["There are few people in the room. I have a few friends I can trust."]}, {"key": "Notas", "items": ["*few* = casi ninguno (tono negativo).", "*a few* = algunos (tono positivo).", "Se usa con sustantivos contables (*people, books, friends*)."]}, {"key": "Ejercicio", "items": ["There are ___ people in the room. (few / little) → **few**"]}, {"key": "Habla", "items": ["\"I have a few ___. There are few ___.\""]}], "exercise": {"stem": "There are ___ people in the room.", "options": ["few", "little"], "answer": "few"}}, {"n": 5, "title": "Little y a little (incontables)", "sections": [{"key": "Tema", "items": ["usar *little* y *a little* con cosas que no se cuentan."]}, {"key": "Vocabulario", "items": ["little (poco, casi nada), a little (un poco), hope (esperanza), water (agua), time (tiempo)"]}, {"key": "Lectura", "items": ["There is little hope left. I have a little time before the meeting."]}, {"key": "Notas", "items": ["*little* = casi nada (negativo).", "*a little* = un poco (positivo).", "Se usa con sustantivos incontables (*water, time, hope*)."]}, {"key": "Ejercicio", "items": ["There is ___ hope left. (little / few) → **little**"]}, {"key": "Habla", "items": ["\"I have a little ___. There is little ___.\""]}], "exercise": {"stem": "There is ___ hope left.", "options": ["little", "few"], "answer": "little"}}, {"n": 6, "title": "Make y do", "sections": [{"key": "Tema", "items": ["diferenciar *make* (crear) y *do* (realizar una tarea)."]}, {"key": "Vocabulario", "items": ["make (hacer, crear), do (hacer, realizar), decision (decisión), homework (deberes), mistake (error)"]}, {"key": "Lectura", "items": ["We need to make a decision today. I'll do my homework tonight. She made a mistake."]}, {"key": "Notas", "items": ["*make* = crear algo nuevo: *make a decision, a mistake, a plan*.", "*do* = realizar una tarea o trabajo: *do homework, do the dishes, do work*."]}, {"key": "Ejercicio", "items": ["We need to ___ a decision today. (make / do) → **make**"]}, {"key": "Habla", "items": ["\"I need to make ___. I have to do ___.\""]}], "exercise": {"stem": "We need ed is a bit more time."]}, {"key": "Notas", "items": ["*All + sujeto + want / need + is + idea*.", "Se usa mucho en la conversación para expresar deseos fuertes."]}, {"key": "Ejercicio", "items": ["All I want ___ some sleep. (is / are) → **is**"]}, {"key": "Habla", "items": ["\"All I need is ___.\""]}], "exercise": {"stem": "All I want ___ some sleep.", "options": ["is", "are"], "answer": "is"}}, {"n": 6, "title": "Such... that y not until (énfasis de intensidad)", "sections": [{"key": "Tema", "items": ["dar énfasis a una intensidad o un momento."]}, {"key": "Vocabulario", "items": ["such (tan, tal), crowd (multitud), left (salimos), early (temprano), until (hasta que)"]}, {"key": "Lectura", "items": ["Such was the crowd that we left early. Not until later did she realise her mistake."]}, {"key": "Notas", "items": ["*Such was the crowd that...* = fue tanta la multitud que... (inversión formal).", "*Not until + tiempo + auxiliar + sujeto* = no fue hasta que..."]}, {"key": "Ejercicio", "items": ["Such ___ the crowd that we left early. (was / were) → **was**"]}, {"key": "Habla", "items": ["\"Such was ___ that ___.\""]}], "exercise": {"stem": "Such ___ the crowd that we left early.", "options": ["was", "were"], "answer": "was"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["It was the manager who made the final decision. Not until the report was finished did we relax. Little did she realise the consequences."]}, {"key": "Repaso", "items": ["cleft con *it* (*it was... who / that*), wh-cleft (*What I need is*), *do* enfático, *it was... that*, *All I want is*, *Such was... that* y *Not until*."]}, {"key": "Actividad de habla", "items": ["di 3 frases de énfasis sobre tu vida (*It was my mother who...*, *What I need is...*, *All I want is...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con estructuras de énfasis sobre un viaje o una experiencia."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", " ) → **look into**"]}, {"key": "Habla", "items": ["\"I will look into ___.\""]}], "exercise": {"stem": "We will ___ the problem next week.", "options": ["look into", "look up"], "answer": "look into"}}, {"n": 2, "title": "Palabras formales frente a informales (request, ask)", "sections": [{"key": "Tema", "items": ["cambiar palabras informales por formales."]}, {"key": "Vocabulario", "items": ["request (solicitar), purchase (comprar, formal), assist (ayudar, formal), ask for (pedir), buy (comprar)"]}, {"key": "Lectura", "items": ["I would like to request more information. We wish to purchase the software."]}, {"key": "Notas", "items": ["*request* = solicitar (formal) en lugar de *ask for*.", "*purchase* = comprar (formal) en lugar de *buy*.", "*assist* = ayudar (formal) en lugar de *help*."]}, {"key": "Ejercicio", "items": ["The formal word for \"ask for\" is ___. (request / requirement) → **request**"]}, {"key": "Habla", "items": ["\"I would like to ___ the information.\""]}], "exercise": {"stem": "The formal word for \"ask for\" is ___.", "options": ["request", "requirement"], "answer": "request"}}, {"n": 3, "title": "Cierres de cartas (Yours sincerely, Yours faithfully)", "sections": [{"key": "Tema", "items": ["cerrar una carta formal según lo que sabes de la persona."]}, {"key": "Vocabulario", "items": ["sincerely (sinceramente), faithfully (fielmente, formal), Dear (Querido/a, formal), Sir (señor), Madam (señora)"]}, {"key": "Lectura", "items": ["Dear Mr Smith, ... Yours sincerely. Dear Sir or Madam, ... Yours faithfully."]}, {"key": "Notas", "items": ["*Yours sincerely* = cuando conoces el nombre de la persona.", "*Yours faithfully* = cuando no conoces el nombre (*Dear Sir or Madam*)."]}, {"key": "Ejercicio", "items": ["Dear Sir, ... Yours ___. (sincerely / cheers) → **sincerely**"]}, {"key": "Habla", "items": ["\"If I know the name, I close with ___.\""]}], "exercise": {"stem": "Dear Sir, ... Yours ___.", "options": ["sincerely", "cheers"], "answer": "sincerely"}}, {"n": 4, "title": "Saludos informales (What's up?)", "sections": [{"key": "Tema", "items": ["saludar de forma relajada con amigos."]}, {"key": "Vocabulario", "items": ["what's up (qué tal), hey (oye), hi (hola), catch up (ponerse al día), cheers (gracias, salud)"]}, {"key": "Lectura", "items": ["Hey, what's up? Let's catch up soon. Cheers!"]}, {"key": "Notas", "items": ["*What's up?* = ¿qué tal? (informal).", "*Cheers* = gracias o salud, solo con amigos.", "No uses estas frases en emails formales."]}, {"key": "Ejercicio", "items": ["Hey, what's ___? (up / over) → **up**"]}, {"key": "Habla", "items": ["\"Hey, what's ___? Let's catch up ___.\""]}], "exercise": {"stem": "Hey, what's ___?", "options": ["up", "over"], "answer": "up"}}, {"n": 5, "title": "Palabras informales y slang (knackered, starving)", "sections": [{"key": "Tema", "items": ["reconocer palabras informales y de tono coloquial."]}, {"key": "Vocabulario", "items": ["knackered (agotado, británico, informal), starving (muerto de hambre, informal), tired (cansado, neutral), hungry (hambriento, neutral), trip (viaje)"]}, {"key": "Lectura", "items": ["I'm absolutely knackered after the trip. I'm starving!"]}, {"key": "Notas", "items": ["*knackered* = muy cansado (informal, británico).", "*starving* = con mucha hambre (informal, exagerado).", "En textos formales usa *exhausted* o *very hungry*."]}, {"key": "Ejercicio", "items": ["I'm absolutely ___ after the trip. (knackered / knackering) → **knackered**"]}, {"key": "Habla", "items": ["\"I'm starving. I'm ___.\""]}], "exercise": {"stem": "I'm absolutely ___ after the trip.", "options": ["knackered", "knackering"], "answer": "knackered"}}, {"n": 6, "title": "Frases de cortesía formales (Could you give me..., I would be grateful)", "sections": [{"key": "Tema", "items": ["pedir algo de forma educada y formal."]}, {"key": "Vocabulario", "items": ["could (podría), give (dar), grateful (agradecido), help (ayuda), kindly (amablemente)"]}, {"key": "Lectura", "items": ["Could you give me a hand? I would be grateful if you could send the report."]}, {"key": "Notas", "items": ["*Could you give me...?* = más educado que *Give me...*.", "*I would be grateful if...* = muy formal y educado.", "*Could you give me a hand?* es informal; en formal di *Could you assist me?*."]}, {"key": "Ejercicio", "items": ["Could you ___ me a hand? (give / gave) → **give**"]}, {"key": "Habla", "items": ["\"Could you ___ me...? I would be grateful if...\""]}], "exercise": {"stem": "Could you ___ me a hand?", "options": ["give", "gave"], "answer": "give"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I would appreciate it if you could forward the document at your earliest convenience. Kindly confirm your attendance."]}, {"key": "Repaso", "items": ["*look into / investigate*, *request / ask for*, *Yours sincerely / faithfully*, *What's up?*, *knackered / starving*, cortesía formal."]}, {"key": "Actividad de habla", "items": ["di la misma frase en dos registros: una formal y otra informal (*I would like to request... / Can I ask for...?*)."]}, {"key": "Actividad escrita", "items": ["escribe un email formal de 4 frases pidiendo información y cierra con *Yours faithfully*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 look into, 2 request, 3 sincerely, 4 up, 5 knackered, 6 give, 7 purchase, 8 to, 9 faithfully, 10 informal"]}], "exercise": null}], "exam": [{"stem": "We will ___ the problem next week.", "options": ["look into", "look up"], "answer": "look into"}, {"stem": "The formal word for \"ask for\" is ___.", "options": ["request", "requirement"], "answer": "request"}, {"stem": "Dear Sir, ... Yours ___.", "options": ["sincerely", "cheers"], "answer": "sincerely"}, {"stem": "Hey, what's ___?", "options": ["up", "over"], "answer": "up"}, {"stem": "I'm absolutely ___ after the trip.", "options": ["knackered", "knackering"], "answer": "knackered"}, {"stem": "Could you ___ me a hand?", "options": ["give", "gave"], "answer": "give"}, {"stem": "The formal word for \"buy\" is ___.", "options": ["purchase", "purchasing"], "answer": "purchase"}, {"stem": "\"Gonna\" is short for \"going ___\".", "options": ["to", "for"], "answer": "to"}, {"stem": "Dear Sir or Madam, ... Yours ___.", "options": ["faithfully", "sincerely"], "answer": "faithfully"}, {"stem": "\"Knackered\" is ___.", "options": ["informal", "formal"], "answer": "informal"}]}, {"id": "c2-u5", "level": "C2", "num": 5, "title": "Ironía y humor", "meta": "entender y usar ironía, sarcasmo, exageración y humor en inglés.", "lessons": [{"n": 1, "title": "Sarcasmo (Oh, great. Another delay.)", "sections": [{"key": "Tema", "items": ["reconocer cuando alguien dice lo contrario de lo que piensa."]}, {"key": "Vocabulario", "items": ["sarcasm (sarcasmo), great (genial, en tono irónico), delay (retraso), meeting (reunión), tone (tono)"]}, {"key": "Lectura", "items": ["\"Oh, great. Another delay.\" This is said with a sarcastic tone."]}, {"key": "Notas", "items": ["Sarcasmo = decir lo contrario de lo que piensas, con tono burlón.", "Se reconoce por el tono, no solo por las palabras.", "*Oh, great* suele ser sarcástico cuando algo sale mal."]}, {"key": "Ejercicio", "items": ["\"Oh, great. Another delay.\" This is ___. (sarcasm / a compliment) → **sarcasm**"]}, {"key": "Habla", "items": ["\"Oh, great. ___.\" (Di algo malo con tono irónico.)"]}], "exercise": {"stem": "\"Oh, great. Another delay.\" This is ___.", "options": ["sarcasm", "a compliment"], "answer": "sarcasm"}}, {"n": 2, "title": "Understatement (It's not bad)", "sections": [{"key": "Tema", "items": ["decir algo menos de lo que es, para dar énfasis."]}, {"key": "Vocabulario", "items": ["understatement (atenuación, decir menos), bad (malo), excellent (excelente), cold (frío), freezing (helado)"]}, {"key": "Lectura", "items": ["\"It's not bad\" can mean the food is excellent. \"It's a bit cold\" when it's freezing is an understatement."]}, {"key": "Notas", "items": ["*It's not bad* = está bien, incluso muy bien.", "*a bit cold* cuando hace mucho frío = understatement (decir menos).", "Es muy típico del humor británico."]}, {"key": "Ejercicio", "items": ["\"It's not bad\" can mean the thing is ___. (excellent / terrible) → **excellent**"]}, {"key": "Habla", "items": ["\"It's not bad. It's a bit ___.\""]}], "exercise": {"stem": "\"It's not bad\" can mean the thing is ___.", "options": ["excellent", "terrible"], "answer": "excellent"}}, {"n": 3, "title": "Hipérbole (I've told you a million times)", "sections": [{"key": "Tema", "items": ["exagerar para dar énfasis, sin mentir."]}, {"key": "Vocabulario", "items": ["hyperbole (hipérbole), million (millón), times (veces), hungry (hambriento), dying (muriendo)"]}, {"key": "Lectura", "items": ["I've told you a million times. I'm dying of hunger."]}, {"key": "Notas", "items": ["*a million times* = muchísimas veces (exageración).", "*I'm dying of hunger* = tengo muchísima hambre (exageración).", "Nadie lo toma literal."]}, {"key": "Ejercicio", "items": ["\"I've told you a million times.\" This is ___. (hyperbole / a fact) → **hyperbole**"]}, {"key": "Habla", "items": ["\"I've told you a ___ times.\""]}], "exercise": {"stem": "\"I've told you a million times.\" This is ___.", "options": ["hyperbole", "a fact"], "answer": "hyperbole"}}, {"n": 4, "title": "Ironía en comentarios (Brilliant idea, really)", "sections": [{"key": "Tema", "items": ["decir algo positivo para expresar lo contrario."]}, {"key": "Vocabulario", "items": ["brilliant (brillante), idea (idea), irony (ironía), really (de verdad), mistake (error)"]}, {"key": "Lectura", "items": ["\"Brilliant idea, really.\" said after a bad idea shows irony."]}, {"key": "Notas", "items": ["Ironía = decir algo positivo para expresar algo negativo.", "Se parece al sarcasmo, pero es más suave."]}, {"key": "Ejercicio", "items": ["\"Brilliant idea, really.\" said after a bad idea shows ___. (irony / agreement) → **irony**"]}, {"key": "Habla", "items": ["\"Brilliant, really. ___.\""]}], "exercise": {"stem": "\"Brilliant idea, really.\" said after a bad idea shows ___.", "options": ["irony", "agreement"], "answer": "irony"}}, {"n": 5, "title": "Humor seco (dry humour)", "sections": [{"key": "Tema", "items": ["reconocer un humor sereno, sin reírse de lo que dices."]}, {"key": "Vocabulario", "items": ["dry (seco), understated (sutil, sin exagerar), calm (tranquilo), joke (broma), delivered (dicho)"]}, {"key": "Lectura", "items": ["Dry humour is funny because it is calm and understated. The joke was delivered without a smile."]}, {"key": "Notas", "items": ["*dry humour* = humor sin exageración, muy calmado.", "Lo usan mucho los británicos.", "Es fácil no notarlo si no conoces el contexto."]}, {"key": "Ejercicio", "items": ["Dry humour is funny but calm and ___. (understated / loud) → **understated**"]}, {"key": "Habla", "items": ["\"His dry humour is ___.\""]}], "exercise": {"stem": "Dry humour is funny but calm and ___.", "options": ["understated", "loud"], "answer": "understated"}}, {"n": 6, "title": "Juegos de palabras (puns)", "sections": [{"key": "Tema", "items": ["entender un juego de palabras con doble sentido."]}, {"key": "Vocabulario", "items": ["pun (juego de palabras), meaning (significado), double (doble), word (palabra), funny (gracioso)"]}, {"key": "Lectura", "items": ["A pun is a joke that uses a word with two meanings. \"I'm reading a book about anti-gravity. It's impossible to put down!\""]}, {"key": "Notas", "items": ["Un *pun* usa una palabra con dos significados (*put down* = dejar, también = criticar).", "Son muy comunes en carteles, títulos y chistes."]}, {"key": "Ejercicio", "items": ["A pun is a joke using words with ___. (two meanings / no meaning) → **two meanings**"]}, {"key": "Habla", "items": ["\"That's a pun. The word ___ means ___.\""]}], "exercise": {"stem": "A pun is a joke using words with ___.", "options": ["two meanings", "no meaning"], "answer": "two meanings"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Oh great, another meeting on a Friday evening. Sure, I'd love to work through the weekend. Yeah, right, as if that will happen."]}, {"key": "Repaso", "items": ["sarcasmo, understatement, hipérbole, ironía, humor seco, juegos de palabras."]}, {"key": "Actividad de habla", "items": ["cuenta un chiste o una situación con ironía y explica el tono."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con ironía, exageración o un pun simple."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 sarcasm, 2 excellent, 3 hyperbole, 4 irony, 5 understatement, 6 hyperbole, 7 understated, 8 two meanings, 9 opposite, 10 laughing"]}], "exercise": null}], "exam": [{"stem": "\"Oh, great. Another delay.\" This is ___.", "options": ["sarcasm", "a compliment"], "answer": "sarcasm"}, {"stem": "\"It's not bad\" can mean the thing is ___.", "options": ["excellent", "terrible"], "answer": "excellent"}, {"stem": "\"I've told you a million times.\" This is ___.", "options": ["hyperbole", "a fact"], "answer": "hyperbole"}, {"stem": "\"Brilliant idea, really.\" said after a bad idea shows ___.", "options": ["irony", "agreement"], "answer": "irony"}, {"stem": "\"It's a bit cold\" when it's freezing is an ___.", "options": ["understatement", "exaggeration"], "answer": "understatement"}, {"stem": "\"I'm dying of hunger.\" is ___.", "options": ["hyperbole", "sarcasm"], "answer": "hyperbole"}, {"stem": "Dry humour is calm and ___.", "options": ["understated", "exaggerated"], "answer": "understated"}, {"stem": "A pun is a joke using words with ___.", "options": ["two meanings", "one meaning"], "answer": "two meanings"}, {"stem": "Sarcasm often means the ___ of what you say.", "options": ["opposite", "same"], "answer": "opposite"}, {"stem": "In a text message, \"lol\" shows you are ___.", "options": ["laughing", "crying"], "answer": "laughing"}]}, {"id": "c2-u6", "level": "C2", "num": 6, "title": "Textos literarios y complejos", "meta": "entender lenguaje figurado, tono y estructura en textos de novela, poesía y artículos complejos.", "lessons": [{"n": 1, "title": "Metáfora (Her voice was music)", "sections": [{"key": "Tema", "items": ["reconocer una comparación directa sin *like* ni *as*."]}, {"key": "Vocabulario", "items": ["metaphor (metáfora), voice (voz), music (música), sky (cielo), blanket (manta)"]}, {"key": "Lectura", "items": ["Her voice was music. The sky was a grey blanket."]}, {"key": "Notas", "items": ["Metáfora = decir que algo *es* otra cosa (sin *like* ni *as*).", "*Her voice was music* = su voz era preciosa, como música."]}, {"key": "Ejercicio", "items": ["\"The sky was a grey blanket.\" This is a ___. (metaphor / simile) → **metaphor**"]}, {"key": "Habla", "items": ["\"___ was a ___.\""]}], "exercise": {"stem": "\"The sky was a grey blanket.\" This is a ___.", "options": ["metaphor", "simile"], "answer": "metaphor"}}, {"n": 2, "title": "Símil (as brave as a lion)", "sections": [{"key": "Tema", "items": ["reconocer una comparación con *like* o *as*."]}, {"key": "Vocabulario", "items": ["simile (símil), brave (valiente), lion (león), like (como), as... as (tan... como)"]}, {"key": "Lectura", "items": ["He was as brave as a lion. She runs like the wind."]}, {"key": "Notas", "items": ["Símil = comparación con *like* o *as... as*.", "*as brave as a lion* = tan valiente como un león."]}, {"key": "Ejercicio", "items": ["\"He was as brave as a lion.\" This is a ___. (simile / metaphor) → **simile**"]}, {"key": "Habla", "items": ["\"He/She is as ___ as ___.\""]}], "exercise": {"stem": "\"He was as brave as a lion.\" This is a ___.", "options": ["simile", "metaphor"], "answer": "simile"}}, {"n": 3, "title": "Personificación (The wind whispered)", "sections": [{"key": "Tema", "items": ["dar características humanas a cosas que no son humanas."]}, {"key í/no → la voz sube al final (↗).", "Pregunta con *wh-* (*what, where, when*) → la voz baja al final (↘).", "Una frase afirmativa suele bajar la voz (↘)."]}, {"key": "Ejercicio", "items": ["A yes-no question usually has ___ intonation at the end. (rising / falling) → **rising**"]}, {"key": "Habla", "items": ["\"Are you ready? (↗)  Where are you? (↘)\""]}], "exercise": {"stem": "A yes-no question usually has ___ intonation at the end.", "options": ["rising", "falling"], "answer": "rising"}}, {"n": 5, "title": "Enlaces (turn off = \"tur-noff\")", "sections": [{"key": "Tema", "items": ["unir palabras para sonar fluido."]}, {"key": "Vocabulario", "items": ["linking (enlace), consonant (consonante), vowel (vocal), turn off (apagar), pick it up (cogerlo)"]}, {"key": "Lectura", "items": ["Turn off the light → \"tur-noff the light.\" Pick it up → \"pi-ki-tup.\""]}, {"key": "Notas", "items": ["Cuando una palabra termina en consonante y la siguiente empieza en vocal, se unen.", "*turn off* suena como *tur-noff*."]}, {"key": "Ejercicio", "items": ["\"Turn off\" links to sound like \"tur-___\". (noff / tern-off) → **noff**"]}, {"key": "Habla", "items": ["Di *turn off*, *pick it up*, *get out* de forma unida."]}], "exercise": {"stem": "\"Turn off\" links to sound like \"tur-___\".", "options": ["noff", "tern-off"], "answer": "noff"}}, {"n": 6, "title": "Letras mudas (knife, honest, lamb)", "sections": [{"key": "Tema", "items": ["reconocer letras que no se pronuncian."]}, {"key": "Vocabulario", "items": ["silent (silenciosa), knife (cuchillo), honest (honesto), lamb (cordero), letter (letra)"]}, {"key": "Lectura", "items": ["The k in *knife* is silent. The h in *honest* is silent. The b in *lamb* is silent."]}, {"key": "Notas", "items": ["*knife* → la *k* es muda: /naɪf/.", "*honest* → la *h* es muda: /ˈɒnɪst/.", "*lamb* → la *b* es muda: /læm/."]}, {"key": "Ejercicio", "items": ["The silent letter in \"honest\" is the ___. (h / s) → **h**"]}, {"key": "Habla", "items": ["\"knife, honest, lamb, write, listen.\""]}], "exercise": {"stem": "The silent letter in \"honest\" is the ___.", "options": ["h", "s"], "answer": "h"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["The word protest is stressed on the first syllable when it is a noun. When it is a verb, the stress moves to the second syllable."]}, {"key": "Repaso", "items": ["acento de palabra, acento de frase, formas débiles, entonación, enlaces, letras mudas."]}, {"key": "Actividad de habla", "items": ["lee en voz alta una frase con entonación de pregunta sí/no y otra de pregunta wh-."]}, {"key": "Actividad escrita", "items": ["escribe 4 frases con acento marcado en mayúsculas y una palabra con letra muda."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 PHO, 2 TOG, 3 first, 4 second, 5 k, 6 h, 7 /tə/, 8 rising, 9 vowel, 10 stressed"]}], "exercise": null}], "exam": [{"stem": "Which syllable is stressed in \"photograph\"?", "options": ["PHO", "to", "graph"], "answer": "PHO"}, {"stem": "In \"photography\" the stress is on ___.", "options": ["PHO", "TOG", "RA"], "answer": "TOG"}, {"stem": "The noun \"record\" has stress on the ___ syllable.", "options": ["first", "second"], "answer": "first"}, {"stem": "The verb \"record\" has stress on the ___ syllable.", "options": ["first", "second"], "answer": "second"}, {"stem": "The silent letter in \"knife\" is the ___.", "options": ["k", "n"], "answer": "k"}, {"stem": "The silent letter in \"honest\" is the ___.", "options": ["h", "s"], "answer": "h"}, {"stem": "In \"I want to go\", \"to\" is pronounced ___.", "options": ["/tə/", "/tuː/"], "answer": "/tə/"}, {"stem": "A yes-no question usually has ___ intonation at the end.", "options": ["rising", "falling"], "answer": "rising"}, {"stem": "In connected speech, the final consonant of \"turn\" links to the start of \"off\" because \"off\" begins with a ___ sound.", "options": ["vowel", "consonant"], "answer": "vowel"}, {"stem": "Content words are usually ___.", "options": ["stressed", "unstressed"], "answer": "stressed"}]}, {"id": "c2-u9", "level": "C2", "num": 9, "title": "Escritura académica", "meta": "escribir ensayos y artículos académicos con tesis clara, citas, cohesión y un tono formal.", "lessons": [{"n": 1, "title": "Tesis (thesis statement)", "sections": [{"key": "Tema", "items": ["escribir una frase que resuma la idea principal del ensayo."]}, {"key": "Vocabulario", "items": ["thesis statement (tesis), introduction (introducción), argue (defender), essay (ensayo), main (principal)"]}, {"key": "Lectura", "items": ["This essay argues that public transport should be free. The thesis statement appears in the introduction."]}, {"key": "Notas", "items": ["La tesis es la frase que dice qué vas a defender.", "Suele estar al final de la introducción."]}, {"key": "Ejercicio", "items": ["A thesis statement is usually placed in the ___ of the essay. (introduction / appendix) → **introduction**"]}, {"key": "Habla", "items": ["\"This essay argues that ___.\""]}], "exercise": {"stem": "A thesis statement is usually placed in the ___ of the essay.", "options": ["introduction", "appendix"], "answer": "introduction"}}, {"n": 2, "title": "Estructura de párrafo (topic sentence, evidence, explanation)", "sections": [{"key": "Tema", "items": ["construir un párrafo con una idea clara, una prueba y una explicación."]}, {"key": "Vocabulario", "items": ["topic sentence (frase principal), evidence (evidencia), explanation (explicación), paragraph (párrafo), support (apoyar)"]}, {"key": "Lectura", "items": ["Public transport reduces traffic. (topic sentence) A study found that cities with buses have fewer cars. (evidence) This shows that good transport changes behaviour. (explanation)"]}, {"key": "Notas", "items": ["*Topic sentence* = primera frase del párrafo.", "Después va la evidencia y la explicación."]}, {"key": "Ejercicio", "items": ["A topic sentence is usually the ___ sentence of a paragraph. (first / last) → **first**"]}, {"key": "Habla", "items": ["\"My paragraph begins with ___. The evidence is ___.\""]}], "exercise": {"stem": "A topic sentence is usually the ___ sentence of a paragraph.", "options": ["first", "last"], "answer": "first"}}, {"n": 3, "title": "Citar fuentes (According to Smith, 2020)", "sections": [{"key": "Tema", "items": ["citar a otros autores correctamente."]}, {"key": "Vocabulario", "items": ["according to (según), cite (citar), source (fuente), author (autor), year (año)"]}, {"key": "Lectura", "items": ["According to Smith (2020), prices will rise. Jones (2019) cites the same figures."]}, {"key": "Notas", "items": ["*According to* + autor + (año) = según el autor.", "*cite* = citar a alguien en el texto."]}, {"key": "Ejercicio", "items": ["\"According to Smith (2020), ...\" is a way to ___ a source. (cite / quote) → **cite**"]}, {"key": "Habla", "items": ["\"According to ___, ___.\""]}], "exercise": {"stem": "\"According to Smith (2020), ...\" is a way to ___ a source.", "options": ["cite", "quote"], "answer": "cite"}}, {"n": 4, "title": "Tono académico (many, obtain, avoid \"a lot of\")", "sections": [{"key": "Tema", "items": ["evitar expresiones informales en textos académicos."]}, {"key": "Vocabulario", "items": ["many (muchos), obtain (obtener), a lot of (muchos, informal), get (conseguir, informal), important (importante)"]}, {"key": "Lectura", "items": ["Many researchers obtained similar results. Avoid \"a lot of\" and \"get\" in academic writing."]}, {"key": "Notas", "items": ["*a lot of* → *many / much / a considerable number of*.", "*get* → *obtain / receive / gain*.", "Evita contracciones y frases de chat."]}, {"key": "Ejercicio", "items": ["Replace \"a lot of\" with ___. (many / lots) → **many**"]}, {"key": "Habla", "items": ["\"Instead of 'get', I would say ___.\""]}], "exercise": {"stem": "Replace \"a lot of\" with ___.", "options": ["many", "lots"], "answer": "many"}}, {"n": 5, "title": "Cohesión (In contrast, Similarly)", "sections": [{"key": "Tema", "items": ["unir ideas con conectores."]}, {"key": "Vocabulario", "items": ["in contrast (en cambio), similarly (de manera similar), however (sin embargo), therefore (por tanto), addition (adición)"]}, {"key": "Lectura", "items": ["Rural areas have few buses. In contrast, cities have frequent services. Similarly, rural areas struggle with costs."]}, {"key": "Notas", "items": ["*In contrast* = contraste (ideas opuestas).", "*Similarly* = semejanza (ideas parecidas).", "*Furthermore* = adición (añade una idea más)."]}, {"key": "Ejercicio", "items": ["\"In contrast\" shows ___. (contrast / addition) → **contrast**"]}, {"key": "Habla", "items": ["\"In contrast, ___. Similarly, ___.\""]}], "exercise": {"stem": "\"In contrast\" shows ___.", "options": ["contrast", "addition"], "answer": "contrast"}}, {"n": 6, "title": "Conclusión (This study has shown that)", "sections": [{"key": "Tema", "items": ["terminar un ensayo con una conclusión clara."]}, {"key": "Vocabulario", "items": ["conclusion (conclusión), shown (mostrado), study (estudio), suggest (sugerir), further research (más investigación)"]}, {"key": "Lectura", "items": ["This study has shown that free transport increases use. Further research is needed."]}, {"key": "Notas", "items": ["*This study has shown that* = este estudio ha demostrado que.", "*Further research is needed* = hacen falta más investigaciones."]}, {"key": "Ejercicio", "items": ["\"This study has shown that...\" is used in the ___. (conclusion / title) → **conclusion**"]}, {"key": "Habla", "items": ["\"To conclude, this study has shown that ___.\""]}], "exercise": {"stem": "\"This study has shown that...\" is used in the ___.", "options": ["conclusion", "title"], "answer": "conclusion"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["This essay argues that technology reshapes social bonds, both for better and for worse. The evidence suggests a cautious optimism."]}, {"key": "Repaso", "items": ["tesis, estructura de párrafo, citas (*according to*), tono académico (*many, obtain*), cohesión (*in contrast, similarly*), conclusión."]}, {"key": "Actividad de habla", "items": ["explica tu tesis en una frase y apóyala con una evidencia."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo académico de 6 frases con tesis, cita, conector y conclusión."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 introduction, 2 cite, 3 many, 4 obtain, 5 difference, 6 like, 7 conclusion, 8 first, 9 avoids, 10 followed"]}], "exercise": null}], "exam": [{"stem": "A thesis statement is usually placed in the ___ of the essay.", "options": ["introduction", "appendix"], "answer": "introduction"}, {"stem": "\"According to Smith (2020), ...\" is a way to ___ a source.", "options": ["cite", "copy"], "answer": "cite"}, {"stem": "Replace \"a lot of\" with ___.", "options": ["many", "lots"], "answer": "many"}, {"stem": "Replace \"get\" with ___.", "options": ["obtain", "grab"], "answer": "obtain"}, {"stem": "The linking phrase \"In contrast\" is used to show a ___.", "options": ["difference", "addition"], "answer": "difference"}, {"stem": "After \"Similarly\", the next idea is ___ the first one.", "options": ["like", "unlike"], "answer": "like"}, {"stem": "\"This study has shown that...\" is used in the ___.", "options": ["conclusion", "methods section"], "answer": "conclusion"}, {"stem": "A topic sentence is usually the ___ sentence of a paragraph.", "options": ["first", "last"], "answer": "first"}, {"stem": "Academic writing ___ contractions.", "options": ["avoids", "uses"], "answer": "avoids"}, {"stem": "Evidence should be ___ by an explanation.", "options": ["followed", "replaced"], "answer": "followed"}]}, {"id": "c2-u10", "level": "C2", "num": 10, "title": "Presentaciones en público", "meta": "dar presentaciones claras: abrir, guiar al público, usar gráficos, responder preguntas y cerrar.", "lessons": [{"n": 1, "title": "Abrir la presentación (Today I'm going to talk about)", "sections": [{"key": "Tema", "items": ["empezar una presentación de forma clara."]}, {"key": "Vocabulario", "items": ["today (hoy), talk about (hablar de), climate policy (política climática), welcome (bienvenidos), agenda (agenda)"]}, {"key": "Lectura", "items": ["Good morning, everyone. Today I'm going to talk about climate policy."]}, {"key": "Notas", "items": ["*Today I'm going to talk about* = hoy voy a hablar de...", "Empieza con un saludo y di el tema en la primera frase."]}, {"key": "Ejercicio", "items": ["Today I'm ___ to talk about climate policy. (going / go) → **going**"]}, {"key": "Habla", "items": ["\"Good morning. Today I'm going to talk about ___.\""]}], "exercise": {"stem": "Today I'm ___ to talk about climate policy.", "options": ["going", "go"], "answer": "going"}}, {"n": 2, "title": "Guiar al público (First of all, Moving on)", "sections": [{"key": "Tema", "items": ["indicar en qué parte de la presentación estás."]}, {"key": "Vocabulario", "items": ["first of all (en primer lugar), moving on (pasando a), finally (finalmente), background (contexto), point (punto)"]}, {"key": "Lectura", "items": ["First of all, I'll give a short background. Moving on to the next point, let's look at the data."]}, {"key": "Notas", "items": ["*First of all* = en primer lugar.", "*Moving on* = pasando a lo siguiente.", "Estas frases se llaman *signposting* (señalizar el camino)."]}, {"key": "Ejercicio", "items": ["___ of all, I'll give a short background. (First / Last) → **First**"]}, {"key": "Habla", "items": ["\"First of all, ___. Moving on, ___.\""]}], "exercise": {"stem": "___ of all, I'll give a short background.", "options": ["First", "Last"], "answer": "First"}}, {"n": 3, "title": "Usar gráficos (As you can see on this slide)", "sections": [{"key": "Tema", "items": ["explicar una imagen o gráfico."]}, {"key": "Vocabulario", "items": ["slide (diapositiva), chart (gráfico), as you can see (como ves), figures (cifras), increase (aumento)"]}, {"key": "Lectura", "items": ["As you can see on this slide, the figures increased. This chart shows the trend clearly."]}, {"key": "Notas", "items": ["*As you can see on this slide* = como ven en esta diapositiva.", "Describe el gráfico, no solo lo muestres."]}, {"key": "Ejercicio", "items": ["\"As you can see on this ___.\" (slide / slice) → **slide**"]}, {"key": "Habla", "items": ["\"As you can see on this ___, ___.\""]}], "exercise": {"stem": "\"As you can see on this ___.\"", "options": ["slide", "slice"], "answer": "slide"}}, {"n": 4, "title": "Captar la atención (rhetorical question)", "sections": [{"key": "Tema", "items": ["usar una pregunta para hacer pensar al público."]}, {"key": "Vocabulario", "items": ["rhetorical question (pregunta retórica), wondered (preguntado), why (por qué), audience (público), engage (captar)"]}, {"key": "Lectura", "items": ["Have you ever wondered why prices keep rising? It's a question we should all ask."]}, {"key": "Notas", "items": ["Una pregunta retórica no espera respuesta.", "Sirve para captar la atención del público."]}, {"key": "Ejercicio", "items": ["\"Have you ever wondered why?\" is a ___ question. (rhetorical / closed) → **rhetorical**"]}, {"key": "Habla", "items": ["\"Have you ever wondered ___?\""]}], "exercise": {"stem": "\"Have you ever wondered why?\" is a ___ question.", "options": ["rhetorical", "closed"], "answer": "rhetorical"}}, {"n": 5, "title": "Responder preguntas (That's a good question)", "sections": [{"key": "Tema", "items": ["responder preguntas del público con seguridad."]}, {"key": "Vocabulario", "items": ["question (pregunta), get back to you (responder más tarde), not sure (no seguro), follow up (seguimiento), answer (respuesta)"]}, {"key": "Lectura", "items": ["That's a good question. I'm not sure, but I'll get back to you by email."]}, {"key": "Notas", "items": ["*That's a good question* = buena pregunta (gana tiempo).", "*I'll get back to you* = te respondo más tarde.", "Si no sabes algo, di que lo averiguarás, sin inventar."]}, {"key": "Ejercicio", "items": ["I'm not sure, but I'll ___ back to you. (get / take) → **get**"]}, {"key": "Habla", "items": ["\"That's a good ___. I'll get back to you on that.\""]}], "exercise": {"stem": "I'm not sure, but I'll ___ back to you.", "options": ["get", "take"], "answer": "get"}}, {"n": 6, "title": "Cerrar (To wrap up, Thank you for listening)", "sections": [{"key": "Tema", "items": ["terminar la presentación con un resumen y dar las gracias."]}, {"key": "Vocabulario", "items": ["wrap up (resumir, cerrar), main point (punto principal), thank you (gracias), listening (escuchar), questions (preguntas)"]}, {"key": "Lectura", "items": ["To wrap up, let me repeat the main point. Thank you for listening. Are there any questions?"]}, {"key": "Notas", "items": ["*To wrap up* = para terminar.", "Antes de cerrar, repite la idea principal.", "*Are there any questions?* = ¿alguna pregunta?"]}, {"key": "Ejercicio", "items": ["To ___ up, let me repeat the main point. (wrap / cover) → **wrap**"]}, {"key": "Habla", "items": ["\"To wrap up, ___. Thank you for ___.\""]}], "exercise": {"stem": "To ___ up, let me repeat the main point.", "options": ["wrap", "cover"], "answer": "wrap"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Good morning, everyone. Today I want to talk about three ideas. Let me start with a question that changed my view."]}, {"key": "Repaso", "items": ["abrir (*Today I'm going to talk about*), guiar (*First of all, Moving on*), gráficos (*As you can see*), pregunta retórica, responder (*That's a good question, I'll get back to you*), cerrar (*To wrap up, Thank you for listening*)."]}, {"key": "Actividad de habla", "items": ["haz una presentación de 1 minuto sobre un tema tuyo: abre, guía, usa un gráfico imaginario y cierra."]}, {"key": "Actividad escrita", "items": ["escribe el guion de 6 frases para abrir y cerrar una presentación."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 going, 2 First, 3 slide, 4 rhetorical, 5 question, 6 get, 7 wrap, 8 listening, 9 on, 10 questions"]}], "exercise": null}], "exam": [{"stem": "Today I'm ___ to talk about climate policy.", "options": ["going", "go"], "answer": "going"}, {"stem": "___ of all, I'll give a short background.", "options": ["First", "Final"], "answer": "First"}, {"stem": "\"As you can see on this ___.\"", "options": ["slide", "slice"], "answer": "slide"}, {"stem": "\"Have you ever wondered why?\" is a ___ question.", "options": ["rhetorical", "closed"], "answer": "rhetorical"}, {"stem": "\"That's a good ___.\"", "options": ["question", "answer"], "answer": "question"}, {"stem": "I'm not sure, but I'll ___ back to you.", "options": ["get", "take"], "answer": "get"}, {"stem": "To ___ up, let me repeat the main point.", "options": ["wrap", "cover"], "answer": "wrap"}, {"stem": "Thank you for ___.", "options": ["listening", "listen"], "answer": "listening"}, {"stem": "Moving ___ to the next point.", "options": ["on", "over"], "answer": "on"}, {"stem": "Are there any ___?", "options": ["questions", "question"], "answer": "questions"}]}], "dialogs": {"a1-u1-lec1": [["Ana", "Hi, I am Ana. I am from Mexico. I am a teacher."], ["Tom", "Hi, Ana. I am Tom. I am from England. I am happy today."], ["Ana", "Nice to meet you, Tom!"], ["Tom", "Nice to meet you too."]], "a1-u1-lec2": [["Ana", "Hi, I am Ana. I am a teacher. I am from Mexico."], ["Tom", "Hi, Ana. I am Tom. I am not a teacher. I am a student."], ["Ana", "I am not a doctor. I am happy today."], ["Tom", "My friend is not a student. He is a chef."], ["Ana", "I am not from England. I am from Mexico."]], "a1-u1-lec3": [["Ana", "Hi, I am Ana. I am from Mexico. I am a teacher."], ["Tom", "Hi, Ana. I am Tom. I am not a teacher. I am a student."], ["Ana", "Are you from Spain, Tom?"] e finished the project in one week. Not only is the data huge, but the review might have taken longer."], ["Tom", "No, they couldn't have. You needn't have worried about that."], ["Ana", "I can't have sent the wrong file. I checked twice."], ["Tom", "Then it couldn't have been your mistake. Someone must have changed it later."], ["Ana", "That's what I think too. I wouldn't have sent it if I'd seen the error."], ["Tom", "Exactly. Let's check the version history."]], "c1-u3-lec6": [["Ana", "We used to meet every Friday for lunch. Remember? We must have spent hours talking about films."], ["Tom", "Yes, and we would spend hours talking about films. I used to hate Mondays too."], ["Ana", "I used to hate Mondays, but now I like them. You can't have forgotten the old office."], ["Tom", "My manager would always arrive late to meetings back then."], ["Ana", "We used to work in the old office, which was tiny. I should have asked for a bigger desk."], ["Tom", "And the coffee machine would break every day!"], ["Ana", "Those were the days. I miss them sometimes."], ["Tom", "Me too. We should have kept meeting."]], "c1-u3-lec7": [["Ana", "They must have left early, because the house is empty. They might have gone to the beach."], ["Tom", "Then you needn't have brought a gift. She can't have been ill, though, because she was cheerful yesterday."], ["Ana", "I shouldn't have said that about her. We used to play outside together when we were kids."], ["Tom", "I remember. Her brother can't have finished work so fast. My father used to say the job took him hours."], ["Ana", "Should we have called them? We might have missed the chance."], ["Tom", "We could have, but we needn't have worried. They're fine."], ["Ana", "Agreed. I'd have called if I had known."], ["Tom", "Next time, we will."]], "c1-u4-lec1": [["Ana", "If I had studied law, I would be a lawyer now."], ["Tom", "If you had studied law, you might be earning more. Are you happy with your job?"], ["Ana", "Mostly, yes. If I had ta
