mbado) y *lay* (poner algo)."]}, {"key": "Vocabulario", "items": ["lie (tumbarse, estar), lay (poner algo), down (abajo), book (libro), table (mesa)"]}, {"key": "Lectura", "items": ["Please lie down for a while. Can you lay the book on the table?"]}, {"key": "Notas", "items": ["*lie* (sin objeto) = estar tumbado. Pasado: *lay*. Participio: *lain*.", "*lay* (con objeto) = poner algo. Pasado: *laid*."]}, {"key": "Ejercicio", "items": ["Please ___ down for a while. (lie / lay) → **lie**"]}, {"key": "Habla", "items": ["\"I lie down when ___. I lay the ___ on ___.\""]}], "exercise": {"stem": "Please ___ down for a while.", "options": ["lie", "lay"], "answer": "lie"}}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 effect, 2 imply, 3 infer, 4 few, 5 make, 6 do, 7 lie, 8 lay, 9 little, 10 slightly"]}], "exercise": null}], "exam": [{"stem": "The results had a strong ___ on sales.", "options": ["effect", "affect"], "answer": "effect"}, {"stem": "His answer seemed to ___ that he was guilty.", "options": ["imply", "infer"], "answer": "imply"}, {"stem": "I ___ that you were angry from your tone.", "options": ["infer", "imply"], "answer": "infer"}, {"stem": "There are ___ people in the room.", "options": ["few", "little"], "answer": "few"}, {"stem": "We need to ___ a decision today.", "options": ["make", "do"], "answer": "make"}, {"stem": "I'll ___ my homework tonight.", "options": ["do", "make"], "answer": "do"}, {"stem": "Please ___ down for a while.", "options": ["lie", "lay"], "answer": "lie"}, {"stem": "Can you ___ the book on the table?", "options": ["lay", "lie"], "answer": "lay"}, {"stem": "There is ___ hope left.", "options": ["little", "few"], "answer": "little"}, {"stem": "The company's profits rose ___ this year.", "options": ["slightly", "slight"], "answer": "slightly"}]}, {"id": "c1-u10", "level": "C1", "num": 10, "title": "Escritura formal", "meta": "escribir informes, ensayos y textos formales con el registro correcto.", "lessons": [{"n": 1, "title": "Conectores formales (Moreover, Consequently)", "sections": [{"key": "Tema", "items": ["unir ideas en un texto formal."]}, {"key": "Vocabulario", "items": ["moreover (además), consequently (por consiguiente), policy (política), failed (fracasó), costs (costes)"]}, {"key": "Lectura", "items": ["Moreover, the policy failed to reduce costs. Consequently, the budget was reviewed."]}, {"key": "Notas", "items": ["*moreover* = además (añade información).", "*consequently* = como resultado.", "Evita *anyway* o *so* en textos muy formales."]}, {"key": "Ejercicio", "items": ["___, the policy failed to reduce costs. (Moreover / Anyway) → **Moreover**"]}, {"key": "Habla", "items": ["\"Moreover, ___. Consequently, ___.\""]}], "exercise": {"stem": "___, the policy failed to reduce costs.", "options": ["Moreover", "Anyway"], "answer": "Moreover"}}, {"n": 2, "title": "Evitar contracciones", "sections": [{"key": "Tema", "items": ["escribir sin contracciones en textos formales."]}, {"key": "Vocabulario", "items": ["contractions (contracciones), formal (formal), report (informe), do not (no hacer), don't (no hace)"]}, {"key": "Lectura", "items": ["In formal writing, use \"do not\" instead of \"don't\"."]}, {"key": "Notas", "items": ["En un informe o ensayo, escribe *do not, cannot, it is* en lugar de *don't, can't, it's*.", "En emails informales o chats sí puedes usar contracciones."]}, {"key": "Ejercicio", "items": ["In formal writing, use \"do not\" instead of ___. (don't / doesn't) → **don't**"]}, {"key": "Habla", "items": ["\"In a formal report, I would write ___ instead of ___.\""]}], "exercise": {"stem": "In formal writing, use \"do not\" instead of ___.", "options": ["don't", "doesn't"], "answer": "don't"}}, {"n": 3, "title": "Verbos de informes (suggests, concludes, examines)", "sections": [{"key": "Tema", "items": ["usar verbos de informe en tercera persona."]}, {"key": "Vocabulario", "items": ["suggests (sugiere), concludes (concluye), examines (examina), study (estudio), prices (precios)"]}, {"key": "Lectura", "items": ["The study suggests that prices will rise. This essay examines the main causes of inflation."]}, {"key": "Notas", "items": ["Con *the study / the report / the essay* el verbo va en tercera persona: *suggests, concludes, examines*.", "Sin *s* con *the studies / the reports* plural: *the studies suggest*."]}, {"key": "Ejercicio", "items": ["The study ___ that prices will rise. (suggests / suggest) → **suggests**"]}, {"key": "Habla", "items": ["\"The report ___ that ___.\""]}], "exercise": {"stem": "The study ___ that prices will rise.", "options": ["suggests", "suggest"], "answer": "suggests"}}, {"n": 4, "title": "Pasiva en textos formales (It has been decided)", "sections": [{"key": "Tema", "items": ["usar la pasiva para sonar más formal."]}, {"key": "Vocabulario", "items": ["decided (decidido), project (proyecto), start (empezar), May (mayo), agreed (acordado)"]}, {"key": "Lectura", "items": ["It has been decided that the project will start in May. It has been agreed that the budget will be reviewed."]}, {"key": "Notas", "items": ["*It has been decided that...* = Se ha decidido que...", "Es muy común en informes y comunicados oficiales."]}, {"key": "Ejercicio", "items": ["It ___ decided that the project will start in May. (has been / has be) → **has been**"]}, {"key": "Habla", "items": ["\"It has been decided that ___.\""]}], "exercise": {"stem": "It ___ decided that the project will start in May.", "options": ["has been", "has be"], "answer": "has been"}}, {"n": 5, "title": "Nominalización (the implementation of)", "sections": [{"key": "Tema", "items": ["convertir un verbo en sustantivo para sonar formal."]}, {"key": "Vocabulario", "items": ["implementation (implementación), implement (implementar), system (sistema), took (tardó), months (meses)"]}, {"key": "Lectura", "items": ["The implementation of the new system took two months."]}, {"key": "Notas", "items": ["*implement* (verbo) → *implementation* (sustantivo).", "Esto hace que el texto sea más denso y formal.", "Otros ejemplos: *improve → improvement, develop → development*."]}, {"key": "Ejercicio", "items": ["The ___ of the new system took two months. (implementation / implement) → **implementation**"]}, {"key": "Habla", "items": ["\"The ___ of ___ was ___.\""]}], "exercise": {"stem": "The ___ of the new system took two months.", "options": ["implementation", "implement"], "answer": "implementation"}}, {"n": 6, "title": "Cautela en textos formales (It could be argued)", "sections": [{"key": "Tema", "items": ["decir una idea de forma prudente en un ensayo."]}, {"key": "Vocabulario", "items": ["could (podría), argued (argumentado), reform (reforma), necessary (necesaria), suggests (sugiere)"]}, {"key": "Lectura", "items": ["It could be argued that the reform was necessary."]}, {"key": "Notas", "items": ["*It could be argued that...* = se podría argumentar que...", "Es una forma prudente de presentar una opinión."]}, {"key": "Ejercicio", "items": ["It could ___ that the reform was necessary. (be argued / argued be) → **be argued**"]}, {"key": "Habla", "items": ["\"It could be argued that ___.\""]}], "exercise": {"stem": "It could ___ that the reform was necessary.", "options": ["be argued", "argued be"], "answer": "be argued"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Furthermore, the evidence supports this view. Consequently, the government should review the law. In conclusion, change is necessary."]}, {"key": "Repaso", "items": ["conectores formales, evitar contracciones, verbos de informe, pasiva formal, nominalización, cautela con *It could be argued*."]}, {"key": "Actividad de habla", "items": ["lee en voz alta una frase de un informe usando *The report concludes that...* y explica sus razones."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo de 6 frases con 2 conectores, 1 pasiva y 1 nominalización."]}], "exercise": null}, {"n" ms": ["It was a ___ decision to wait. (sensible / sensitive) → **sensible**"]}, {"key": "Habla", "items": ["\"That's a sensible ___. I'm sensitive about ___.\""]}], "exercise": {"stem": "It was a ___ decision to wait.", "options": ["sensible", "sensitive"], "answer": "sensible"}}, {"n": 4, "title": "Eventually y possibly", "sections": [{"key": "Tema", "items": ["diferenciar *eventually* (al final) de *possibly* (posiblemente)."]}, {"key": "Vocabulario", "items": ["eventually (al final, por fin), possibly (posiblemente), hotel (hotel), hours (horas), help (ayudar)"]}, {"key": "Lectura", "items": ["We eventually found the hotel after two hours. I can possibly help you tomorrow."]}, {"key": "Notas", "items": ["*eventually* = después de un tiempo, al final.", "*possibly* = quizá, es posible."]}, {"key": "Ejercicio", "items": ["We ___ found the hotel after two hours. (eventually / possibly) → **eventually**"]}, {"key": "Habla", "items": ["\"I eventually ___. I can possibly ___.\""]}], "exercise": {"stem": "We ___ found the hotel after two hours.", "options": ["eventually", "possibly"], "answer": "eventually"}}, {"n": 5, "title": "Expresiones con sentido figurado (I'm dying to)", "sections": [{"key": "Tema", "items": ["entender frases que no se toman al pie de la letra."]}, {"key": "Vocabulario", "items": ["dying (muriendo, en sentido figurado), dying to (morirse de ganas), see (ver), film (película), literally (literalmente)"]}, {"key": "Lectura", "items": ["I'm dying to see the film. I literally cannot wait."]}, {"key": "Notas", "items": ["*I'm dying to* = tengo muchas ganas de (no es literal).", "*literally* = de verdad, exactamente (se usa para enfatizar)."]}, {"key": "Ejercicio", "items": ["I'm ___ to see the film. (dying / died) → **dying**"]}, {"key": "Habla", "items": ["\"I'm dying to ___. I literally ___.\""]}], "exercise": {"stem": "I'm ___ to see the film.", "options": ["dying", "died"], "answer": "dying"}}, {"n": 6, "title": "Complement y compliment", "section r de iniciar una conversación."]}, {"key": "Vocabulario", "items": ["break the ice (romper el hielo), light (ligero), topic (tema), meeting (reunión), nervous (nervioso)"]}, {"key": "Lectura", "items": ["Let's talk about something light to break the ice before the meeting."]}, {"key": "Notas", "items": ["*break the ice* = empezar una conversación con alguien nuevo o tenso.", "Se usa mucho en reuniones y fiestas."]}, {"key": "Ejercicio", "items": ["Let's talk about something light to ___ the ice. (break / cut) → **break**"]}, {"key": "Habla", "items": ["\"A good way to break the ice is ___.\""]}], "exercise": {"stem": "Let's talk about something light to ___ the ice.", "options": ["break", "cut"], "answer": "break"}}, {"n": 3, "title": "Hit the nail on the head (dar en el clavo)", "sections": [{"key": "Tema", "items": ["decir que alguien acertó exactamente."]}, {"key": "Vocabulario", "items": ["hit the nail on the head (dar en el clavo), exactly (exactamente), problem (problema), answer (respuesta), right (correcto)"]}, {"key": "Lectura", "items": ["You hit the nail on the head! That's exactly the problem."]}, {"key": "Notas", "items": ["*hit the nail on the head* = acertar exactamente, decir lo justo.", "Se usa para elogiar una respuesta o un análisis."]}, {"key": "Ejercicio", "items": ["You ___ the nail on the head! That's exactly the problem. (hit / knock) → **hit**"]}, {"key": "Habla", "items": ["\"You hit the nail on the ___.\""]}], "exercise": {"stem": "You ___ the nail on the head! That's exactly the problem.", "options": ["hit", "knock"], "answer": "hit"}}, {"n": 4, "title": "It costs an arm and a leg (costar un ojo de la cara)", "sections": [{"key": "Tema", "items": ["decir que algo es muy caro."]}, {"key": "Vocabulario", "items": ["an arm and a leg (un ojo de la cara), expensive (caro), restaurant (restaurante), price (precio), cheap (barato)"]}, {"key": "Lectura", "items": ["That restaurant costs an arm and a leg. The price is crazy."]}, {"key": "Notas", " .", "options": ["is", "are"], "answer": "is"}}, {"n": 6, "title": "Such... that y not until (énfasis de intensidad)", "sections": [{"key": "Tema", "items": ["dar énfasis a una intensidad o un momento."]}, {"key": "Vocabulario", "items": ["such (tan, tal), crowd (multitud), left (salimos), early (temprano), until (hasta que)"]}, {"key": "Lectura", "items": ["Such was the crowd that we left early. Not until later did she realise her mistake."]}, {"key": "Notas", "items": ["*Such was the crowd that...* = fue tanta la multitud que... (inversión formal).", "*Not until + tiempo + auxiliar + sujeto* = no fue hasta que..."]}, {"key": "Ejercicio", "items": ["Such ___ the crowd that we left early. (was / were) → **was**"]}, {"key": "Habla", "items": ["\"Such was ___ that ___.\""]}], "exercise": {"stem": "Such ___ the crowd that we left early.", "options": ["was", "were"], "answer": "was"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["It was the manager who made the final decision. Not until the report was finished did we relax. Little did she realise the consequences."]}, {"key": "Repaso", "items": ["cleft con *it* (*it was... who / that*), wh-cleft (*What I need is*), *do* enfático, *it was... that*, *All I want is*, *Such was... that* y *Not until*."]}, {"key": "Actividad de habla", "items": ["di 3 frases de énfasis sobre tu vida (*It was my mother who...*, *What I need is...*, *All I want is...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con estructuras de énfasis sobre un viaje o una experiencia."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 who, 2 is, 3 does, 4 that, 5 is, 6 was, 7 Not until, 8 that, 9 is, 10 do"]}], "exercise": null}], "exam": [{"stem": "It was Maria ___ won the prize.", "options": ["who", "which"], "answer": "who"}, {"stem": "What I need ___ a holiday.", "options": ["is", "are"], "answer": "is"}, {"stem": "She ___ know th ", "items": ["\"It's not bad. It's a bit ___.\""]}], "exercise": {"stem": "\"It's not bad\" can mean the thing is ___.", "options": ["excellent", "terrible"], "answer": "excellent"}}, {"n": 3, "title": "Hipérbole (I've told you a million times)", "sections": [{"key": "Tema", "items": ["exagerar para dar énfasis, sin mentir."]}, {"key": "Vocabulario", "items": ["hyperbole (hipérbole), million (millón), times (veces), hungry (hambriento), dying (muriendo)"]}, {"key": "Lectura", "items": ["I've told you a million times. I'm dying of hunger."]}, {"key": "Notas", "items": ["*a million times* = muchísimas veces (exageración).", "*I'm dying of hunger* = tengo muchísima hambre (exageración).", "Nadie lo toma literal."]}, {"key": "Ejercicio", "items": ["\"I've told you a million times.\" This is ___. (hyperbole / a fact) → **hyperbole**"]}, {"key": "Habla", "items": ["\"I've told you a ___ times.\""]}], "exercise": {"stem": "\"I've told you a million times.\" This is ___.", "options": ["hyperbole", "a fact"], "answer": "hyperbole"}}, {"n": 4, "title": "Ironía en comentarios (Brilliant idea, really)", "sections": [{"key": "Tema", "items": ["decir algo positivo para expresar lo contrario."]}, {"key": "Vocabulario", "items": ["brilliant (brillante), idea (idea), irony (ironía), really (de verdad), mistake (error)"]}, {"key": "Lectura", "items": ["\"Brilliant idea, really.\" said after a bad idea shows irony."]}, {"key": "Notas", "items": ["Ironía = decir algo positivo para expresar algo negativo.", "Se parece al sarcasmo, pero es más suave."]}, {"key": "Ejercicio", "items": ["\"Brilliant idea, really.\" said after a bad idea shows ___. (irony / agreement) → **irony**"]}, {"key": "Habla", "items": ["\"Brilliant, really. ___.\""]}], "exercise": {"stem": "\"Brilliant idea, really.\" said after a bad idea shows ___.", "options": ["irony", "agreement"], "answer": "irony"}}, {"n": 5, "title": "Humor seco (dry humour)", "sections": [{"key": "Tema", "items": ["reconocer un humor sereno co, juegos de palabras."]}, {"key": "Actividad de habla", "items": ["cuenta un chiste o una situación con ironía y explica el tono."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con ironía, exageración o un pun simple."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 sarcasm, 2 excellent, 3 hyperbole, 4 irony, 5 understatement, 6 hyperbole, 7 understated, 8 two meanings, 9 opposite, 10 laughing"]}], "exercise": null}], "exam": [{"stem": "\"Oh, great. Another delay.\" This is ___.", "options": ["sarcasm", "a compliment"], "answer": "sarcasm"}, {"stem": "\"It's not bad\" can mean the thing is ___.", "options": ["excellent", "terrible"], "answer": "excellent"}, {"stem": "\"I've told you a million times.\" This is ___.", "options": ["hyperbole", "a fact"], "answer": "hyperbole"}, {"stem": "\"Brilliant idea, really.\" said after a bad idea shows ___.", "options": ["irony", "agreement"], "answer": "irony"}, {"stem": "\"It's a bit cold\" when it's freezing is an ___.", "options": ["understatement", "exaggeration"], "answer": "understatement"}, {"stem": "\"I'm dying of hunger.\" is ___.", "options": ["hyperbole", "sarcasm"], "answer": "hyperbole"}, {"stem": "Dry humour is calm and ___.", "options": ["understated", "loud"], "answer": "understated"}, {"stem": "A pun is a joke using words with ___.", "options": ["two meanings", "no meaning"], "answer": "two meanings"}, {"stem": "Sarcasm often means the ___ of what you say.", "options": ["opposite", "same"], "answer": "opposite"}, {"stem": "In a text message, \"lol\" shows you are ___.", "options": ["laughing", "crying"], "answer": "laughing"}]}, {"id": "c2-u6", "level": "C2", "num": 6, "title": "Textos literarios y complejos", "meta": "entender lenguaje figurado, tono y estructura en textos de novela, poesía y artículos complejos.", "lessons": [{"n": 1, "title": "Metáfora (Her voice was music)", "sections": [{"key": "Tema", "items": ["reconocer una comparación directa sin *like* ni *as*."]}, {"key": "Vocabulario", "items": ["metaphor (metáfora), voice (voz), music (música), sky (cielo), blanket (manta)"]}, {"key": "Lectura", "items": ["Her voice was music. The sky was a grey blanket."]}, {"key": "Notas", "items": ["Metáfora = decir que algo *es* otra cosa (sin *like* ni *as*).", "*Her voice was music* = su voz era preciosa, como música."]}, {"key": "Ejercicio", "items": ["\"The sky was a grey blanket.\" This is a ___. (metaphor / simile) → **metaphor**"]}, {"key": "Habla", "items": ["\"___ was a ___.\""]}], "exercise": {"stem": "\"The sky was a grey blanket.\" This is a ___.", "options": ["metaphor", "simile"], "answer": "metaphor"}}, {"n": 2, "title": "Símil (as brave as a lion)", "sections": [{"key": "Tema", "items": ["reconocer una comparación con *like* o *as*."]}, {"key": "Vocabulario", "items": ["simile (símil), brave (valiente), lion (león), like (como), as... as (tan... como)"]}, {"key": "Lectura", "items": ["He was as brave as a lion. She runs like the wind."]}, {"key": "Notas", "items": ["Símil = comparación con *like* o *as... as*.", "*as brave as a lion* = tan valiente como un león."]}, {"key": "Ejercicio", "items": ["\"He was as brave as a lion.\" This is a ___. (simile / metaphor) → **simile**"]}, {"key": "Habla", "items": ["\"He/She is as ___ as ___.\""]}], "exercise": {"stem": "\"He was as brave as a lion.\" This is a ___.", "options": ["simile", "metaphor"], "answer": "simile"}}, {"n": 3, "title": "Personificación (The wind whispered)", "sections": [{"key": "Tema", "items": ["dar características humanas a cosas que no son humanas."]}, {"key": "Vocabulario", "items": ["personification (personificación), wind (viento), whispered (susurró), trees (árboles), sang (cantó)"]}, {"key": "Lectura", "items": ["The wind whispered through the trees. The river sang in the night."]}, {"key": "Notas", "items": ["Personificación = dar a cosas o animales acciones humanas.", "*whispered* (susurrar) es una acció . By the time ___, ___ had ___.\""]}], "exercise": {"stem": "By the time he arrived, the show ___ started.", "options": ["had", "has"], "answer": "had"}}, {"n": 6, "title": "Tono y resumen (melancholic, describes, infer from context)", "sections": [{"key": "Tema", "items": ["describir el tono de un texto y resumirlo."]}, {"key": "Vocabulario", "items": ["mood (ambiente), melancholic (melancólico), describes (describe), context (contexto), infer (deducir)"]}, {"key": "Lectura", "items": ["The mood of the poem is melancholic. The author describes the city as a sleeping giant. We can infer the meaning from context."]}, {"key": "Notas", "items": ["*mood / tone* = ambiente o tono de un texto.", "*infer from context* = deducir el significado por el contexto.", "Para resumir, usa *The author describes / argues / suggests*."]}, {"key": "Ejercicio", "items": ["The author ___ the city as a sleeping giant. (describes / describe) → **describes**"]}, {"key": "Habla", "items": ["\"The mood is ___. The author ___ ...\""]}], "exercise": {"stem": "The author ___ the city as a sleeping giant.", "options": ["describes", "describe"], "answer": "describes"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Her smile was a ray of sunshine in the grey room. Time is a thief that steals our years. The city slept like a sleeping giant."]}, {"key": "Repaso", "items": ["metáfora, símil, personificación, *argues / suggests*, *is set in*, *had + participio*, tono (*melancholic*), *describes*, *infer from context*."]}, {"key": "Actividad de habla", "items": ["lee una frase de un libro o poema y di qué figura literaria es y qué tono tiene."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con una metáfora, un símil, una personificación y un resumen de un texto."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 metaphor, 2 simile, 3 personification, 4 argues, 5 is set, 6 had, 7 melanc rupt (interrumpir), come in (intervenir), just (solo), moment (momento), point (punto)"]}, {"key": "Lectura", "items": ["If I could just come in here for a moment. Sorry to interrupt, but I think..."]}, {"key": "Notas", "items": ["*If I could just come in here* = si pudiera intervenir un momento.", "*Sorry to interrupt, but...* = lo siento por interrumpir, pero..."]}, {"key": "Ejercicio", "items": ["If I could just ___ in here. (come / go) → **come**"]}, {"key": "Habla", "items": ["\"If I could just ___ in here...\""]}], "exercise": {"stem": "If I could just ___ in here.", "options": ["come", "go"], "answer": "come"}}, {"n": 5, "title": "Resumir la postura del otro (What you're saying is)", "sections": [{"key": "Tema", "items": ["repetir lo que dijo la otra persona antes de contestar."]}, {"key": "Vocabulario", "items": ["saying (diciendo), cost (coste), high (alto), summarise (resumir), position (postura)"]}, {"key": "Lectura", "items": ["What you're saying is that the cost is too high. So, what you're saying is that we should wait."]}, {"key": "Notas", "items": ["*What you're saying is...* = lo que dices es que...", "Así demuestras que escuchaste bien antes de responder."]}, {"key": "Ejercicio", "items": ["What you're ___ is that the cost is too high. (saying / telling) → **saying**"]}, {"key": "Habla", "items": ["\"So, what you're saying is ___.\""]}], "exercise": {"stem": "What you're ___ is that the cost is too high.", "options": ["saying", "telling"], "answer": "saying"}}, {"n": 6, "title": "Cerrar sin ganar (Let's agree to differ)", "sections": [{"key": "Tema", "items": ["terminar un debate sin acuerdo y con respeto."]}, {"key": "Vocabulario", "items": ["agree to differ (aceptar que no estamos de acuerdo), respect (respeto), opinion (opinión), summary (resumen), end (terminar)"]}, {"key": "Lectura", "items": ["I think we need to agree to differ. Let's agree to differ on this one."]}, {"key": "Notas", "items": ["*agree to differ* = acordar que no estamos de acuerdo.", "Es una forma cortés de terminar un debate."]}, {"key": "Ejercicio", "items": ["Let's ___ to differ. (agree / accept) → **agree**"]}, {"key": "Habla", "items": ["\"I think we should agree to ___.\""]}], "exercise": {"stem": "Let's ___ to differ.", "options": ["agree", "accept"], "answer": "agree"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I see where you are coming from, but I'm not convinced by your evidence. Granted, the policy has flaws, yet its aims are sound."]}, {"key": "Repaso", "items": ["*I take your point*, pedir evidencia, *highly unlikely*, *If I could just come in*, *What you're saying is*, *agree to differ*."]}, {"key": "Actividad de habla", "items": ["debate corto con un amigo sobre un tema (trabajo, tecnología). Usa al menos 3 frases de la unidad."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo de 6 frases: un argumento, una concesión y un cierre con *agree to differ*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 point, 2 evidence, 3 unlikely, 4 come, 5 saying, 6 agree, 7 What, 8 clarify, 9 consider, 10 challenge"]}], "exercise": null}], "exam": [{"stem": "I take your ___, but I still disagree.", "options": ["point", "idea"], "answer": "point"}, {"stem": "Where's the ___ for that claim?", "options": ["evidence", "evidences"], "answer": "evidence"}, {"stem": "It is highly ___ that the plan will work.", "options": ["unlikely", "unlike"], "answer": "unlikely"}, {"stem": "If I could just ___ in here.", "options": ["come", "go"], "answer": "come"}, {"stem": "What you're ___ is that the cost is too high.", "options": ["saying", "telling"], "answer": "saying"}, {"stem": "Let's ___ to differ.", "options": ["agree", "accept"], "answer": "agree"}, {"stem": "___ you're saying is that we should wait.", "options": ["What", "Which"], "answer": "What"}, {"stem": "Could you ___ your point more clearly?", "options": ["clarify", ."]}, {"key": "Ejercicio", "items": ["Content words are usually ___. (stressed / unstressed) → **stressed**"]}, {"key": "Habla", "items": ["Lee una frase y marca en mayúsculas solo las palabras importantes."]}], "exercise": {"stem": "Content words are usually ___.", "options": ["stressed", "unstressed"], "answer": "stressed"}}, {"n": 3, "title": "Formas débiles (to = /tə/)", "sections": [{"key": "Tema", "items": ["pronunciar palabras cortas y funcionales de forma relajada."]}, {"key": "Vocabulario", "items": ["weak form (forma débil), schwa (sonido /ə/), to (a, hacia), want (querer), go (ir)"]}, {"key": "Lectura", "items": ["I want to go. → /aɪ wɒnt tə gəʊ/ (*to* suena /tə/, no /tuː/)."]}, {"key": "Notas", "items": ["Las formas débiles usan el sonido /ə/ (*schwa*).", "*to* suena /tə/ cuando no está al final ni se quiere enfatizar.", "*a, and, of, the* también suelen ser débiles."]}, {"key": "Ejercicio", "items": ["In \"I want to go\", \"to\" is pronounced ___. (/tə/ / /tuː/) → **/tə/**"]}, {"key": "Habla", "items": ["\"I want to ___. I have to ___.\""]}], "exercise": {"stem": "In \"I want to go\", \"to\" is pronounced ___.", "options": ["/tə/", "/tuː/"], "answer": "/tə/"}}, {"n": 4, "title": "Entonación (preguntas sí/no y wh-)", "sections": [{"key": "Tema", "items": ["subir o bajar la voz según el tipo de pregunta."]}, {"key": "Vocabulario", "items": ["rising (subir), falling (bajar), yes-no question (pregunta sí/no), wh- question (pregunta con qué, dónde, cuándo), intonation (entonación)"]}, {"key": "Lectura", "items": ["Are you coming? (↗) Where are you going? (↘)"]}, {"key": "Notas", "items": ["Pregunta sí/no → la voz sube al final (↗).", "Pregunta con *wh-* (*what, where, when*) → la voz baja al final (↘).", "Una frase afirmativa suele bajar la voz (↘)."]}, {"key": "Ejercicio", "items": ["A yes-no question usually has ___ intonation at the end. (rising / falling) → **rising**"]}, {"key": "Habla", "items": ["\"Are you ready? (↗)  Where are you? (↘)\""]}], "exerci al del ensayo."]}, {"key": "Vocabulario", "items": ["thesis statement (tesis), introduction (introducción), argue (defender), essay (ensayo), main (principal)"]}, {"key": "Lectura", "items": ["This essay argues that public transport should be free. The thesis statement appears in the introduction."]}, {"key": "Notas", "items": ["La tesis es la frase que dice qué vas a defender.", "Suele estar al final de la introducción."]}, {"key": "Ejercicio", "items": ["A thesis statement is usually placed in the ___ of the essay. (introduction / appendix) → **introduction**"]}, {"key": "Habla", "items": ["\"This essay argues that ___.\""]}], "exercise": {"stem": "A thesis statement is usually placed in the ___ of the essay.", "options": ["introduction", "appendix"], "answer": "introduction"}}, {"n": 2, "title": "Estructura de párrafo (topic sentence, evidence, explanation)", "sections": [{"key": "Tema", "items": ["construir un párrafo con una idea clara, una prueba y una explicación."]}, {"key": "Vocabulario", "items": ["topic sentence (frase principal), evidence (evidencia), explanation (explicación), paragraph (párrafo), support (apoyar)"]}, {"key": "Lectura", "items": ["Public transport reduces traffic. (topic sentence) A study found that cities with buses have fewer cars. (evidence) This shows that good transport changes behaviour. (explanation)"]}, {"key": "Notas", "items": ["*Topic sentence* = primera frase del párrafo.", "Después va la evidencia y la explicación."]}, {"key": "Ejercicio", "items": ["A topic sentence is usually the ___ sentence of a paragraph. (first / last) → **first**"]}, {"key": "Habla", "items": ["\"My paragraph begins with ___. The evidence is ___.\""]}], "exercise": {"stem": "A topic sentence is usually the ___ sentence of a paragraph.", "options": ["first", "last"], "answer": "first"}}, {"n": 3, "title": "Citar fuentes (According to Smith, 2020)", "sections": [{"key": "Tema", "items": ["citar a otros autores correctamente."]}, {"key": "Vocabulario", ntrast* = contraste (ideas opuestas).", "*Similarly* = semejanza (ideas parecidas).", "*Furthermore* = adición (añade una idea más)."]}, {"key": "Ejercicio", "items": ["\"In contrast\" shows ___. (contrast / addition) → **contrast**"]}, {"key": "Habla", "items": ["\"In contrast, ___. Similarly, ___.\""]}], "exercise": {"stem": "\"In contrast\" shows ___.", "options": ["contrast", "addition"], "answer": "contrast"}}, {"n": 6, "title": "Conclusión (This study has shown that)", "sections": [{"key": "Tema", "items": ["terminar un ensayo con una conclusión clara."]}, {"key": "Vocabulario", "items": ["conclusion (conclusión), shown (mostrado), study (estudio), suggest (sugerir), further research (más investigación)"]}, {"key": "Lectura", "items": ["This study has shown that free transport increases use. Further research is needed."]}, {"key": "Notas", "items": ["*This study has shown that* = este estudio ha demostrado que.", "*Further research is needed* = hacen falta más investigaciones."]}, {"key": "Ejercicio", "items": ["\"This study has shown that...\" is used in the ___. (conclusion / title) → **conclusion**"]}, {"key": "Habla", "items": ["\"To conclude, this study has shown that ___.\""]}], "exercise": {"stem": "\"This study has shown that...\" is used in the ___.", "options": ["conclusion", "title"], "answer": "conclusion"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["This essay argues that technology reshapes social bonds, both for better and for worse. The evidence suggests a cautious optimism."]}, {"key": "Repaso", "items": ["tesis, estructura de párrafo, citas (*according to*), tono académico (*many, obtain*), cohesión (*in contrast, similarly*), conclusión."]}, {"key": "Actividad de habla", "items": ["explica tu tesis en una frase y apóyala con una evidencia."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo académico de 6 frases con tesis, cita, conector y conclusión."]}], "exercise": null}, {"n": 8, function dayStr(d){ return d.toISOString().slice(0,10); }
function touch(){
  const t = dayStr(new Date());
  if (S.streak.last === t) return;
  const y = dayStr(new Date(Date.now() - 864e5));
  S.streak.count = (S.streak.last === y) ? S.streak.count + 1 : 1;   // sin castigo: solo cuenta la racha
  S.streak.last = t;
  save();
}

// ---------- utilidades ----------
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>'); }
function go(h){ location.hash = h.slice(1); }

// ---------- voz ----------
function tts(text, cb){
  if (!('speechSynthesis' in window)) { if (cb) cb(); else alert('Este navegador no puede leer en voz alta.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = 0.9;
  if (cb) { u.onend = cb; u.onerror = cb; }
  const v = speechSynthesis.getVoices().find(x => /^en[-_]/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function lectureText(uid, n){
  const l = U(uid).lessons.find(x => x.n === n);
  const lec = l && l.sections.find(s => /^Lectura/.test(s.key));
  return lec ? lec.items.join(' ').replace(/→/g, '. ').replace(/\*/g, '') : '';
}
let CUR_AUDIO = null;
function speakLesson(uid, n, cb){
  const text = lectureText(uid, n);
  if (!text) { if (cb) cb(); return; }
  let done = false, fin = false;
  const end = () => { if (!fin) { fin = true; if (cb) cb(); } };
  const fb = () => { if (!done) { done = true; tts(text, end); } };
  if (CUR_AUDIO) { try { CUR_AUDIO.pause(); } catch(e){} }
  const a = new Audio(`audio/${uid}-lec${n}.wav`);   // si existe el audio de VoiceStudio, se usa
  CUR_AUDIO = a;
  a.playbackRate = 0.8;   // velocidad más lenta y clara para aprender
  a.onerror = fb;
  a.onended = end;
  a.play().catch(fb);
}

// ---------- escucha y repite ----------
const CONTR = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is",
  "that's":"that is","what's":"what is","there's":"there is","here's":"here is","let's":"let us","don't":"do not","doesn't":"does not",
  "didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","can't":"can not","cannot":"can not",
  "won't":"will not","haven't":"have not","hasn't":"has not","hadn't":"had not","wouldn't":"would not","couldn't":"could not",
  "shouldn't":"should not","i've":"i have","i'll":"i will","i'd":"i would","you've":"you have","you'll":"you will","we've":"we have",
  "we'll":"we will","they've":"they have","they'll":"they will"};
const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen',
  'fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){ return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : ''); }
// palabras normalizadas de un texto: sin mayúsculas ni signos; "I'm" = "I am"; "25" = "twenty five"
function normWords(text){
  const out = [];
  String(text).toLowerCase().replace(/[’‘`]/g, "'").replace(/[-–—\/]/g, ' ').split(/\s+/).forEach(raw => {
    let t = raw.replace(/[^\p{L}\p{N}']/gu, '').replace(/^'+|'+$/g, '');
    if (!t) return;
    if (CONTR[t]) t = CONTR[t];
    else if (/^\d{1,2}$/.test(t)) t = numWords(+t);
    t.split(' ').forEach(w => out.push(w));
  });
  return out;
}
// compara palabra por palabra (alineación LCS): cada palabra de la frase sale como bien/mal, más la puntuación 0-100
function compareSpeech(ref, said){
  const toks = [];
  const rw = [];
  String(ref).split(/\s+/).filter(Boolean).forEach(t => {
    const ws = normWords(t);
    toks.push({t, from: rw.length, n: ws.length});
    ws.forEach(w => rw.push(w));
  });
  const sw = normWords(said);
  const R = rw.length, T = sw.length;
  const L = Array.from({length: R + 1}, () => new Array(T + 1).fill(0));
  for (let i = R - 1; i >= 0; i--) for (let j = T - 1; j >= 0; j--)
    L[i][j] = rw[i] === sw[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const hit = new Array(R).fill(false);
  for (let i = 0, j = 0; i < R && j < T;) {
    if (rw[i] === sw[j]) { hit[i] = true; i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) i++; else j++;
  }
  const matched = hit.filter(Boolean).length;
  const score = R === 0 ? 0 : Math.round(100 * matched / Math.max(R, T));   // las palabras de más también restan
  const tokens = toks.filter(x => x.n > 0).map(x => ({t: x.t, ok: hit.slice(x.from, x.from + x.n).every(Boolean)}));
  return {score, tokens, missed: tokens.filter(x => !x.ok).map(x => x.t.replace(/[^\p{L}\p{N}']/gu, ''))};
}
const READY_SCORE = 80;
function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function repBlock(uid, n){
  const ref = lectureText(uid, n);
  if (!ref) return '';
  const best = (S.speak || {})[uid + '-' + n];
  const bestTxt = best === undefined ? '' : `Mejor puntuación: ${best}/100 ${best >= READY_SCORE ? '✅ Lista' : ''}`;
  const nomic = speechSupported() ? '' : '<p class="fb bad">Para practicar hablar hace falta usar Chrome o Edge: este navegador no tiene reconocimiento de voz.</p>';
  return `<div class="rep" id="rep">
    <div class="rep-title">🎧 Escucha y repite</div>
    <div class="rep-text" id="rep-text">${esc(ref)}</div>
    <button class="btn ghost" id="rep-listen" onclick="repListen('${uid}',${n})">🔊 1. Escuchar</button>
    <button class="btn" id="rep-mic" onclick="repMic('${uid}',${n})" ${speechSupported() ? '' : 'disabled'}>🎤 2. Repetir</button>
    ${nomic}
    <div id="rep-out" aria-live="polite"></div>
    <div class="pcap" id="rep-best">${bestTxt}</div>
  </div>`;
}
function repListen(uid, n){
  const b = document.getElementById('rep-listen'), m = document.getElementById('rep-mic');
  b.disabled = true; if (m) m.disabled = true;
  const back = () => { b.disabled = false; if (m && speechSupported()) m.disabled = false; };
  speakLesson(uid, n, back);
}
let REC = null;
function repMic(uid, n){
  const out = document.getElementById('rep-out'), mic = document.getElementById('rep-mic');
  if (REC) { REC.stop(); return; }                                  // segundo clic = terminar
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { out.innerHTML = '<p class="fb bad">Hace falta Chrome o Edge para practicar hablar.</p>'; return; }
  if (CUR_AUDIO) { try { CUR_AUDIO.pause(); } catch(e){} }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const r = new R(); r.lang = 'en-US'; r.continuous = true; r.interimResults = false;
  let said = '', err = '';
  r.onresult = e => { said = ''; for (let i = 0; i < e.results.length; i++) said += ' ' + e.results[i][0].transcript; };
  r.onerror = e => { err = e.error || 'error'; };
  r.onend = () => {
    REC = null; mic.textContent = '🎤 2. Repetir';
    if (err === 'not-allowed' || err === 'service-not-allowed') { out.innerHTML = '<p class="fb bad">Permite el micrófono en el navegador y vuelve a intentarlo.</p>'; return; }
    if (!said.trim()) { out.innerHTML = '<p class="fb bad">No te escuché. Acércate al micrófono e inténtalo otra vez.</p>'; return; }
    repResult(uid, n, said);
  };
  REC = r;
  mic.textContent = '⏹ Terminar';
  out.innerHTML = '<p class="fb">Escuchando... di la frase y pulsa «Terminar».</p>';
  try { r.start(); } catch(e){ REC = null; mic.textContent = '🎤 2. Repetir'; }
}
function repResult(uid, n, said){
  const ref = lectureText(uid, n);
  const c = compareSpeech(ref, said);
  const key = uid + '-' + n;
  S.speak = S.speak || {};
  if (S.speak[key] === undefined || c.score > S.speak[key]) S.speak[key] = c.score;   // guarda la mejor; no toca el resto del progreso
  touch(); save();
  const ready = c.score >= READY_SCORE;
  const words = c.tokens.map(x => `<span class="w ${x.ok ? 'ok' : 'bad'}">${esc(x.t)}</span>`).join(' ');
  document.getElementById('rep-out').innerHTML = `
    <div class="rep-text">${words}</div>
    <div class="score ${ready ? 'ok' : 'bad'}">${c.score} / 100</div>
    ${ready ? '<p class="fb ok">✅ ¡Frase lista! Muy buena pronunciación.</p>'
            : `<p class="fb bad">¡Casi! Inténtalo otra vez, tú puedes.${c.missed.length ? ' Palabras para repasar: <b>' + esc(c.missed.join(', ')) + '</b>.' : ''}</p>`}
    <p class="pcap">Dijiste: ${esc(said.trim())}</p>`;
  document.getElementById('rep-best').textContent = `Mejor puntuación: ${S.speak[key]}/100 ${S.speak[key] >= READY_SCORE ? '✅ Lista' : ''}`;
}

// ---------- preguntas ----------
let QID = 0;
function quiz(q, kind, key){
  const id = 'q' + (++QID);
  Q[id] = {answer: q.answer, kind, key, answered: false};
  const stem = esc(q.stem).replace(/___/g, '<span class="blank"></span>');
  const opts = q.options.map(o =>
    `<button class="opt" data-v="${esc(o)}" onclick="answer('${id}',this.dataset.v)">${esc(o)}</button>`).join('');
  return `<div id="box-${id}">
    <div class="stem">${stem}</div>
    <div class="opts">${opts}</div>
    <div class="fb"></div>
    <button class="btn retry hide" onclick="render()">🔄 Probar otra vez</button>
    <button class="btn nextbtn hide" onclick="nextQ()">Siguiente →</button>
  </div>`;
}
function answer(id, val){
  const q = Q[id]; if (!q || q.answered) return;
  q.answered = true;
  const right = val === q.answer;
  const box = document.getElementById('box-' + id);
  box.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.answer) b.classList.add('right');
    else if (b.dataset.v === val) b.classList.add('wrong');
  });
  const fb = box.querySelector('.fb');
  if (q.kind === 'exam') {
    if (right) { EX.score++; const lv = EX.items[EX.i].level; if (lv && EX.byLevel) EX.byLevel[lv] = (EX.byLevel[lv] || 0) + 1; }
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.textContent = right ? '¡Correcto! ✅' : 'La respuesta correcta es: ' + q.answer;
    box.querySelector('.nextbtn').classList.remove('hide');
  } else {
    if (right) {
      S.done[q.key] = true; touch(); save();
      fb.className = 'fb ok'; fb.textContent = '¡Muy bien! ✅ Ejercicio completado.';
    } else {
      fb.className = 'fb bad'; fb.textContent = 'La respuesta correcta es: ' + q.answer + '. Lee otra vez la lección.';
      box.querySelector('.retry').classList.remove('hide');
    }
  }
}

  const list = [

    {name:'Racha de 3 días', on: S.streak.count >= 3},
    {name:'Racha de 7 días', on: S.streak.count >= 7},
    {name:'30 unidades aprobadas', on: passed >= 30},
  ];
  DATA.levels.forEach(l => list.push({name:'Nivel ' + l.code + ' completo', on: levelDone(l.code) === levelTotal(l.code)}));
  return list;
}

// ---------- vistas ----------
function continueButton(){
  const last = S.last && U(S.last.uid) ? S.last : null;
  const u = last ? U(last.uid) : UNITS[0];
  const n = last ? last.n : 1;
  const l = u.lessons.find(x => x.n === n) || u.lessons[0];
  const txt = last ? '▶ Continuar' : '▶ Empezar';
  return `<button class="btn cont" onclick="go('#/lesson/${u.id}/${l.n}')">${txt}
    <small>${u.level} · Unidad ${u.num}: ${esc(u.title)} · Lección ${l.n}</small></button>`;
}
function unitProgress(uid){
  let d = 0;
  for (let n = 1; n <= 7; n++) if (S.done[uid + '-' + n]) d++;
  if (S.passed[uid]) d++;
  return {d, t: 8, pct: Math.round(100 * d / 8)};
}
function viewHome(){
  const cards = DATA.levels.map(l => {
    const d = levelDone(l.code), t = levelTotal(l.code);
    return `<div class="card level" onclick="go('#/level/${l.code}')">
      <div class="lvl-code">${l.code}</div><div>${esc(l.name)}</div>
      <div>${d}/${t} unidades</div>
      <div class="bar"><div style="width:${Math.round(100*d/t)}%"></div></div></div>`;
  }).join('');
  const bl = badges().map(b => `<span class="badge ${b.on ? 'on' : ''}">${b.on ? '🏅' : '🔒'} ${esc(b.name)}</span>`).join('');
  const P = S.placement;
  const ptBtn = P ? `<button class="btn ghost" onclick="go('#/nivel')">📊 Ver mi nivel: ${P.level || 'Principiante'}</button>`
                  : `<button class="btn ghost" onclick="go('#/placement')">📊 Test de nivel</button>`;
  return `${continueButton()}<div style="margin-bottom:10px">${ptBtn}</div><h2>Elige tu nivel</h2><div class="grid">${cards}</div>
    <div class="card"><h3>Logros</h3>${bl}</div>
    <p class="center" style="color:var(--muted)">Consejo: 15 minutos al día valen más que 2 horas de vez en cuando.</p>
    <div class="ver">Mi inglés · versión ${APP_VERSION}</div>`;
}
function viewLevel(code){
  const lv = DATA.levels.find(l => l.code === code);
  const rows = UNITS.map((u, i) => {
    if (u.level !== code) return '';
    const ok = !!S.passed[u.id], lock = !unlocked(i);
    const tag = ok ? '<span class="tag ok">✅ aprobada</span>' : lock ? '<span class="tag">🔒 bloqueada</span>' : '<span class="tag">Empezar</span>';
    return `<div class="row ${lock ? 'locked' : ''}" ${lock ? '' : `onclick="go('#/unit/${u.id}')"`}>
      <div><b>Unidad ${u.num}</b>: ${esc(u.title)}
        <div class="bar mini"><div style="width:${unitProgress(u.id).pct}%"></div></div></div>${tag}</div>`;
  }).join('');
  return `<div class="crumb" onclick="go('#/')">← Niveles</div>
    <h2>${code} · ${esc(lv.name)}</h2>${rows}`;
}
function viewUnit(uid){
  const u = U(uid);
  const idx = UNITS.indexOf(u);
  const rows = u.lessons.filter(l => l.n <= 7).map(l => {
    const key = uid + '-' + l.n;
    const ok = !!S.done[key];
    return `<div class="row" onclick="go('#/lesson/${uid}/${l.n}')"><div><b>Lección ${l.n}</b>: ${esc(l.title)}</div>
      <span class="tag ${ok ? 'ok' : ''}">${ok ? '✅ hecha' : 'abrir'}</span></div>`;
  }).join('');
  const exOk = !!S.passed[uid];
  const exRow = `<div class="row" onclick="go('#/exam/${uid}')"><div><b>Examen de la unidad</b> (7 de 10 para pasar)</div>
      <span class="tag ${exOk ? 'ok' : ''}">${exOk ? '✅ aprobado' : 'hacer examen'}</span></div>`;
  const next = UNITS[idx + 1];
  const prog = unitProgress(uid);
  return `<div class="crumb" onclick="go('#/level/${u.level}')">← ${u.level}</div>
    <h2>Unidad ${u.num}: ${esc(u.title)}</h2>
    <p style="color:var(--muted)">${esc(u.meta)}</p>
    <div class="bar big" role="progressbar" aria-valuenow="${prog.pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${prog.pct}%">${prog.pct >= 15 ? prog.pct + '%' : ''}</div></div>
    <div class="pcap">${prog.d} de ${prog.t} pasos completados (7 lecciones + examen)</div>
    ${rows}${exRow}
    ${next ? '' : ''}`;
}
function viewLesson(uid, n){
  const u = U(uid), l = u.lessons.find(x => x.n === n);
  touch();
  S.last = {uid, n}; save();   // recuerda dónde quedó el usuario
  let html = `<div class="crumb" onclick="go('#/unit/${uid}')">← Unidad ${u.num}: ${esc(u.title)}</div>
    <div class="card"><h2>Lección ${n}: ${esc(l.title)}</h2>`;
  const ejSection = l.sections.find(s => s.key === 'Ejercicio');
  const respSection = l.sections.find(s => s.key === 'Respuestas');
  for (const s of l.sections) {
    if (s.key === 'Respuestas') continue;                       // se muestra con "ver respuestas"
    if (s.key === 'Ejercicio' && l.exercise) continue;         // se muestra como pregunta interactiva
    const isList = /^Notas|^Otros/.test(s.key);
    html += `<div class="sec"><h3>${esc(s.key)}${/^Lectura/.test(s.key) ? `<button class="speak" title="Escuchar" onclick="speakLesson('${uid}',${n})">🔊</button>` : ''}</h3>`;
    if (isList) html += '<ul>' + s.items.map(i => `<li>${md(i)}</li>`).join('') + '</ul>';
    else html += s.items.map(i => `<p>${md(i)}</p>`).join('');
    if (/^Habla/.test(s.key) || /^Actividad de habla/.test(s.key)) {
      html += repBlock(uid, n);
    }
    html += '</div>';
    if (/^Lectura/.test(s.key)) html += dialogBlock(uid, n);
  }
  html += '</div>';
  if (l.exercise) {
    html += `<div class="card"><h3>✏️ Ejercicio</h3>${quiz(l.exercise, 'ex', uid + '-' + n)}</div>`;
  } else if (ejSection) {
    const key = uid + '-' + n, ok = !!S.done[key];
    const ans = respSection ? respSection.items.map(md).join('<br>') : '(no hay respuestas en esta lección)';
    html += `<div class="card"><h3>✏️ Ejercicio</h3>${ejSection.items.map(i => `<p>${md(i)}</p>`).join('')}
      <button class="btn ghost" onclick="this.nextElementSibling.classList.toggle('hide')">👀 Ver respuestas</button>
      <div class="hide" style="margin-top:8px"><b>Respuestas:</b><br>${ans}</div>
      <div style="margin-top:10px">${ok ? '✅ Hecho' : `<button class="btn" onclick="markDone('${key}')">✅ Ya lo hice</button>`}</div></div>`;
  } else if (n === 7) {
    const key = uid + '-7', ok = !!S.done[key];
    html += `<div class="card center">${ok ? '✅ Repaso marcado' : '<button class="btn" onclick="markDone(\'' + key + '\')">✅ Ya repasé esta unidad</button>'}</div>`;
  }
  const i = u.lessons.indexOf(l);
  const nav = [];
  if (n > 1) nav.push(`<button class="btn ghost" onclick="go('#/lesson/${uid}/${n-1}')">← Anterior</button>`);
  if (n < 7) nav.push(`<button class="btn" onclick="go('#/lesson/${uid}/${n+1}')">Siguiente →</button>`);
  if (n === 7) nav.push(`<button class="btn" onclick="go('#/exam/${uid}')">Ir al examen →</button>`);
  html += `<div class="center">${nav.join('')}</div>`;
  return html;
}
function markDone(key){ S.done[key] = true; touch(); save(); render(); }

// ---------- examen ----------
function startExam(uid){
  EX = {uid, i: 0, score: 0, items: U(uid).exam};
  touch();
}
function nextQ(){
  EX.i++;
  if (EX.placement && EX.i >= EX.items.length) { finishPlacement(); return; }
  render();
}
function viewExam(){
  const u = U(EX.uid);
  if (EX.i >= EX.items.length) {
    const pass = EX.score >= 7;
    if (pass) { S.passed[u.id] = true; save(); }
    const idx = UNITS.indexOf(u), next = UNITS[idx + 1];
    return `<div class="card center">
      <div class="big">${EX.score} / ${EX.items.length}</div>
      ${pass ? '<h2>🎉 ¡Unidad aprobada!</h2><p>Muy bien. Ya puedes seguir.</p>'
             : '<h2>Casi. Necesitas 7 para pasar.</h2><p>Repasa las lecciones y vuelve a intentarlo. Sin prisas.</p>'}
      ${pass ? (next && next.level === u.level ? `<button class="btn" onclick="go('#/unit/${next.id}')">Siguiente unidad →</button>` : '') : `<button class="btn" onclick="startExam('${u.id}');render()">Repetir examen</button>`}
      <button class="btn ghost" onclick="go('#/unit/${u.id}')">Volver a la unidad</button>
    </div>`;
  }
  const q = EX.items[EX.i];
  return `<div class="crumb" onclick="go('#/unit/${u.id}')">← Unidad ${u.num}: ${esc(u.title)}</div>
    <div class="card"><h2>Examen · pregunta ${EX.i + 1} de ${EX.items.length}</h2>
    ${quiz(q, 'exam', null)}</div>`;
}

// ---------- test de nivel ----------
const PT_PER_LEVEL = 4;
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startPlacement(){
  const items = [];
  DATA.levels.forEach(l => {
    // 4 unidades distintas del nivel; de cada una, 1 pregunta de su examen (ya existente)
    const units = shuffle(UNITS.filter(u => u.level === l.code && u.exam.length)).slice(0, PT_PER_LEVEL);
    units.forEach(u => {
      const q = u.exam[Math.floor(Math.random() * u.exam.length)];
      items.push(Object.assign({}, q, {level: l.code, from: u.id}));
    });
  });
  EX = {uid: '__placement', placement: true, i: 0, score: 0, byLevel: {}, items};
  touch();
}
function placementLevel(by){
  // nivel más alto con >= 3 de 4 aciertos, siempre que los niveles anteriores también lo cumplan
  let det = null;
  for (const l of DATA.levels) {
    if ((by[l.code] || 0) >= 3) det = l.code; else break;
  }
  return det;
}
function finishPlacement(){
  const by = {}; DATA.levels.forEach(l => by[l.code] = EX.byLevel[l.code] || 0);
  S.placement = {level: placementLevel(by), scores: by, total: EX.score, date: new Date().toISOString(), accepted: false};
  save();
  EX = null;
  go('#/nivel');
}
function placementStartUnit(code){
  const lvl = code || 'A1';
  const inLevel = UNITS.find(u => u.level === lvl && !S.passed[u.id]);
  return inLevel || UNITS.find(u => !S.passed[u.id]) || null;
}
function acceptPlacement(){
  const P = S.placement; if (!P) return;
  const idx = P.level ? DATA.levels.findIndex(l => l.code === P.level) : 0;
  const before = new Set(DATA.levels.slice(0, idx).map(l => l.code));
  UNITS.forEach(u => { if (before.has(u.level)) S.passed[u.id] = true; });   // solo añade; nunca borra progreso
  P.accepted = true; save();
  const u = placementStartUnit(P.level);
  go(u ? '#/unit/' + u.id : '#/');
}
const PT_MSG = {
  A1: 'Estás empezando, y eso está muy bien. Vas a avanzar paso a paso desde lo básico.',
  A2: 'Ya manejas lo básico. Es hora de hablar de tu rutina y del pasado.',
  B1: 'Te defiendes bien en situaciones del día a día. Sigue ampliando tu vocabulario.',
  B2: 'Tienes un nivel intermedio alto. Puedes conversar con bastante fluidez.',
  C1: 'Tu inglés es avanzado. Ahora toca pulir los matices.',
  C2: '¡Nivel de dominio! Tu inglés es casi como el de un hablante nativo.'
};
function viewPlacement(){
  const q = EX.items[EX.i];
  return `<div class="crumb" onclick="go('#/')">← Menú</div>
    <div class="card"><h2>Test de nivel · pregunta ${EX.i + 1} de ${EX.items.length}</h2>
    <div class="bar"><div style="width:${Math.round(100 * EX.i / EX.items.length)}%"></div></div>
    ${quiz(q, 'exam', null)}</div>`;
}
function viewLevelResult(){
  const P = S.placement;
  if (!P) return viewHome();
  const lv = P.level ? DATA.levels.find(l => l.code === P.level) : null;
  const rows = DATA.levels.map(l => `<span class="badge ${P.scores[l.code] >= 3 ? 'on' : ''}">${l.code}: ${P.scores[l.code]}/${PT_PER_LEVEL}</span>`).join('');
  const su = placementStartUnit(P.level);
  const fecha = new Date(P.date).toLocaleDateString('es');
  const msg = lv ? PT_MSG[lv.code] : 'Todavía no tienes el nivel A1 asegurado. Empieza por el principio, sin prisa: todos empezamos ahí.';
  const startBtn = su ? `<button class="btn" onclick="acceptPlacement()">Empezar en unidad ${su.num} (${su.level}: ${esc(su.title)})</button>`
                      : '<p>Ya tienes todas las unidades aprobadas. ¡Felicidades!</p>';
  const note = P.level && P.level !== 'A1' ? '<p class="pcap">Si empiezas ahí, se marcarán como aprobadas las unidades de los niveles anteriores. Si no, tu progreso no cambia.</p>' : '';
  return `<div class="crumb" onclick="go('#/')">← Menú</div>
    <div class="card center"><h2>Tu nivel</h2>
      <div class="big">${lv ? P.level + ' · ' + esc(lv.name) : 'Principiante'}</div>
      <p>${msg}</p>
      <p>${P.total} de ${DATA.levels.length * PT_PER_LEVEL} respuestas correctas</p>
      <div>${rows}</div>
      <p class="pcap">Test hecho el ${fecha}</p>
      ${note}${startBtn}
      <button class="btn ghost" onclick="go('#/placement')">Repetir el test</button>
      <button class="btn ghost" onclick="go('#/')">Volver al menú</button>
    </div>`;
}

// ---------- enrutado ----------
function render(){
  const h = (location.hash || '#/').slice(2).split('/');
  const app = document.getElementById('app');
  let html;
  if (h[0] === 'level') html = viewLevel(h[1]);
  else if (h[0] === 'unit') html = viewUnit(h[1]);
  else if (h[0] === 'lesson') html = viewLesson(h[1], +h[2]);
  else if (h[0] === 'placement') { if (!EX || !EX.placement) startPlacement(); html = viewPlacement(); }
  else if (h[0] === 'nivel') html = viewLevelResult();
  else if (h[0] === 'exam') { if (!EX || EX.uid !== h[1]) startExam(h[1]); html = viewExam(); }
  else html = viewHome();
  app.innerHTML = html;
  stats();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/exam') && !location.hash.startsWith('#/placement')) EX = null; render(); });
render();

// Modo app: permite instalarla y usarla sin conexión
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
