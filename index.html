<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi inglés</title>
<meta name="theme-color" content="#7c5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi inglés">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6ff;--card:#fff;--ink:#1d2350;--muted:#6b72a1;--a:#7c5cff;--ok:#1fbf75;--bad:#ff5c7a;
--soft:#e6e9ff;--soft2:#eef0ff;--line:#d9dcff;--okbg:#e9fbf2;--okbg2:#dff8ec;--okink:#137a4d;--badbg:#fff0f3;--badink:#c2284b;--gold:#fff3c4;--shadow:rgba(29,35,80,.08);--star:#b7791f}
:root[data-theme=dark]{--bg:#12142b;--card:#1d2040;--ink:#e8eaff;--muted:#a3a9d6;--a:#9a82ff;--ok:#2fd38a;--bad:#ff7a93;
--soft:#2a2e5a;--soft2:#262a52;--line:#3a3f78;--okbg:#14382b;--okbg2:#14382b;--okink:#6ff0b4;--badbg:#431d2b;--badink:#ff9db1;--gold:#5a4a14;--shadow:rgba(0,0,0,.4);--star:#ffd34d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#7c5cff,#2fb8ff);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;cursor:pointer}
.stats span{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;margin-left:6px;font-size:14px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--a);color:#fff;font-size:15px;cursor:pointer;margin:4px 6px 4px 0}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.peligro{background:var(--badbg);color:var(--badink)}
.errrow{padding:12px 0;border-bottom:1px solid var(--line)}
.errrow:last-of-type{border-bottom:0}
.errrow .stem{margin:0 0 6px;overflow-wrap:anywhere}
.errrow .corr{margin:0 0 4px;overflow-wrap:anywhere}
.errrow .corr b{color:var(--okink)}
.errrow .dorigen{display:inline-block;margin:0 10px 6px 0}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px var(--shadow);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.level{cursor:pointer;transition:transform .15s}
.level:hover{transform:translateY(-2px)}
.lvl-code{font-size:28px;font-weight:800;color:var(--a)}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:linear-gradient(90deg,var(--ok),#7ee0a8);transition:width .4s}
.crumb{color:var(--muted);font-size:14px;margin:4px 0 10px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);margin-bottom:10px;box-shadow:0 1px 6px var(--shadow);cursor:pointer}
.row:hover{outline:2px solid var(--line)}
.row.locked{opacity:.5;cursor:not-allowed}
.row.locked:hover{outline:none}
.tag{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--soft2);white-space:nowrap}
.tag.ok{background:var(--okbg2);color:var(--okink)}
h2{margin:4px 0 10px;font-size:22px}
h3{margin:14px 0 6px;color:var(--a);font-size:16px}
.sec p{margin:6px 0}
.sec ul{margin:6px 0 0 18px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;font-weight:600;min-height:1.5em}
.fb.ok{color:var(--okink)}
.fb.bad{color:var(--badink)}
.speak{margin-left:8px;font-size:18px;background:none;border:0;cursor:pointer;vertical-align:middle}
.stem{font-size:18px;line-height:1.6}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--a);margin:0 4px}
.big{font-size:24px;font-weight:800;text-align:center;margin:8px 0}
.center{text-align:center}
.inst details{background:var(--soft);border-radius:12px;padding:10px 14px;margin:8px 0}
.inst summary{cursor:pointer;font-weight:700;padding:4px 0}
.inst ol{padding-left:22px;margin:8px 0}
.inst li{margin:6px 0;line-height:1.45}
.btn.grande{display:block;width:100%;font-size:18px;padding:14px 16px;margin:10px 0}
.btn.chico{font-size:13px;padding:6px 12px}
.glos-bus{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;margin-bottom:6px}
.glos-bus input{display:block;width:100%;padding:12px;font-size:17px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit}
.glos-bus input:focus{outline:none;border-color:var(--a)}
.grow{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.gbody{flex:1;min-width:0;overflow-wrap:anywhere}
.glinks{margin-top:4px}
.glinks .dorigen{display:inline-block;margin:0 10px 4px 0}
.oir{flex:none;background:var(--soft);border:0;border-radius:10px;min-width:36px;min-height:36px;font-size:16px;cursor:pointer}
.esc-txt{display:block;width:100%;min-height:150px;margin:10px 0 6px;padding:12px;font-size:18px;line-height:1.5;border:2px solid var(--line);border-radius:12px;background:var(--soft2);color:var(--ink);font-family:inherit;resize:vertical}
.esc-txt:focus{outline:none;border-color:var(--a)}
.semgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.semnum{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px var(--shadow);text-align:center}
.semnum b{display:block;font-size:28px;color:var(--a)}
.semnum span{font-size:13px;color:var(--muted)}
.semsug{font-size:17px;margin:0 0 10px}
.logro{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--soft2);color:var(--muted);box-shadow:0 1px 6px var(--shadow)}
.logro .lg-ico{flex:none;font-size:32px;line-height:1;filter:grayscale(1);opacity:.55}
.logro .lg-txt{min-width:0;overflow-wrap:anywhere}
.logro .lg-txt b{display:block;color:var(--muted)}
.logro.on{background:var(--gold);color:var(--ink)}
.logro.on .lg-ico{filter:none;opacity:1}
.logro.on .lg-txt b{color:var(--ink)}
.logro-aviso{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;width:calc(100% - 32px);max-width:420px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);color:var(--ink);border:2px solid var(--a);box-shadow:0 6px 24px var(--shadow);pointer-events:none;animation:laentra .3s ease-out}
.logro-aviso .la-ico{font-size:30px;line-height:1}
@keyframes laentra{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.logro-aviso{animation:none}}
.desc-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 1px 6px var(--shadow)}
.desc-txt{min-width:0;flex:1}
.desc-fila .btn{flex:none}
.destiempo{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.destiempo b{flex:none;min-width:3.2em;text-align:right;font-size:18px}
.destrack{flex:1;min-width:0;height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.desfill{height:100%;background:var(--ok);border-radius:99px}
.desfill.poco{background:var(--bad)}
.desfila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 1px 6px var(--shadow);cursor:pointer}
.desmejor{flex:none;color:var(--muted);font-size:14px;text-align:right}
.desrank{list-style:none;margin:0;padding:0;text-align:left}
.desrank li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:var(--soft2)}
.desrank li span{color:var(--muted)}
.desrank li.es{background:var(--gold)}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{min-width:0;display:flex;flex-direction:column;gap:8px}
.pcol .pcap{margin:0;text-align:center}
.pw{min-height:52px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;line-height:1.25;text-align:center;cursor:pointer;overflow-wrap:anywhere;hyphens:auto}
.pw.sel{border-color:var(--a);background:var(--soft)}
.pw.ok{background:var(--okbg);border-color:var(--ok);color:var(--okink);opacity:1}
.pw.mal{background:var(--badbg);border-color:var(--bad);color:var(--badink)}
.pw:disabled{cursor:default}
.codfila{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 1px 6px var(--shadow)}
.codfila.usado{opacity:.75}
.codtxt{min-width:0;overflow-wrap:anywhere}
.codmono{font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
.codconf{font-size:14px}
.codnuevo{text-align:center}
.codgrande{font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:1px;margin:6px 0 10px;overflow-wrap:anywhere}
.parte{padding:12px 14px}
.parte.cerrada{opacity:.75}
.parte-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.parte-cab h3{margin:0;font-size:16px}
.parte .bar.mini{margin:6px 0 10px}
.mbarra{display:inline-block;width:26px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;vertical-align:middle;margin-right:4px}
.mbarra i{display:block;width:50%;height:100%;background:var(--ok)}
.mapa{position:relative;margin:6px 0 10px}
.mapa svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.mapa path{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 9;vector-effect:non-scaling-stroke}
.mapa path.hecho{stroke:var(--ok);stroke-dasharray:none}
.mnodo{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:800;line-height:1.05;cursor:pointer;padding:0;font-family:inherit}
.mnodo small{font-size:12px;font-weight:700}
.mnodo.ok{background:var(--ok);color:#08331f}
.mnodo.sig{width:78px;height:78px;background:var(--a);color:#fff;font-size:26px;border-color:var(--card);box-shadow:0 0 0 4px var(--a);animation:mpulso 1.8s ease-in-out infinite}
.mnodo.bloq{background:var(--soft);color:var(--muted);border-color:var(--line);font-size:22px;cursor:not-allowed}
.mtxt{position:absolute;transform:translateY(-50%);width:calc(72% - 58px);font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.mtxt.izq{text-align:right}
.mtxt b{display:block;font-size:12px;color:var(--a);text-transform:uppercase;letter-spacing:.04em}
.mtxt.bq{color:var(--muted)}
.mmsg{min-height:44px;margin:6px 0;padding:10px 14px;border-radius:12px;background:var(--badbg);color:var(--badink);font-size:14px;visibility:hidden}
.mmsg.ver{visibility:visible}
@keyframes mpulso{0%,100%{box-shadow:0 0 0 4px var(--a)}50%{box-shadow:0 0 0 11px rgba(124,92,255,.22)}}
@media (prefers-reduced-motion:reduce){.mnodo.sig{animation:none}}
.hide{display:none}
.badge{display:inline-block;margin:4px;padding:6px 12px;border-radius:999px;background:var(--soft2)}
.badge.on{background:var(--gold)}
.themebtn{background:rgba(255,255,255,.22);border:0;border-radius:999px;padding:4px 12px;font-size:16px;cursor:pointer;color:#fff}
.acciones{display:flex;gap:8px;align-items:center}
#sonidobtn{background:rgba(29,35,80,.34)}   /* fondo algo más oscuro para que el altavoz se lea sobre el degradado */
.bar.big{height:18px;margin:10px 0 4px}
.bar.big{box-shadow:inset 0 0 0 1px var(--line)}
.bar.big div{display:flex;align-items:center;justify-content:center;background:var(--a);color:#fff;font-size:12px;font-weight:700;min-width:0}
:root[data-theme=dark] .bar.big div{color:var(--bg)}
.pct-fuera{display:none}                                   /* en modo claro no cambia nada */
:root[data-theme=dark] .pct-fuera{display:inline}          /* en oscuro: si la barra casi no se ve, el % va debajo */
.pcap{color:var(--muted);font-size:14px;margin-bottom:10px}
.mini{height:6px;margin-top:6px;width:120px}
.cont{display:block;width:100%;padding:20px 16px;font-size:20px;font-weight:800;border-radius:18px;margin:0 0 14px;text-align:left;box-shadow:0 6px 18px rgba(124,92,255,.35)}
.cont small{display:block;font-weight:500;font-size:14px;opacity:.9;margin-top:2px}
.rep{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.rep-title{font-weight:800;color:var(--a);margin-bottom:6px}
.rep-text{font-size:18px;line-height:2;margin:6px 0 10px}
.w{display:inline-block;padding:0 5px;border-radius:6px;margin:0 1px}
.w.ok{background:var(--okbg);color:var(--okink);font-weight:600}
.w.bad{background:var(--badbg);color:var(--badink);font-weight:600;text-decoration:underline}
.score{font-size:34px;font-weight:800;margin:6px 0}
.score.ok{color:var(--okink)}.score.bad{color:var(--badink)}
.ver{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 4px}
/* animación al aprobar un examen: no bloquea nada (pointer-events:none) y usa los colores de la app */
.aprobado{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.aprobado *{pointer-events:none}
.aprobado .estrella{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);text-align:center;background:var(--card);color:var(--ink);border-radius:20px;padding:8px 28px 14px;box-shadow:0 10px 30px var(--shadow),0 0 0 3px var(--a);animation:apop .5s cubic-bezier(.2,1.4,.4,1) both,asal .5s ease 3s forwards}
.aprobado .estrella b{display:block;font-size:80px;line-height:1.1;font-weight:400}
.aprobado .estrella span{font-size:24px;font-weight:800;color:var(--a)}
.aprobado i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;opacity:0;animation:acae linear forwards}
@keyframes apop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes asal{to{opacity:0}}
@keyframes acae{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot));opacity:1}}
@media (prefers-reduced-motion:reduce){.aprobado .estrella{animation:none}}
/* entrar / crear cuenta */
.sin-sesion #stats,.sin-sesion .acciones{display:none}
.campo{display:block;margin:0 0 12px;font-weight:600}
.campo input{display:block;width:100%;margin-top:4px;padding:12px;font-size:18px;border:2px solid var(--line);border-radius:12px;background:var(--soft2);color:var(--ink);font-family:inherit}
.campo input:focus{outline:none;border-color:var(--a)}
.card.entrada{background:#1b1f45;color:#e8eaff;border:1px solid #3a3f78;padding:20px 16px}
.card.entrada h2{margin:0 0 6px;color:#fff}
.card.entrada p{color:#b9bfe8}
.pestanas{display:flex;gap:8px;margin:12px 0 14px}
.pestana{flex:1;padding:10px 8px;border:2px solid #3a3f78;border-radius:12px;background:transparent;color:#e8eaff;font-size:16px;cursor:pointer}
.pestana.on{border-color:#19c9b4;color:#19e0c9;font-weight:700}
.card.entrada .campo{color:#e8eaff}
.card.entrada .campo input{background:#12142b;color:#fff;border-color:#3a3f78}
.card.entrada .campo input:focus{border-color:#19c9b4}
.btn.turquesa{background:#19c9b4;color:#06222a;font-weight:700;width:100%;margin:4px 0}
.btn.turquesa:disabled{opacity:.6}
.card.entrada .fb{padding:10px 12px;border-radius:10px;margin:12px 0 0}
.card.entrada .fb.bad{background:#431d2b;color:#ff9db1}
.card.entrada .fb.ok{background:#14382b;color:#6ff0b4}
/* palabras difíciles: estrella junto a cada palabra del vocabulario */
.vw{display:inline-flex;align-items:flex-start;max-width:100%;margin:0 8px 0 0}
.star{flex:none;background:none;border:0;padding:0 4px 0 0;min-width:30px;min-height:30px;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.star.on{color:var(--star)}
.star:focus-visible{outline:2px solid var(--a);border-radius:6px}
.difrow{display:flex;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.difrow:last-child{border-bottom:0}
.difbody{min-width:0;overflow-wrap:anywhere}
.dorigen{display:block;background:none;border:0;padding:0;margin-top:2px;font:inherit;font-size:14px;color:var(--a);text-align:left;cursor:pointer;text-decoration:underline}
/* texto más grande para leer cómodo en el móvil: solo lecciones y exámenes */
.leccion,.examen{font-size:18px}
.leccion h2,.examen h2{font-size:24px}
.leccion h3{font-size:19px}
.leccion .sec p{line-height:1.75}
.leccion .sec li{line-height:1.65}
.leccion .stem,.examen .stem{font-size:19px}
.leccion .opt,.examen .opt{font-size:18px}
.leccion .fb,.examen .fb{font-size:17px}
@media (max-width:480px){.leccion h2,.examen h2{font-size:22px}}
@media (max-width:480px){.stem{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1 onclick="go('#/')">🎓 Mi inglés</h1>
  <div class="stats" id="stats"></div>
  <div class="acciones">
    <button class="themebtn" id="themebtn" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema claro u oscuro">🌙</button>
    <button class="themebtn" id="sonidobtn" onclick="toggleSonido()" title="Silenciar sonidos" aria-label="Silenciar o activar los sonidos" aria-pressed="false">🔊</button>
  </div>
</header>
<main id="app"></main>

* en frases afirmativas.", "*any* en negativas y preguntas."]}, {"key": "Ejercicio", "items": ["I have ___ bread. → **some**. Do you have ___ eggs? → **any**"]}, {"key": "Habla", "items": ["\"I have some ___. I don't have any ___.\""]}], "exercise": null}, {"n": 2, "title": "Cuánto y cuántos (how much / how many)", "sections": [{"key": "Tema", "items": ["preguntar cantidades."]}, {"key": "Vocabulario", "items": ["much (mucho, incontable), many (muchos, contable), kilo (kilo), bottle (botella), box (caja)"]}, {"key": "Lectura", "items": ["How much milk do you need? One bottle. How many apples do you need? Three."]}, {"key": "Notas", "items": ["*how much* + incontable: *how much milk*.", "*how many* + contable: *how many eggs*."]}, {"key": "Ejercicio", "items": ["How ___ milk? → **much**. How ___ eggs? → **many**"]}, {"key": "Habla", "items": ["\"How much ___? How many ___?\""]}], "exercise": null}, {"n": 3, "title": "Quisiera... (I'd like)", "sections": [{"key": "Tema", "items": ["pedir algo de forma educada."]}, {"key": "Vocabulario", "items": ["shop (tienda), buy (comprar), pay (pagar), cash (efectivo), card (tarjeta)"]}, {"key": "Lectura", "items": ["I'd like a kilo of apples, please. How much is it? Here you are. I'll pay with a card."]}, {"key": "Notas", "items": ["*I'd like* = quisiera. Es más educado que *I want*.", "*Here you are* = aquí tiene."]}, {"key": "Ejercicio", "items": ["I'd like two ___ of milk. → **bottles**"]}, {"key": "Habla", "items": ["\"I'd like a ___, please.\""]}], "exercise": null}, {"n": 4, "title": "Comidas y alimentos", "sections": [{"key": "Tema", "items": ["nombrar comidas del día y alimentos."]}, {"key": "Vocabulario", "items": ["breakfast (desayuno), lunch (comida), dinner (cena), fruit (fruta), vegetables (verduras), fish (pescado), juice (zumo)"]}, {"key": "Lectura", "items": ["For breakfast I have toast and juice. For lunch I eat fish and vegetables. For dinner I have fruit."]}, {"key": "Notas", "items": ["*have breakfast* / *have lunch* / *have dinner*.", "*eat* = comer."]}, {"key": "Preguntas", "items": ["What does the speaker have for breakfast? What does he eat for lunch?"]}, {"key": "Ejercicio", "items": ["For ___ I have fruit. (dinner / breakfast) → **dinner**"]}, {"key": "Habla", "items": ["\"For breakfast I have ___.\""]}], "exercise": {"stem": "For ___ I have fruit.", "options": ["dinner", "breakfast"], "answer": "dinner"}}, {"n": 5, "title": "En el restaurante", "sections": [{"key": "Tema", "items": ["pedir la carta y la cuenta."]}, {"key": "Vocabulario", "items": ["menu (carta), waiter (camarero), bill (cuenta), table (mesa)"]}, {"key": "Lectura", "items": ["A table for two, please. Can I see the menu? The bill, please."]}, {"key": "Notas", "items": ["*Can I see the menu?* = ¿Puedo ver la carta?", "*The bill, please.* = La cuenta, por favor."]}, {"key": "Ejercicio", "items": ["Can I see the ___? (menu / bill) → **menu**"]}, {"key": "Habla", "items": ["\"A table for ___, please.\""]}], "exercise": {"stem": "Can I see the ___?", "options": ["menu", "bill"], "answer": "menu"}}, {"n": 6, "title": "Precios", "sections": [{"key": "Tema", "items": ["decir cuánto cuesta algo."]}, {"key": "Vocabulario", "items": ["price (precio), cheap (barato), expensive (caro), euro (euro)"]}, {"key": "Lectura", "items": ["The bread is two euros. The coffee is cheap. The car is expensive."]}, {"key": "Notas", "items": ["*How much is it?* = ¿Cuánto cuesta?", "*It is ten euros.* = Son diez euros."]}, {"key": "Preguntas", "items": ["How much is the bread? Is the car cheap?"]}, {"key": "Ejercicio", "items": ["The car is very ___. (cheap / expensive) → **expensive**"]}, {"key": "Habla", "items": ["\"How much is ___? It is ___ euros.\""]}], "exercise": {"stem": "The car is very ___.", "options": ["cheap", "expensive"], "answer": "expensive"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I want some bread and some milk. Do you have any eggs? No, I don't have any eggs. I have some rice."]}, {"key": "Repaso", "items": ["*some / any*, *how much / how many*, *I'd like*, comidas, restaurante, precios."]}, {"key": "Actividad de habla (role play)", "items": ["Eres cliente en una tienda. Pide 2 cosas, pregunta el precio y paga."]}, {"key": "Actividad escrita", "items": ["escribe tu lista de compra en 5 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 some, 2 any, 3 much, 4 many, 5 I'd, 6 breakfast, 7 menu, 8 cheap, 9 much, 10 Can"]}], "exercise": null}], "exam": [{"stem": "I have ___ apples.", "options": ["some", "any"], "answer": "some"}, {"stem": "I don't have ___ milk.", "options": ["some", "any"], "answer": "any"}, {"stem": "How ___ bread do you need?", "options": ["much", "many"], "answer": "much"}, {"stem": "How ___ eggs do you need?", "options": ["much", "many"], "answer": "many"}, {"stem": "___ like a kilo of rice, please.", "options": ["I'd", "I am"], "answer": "I'd"}, {"stem": "For ___ I have toast.", "options": ["breakfast", "dinner"], "answer": "breakfast"}, {"stem": "Can I see the ___?", "options": ["menu", "bill"], "answer": "menu"}, {"stem": "The coffee is ___.", "options": ["cheap", "the cheap"], "answer": "cheap"}, {"stem": "How ___ is it?", "options": ["much", "many"], "answer": "much"}, {"stem": "___ you pay with a card?", "options": ["Can", "Does"], "answer": "Can"}]}, {"id": "a1-u5", "level": "A1", "num": 5, "title": "Lugares y momentos", "meta": "decir dónde y cuándo pasan las cosas: días, meses, lugares y partes del día.", "lessons": [{"n": 1, "title": "Días (on)", "sections": [{"key": "Tema", "items": ["usar *on* con los días de la semana."]}, {"key": "Vocabulario", "items": ["Monday (lunes), Friday (viernes), Saturday (sábado), Sunday (domingo), weekend (fin de semana)"]}, {"key": "Lectura", "items": ["I work on Monday. I go to the gym on Friday. We relax on the weekend."]}, {"key": "Notas", "items": ["*on* + día: *on Monday*.", "Los días : "The bag is ___ the table.", "options": ["on", "under"], "answer": "on"}}, {"n": 5, "title": "Momentos del día (in, at)", "sections": [{"key": "Tema", "items": ["decir cuándo haces algo durante el día."]}, {"key": "Vocabulario", "items": ["morning (mañana), afternoon (tarde), evening (tarde-noche), night (noche)"]}, {"key": "Lectura", "items": ["I study in the morning. I go to the gym in the afternoon. I watch TV at night."]}, {"key": "Notas", "items": ["*in the morning*, *in the afternoon*, *in the evening*.", "Pero *at night*."]}, {"key": "Ejercicio", "items": ["I sleep ___ night. → **at**"]}, {"key": "Habla", "items": ["\"I ___ in the morning. I ___ at night.\""]}], "exercise": null}, {"n": 6, "title": "Cuándo y dónde (when, where)", "sections": [{"key": "Tema", "items": ["hacer preguntas con *when* y *where*."]}, {"key": "Vocabulario", "items": ["when (cuándo), where (dónde), party (fiesta)"]}, {"key": "Lectura (diálogo)", "items": ["When is your party? → It is on Saturday.", "Where do you work? → I work in Madrid."]}, {"key": "Notas", "items": ["*When* para preguntar el momento.", "*Where* para preguntar el lugar."]}, {"key": "Preguntas", "items": ["When is the party? Where does the speaker work?"]}, {"key": "Ejercicio", "items": ["___ do you live? (Where / When) → **Where**"]}, {"key": "Habla", "items": ["\"Where do you ___? When do you ___?\""]}], "exercise": {"stem": "___ do you live?", "options": ["Where", "When"], "answer": "Where"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["On Monday I work. On Friday I play football. We go to the park on Sunday. What do you do on Saturday?"]}, {"key": "Repaso", "items": ["*on* (días), *in* (meses y partes del día), *at* (lugares y horas), *next to*, *when*, *where*."]}, {"key": "Actividad de habla", "items": ["\"I work on ___. I am at ___ in the morning. My birthday is in ___.\""]}, {"key": "Actividad escrita", "items": ["escribe tu semana en 5 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 on, 2 in, 3 at, 4 under, 5 in, 6 at, 7 Where, 8 When, 9 on, 10 in"]}], "exercise": null}], "exam": [{"stem": "I go to the gym ___ Friday.", "options": ["on", "in", "at"], "answer": "on"}, {"stem": "My birthday is ___ March.", "options": ["on", "in", "at"], "answer": "in"}, {"stem": "She is ___ work.", "options": ["in", "at", "on"], "answer": "at"}, {"stem": "The cat is hiding ___ the chair.", "options": ["under", "in", "on"], "answer": "under"}, {"stem": "I study ___ the morning.", "options": ["in", "at", "on"], "answer": "in"}, {"stem": "I sleep ___ night.", "options": ["in", "at", "on"], "answer": "at"}, {"stem": "___ do you work? In a bank.", "options": ["Where", "When"], "answer": "Where"}, {"stem": "___ is the party? On Saturday.", "options": ["Where", "When"], "answer": "When"}, {"stem": "I can see the book from above. It is ___ the table.", "options": ["on", "under", "in"], "answer": "on"}, {"stem": "We travel ___ summer.", "options": ["in", "on", "at"], "answer": "in"}]}, {"id": "a1-u6", "level": "A1", "num": 6, "title": "Gustos", "meta": "decir qué te gusta y qué no, con qué intensidad y dar tu opinión sencilla.", "lessons": [{"n": 1, "title": "Me gusta (like + sustantivo)", "sections": [{"key": "Tema", "items": ["usar *like* con cosas."]}, {"key": "Vocabulario", "items": ["music (música), football (fútbol), cinema (cine), coffee (café), pizza (pizza)"]}, {"key": "Lectura", "items": ["I like pizza. She likes music. We don't like football."]}, {"key": "Notas", "items": ["*I, you, we, they* + **like**.", "*he, she, it* + **likes**."]}, {"key": "Ejercicio", "items": ["She ___ coffee. (like / likes) → **likes**"]}, {"key": "Habla", "items": ["\"I like ___. He likes ___.\""]}], "exercise": {"stem": "She ___ coffee.", "options": ["like", "likes"], "answer": "likes"}}, {"n": 2, "title": "Amar, odiar, disfrutar (love, hate, enjoy)", "sections": [{"key": "Tema", "items": ["expresar más intensidad."]}, {"key": "Vocabulario", "items": ["love (encantar), hate (odiar), enjoy (disfrutar), spiders (arañas), chocolate (chocolate)"]}, {"key": "Lectura", "items": ["I love chocolate. He hates spiders. They enjoy travelling."]}, {"key": "Notas", "items": ["*love* = me encanta (más fuerte que *like*).", "*hate* = odio, lo contrario de *love*."]}, {"key": "Ejercicio", "items": ["I ___ spiders! (love / hate) → **hate**"]}, {"key": "Habla", "items": ["\"I love ___. I hate ___.\""]}], "exercise": {"stem": "I ___ spiders!", "options": ["love", "hate"], "answer": "hate"}}, {"n": 3, "title": "Me gusta hacer (like + -ing)", "sections": [{"key": "Tema", "items": ["usar *like* con un verbo en *-ing*."]}, {"key": "Vocabulario", "items": ["reading (leer), swimming (nadar), cooking (cocinar), dancing (bailar), running (correr)"]}, {"key": "Lectura", "items": ["I like swimming in the sea. She enjoys cooking. He hates running."]}, {"key": "Notas", "items": ["Verbo + **-ing**: *reading, swimming*.", "Con *enjoy* y *hate* también se usa **-ing**."]}, {"key": "Ejercicio", "items": ["I like ___ (run). → **running**"]}, {"key": "Habla", "items": ["\"I like ___ing.\""]}], "exercise": null}, {"n": 4, "title": "¿Te gusta...? (preguntas)", "sections": [{"key": "Tema", "items": ["preguntar gustos."]}, {"key": "Vocabulario", "items": ["tea (té), reading (leer), dancing (bailar)"]}, {"key": "Lectura (diálogo)", "items": ["Do you like dancing? → Yes, I do.", "Does she like coffee? → No, she doesn't."]}, {"key": "Notas", "items": ["*Do* para *you, I, we, they*.", "*Does* para *he, she, it*."]}, {"key": "Ejercicio", "items": ["___ you like tea? → **Do**"]}, {"key": "Habla", "items": ["\"Do you like ___? Yes, I do. / No, I don't.\""]}], "exercise": null}, {"n": 5, "title": "Mi favorito (favorite)", "sections": [{"key": "Tema", "items": ["decir lo que más te gusta."]}, {"key": "Vocabulario", "items": ["favorite (favorito), color (color), food (comida), film (película)"]}, {"ke  am going to ___.\""]}], "exercise": {"stem": "She ___ going to work tomorrow.", "options": ["is", "are"], "answer": "is"}}, {"n": 4, "title": "¿Vas a...? (preguntas con going to)", "sections": [{"key": "Tema", "items": ["preguntar por planes."]}, {"key": "Vocabulario", "items": ["come (venir), call (llamar)"]}, {"key": "Lectura (diálogo)", "items": ["Are you going to come to the party? → Yes, I am.", "Is she going to call you? → No, she isn't."]}, {"key": "Notas", "items": ["*Are / Is* al principio de la pregunta."]}, {"key": "Ejercicio", "items": ["___ you going to travel? → **Are**"]}, {"key": "Habla", "items": ["\"Are you going to ___?\""]}], "exercise": null}, {"n": 5, "title": "Cuándo (tomorrow, next week)", "sections": [{"key": "Tema", "items": ["decir cuándo harás algo."]}, {"key": "Vocabulario", "items": ["tomorrow (mañana), this weekend (este fin de semana), next week (la semana que viene), next month (el mes que viene), relax (descansar), move (mudarse)"]}, {"key": "Lectura", "items": ["This weekend I am going to relax. Next month we are going to move."]}, {"key": "Notas", "items": ["*next* = próximo.", "*this* = este."]}, {"key": "Ejercicio", "items": ["We are going to travel ___ week. (next / last) → **next**"]}, {"key": "Habla", "items": ["\"Next ___ I am going to ___.\""]}], "exercise": {"stem": "We are going to travel ___ week.", "options": ["next", "last"], "answer": "next"}}, {"n": 6, "title": "¿Quieres...? (would you like to)", "sections": [{"key": "Tema", "items": ["invitar y responder a una invitación."]}, {"key": "Vocabulario", "items": ["cinema (cine), sure (claro), sounds great (suena genial)"]}, {"key": "Lectura (diálogo)", "items": ["Would you like to go to the cinema? → Sure, that sounds great."]}, {"key": "Notas", "items": ["*Would you like to...?* = ¿Te gustaría...?", "Responder: *Sure* / *Yes, I would love to*."]}, {"key": "Ejercicio", "items": ["Would you like ___ have dinner? → **to**"]}, {"key": "Habla", "items": ["\"Would you like t "]}, {"key": "Vocabulario", "items": ["every day (todos los días), once a week (una vez a la semana), twice a month (dos veces al mes), never (nunca)"]}, {"key": "Lectura (diálogo)", "items": ["How often do you go to the gym? → Twice a week.", "How often do you call your mother? → Every day."]}, {"key": "Notas", "items": ["*How often* = ¿con qué frecuencia?", "*once* = una vez, *twice* = dos veces, *three times* = tres veces."]}, {"key": "Preguntas", "items": ["How often does the speaker go to the gym? How often does he call his mother?"]}, {"key": "Ejercicio", "items": ["I swim ___ a week. (once / every) → **once**"]}, {"key": "Habla", "items": ["\"I ___ a week.\""]}], "exercise": {"stem": "I swim ___ a week.", "options": ["once", "every"], "answer": "once"}}, {"n": 2, "title": "Una rutina completa (presente simple)", "sections": [{"key": "Tema", "items": ["contar una rutina larga con presente simple."]}, {"key": "Vocabulario", "items": ["get up (levantarse), go for a run (salir a correr), commute (ir y volver del trabajo), finish (terminar)"]}, {"key": "Lectura", "items": ["I get up at 6:30. I usually go for a run before breakfast. I commute to work by train. I finish at 5 o'clock."]}, {"key": "Notas", "items": ["Tercera persona lleva **-s**: *she goes*, *he finishes*.", "*before* = antes de. *after* = después de."]}, {"key": "Ejercicio", "items": ["She ___ (go) for a run every morning. → **goes**"]}, {"key": "Habla", "items": ["\"I get up at ___. I usually ___.\""]}], "exercise": null}, {"n": 3, "title": "El fin de semana (on, at the weekend)", "sections": [{"key": "Tema", "items": ["hablar de lo que haces los fines de semana."]}, {"key": "Vocabulario", "items": ["at the weekend (el fin de semana), on Sundays (los domingos), sleep in (dormir hasta tarde), relax (descansar)"]}, {"key": "Lectura", "items": ["At the weekend I sleep in. On Sundays I relax at home. On Saturdays I meet my friends."]}, {"key": "Notas", "items": ["*at the weekend* es la forma más común en A2.", "Para días en plural usamos *on Sundays*."]}, {"key": "Ejercicio", "items": ["I meet my friends ___ Saturdays. → **on**"]}, {"key": "Habla", "items": ["\"At the weekend I ___.\""]}], "exercise": null}, {"n": 4, "title": "¿Cuánto tarda? (how long / it takes)", "sections": [{"key": "Tema", "items": ["decir cuánto tiempo tarda algo."]}, {"key": "Vocabulario", "items": ["take (tardar), journey (trayecto), minutes (minutos), hour (hora)"]}, {"key": "Lectura", "items": ["How long does it take to get to work? It takes twenty minutes by bus. The journey takes an hour by car."]}, {"key": "Notas", "items": ["*It takes* + tiempo: *It takes twenty minutes*.", "*How long does it take?* = ¿cuánto tarda?"]}, {"key": "Ejercicio", "items": ["It ___ thirty minutes. (take / takes) → **takes**"]}, {"key": "Habla", "items": ["\"It takes ___ minutes to ___.\""]}], "exercise": {"stem": "It ___ thirty minutes.", "options": ["take", "takes"], "answer": "takes"}}, {"n": 5, "title": "Tareas de casa (do, make)", "sections": [{"key": "Tema", "items": ["usar *do* y *make* con tareas de casa."]}, {"key": "Vocabulario", "items": ["do the housework (hacer las tareas de casa), do the shopping (hacer la compra), make the bed (hacer la cama), wash the dishes (lavar los platos)"]}, {"key": "Lectura", "items": ["On Sundays I do the housework. I make the bed every morning. My brother washes the dishes."]}, {"key": "Notas", "items": ["*do* para tareas: *do the housework*, *do the shopping*.", "*make* para hacer algo: *make the bed*."]}, {"key": "Ejercicio", "items": ["I ___ the bed every day. (do / make) → **make**"]}, {"key": "Habla", "items": ["\"I do ___. I make ___.\""]}], "exercise": {"stem": "I ___ the bed every day.", "options": ["do", "make"], "answer": "make"}}, {"n": 6, "title": "Preguntas de frecuencia", "sections": [{"key": "Tema", "items": ["hacer preguntas con *how often* y *do / does*."]}, {"key": "Vocabulario", "items": ["cook (cocinar), clean (limpiar), study (estudiar)"]}, {"key" key": "Notas", "items": ["*didn't* + verbo en forma base: *didn't go* (no *didn't went*)."]}, {"key": "Ejercicio", "items": ["He ___ (not visit) the museum. → **didn't visit**"]}, {"key": "Habla", "items": ["\"I didn't ___.\""]}], "exercise": null}, {"n": 4, "title": "¿Hiciste...? (preguntas)", "sections": [{"key": "Tema", "items": ["preguntar por algo del pasado."]}, {"key": "Vocabulario", "items": ["weekend (fin de semana), cinema (cine)"]}, {"key": "Lectura (diálogo)", "items": ["Did you have a good weekend? → Yes, I did.", "Did they go to the cinema? → No, they didn't."]}, {"key": "Notas", "items": ["*Did* + sujeto + verbo en forma base: *Did you see...?*", "Respuesta corta: *Yes, I did.* / *No, she didn't.*"]}, {"key": "Ejercicio", "items": ["___ you see the film? → **Did**"]}, {"key": "Habla", "items": ["\"Did you ___? Yes, I did. / No, I didn't.\""]}], "exercise": null}, {"n": 5, "title": "Cuándo pasó (expresiones de tiempo)", "sections": [{"key": "Tema", "items": ["decir cuándo pasó algo."]}, {"key": "Vocabulario", "items": ["last night (anoche), two days ago (hace dos días), in 2020 (en 2020), when I was a child (cuando era niño)"]}, {"key": "Lectura", "items": ["Two days ago I met an old friend. In 2020 I moved to Madrid. When I was a child, I lived in a small village."]}, {"key": "Notas", "items": ["*ago* va después del tiempo: *two days ago*.", "*in* + año: *in 2020*."]}, {"key": "Ejercicio", "items": ["I moved here ___ 2020. (in / on) → **in**"]}, {"key": "Habla", "items": ["\"In ___, I ___.\""]}], "exercise": {"stem": "I moved here ___ 2020.", "options": ["in", "on"], "answer": "in"}}, {"n": 6, "title": "Contar una historia (first, then, finally)", "sections": [{"key": "Tema", "items": ["ordenar las acciones de una historia."]}, {"key": "Vocabulario", "items": ["first (primero), then (luego), after that (después de eso), finally (por fin), missed the bus (perdí el autobús)"]}, {"key": "Lectura", "items": ["First, I got up late. Then I missed the bus. A , "sections": [{"key": "Tema", "items": ["diferenciar *going to* (plan) y *will* (decisión del momento)."]}, {"key": "Vocabulario", "items": ["plan (plan), visit (visitar), next week (la semana que viene)"]}, {"key": "Lectura", "items": ["I'm going to visit my aunt next week. (plan) / I'll call her now. (decisión)"]}, {"key": "Notas", "items": ["*going to* = ya lo habíamos decidido antes.", "*will* = lo decidimos justo ahora."]}, {"key": "Ejercicio", "items": ["I'm ___ visit my aunt next week. (going to / will) → **going to**"]}, {"key": "Habla", "items": ["\"I'm going to ___. I'll ___.\""]}], "exercise": {"stem": "I'm ___ visit my aunt next week.", "options": ["going to", "will"], "answer": "going to"}}, {"n": 6, "title": "Expresiones de futuro", "sections": [{"key": "Tema", "items": ["palabras para hablar del futuro."]}, {"key": "Vocabulario", "items": ["soon (pronto), next year (el año que viene), in two weeks (dentro de dos semanas), later (más tarde)"]}, {"key": "Lectura", "items": ["We'll meet in two weeks. I'll see you soon. Next year we'll move to Barcelona."]}, {"key": "Notas", "items": ["*in + tiempo* = dentro de: *in two weeks*.", "*soon* = pronto."]}, {"key": "Ejercicio", "items": ["We'll ___ in two weeks. (meet / meets) → **meet**"]}, {"key": "Habla", "items": ["\"I'll ___ in ___.\""]}], "exercise": {"stem": "We'll ___ in two weeks.", "options": ["meet", "meets"], "answer": "meet"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I will call you tomorrow. I think it will rain later. I'll help you with your homework. We will visit grandma next week."]}, {"key": "Repaso", "items": ["*will* para decisiones, predicciones, promesas, negativos, preguntas, *going to* vs *will*."]}, {"key": "Actividad de habla", "items": ["Di 2 decisiones de hoy con *I'll*, 2 predicciones con *I think... will* y 1 promesa."]}, {"key": "Actividad escrita", "items": ["escribe tu agenda de la semana que viene en 6 frases con *will* o *going to*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have, 2 will, 3 will, 4 be, 5 Will, 6 going to, 7 soon, 8 will, 9 meet, 10 will"]}], "exercise": null}], "exam": [{"stem": "I'll ___ the soup, please.", "options": ["have", "has"], "answer": "have"}, {"stem": "It ___ rain tomorrow.", "options": ["will", "is going"], "answer": "will"}, {"stem": "I ___ help you.", "options": ["will", "going"], "answer": "will"}, {"stem": "I won't ___ late.", "options": ["be", "is"], "answer": "be"}, {"stem": "___ you call me later?", "options": ["Will", "Are"], "answer": "Will"}, {"stem": "I'm ___ visit my aunt next week.", "options": ["going to", "will"], "answer": "going to"}, {"stem": "I'll see you ___.", "options": ["soon", "ago"], "answer": "soon"}, {"stem": "She ___ pass the exam.", "options": ["will", "is"], "answer": "will"}, {"stem": "We'll ___ in two weeks.", "options": ["meet", "meets"], "answer": "meet"}, {"stem": "The weather ___ be sunny.", "options": ["will", "is going"], "answer": "will"}]}, {"id": "a2-u10", "level": "A2", "num": 10, "title": "Experiencias", "meta": "hablar de lo que has hecho alguna vez en la vida, usando el present perfect.", "lessons": [{"n": 1, "title": "Participios irregulares", "sections": [{"key": "Tema", "items": ["formas del participio que más se usan."]}, {"key": "Vocabulario", "items": ["been (estado de ser o estar), seen (visto), done (hecho), eaten (comido), gone (ido), had (tenido), made (hecho/fabricado)"]}, {"key": "Lectura", "items": ["I have been to Italy. I have seen a whale. I have eaten sushi. I have had a lot of fun."]}, {"key": "Notas", "items": ["Los verbos regulares añaden **-ed** (*visited*). Los irregulares hay que memorizarlos.", "*been* y *gone* no significan lo mismo: *I have been to Rome* (fui y volví) / *She has gone to Rome* (se fue y no ha vuelto)."]}, {"key": "Ejercicio", "items": ["I have ___ to Italy. (been / be) → **been**"]}, {"key": "Habla", "items": ["\"I have ___ ___.\""]}], "exercise": {"stem": "I have ___ to Italy.", "options": ["been", "be"], "answer": "been"}}, {"n": 2, "title": "He estado / he hecho (present perfect)", "sections": [{"key": "Tema", "items": ["formar el present perfect: *have/has + participio*."]}, {"key": "Vocabulario", "items": ["visit (visitar), climb (escalar), try (probar), ever (alguna vez)"]}, {"key": "Lectura", "items": ["I have visited Portugal twice. She has tried sushi. We have climbed a mountain."]}, {"key": "Notas", "items": ["*I, you, we, they* + **have** + participio.", "*he, she, it* + **has** + participio."]}, {"key": "Ejercicio", "items": ["She has ___ sushi. (try / tried) → **tried**"]}, {"key": "Habla", "items": ["\"I have ___ ___.\""]}], "exercise": {"stem": "She has ___ sushi.", "options": ["try", "tried"], "answer": "tried"}}, {"n": 3, "title": "¿Alguna vez...? (have you ever)", "sections": [{"key": "Tema", "items": ["preguntar por experiencias."]}, {"key": "Vocabulario", "items": ["ever (alguna vez), shark (tiburón), London (Londres), sushi (sushi)"]}, {"key": "Lectura (diálogo)", "items": ["Have you ever been to London? → Yes, I have. Twice!", "Has she ever seen a shark? → No, she hasn't."]}, {"key": "Notas", "items": ["Pregunta: **Have/Has** + sujeto + *ever* + participio.", "Respuesta corta: *Yes, I have.* / *No, she hasn't.*"]}, {"key": "Ejercicio", "items": ["___ you ever been to London? (Have / Did) → **Have**"]}, {"key": "Habla", "items": ["\"Have you ever ___? Yes, I have. / No, I haven't.\""]}], "exercise": {"stem": "___ you ever been to London?", "options": ["Have", "Did"], "answer": "Have"}}, {"n": 4, "title": "Nunca (never)", "sections": [{"key": "Tema", "items": ["decir que nunca has hecho algo."]}, {"key": "Vocabulario", "items": ["never (nunca), snake (serpiente), before (antes)"]}, {"key": "Lectura", "items": ["I have never seen a snake. We have never been to Japan before."]}, {"key": "Notas", "items": ["*never* va entre *have* y el participio: *have never seen*.", "No uses *not* con *never*."]}, {"key": "Ejercicio", "items": ["I have ___ seen a snake. (never / not) → **never**"]}, {"key": "Habla", "items": ["\"I have never ___.\""]}], "exercise": {"stem": "I have ___ seen a snake.", "options": ["never", "not"], "answer": "never"}}, {"n": 5, "title": "Experiencia vs. fecha (present perfect vs. pasado simple)", "sections": [{"key": "Tema", "items": ["diferenciar la experiencia (sin fecha) del hecho en un momento concreto."]}, {"key": "Vocabulario", "items": ["in 2019 (en 2019), last year (el año pasado)"]}, {"key": "Lectura", "items": ["I have been to Paris. (experiencia, sin fecha) / I visited Paris in 2019. (momento concreto)"]}, {"key": "Notas", "items": ["Con fecha exacta usamos pasado simple: *in 2019*, *last year*.", "Sin fecha, pero como experiencia de vida, usamos present perfect."]}, {"key": "Ejercicio", "items": ["I ___ Paris in 2019. (visited / have visited) → **visited**"]}, {"key": "Habla", "items": ["\"I have ___. I ___ in ___.\""]}], "exercise": {"stem": "I ___ Paris in 2019.", "options": ["visited", "have visited"], "answer": "visited"}}, {"n": 6, "title": "Contar una experiencia", "sections": [{"key": "Tema", "items": ["hablar de una experiencia con más detalle."]}, {"key": "Vocabulario", "items": ["amazing (increíble), exciting (emocionante), scary (aterrador), beautiful (bonito)"]}, {"key": "Lectura", "items": ["I have done many things in my life. Skydiving was amazing. Climbing the mountain was scary but exciting."]}, {"key": "Notas", "items": ["*was* + adjetivo para opinar sobre lo que pasó.", "*the best / the most* para destacar."]}, {"key": "Ejercicio", "items": ["Skydiving was ___. (amazing / amazed) → **amazing**"]}, {"key": "Habla", "items": ["\"I have done ___. It was ___.\""]}], "exercise": {"stem": "Skydiving was ___.", "options": ["amazing", "amazed"], "answer": "amazing"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I have visited London twice. Have you ever eaten sushi? She has already finished the project. I have never seen snow."]}, {"key": "Repaso", "items": ["participios, *have/has + participio*, *have you ever*, *never*, experiencia vs. fecha, contar una experiencia."]}, {"key": "Actividad de habla", "items": ["Di 3 cosas que hayas hecho alguna vez y 1 que nunca hayas hecho."]}, {"key": "Actividad escrita", "items": ["escribe 5 frases sobre tu vida con *I have* y *I have never*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 been, 2 seen, 3 eaten, 4 never, 5 gone, 6 Have, 7 have, 8 haven't, 9 visited, 10 had"]}], "exercise": null}], "exam": [{"stem": "I have ___ to Italy.", "options": ["been", "be"], "answer": "been"}, {"stem": "Have you ___ a shark?", "options": ["seen", "see"], "answer": "seen"}, {"stem": "Have you ever ___ sushi?", "options": ["eat", "eaten"], "answer": "eaten"}, {"stem": "I have ___ seen a snake.", "options": ["never", "not"], "answer": "never"}, {"stem": "She has ___ to Japan.", "options": ["gone", "went"], "answer": "gone"}, {"stem": "___ you ever been to London?", "options": ["Have", "Did"], "answer": "Have"}, {"stem": "Yes, I ___ been to Rome. Twice!", "options": ["have", "did"], "answer": "have"}, {"stem": "Have you ever eaten snails? No, I ___.", "options": ["haven't", "didn't"], "answer": "haven't"}, {"stem": "I ___ Paris in 2019.", "options": ["visited", "have visited"], "answer": "visited"}, {"stem": "He has ___ a car.", "options": ["had", "have"], "answer": "had"}]}, {"id": "b1-u1", "level": "B1", "num": 1, "title": "Sobre mí", "meta": "describir tu personalidad, tus gustos, tus hábitos de antes y de ahora, y hablar de ti con detalle durante un minuto.", "lessons": [{"n": 1, "title": "Presente simple o continuo (contraste)", "sections": [{"key": "Tema", "items": ["cuándo usar presente simple (hábitos) y presente continuo (ahora)."]}, {"key": "Vocabulario", "items": ["usually (normalmente), right now (ahora mismo), at the moment (en este momento), every day (todos los días)"]}, {"key": "Lectura", "items": ["I usually work from home. Right now I am reading a book about history. At the moment we are looking for a new flat."]}, {"key": "Notas", "items": ["Presente simple: hábitos y rutinas, *usually, every day*.", "Presente continuo: algo que pasa ahora o en este periodo, *right now, at the moment*."]}, {"key": "Ejercicio", "items": ["Right now I ___ a book. (read / am reading) → **am reading**"]}, {"key": "Habla", "items": ["\"Usually I ___. Right now I am ___.\""]}], "exercise": {"stem": "Right now I ___ a book.", "options": ["read", "am reading"], "answer": "am reading"}}, {"n": 2, "title": "Describir la personalidad", "sections": [{"key": "Tema", "items": ["adjetivos de personalidad."]}, {"key": "Vocabulario", "items": ["outgoing (sociable), shy (tímido), reliable (fiable), easy-going (tranquilo), ambitious (ambicioso), patient (paciente)"]}, {"key": "Lectura", "items": ["I'm quite outgoing and I enjoy meeting new people. My sister is shy at first, but she's very reliable. My boss is patient and easy-going."]}, {"key": "Notas", "items": ["*quite* = bastante. *very* = muy.", "Adjetivos de personalidad se usan con *is / am / are*: *She is very reliable*."]}, {"key": "Ejercicio", "items": ["She is very ___. (reliable / reliably) → **reliable**"]}, {"key": "Habla", "items": ["\"I'm quite ___. I'm ___.\""]}], "exercise": {"stem": "She is very ___.", "options": ["reliable", "reliably"], "answer": "reliable"}}, {"n": 3, "title": "Gustos fuertes (be into, can't stand)", "sections": [{"key": "Tema", "items": ["expresar gustos con más intensidad."]}, {"key": "Vocabulario", "items": ["be into (estar muy interesado en), keen on (aficionado a), can't stand (no soportar), loud (ruidoso), photography (fotografía)"]}, {"key": "Lectura", "items": ["I'm really into photography. I'm keen on hiking at weekends. I can't stand loud music."]}, {"key": "Notas", "items": ["*be into* + sustantivo o *-ing*: *I'm into reading*.", "*keen on* + sustantivo o *-ing*: *keen on hiking*.", "*can't stand* + *-ing*: *can't stand waiting*."]}, {"key": "Ejercicio", "items": ["I can't ___ loud music. (stand / standing) → **stand**"]}, {"key": "Habla", "items": ["\"I'm really into ___. I can't stand ___.\""]}], "exercise": {"stem": "I can't ___ loud music.", "options": ["stand", "standing"], "answer": "stand"}}, {"n": 4, "title": "Hábitos del pasado (used to)", "sections": [{"key": "Tema", "items": ["hablar de hábitos o situaciones que ya no existen."]}, {"key": "Vocabulario", "items": ["used to (solía), play the piano (tocar el piano), childhood (infancia), move (mudarse)"]}, {"key": "Lectura", "items": ["When I was a child, I used to play the piano every day. We used to live in a small village. Now I live in a big city."]}, {"key": "Notas", "items": ["*used to* + verbo base = solía / antes hacía.", "Ya no se hace, por eso usamos *used to* y no el presente."]}, {"key": "Ejercicio", "items": ["I ___ to play the piano. (used / use) → **used**"]}, {"key": "Habla", "items": ["\"When I was a child, I used to ___.\""]}], "exercise": {"stem": "I ___ to play the piano.", "options": ["used", "use"], "answer": "used"}}, {"n": 5, "title": "Preguntas indirectas (Do you know where...?)", "sections": [{"key": "Tema", "items": ["preguntas más educadas."]}, {"key": "Vocabulario", "items": ["know (saber), where (dónde), when (cuándo), station (estación)"]}, {"key": "Lectura (diálogo)", "items": ["Do you know where the station is? → Yes, it's next to the bank.", "Could you tell me when the shop opens? → At nine."]}, {"key": "Notas", "items": ["En preguntas indirectas el verbo va en orden normal: *where the station is*, no *where is the station*.", "Son más educadas que las directas."]}, {"key": "Ejercicio", "items": ["Do you know where the station ___? (is / it is) → **is**"]}, {"key": "Habla", "items": ["\"Do you know where ___?\""]}], "exercise": {"stem": "Do you know where the station ___?", "options": ["is", "it is"], "answer": "is"}}, {"n": 6, "title": "Frecuencia avanzada (rarely, tend to)", "sections": [{"key": "Tema", "items": ["hablar de hábitos con más matices."]}, {"key": "Vocabulario", "items": ["rarely (rara vez), hardly ever (casi nunca), tend to (tender a), late (tarde), stay up (quedarse despierto)"]}, {"key": "Lectura", "items": ["I rarely go out on weekdays. I hardly ever eat fast food. I tend to stay up late."]}, {"key": "Notas", "items": ["*rarely* y *hardly ever* son casi negativos.", "*tend to* + verbo base: *tend to stay*."]}, {"key": "Ejercicio", "items": ["I ___ go to the gym. (rarely / rarely to) → **rarely**"]}, {"key": "Habla", "items": ["\"I tend to ___. I rarely ___.\""]}], "exercise": {"stem": "I ___ go to the gym.", "options": ["rarely", "rarely to"], "answer": "rarely"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I usually take the bus to work. Right now I am reading a great book. I am living in Madrid, but I work in London."]}, {"key": "Repaso", "items": ["presente simple vs. continuo, personalidad, *be into / can't stand*, *used to*, preguntas indirectas, frecuencia avanzada."]}, {"key": "Actividad de habla (1 minuto)", "items": ["Háblate durante un minuto: quién eres, qué te gusta, qué hacías de niño y qué haces ahora."]}, {"key": "Actividad escrita", "items": ["escribe una presentación de 8 frases sobre ti."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 am reading, 2 is, 3 can't, 4 used, 5 is, 6 rarely, 7 used, 8 on, 9 reliable, 10 tend to"]}], "exercise": null}], "exam": [{"stem": "Right now I ___ a book.", "options": ["read", "am reading"], "answer": "am reading"}, {"stem": "She ___ very outgoing.", "options": ["is", "are"], "answer": "is"}, {"stem": "I ___ stand loud music. So I never go to concerts.", "options": ["can", "can't"], "answer": "can't"}, {"stem": "He ___ to play the piano as a child.", "options": ["used", "use"], "answer": "used"}, {"stem": "Do you know where the station ___?", "options": ["is", "it is"], "answer": "is"}, {"stem": "I ___ go to the gym.", "options": ["rarely", "rare"], "answer": "rarely"}, {"stem": "We ___ to live in a flat.", "options": ["used", "use"], "answer": "used"}, {"stem": "I'm keen ___ hiking.", "options": ["on", "for"], "answer": "on"}, {"stem": "She is very ___.", "options": ["reliable", "reliably"], "answer": "reliable"}, {"stem": "I ___ stay up late.", "options": ["tend to", "tend"], "answer": "tend to"}]}, {"id": "b1-u2", "level": "B1", "num": 2, "title": "Trabajo y estudios", "meta": "contar tu historia laboral y académica: qué hiciste, cuándo y cómo cambió tu vida profesional.", "lessons": [{"n": 1, "title": "Pasado simple (regulares e irregulares)", "sections": [{"key": "Tema", "items": ["formar el pasado simple con verbos regulares e irregulares comunes."]}, {"key": "Vocabulario", "items": ["began (empezó), took (tomó), wrote (escribió), got (consiguió), found (encontró), left (dejó / salió)"]}, {"key": "Lectura", "items": ["I began my first job at 22. I took a course in marketing. Last year I got a new position and I wrote my first report."]}, {"key": "Notas", "items": ["Regulares: *worked, studied, started* (+ **-ed**).", "Irregulares: hay que memorizarlos. *began, took, wrote, got, found, left*."]}, {"key": "Ejercicio", "items": ["Last year I ___ a new job. (got / get) → **got**"]}, {"key": "Habla", "items": ["\"I began ___. Last year I ___.\""]}], "exercise": {"stem": "Last year I ___ a new job.", "options": ["got", "get"], "answer": "got"}}, {"n": 2, "title": "Contar un día de trabajo (narrar)", "sections": [{"key": "Tema", "items": ["narrar acciones en pasado en orden."]}, {"key": "Vocabulario", "items": ["arrived (llegó), had a meeting (tuve una reunión), finished (terminó), answered (contestó), emails (correos)"]}, {"key": "Lectura", "items": ["Yesterday I arrived at the office at nine. I had a meeting at ten and answered a lot of emails. I finished the report at six."]}, {"key": "Notas", "items": ["Para contar en orden usamos *then, after that, finally*.", "*had a meeting* = tuve una reunión (*have* en pasado = *had*)."]}, {"key": "Ejercicio", "items": ["Yesterday I ___ the report at six. (finish / finished) → **finished**"]}, {"key": "Habla", "items": ["\"Yesterday I ___ at ___.\""]}], "exercise": {"stem": "Yesterday I ___ the report at six.", "options": ["finish", "finished"], "answer": "finished"}}, {"n": 3, "title": "Vocabulario del trabajo", "sections": [{"key": "Tema", "items": ["palabras de trabajo de nivel intermedio."]}, {"key": "Vocabulario", "items": ["promotion (ascenso), deadline (fecha límite), responsibility (responsabilidad), team leader (líder de equipo), contract (contrato)"]}, {"key": "Lectura", "items": ["I got a promotion last year. I am now a team leader. My main responsibility is meeting the deadlines."]}, {"key": "Notas", "items": ["*a promotion* = un ascenso.", "*responsibility* es sustantivo. *responsible* es adjetivo: *I am responsible for...*"]}, {"key": "Ejercicio", "items": ["I was ___ for the project. (responsible / responsibility) → **responsible**"]}, {"key": "Habla", "items": ["\"My main responsibility is ___.\""]}], "exercise": {"stem": "I was ___ for the project.", "options": ["responsible", "responsibility"], "answer": "responsible"}}, {"n": 4, "title": "Experiencia laboral (worked as)", "sections": [{"key": "Tema", "items": ["hablar de tus trabajos anteriores."]}, {"key": "Vocabulario", "items": ["worked as (trabajé como), company (empresa), department (departamento), for (durante), in charge of (a cargo de)"]}, {"key": "Lectura", "items": ["I worked as a teacher for five years. Then I joined a marketing company. I was in charge of the social media department."]}, {"key": "Notas", "items": ["*worked as* + profesión: *worked as a teacher*.", "*joined* = empecé a trabajar en (una empresa)."]}, {"key": "Ejercicio", "items": ["I ___ as a teacher for five years. (worked / work) → **worked**"]}, {"key": "Habla", "items": ["\"I worked as a ___ for ___ years.\""]}], "exercise": {"stem": "I ___ as a teacher for five years.", "options": ["worked", "work"], "answer": "worked"}}, {"n": 5, "title": "Estudios (studied, graduated)", "sections": [{"key": "Tema", "items": ["hablar de tu formación académica."]}, {"key": "Vocabulario", "items": ["studied (estudié), graduated (me gradué), degree (título), master's (máster), studying for (estudiando para)"]}, {"key": "Lectura", "items": ["I studied English at university. I graduated in 2018. Now I am studying for a master's in business."]}, {"key": "Notas", "items": ["*graduate in* + materia: *graduated in 2018*.", "*study for* + título: *studying for a master's*."]}, {"key": "Ejercicio", "items": ["He ___ in engineering in 2018. (graduated / graduate) → **graduated**"]}, {"key": "Habla", "items": ["\"I graduated in ___. Now I'm studying ___.\""]}], "exercise": {"stem": "He ___ in engineering in 2018.", "options": ["graduated", "graduate"], "answer": "graduated"}}, {"n": 6, "title": "Cambios en la vida profesional", "sections": [{"key": "Tema", "items": ["hablar de cambios: empezar, dejar y mudarse."]}, {"key": "Vocabulario", "items": ["started (empecé), left (dejé), moved (me mudé), became (me convertí en), changed (cambió)"]}, {"key": "Lectura", "items": ["I started my new job in March. I left my old company after three years. We moved to Madrid last year. She became a team leader."]}, {"key": "Notas", "items": ["*became* + profesión: *became a team leader*.", "*left* = dejé o salí de un lugar o empresa."]}, {"key": "Ejercicio", "items": ["She ___ a team leader last month. (became / become) → **became**"]}, {"key": "Habla", "items": ["\"I started ___. I left ___.\""]}], "exercise": {"stem": "She ___ a team leader last month.", "options": ["became", "become"], "answer": "became"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Last year I worked in a hotel. I went to Berlin in June. We didn't finish the project on time. Did you study for the test?"]}, {"key": "Repaso", "items": ["pasado simple regular e irregular, narrar, vocabulario de trabajo, experiencia laboral, estudios, cambios."]}, {"key": "Actividad de habla (2 minutos)", "items": ["Cuenta tu historia laboral y académica: estudios, primer trabajo, trabajo actual y un cambio importante."]}, {"key": "Actividad escrita", "items": ["escribe tu currículum en 8 frases con pasado simple."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 got, 2 wrote, 3 missed, 4 worked, 5 graduated, 6 responsible, 7 left, 8 studied, 9 became, 10 started"]}], "exercise": null}], "exam": [{"stem": "Last year I ___ a new job.", "options": ["got", "get"], "answer": "got"}, {"stem": "She ___ the report on Monday.", "options": ["wrote", "write"], "answer": "wrote"}, {"stem": "We ___ the deadline.", "options": ["missed", "miss"], "answer": "missed"}, {"stem": "I ___ as a teacher for five years.", "options": ["worked", "work"], "answer": "worked"}, {"stem": "He ___ in engineering in 2018.", "options": ["graduated", "graduate"], "answer": "graduated"}, {"stem": "I was ___ for the project.", "options": ["responsible", "responsibility"], "answer": "responsible"}, {"stem": "They ___ the office last year.", "options": ["left", "leave"], "answer": "left"}, {"stem": "I ___ English at university.", "options": ["studied", "study"], "answer": "studied"}, {"stem": "She ___ a team leader last month.", "options": ["became", "become"], "answer": "became"}, {"stem": "We ___ the meeting early.", "options": ["started", "start"], "answer": "started"}]}, {"id": "b1-u3", "level": "B1", "num": 3, "title": "Planes y futuro", "meta": "hablar de planes, posibilidades, horarios y sugerencias sobre el futuro.", "lessons": [{"n": 1, "title": "Going to o will (repaso y contraste)", "sections": [{"key": "Tema", "items": ["diferenciar planes (*going to*) y decisiones del momento (*will*)."]}, {"key": "Vocabulario", "items": ["start (empezar), course (curso), decide (decidir), next month (el mes que viene)"]}, {"key": "Lectura", "items": ["I'm going to start a course next month. I've already booked it. (plan) / Oh, the phone is ringing. I'll answer it. (decisión)"]}, {"key": "Notas", "items": ["*going to* = plan que ya existía antes del momento.", "*will* = decisión que tomas justo ahora."]}, {"key": "Ejercicio", "items": ["I'm ___ start a course next month. (going to / will) → **going to**"]}, {"key": "Habla", "items": ["\"I'm going to ___. I'll ___.\""]}], "exercise": {"stem": "I'm ___ start a course next month.", "options": ["going to", "will"], "answer": "going to"}}, {"n": 2, "title": "Presente continuo para citas (arrangements)", "sections": [{"key": "Tema", "items": ["hablar de citas y planes con fecha usando presente continuo."]}, {"key": "Vocabulario", "items": ["meet (quedar), client (cliente), flight (vuelo), tomorrow (mañana), arrangement (cita organizada)"]}, {"key": "Lectura", "items": ["We are meeting the clients tomorrow at ten. I'm flying to Berlin on Friday. She is starting her new job on Monday."]}, {"key": "Notas", "items": ["Presente continuo para citas ya organizadas, con hora o día.", "Se usa con verbos de movimiento y de planes: *meet, fly, start*."]}, {"key": "Ejercicio", "items": ["We ___ meeting the clients tomorrow. (are / will) → **are**"]}, {"key": "Habla", "items": ["\"I'm ___ on ___.\""]}], "exercise": {"stem": "We ___ meeting the clients tomorrow.", "options": ["are", "will"], "answer": "are"}}, {"n": 3, "title": "Posibilidad (might, may)", "sections": [{"key": "Tema", "items": ["decir que algo es posible, pero no seguro."]}, {"key": "Vocabulario", "items": ["might (podría), may (puede que), rain (llover), later (más tarde), sure (seguro)"]}, {"key": "Lectura", "items": ["It might rain later. I'm not sure. We may go to the beach tomorrow, but it depends on the weather."]}, {"key": "Notas", "items": ["*might* y *may* = puede que / podría.", "Después de *might* o *may* va el verbo en forma base: *might rain*."]}, {"key": "Ejercicio", "items": ["It ___ rain later. I'm not sure. (might / must) → **might**"]}, {"key": "Habla", "items": ["\"I might ___. I may ___.\""]}], "exercise": {"stem": "It ___ rain later. I'm not sure.", "options": ["might", "must"], "answer": "might"}}, {"n": 4, "title": "Cuando pase algo (when, as soon as)", "sections": [{"key": "Tema", "items": ["hablar de cosas futuras con cláusulas de tiempo."]}, {"key": "Vocabulario", "items": ["as soon as (en cuanto), when (cuando), finish (terminar), arrive (llegar), call (llamar)"]}, {"key": "Lectura", "items": ["I'll call you as soon as I arrive. When I finish university, I'll travel for a year."]}, {"key": "Notas", "items": ["Con *when*, *as soon as*, *before*, *after*, en la cláusula con tiempo futuro usamos **presente simple**, no *will*.", "*I'll call you when I arrive*. No *when I will arrive*."]}, {"key": "Ejercicio", "items": ["I'll call you as soon as I ___. (arrive / will arrive) → **arrive**"]}, {"key": "Habla", "items": ["\"When I ___, I'll ___.\""]}], "exercise": {"stem": "I'll call you as soon as I ___.", "options": ["arrive", "will arrive"], "answer": "arrive"}}, {"n": 5, "title": "Sugerencias (let's, shall, how about)", "sections": [{"key": "Tema", "items": ["proponer planes."]}, {"key": "Vocabulario", "items": ["let's (vamos a), shall (¿...?), how about (¿qué tal si...?), cinema (cine), dinner (cena)"]}, {"key": "Lectura (diálogo)", "items": ["Shall we meet at the café? → Yes, good idea.", "How about going to the cinema tonight? → Let's do it!"]}, {"key": "Notas", "items": ["*Let's + verbo base*: *Let's watch a film*.", "*How about + -ing*: *How about going out?*"]}, {"key": "Ejercicio", "items": ["Let's ___ a film tonight. (watch / watching) → **watch**"]}, {"key": "Habla", "items": ["\"Shall we ___? How about ___?\""]}], "exercise": {"stem": "Let's ___ a film tonight.", "options": ["watch", "watching"], "answer": "watch"}}, {"n": 6, "title": "Previsto (be due to, be about to)", "sections": [{"key": "Tema", "items": ["hablar de algo que está previsto o a punto de pasar."]}, {"key": "Vocabulario", "items": ["be due to (estar previsto para), be about to (estar a punto de), leave (salir), start (empezar), announce (anunciar)"]}, {"key": "Lectura", "items": ["The train is due to arrive at nine. The meeting is about to start. The company is due to announce the results next week."]}, {"key": "Notas", "items": ["*be due to* + verbo base: *is due to arrive*.", "*be about to* + verbo base = estar a punto de: *is about to start*."]}, {"key": "Ejercicio", "items": ["She's ___ to leave soon. (about / going) → **about**"]}, {"key": "Habla", "items": ["\"The ___ is due to ___. The ___ is about to ___.\""]}], "exercise": {"stem": "She's ___ to leave soon.", "options": ["about", "going"], "answer": "about"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I am going to start a new course in January. I think it will be useful. Oh, the phone is ringing. I'll answer it."]}, {"key": "Repaso", "items": ["*going to / will*, citas con presente continuo, *might/may*, cláusulas con *when*, sugerencias, *due to / about to*."]}, {"key": "Actividad de habla (role play)", "items": ["Planifica un fin de semana con un amigo: propón planes, di qué es posible y qué ya está decidido."]}, {"key": "Actividad escrita", "items": ["escribe tu agenda de la próxima semana en 6 frases con diferentes formas de futuro."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 going, 2 are, 3 might, 4 as, 5 Shall, 6 is due, 7 finish, 8 be, 9 watch, 10 about"]}], "exercise": null}], "exam": [{"stem": "I'm ___ to start a new course next month.", "options": ["going", "will"], "answer": "going"}, {"stem": "We ___ meeting ", "items": ["last year (el año pasado), in 2019 (en 2019), yesterday (ayer), since (desde), for (durante)"]}, {"key": "Lectura", "items": ["I have been to Italy. I went to Rome in 2019. We have lived here since 2020. We lived in Madrid for two years."]}, {"key": "Notas", "items": ["Con fecha o tiempo concreto: pasado simple. *I went in 2019*.", "Sin fecha, como experiencia de vida: present perfect. *I have been*."]}, {"key": "Ejercicio", "items": ["I ___ to Rome in 2019. (went / have been) → **went**"]}, {"key": "Habla", "items": ["\"I have ___. I ___ in ___.\""]}], "exercise": {"stem": "I ___ to Rome in 2019.", "options": ["went", "have been"], "answer": "went"}}, {"n": 3, "title": "Ya (already) y todavía no (yet)", "sections": [{"key": "Tema", "items": ["hablar de algo ya hecho o todavía no."]}, {"key": "Vocabulario", "items": ["already (ya), yet (todavía / aún), homework (deberes), finish (terminar), report (informe)"]}, {"key": "Lectura", "items": ["I have already finished my homework. Have you finished the report yet? No, not yet."]}, {"key": "Notas", "items": ["*already* va entre *have* y el participio en afirmativa.", "*yet* va al final en preguntas y negativas: *Have you finished yet?*"]}, {"key": "Ejercicio", "items": ["Have you finished the report ___? (already / yet) → **yet**"]}, {"key": "Habla", "items": ["\"I have already ___. I haven't ___ yet.\""]}], "exercise": {"stem": "Have you finished the report ___?", "options": ["already", "yet"], "answer": "yet"}}, {"n": 4, "title": "Nunca y alguna vez (never, ever)", "sections": [{"key": "Tema", "items": ["preguntar y responder sobre experiencias de vida."]}, {"key": "Vocabulario", "items": ["ever (alguna vez), never (nunca), Japan (Japón), seen (visto)"]}, {"key": "Lectura (diálogo)", "items": ["Have you ever been to Japan? → No, I have never been there.", "Has she ever seen a shark? → Yes, she has."]}, {"key": "Notas", "items": ["*ever* en preguntas, *never* en respuestas negativas.", "*never* va antes del participio: *have never been*."]}, {"key": "Ejercicio", "items": ["She has ___ been to Paris. (never / ever) → **never**"]}, {"key": "Habla", "items": ["\"Have you ever ___? I have never ___.\""]}], "exercise": {"stem": "She has ___ been to Paris.", "options": ["never", "ever"], "answer": "never"}}, {"n": 5, "title": "Algo acaba de pasar (just)", "sections": [{"key": "Tema", "items": ["hablar de algo reciente."]}, {"key": "Vocabulario", "items": ["just (acabar de), arrive (llegar), finish (terminar), call (llamar), train (tren)"]}, {"key": "Lectura", "items": ["We have just arrived at the station. I have just finished my exam. She has just called me."]}, {"key": "Notas", "items": ["*just* va entre *have* y el participio: *have just finished*.", "Sirve para algo que pasó hace muy poco."]}, {"key": "Ejercicio", "items": ["They have ___ arrived home. (just / yet) → **just**"]}, {"key": "Habla", "items": ["\"I have just ___.\""]}], "exercise": {"stem": "They have ___ arrived home.", "options": ["just", "yet"], "answer": "just"}}, {"n": 6, "title": "Desde y durante (since, for)", "sections": [{"key": "Tema", "items": ["decir desde cuándo y cuánto tiempo."]}, {"key": "Vocabulario", "items": ["since (desde), for (durante), 2020 (año), two years (dos años), long time (mucho tiempo)"]}, {"key": "Lectura", "items": ["I haven't seen him since last year. We have been married for ten years. She has worked here since 2020."]}, {"key": "Notas", "items": ["*since* + momento concreto: *since 2020*.", "*for* + periodo de tiempo: *for ten years*."]}, {"key": "Ejercicio", "items": ["I haven't seen him ___ last year. (since / for) → **since**"]}, {"key": "Habla", "items": ["\"I have ___ since ___. I have ___ for ___.\""]}], "exercise": {"stem": "I haven't seen him ___ last year.", "options": ["since", "for"], "answer": "since"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I have visited five countries. Have you ever tried Thai food? I hav __ reading.", "options": ["was", "were"], "answer": "was"}]}, {"id": "b1-u8", "level": "B1", "num": 8, "title": "Tecnología", "meta": "describir cómo se hacen las cosas, cuándo se hicieron y para qué se usan, con la voz pasiva.", "lessons": [{"n": 1, "title": "Voz pasiva en presente (is made, are used)", "sections": [{"key": "Tema", "items": ["formar la pasiva en presente simple."]}, {"key": "Vocabulario", "items": ["made (fabricado), used (usado), in China (en China), schools (colegios), computer (ordenador)"]}, {"key": "Lectura", "items": ["This phone is made in China. Computers are used in most schools."]}, {"key": "Notas", "items": ["*am / is / are* + participio: *is made*, *are used*.", "Se usa cuando lo importante es la cosa, no quién la hace."]}, {"key": "Ejercicio", "items": ["This phone ___ in China. (is made / makes) → **is made**"]}, {"key": "Habla", "items": ["\"___ is made in ___.\""]}], "exercise": {"stem": "This phone ___ in China.", "options": ["is made", "makes"], "answer": "is made"}}, {"n": 2, "title": "Voz pasiva en pasado (was built, were sent)", "sections": [{"key": "Tema", "items": ["formar la pasiva en pasado simple."]}, {"key": "Vocabulario", "items": ["built (construido), sent (enviado), bridge (puente), letters (cartas), yesterday (ayer)"]}, {"key": "Lectura", "items": ["The bridge was built in 1932. The letters were sent yesterday."]}, {"key": "Notas", "items": ["*was / were* + participio: *was built*, *were sent*.", "*was* con singular, *were* con plural."]}, {"key": "Ejercicio", "items": ["The bridge ___ in 1932. (was built / built) → **was built**"]}, {"key": "Habla", "items": ["\"___ was built in ___.\""]}], "exercise": {"stem": "The bridge ___ in 1932.", "options": ["was built", "built"], "answer": "was built"}}, {"n": 3, "title": "Voz pasiva con \"by\" (quién lo hizo)", "sections": [{"key": "Tema", "items": ["decir quién hizo algo, con *by*."]}, {"key": "Vocabulario", "items": ["designed (diseñado), by (por), invented (inventado), company (empresa), famous (famoso)"]}, {"key": "Lectura", "items": ["This app was designed by a small company. The telephone was invented by a famous scientist."]}, {"key": "Notas", "items": ["*by* introduce quién hizo la acción.", "No siempre hace falta *by*; solo si es importante."]}, {"key": "Ejercicio", "items": ["The book was written ___ a famous author. (by / for) → **by**"]}, {"key": "Habla", "items": ["\"It was ___ by ___.\""]}], "exercise": {"stem": "The book was written ___ a famous author.", "options": ["by", "for"], "answer": "by"}}, {"n": 4, "title": "Pasiva con will (will be built)", "sections": [{"key": "Tema", "items": ["hablar de algo que se hará en el futuro."]}, {"key": "Vocabulario", "items": ["will be built (se construirá), next year (el año que viene), library (biblioteca), opened (abrió)"]}, {"key": "Lectura", "items": ["A new library will be built next year. The shop will be opened in May."]}, {"key": "Notas", "items": ["*will be* + participio: *will be built*.", "Solo cambia el verbo auxiliar: *will be*."]}, {"key": "Ejercicio", "items": ["A new library ___ next year. (will be built / is built) → **will be built**"]}, {"key": "Habla", "items": ["\"___ will be ___.\""]}], "exercise": {"stem": "A new library ___ next year.", "options": ["will be built", "is built"], "answer": "will be built"}}, {"n": 5, "title": "Lo que se habla (is spoken)", "sections": [{"key": "Tema", "items": ["decir qué se habla, se usa o se sabe."]}, {"key": "Vocabulario", "items": ["spoken (hablado), countries (países), understood (entendido), common (común), language (idioma)"]}, {"key": "Lectura", "items": ["English is spoken in many countries. Spanish is understood in many parts of the world."]}, {"key": "Notas", "items": ["*is spoken* = se habla.", "Así no hace falta decir quién lo habla."]}, {"key": "Ejercicio", "items": ["English ___ in many countries. (is spoken / speaks) → **is spoken**"]}, {"key": "Habla", "items": ["\"___ is spoken in ___.\""]}], "exercise": {" * → *could*."]}, {"key": "Ejercicio", "items": ["He told me that he ___ the car. (sold / had sold) → **had sold**"]}, {"key": "Habla", "items": ["\"She said she had ___.\""]}], "exercise": {"stem": "He told me that he ___ the car.", "options": ["sold", "had sold"], "answer": "had sold"}}, {"n": 3, "title": "Will y would (estilo indirecto)", "sections": [{"key": "Tema", "items": ["contar futuros dichos en pasado."]}, {"key": "Vocabulario", "items": ["would come (vendría), will be (estará), see (ver), later (más tarde), party (fiesta)"]}, {"key": "Lectura", "items": ["They said they would come to the party. He said he would see me later."]}, {"key": "Notas", "items": ["*will* → *would* en estilo indirecto.", "*He said he would see me later* = dijo que me vería más tarde."]}, {"key": "Ejercicio", "items": ["They said they ___ come. (will / would) → **would**"]}, {"key": "Habla", "items": ["\"He said he would ___.\""]}], "exercise": {"stem": "They said they ___ come.", "options": ["will", "would"], "answer": "would"}}, {"n": 4, "title": "Preguntas indirectas (asked me where)", "sections": [{"key": "Tema", "items": ["contar una pregunta que alguien hizo."]}, {"key": "Vocabulario", "items": ["asked (preguntó), where (dónde), lived (vivió / vivía), when (cuándo), arrived (llegó)"]}, {"key": "Lectura", "items": ["I asked her where she lived. He asked me when I arrived."]}, {"key": "Notas", "items": ["En estilo indirecto no hay signo de interrogación.", "El orden es afirmativo: *where she lived*, no *where did she live*."]}, {"key": "Ejercicio", "items": ["I asked her where she ___. (lives / lived) → **lived**"]}, {"key": "Habla", "items": ["\"I asked him where ___.\""]}], "exercise": {"stem": "I asked her where she ___.", "options": ["lives", "lived"], "answer": "lived"}}, {"n": 5, "title": "Órdenes y peticiones (told me to)", "sections": [{"key": "Tema", "items": ["contar lo que alguien te pidió que hicieras."]}, {"key": "Vocabulario", "items": ["told (dijo a), to (para que), close (cerrar), door (puerta), wait (esperar)"]}, {"key": "Lectura", "items": ["She told me to close the door. He asked us to wait outside."]}, {"key": "Notas", "items": ["*told + persona + to + verbo*: *told me to close*.", "*asked + persona + to + verbo*: *asked us to wait*."]}, {"key": "Ejercicio", "items": ["She told me ___ close the door. (to / for) → **to**"]}, {"key": "Habla", "items": ["\"She told me to ___.\""]}], "exercise": {"stem": "She told me ___ close the door.", "options": ["to", "for"], "answer": "to"}}, {"n": 6, "title": "Lugar y tiempo en estilo indirecto (here → there, today → that day)", "sections": [{"key": "Tema", "items": ["cambiar palabras de tiempo y lugar al contar."]}, {"key": "Vocabulario", "items": ["here (aquí), there (allí), today (hoy), that day (ese día), tomorrow (mañana), the next day (al día siguiente)"]}, {"key": "Lectura", "items": ["He said he was here today. She said she would come the next day."]}, {"key": "Notas", "items": ["*today* → *that day*. *tomorrow* → *the next day*.", "*here* → *there*."]}, {"key": "Ejercicio", "items": ["She said she would come ___ day. (the next / tomorrow) → **the next**"]}, {"key": "Habla", "items": ["\"He said he was ___.\""]}], "exercise": {"stem": "She said she would come ___ day.", "options": ["the next", "tomorrow"], "answer": "the next"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["She said that she was tired. He told me that the meeting had moved. They said they would arrive late."]}, {"key": "Repaso", "items": ["*said that*, retroceso de tiempos, *would*, preguntas indirectas, *told me to*, cambios de tiempo y lugar."]}, {"key": "Actividad de habla", "items": ["Cuenta lo que dijo un amigo ayer, lo que te preguntó y lo que te pidió."]}, {"key": "Actividad escrita", "items": ["escribe un mensaje de voz contando lo que te dijo tu jefe o un amigo, en 6 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"k
