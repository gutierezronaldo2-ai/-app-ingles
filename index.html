  guardarUltima(uid, n);   // recuerda dónde quedó el usuario (clave nueva)
  let html = `<div class="crumb" onclick="go('#/unit/${uid}')">← Unidad ${u.num}: ${esc(u.title)}</div>
    <div class="card"><h2>Lección ${n}: ${esc(l.title)}</h2>`;
  const ejSection = l.sections.find(s => s.key === 'Ejercicio');
  const respSection = l.sections.find(s => s.key === 'Respuestas');
  let repPuesto = false;
  const cv = {k: 0};
  for (const s of l.sections) {
    if (s.key === 'Respuestas') continue;                       // se muestra con "ver respuestas"
    if (s.key === 'Ejercicio' && l.exercise) continue;         // se muestra como pregunta interactiva
    const isList = /^Notas|^Otros/.test(s.key);
    html += `<div class="sec"><h3>${esc(s.key)}${/^Lectura/.test(s.key) ? `<button class="speak" title="Escuchar" onclick="speakLesson('${uid}',${n})">🔊</button>` : ''}</h3>`;
    if (isList) html += '<ul>' + s.items.map(i => `<li>${md(i)}</li>`).join('') + '</ul>';
    else if (/^Vocabulario/.test(s.key)) html += vocabHtml(uid, n, s.items, cv);
    else html += s.items.map(i => `<p>${md(i)}</p>`).join('');
    html += '</div>';
    if (/^Lectura/.test(s.key) && !repPuesto) { html += repBlock(uid, n) + escBlock(uid, n); repPuesto = true; }
    if (/^Lectura/.test(s.key)) html += dialogBlock(uid, n);
  }
  html += '</div>';
  if (l.exercise) {
    html += `<div class="card"><h3>✏️ Ejercicio</h3>${quiz(l.exercise, 'ex', uid + '-' + n, {uid, n})}</div>`;
  } else if (ejSection) {
    const key = uid + '-' + n, ok = !!S.done[key];
    const ans = respSection ? respSection.items.map(md).join('<br>') : '(no hay respuestas en esta lección)';
    html += `<div class="card"><h3>✏️ Ejercicio</h3>${ejSection.items.map(i => `<p>${md(i)}</p>`).join('')}
      <button class="btn ghost" onclick="this.nextElementSibling.classList.toggle('hide')">👀 Ver respuestas</button>
      <div class="hide" style="margin-top:8px"><b>Respuestas:</b><br>${ans}</div>
      <div style="margin-top:10px">${ok ? '✅ Hecho' : `<button class="btn" onclick="markDone('${key}')">✅ Ya lo hice</button>`}</div></div>`;
  } else if (n === 7) {
    const key = uid + '-7', ok = !!S.done[key];
    html += `<div class="card center">${ok ? '✅ Repaso marcado' : '<button class="btn" onclick="markDone(\'' + key + '\')">✅ Ya repasé esta unidad</button>'}</div>`;
  }
  const i = u.lessons.indexOf(l);
  const nav = [];
  if (n > 1) nav.push(`<button class="btn ghost" onclick="go('#/lesson/${uid}/${n-1}')">← Anterior</button>`);
  if (n < 7) nav.push(`<button class="btn" onclick="go('#/lesson/${uid}/${n+1}')">Siguiente →</button>`);
  if (n === 7) nav.push(`<button class="btn" onclick="go('#/exam/${uid}')">Ir al examen →</button>`);
  html += `<div class="center">${nav.join('')}</div>`;
  return html;
}
function markDone(key){ fechaLeccion(key); S.done[key] = true; touch(); save(); render(); }

// ---------- animación de examen aprobado ----------
const CONFETI_COLORES = ['#7c5cff', '#2fb8ff', '#1fbf75', '#ff5c7a', '#ffc94d'];   // colores de la app (cabecera, acierto, error) + dorado
function celebrar(){
  const viejo = document.getElementById('aprobado'); if (viejo) viejo.remove();
  const quieto = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);   // "reducir movimiento": solo la estrella
  const caja = document.createElement('div');
  caja.id = 'aprobado'; caja.className = 'aprobado'; caja.setAttribute('role', 'status');
  let h = '';
  if (!quieto) {
    for (let i = 0; i < 70; i++) {
      h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${CONFETI_COLORES[i % CONFETI_COLORES.length]};--dx:${Math.round(Math.random() * 160 - 80)}px;--rot:${Math.round(Math.random() * 720 - 360)}deg;animation-duration:${(1.8 + Math.random() * 0.9).toFixed(2)}s;animation-delay:${(Math.random() * 0.5).toFixed(2)}s"></i>`;
    }
  }
  h += '<div class="estrella"><b>⭐</b><span>¡Aprobado!</span></div>';
  caja.innerHTML = h;
  document.body.appendChild(caja);
  setTimeout(() => caja.remove(), 3500);   // unos 3 segundos; no bloquea los botones
}

// ---------- examen ----------
function startExam(uid){
  EX = {uid, i: 0, score: 0, items: U(uid).exam};
  touch();
}
function nextQ(){
  if (EX.est) { estAvanzar(); return; }
  EX.i++;
  render();
}
function viewExam(){
  const u = U(EX.uid);
  if (EX.i >= EX.items.length) {
    const pass = EX.score >= 7;
    if (pass) { if (!S.passed[u.id]) fechaExamen(u.id); S.passed[u.id] = true; save(); }
    if (pass && !EX.est && EX.score === EX.items.length) otorgarLogro('ni-un-fallo');
    if (pass && !EX.celebrado) { EX.celebrado = true; setTimeout(celebrar, 0); }   // solo si aprueba; una vez por examen
    const idx = UNITS.indexOf(u), next = UNITS[idx + 1];
    return `<div class="card center">
      <div class="big">${EX.score} / ${EX.items.length}</div>
      ${pass ? '<h2>🎉 ¡Unidad aprobada!</h2><p>Muy bien. Ya puedes seguir.</p>'
             : '<h2>Casi. Necesitas 7 para pasar.</h2><p>Repasa las lecciones y vuelve a intentarlo. Sin prisas.</p>'}
      ${pass ? (next && next.level === u.level ? `<button class="btn" onclick="go('#/unit/${next.id}')">Siguiente unidad →</button>` : '') : `<button class="btn" onclick="startExam('${u.id}');render()">Repetir examen</button>`}
      <button class="btn ghost" onclick="go('#/unit/${u.id}')">Volver a la unidad</button>
    </div>`;
  }
  const q = EX.items[EX.i];
  return `<div class="crumb" onclick="go('#/unit/${u.id}')">← Unidad ${u.num}: ${esc(u.title)}</div>
    <div class="card"><h2>Examen · pregunta ${EX.i + 1} de ${EX.items.length}</h2>
    ${quiz(q, 'exam', null, {uid: u.id, n: 0})}</div>`;
}

// ---------- ¿Por dónde empiezo? (estimación de nivel) ----------
const EST_PREGUNTAS = 5;      // preguntas por nivel (de los exámenes que ya existen)
const EST_FALLOS_MAX = 2;     // 2 fallos o más detienen el test; con 4 de 5 aciertos pasa al siguiente nivel
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startEst(){
  // 5 preguntas por nivel, al azar, de 5 unidades distintas del nivel; solo preguntas ya existentes
  const pool = DATA.levels.map(l => {
    const qs = [];
    for (const u of shuffle(UNITS.filter(x => x.level === l.code && x.exam.length))) {
      if (qs.length >= EST_PREGUNTAS) break;
      qs.push(Object.assign({}, u.exam[Math.floor(Math.random() * u.exam.length)], {level: l.code, from: u.id}));
    }
    return qs;
  });
  const res = {}; DATA.levels.forEach(l => res[l.code] = {ok: 0, bad: 0});
  EX = {est: true, uid: '__est', i: 0, score: 0, items: [], pool, li: 0, qi: 0, res};
  touch();
}
function estRegistrar(right){
  const r = EX.res[DATA.levels[EX.li].code];
  if (right) r.ok++; else r.bad++;
}
function estAvanzar(){
  const code = DATA.levels[EX.li].code;
  if (EX.res[code].bad >= EST_FALLOS_MAX) { estTerminar(code); return; }   // falla 2 o más: se detiene en este nivel
  EX.qi++;
  if (EX.qi >= EST_PREGUNTAS) {                                            // 5 hechas con como mucho 1 fallo (4 de 5): sube de nivel
    if (EX.li + 1 >= DATA.levels.length) { estTerminar(null); return; }
    EX.li++; EX.qi = 0;
  }
  render();
}
function estSugerencia(stop){
  if (stop === null) {                                    // pasó todos los niveles
    const last = DATA.levels[DATA.levels.length - 1].code;
    return UNITS.find(u => u.level === last);
  }
  const delNivel = UNITS.filter(u => u.level === stop);
  const num = Math.min(1 + 2 * EX.res[stop].ok, delNivel.length);   // cuantos más aciertos, más adelante empieza
  return delNivel.find(u => u.num === num) || delNivel[0];
}
function estTerminar(stop){
  const u = estSugerencia(stop);
  const scores = {};
  DATA.levels.forEach(l => { const r = EX.res[l.code]; if (r.ok + r.bad > 0) scores[l.code] = {ok: r.ok, bad: r.bad}; });
  S.nivel = {level: u.level, unit: u.id, num: u.num, detenido: stop, scores, date: new Date().toISOString(), aplicado: false};
  save();                                                  // se guarda dentro del mismo progreso, sin borrar nada
  EX = null;
  go('#/sugerencia');
}
function estAplicar(){
  const N = S.nivel; if (!N) return;
  const idx = UNITS.findIndex(u => u.id === N.unit);
  UNITS.slice(0, Math.max(idx, 0)).forEach(u => { S.passed[u.id] = true; });   // solo añade unidades pasadas; nunca borra
  N.aplicado = true; save();
  go('#/unit/' + N.unit);
}
function estDesdeInicio(){ go('#/unit/' + UNITS[0].id); }                       // solo navega: no cambia ningún dato
function viewEst(){
  const lv = DATA.levels[EX.li], q = EX.pool[EX.li][EX.qi];
  const hechas = EX.li * EST_PREGUNTAS + EX.qi;
  return `<div class="crumb" onclick="go('#/')">← Menú</div>
    <div class="card"><h2>¿Por dónde empiezo? · Nivel ${lv.code} · pregunta ${EX.qi + 1} de ${EST_PREGUNTAS}</h2>
    <div class="bar"><div style="width:${Math.round(100 * hechas / (DATA.levels.length * EST_PREGUNTAS))}%"></div></div>
    ${quiz(q, 'exam', null)}</div>`;
}
function viewSugerencia(){
  const N = S.nivel;
  if (!N) return viewHome();
  const u = U(N.unit) || UNITS[0];
  const filas = DATA.levels.filter(l => N.scores[l.code]).map(l => {
    const r = N.scores[l.code], total = r.ok + r.bad, pasa = total >= EST_PREGUNTAS && r.bad < EST_FALLOS_MAX;
    return `<span class="badge ${pasa ? 'on' : ''}">${l.code}: ${r.ok} de ${total}</span>`;
  }).join('');
  const msg = N.detenido === null ? '¡Has superado todos los niveles del test!'
            : (N.level === 'A1' && N.num === 1 ? 'Empezamos por el principio, sin prisa. Todos empezamos ahí.' : 'Seguiste bien hasta el nivel anterior y ahí te detuviste el test.');
  const fecha = new Date(N.date).toLocaleDateString('es');
  return `<div class="crumb" onclick="go('#/')">← Menú</div>
    <div class="card center"><h2>¿Por dónde empiezo?</h2>
      <div class="big">Te sugiero empezar en ${N.level}, unidad ${u.num}</div>
      <p>${esc(u.title)}</p>
      <p>${msg}</p>
      <div>${filas}</div>
      <p class="pcap">Test hecho el ${fecha}. «Empezar aquí» marca como pasadas las unidades anteriores a esa. Si prefieres no hacerlo, empieza desde el principio y no cambia nada.</p>
      <button class="btn" onclick="estAplicar()">Empezar aquí</button>
      <button class="btn ghost" onclick="estDesdeInicio()">Empezar desde el principio</button>
    </div>`;
}

// ---------- enrutado ----------
function render(){
  if (!HAY_SESION) { pintarEntrada(); return; }          // sin sesión no se muestra nada más que la entrada
  document.body.classList.remove('sin-sesion');
  logrosInicio();
  const h = (location.hash || '#/').slice(2).split('/');
  const app = document.getElementById('app');
  let html;
  if (h[0] === 'level') html = viewLevel(h[1]);
  else if (h[0] === 'codigos') html = esAdmin() ? '<div class="leccion">' + viewCodigos() + '</div>' : viewHome();      // solo existe para el administrador
  else if (h[0] === 'emparejar') html = '<div class="leccion">' + viewEmparejar(h[1]) + '</div>';
  else if (h[0] === 'desafio') { if (!h[1]) desCancelar(); html = '<div class="leccion">' + viewDesafio(h[1]) + '</div>'; }
  else if (h[0] === 'descargas') html = '<div class="leccion">' + viewDescargas() + '</div>';
  else if (h[0] === 'logros') html = '<div class="leccion">' + viewLogros() + '</div>';
  else if (h[0] === 'semana') html = '<div class="leccion">' + viewSemana() + '</div>';
  else if (h[0] === 'glosario') html = '<div class="leccion">' + (h[1] ? viewGlosario(h[1]) : viewGlosarioNiveles()) + '</div>';
  else if (h[0] === 'mapa') html = h[1] ? viewMapa(h[1]) : viewMapaNiveles();
  else if (h[0] === 'unit') html = viewUnit(h[1]);
  else if (h[0] === 'lesson') html = '<div class="leccion">' + viewLesson(h[1], +h[2]) + '</div>';
  else if (h[0] === 'empezar') { if (!EX || !EX.est) startEst(); html = viewEst(); }
  else if (h[0] === 'sugerencia') html = viewSugerencia();
  else if (h[0] === 'copia') { COPIA = {pend: null, msg: null}; html = '<div class="leccion">' + viewCopia() + '</div>'; }
  else if (h[0] === 'errores') { ERR_CONFIRMAR = false; html = '<div class="leccion">' + viewErrores() + '</div>'; }
  else if (h[0] === 'repaso') { if (!REP) empezarRepaso(); html = '<div class="leccion">' + viewRepaso() + '</div>'; }
  else if (h[0] === 'instalar') html = '<div class="leccion">' + viewInstalar() + '</div>';
  else if (h[0] === 'dificiles') html = '<div class="leccion">' + viewDificiles() + '</div>';
  else if (h[0] === 'exam') { if (!EX || EX.uid !== h[1]) startExam(h[1]); html = '<div class="examen">' + viewExam() + '</div>'; }
  else html = viewHome();
  app.innerHTML = html;
  stats();
  try { descHome(); } catch(e){}
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/desafio')) desCancelar(); });   // salir a mitad: se cancela y no se guarda nada
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#/exam') && !location.hash.startsWith('#/empezar')) EX = null; if (!location.hash.startsWith('#/repaso')) REP = null; render(); });
render();

// Modo app: permite instalarla y usarla sin conexión
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
