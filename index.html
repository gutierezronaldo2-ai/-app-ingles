lar", "sections": [{"key": "Lectura de repaso", "items": ["I've been feeling tired lately. Doctors say that sleep is essential. I try to exercise three times a week and eat more vegetables."]}, {"key": "Repaso", "items": ["síntomas, medicinas, *should* / *ought to*, *had better*, *should have*, hábitos de salud."]}, {"key": "Actividad de habla", "items": ["describe un síntoma y pide consejo a un amigo (*What should I do?*). Él te responde con *You should...* o *You'd better...*."]}, {"key": "Actividad escrita", "items": ["escribe 6 consejos para una persona con estrés (usa *should*, *ought to* y *had better*)."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 cough, 2 pharmacy, 3 should, 4 rest, 5 have, 6 reduce, 7 prescription, 8 ought to, 9 recover, 10 shouldn't"]}], "exercise": null}], "exam": [{"stem": "I have a bad ___.", "options": ["cough", "coffee"], "answer": "cough"}, {"stem": "I need to go to the ___ to buy the medicine.", "options": ["pharmacy", "library"], "answer": "pharmacy"}, {"stem": "You ___ drink more water.", "options": ["should", "shall"], "answer": "should"}, {"stem": "You'd better ___ today.", "options": ["rest", "to rest"], "answer": "rest"}, {"stem": "I should ___ slept more last night.", "options": ["have", "has"], "answer": "have"}, {"stem": "Regular exercise helps you ___ stress.", "options": ["reduce", "reducing"], "answer": "reduce"}, {"stem": "The doctor wrote me a ___.", "options": ["prescription", "description"], "answer": "prescription"}, {"stem": "You ___ see a doctor.", "options": ["ought to", "ought"], "answer": "ought to"}, {"stem": "I feel better, but I still need to ___.", "options": ["recover", "recovery"], "answer": "recover"}, {"stem": "He ___ eat so much fast food. It is bad.", "options": ["shouldn't", "didn't"], "answer": "shouldn't"}]}, {"id": "b2-u8", "level": "B2", "num": 8, "title": "Consumo y dinero", "meta": "hablar de gastos, ahorros, deudas y compras con too, enough, such y so.", "lessons": [{"n": 1, "title": "Ahorrar y gastar (save, spend)", "sections": [{"key": "Tema", "items": ["hablar de cómo gestionas tu dinero."]}, {"key": "Vocabulario", "items": ["save (ahorrar), spend (gastar), budget (presupuesto), holiday (vacaciones), waste (desperdiciar)"]}, {"key": "Lectura", "items": ["I want to save money for a holiday. I try not to waste money on things I don't need."]}, {"key": "Notas", "items": ["*save* = guardar dinero. *spend* = gastar dinero (*spend money on*).", "*waste* = gastar algo mal o sin necesidad."]}, {"key": "Ejercicio", "items": ["I want to ___ money for a holiday. (save / waste) → **save**"]}, {"key": "Habla", "items": ["\"I try to ___ money on ___.\""]}], "exercise": {"stem": "I want to ___ money for a holiday.", "options": ["save", "waste"], "answer": "save"}}, {"n": 2, "title": "Prestar y pedir prestado (lend, borrow)", "sections": [{"key": "Tema", "items": ["hablar de dar o pedir dinero."]}, {"key": "Vocabulario", "items": ["lend (prestar, dar), borrow (pedir prestado), debt (deuda), loan (préstamo), bank (banco)"]}, {"key": "Lectura", "items": ["He borrowed money from the bank. Can you lend me ten euros?"]}, {"key": "Notas", "items": ["*lend* = tú das dinero a otra persona: *Can you lend me...?*", "*borrow* = tú recibes dinero de otra persona: *Can I borrow...?*"]}, {"key": "Ejercicio", "items": ["Can you ___ me ten euros? (lend / borrow) → **lend**"]}, {"key": "Habla", "items": ["\"Can I borrow ___? Can you lend me ___?\""]}], "exercise": {"stem": "Can you ___ me ten euros?", "options": ["lend", "borrow"], "answer": "lend"}}, {"n": 3, "title": "Pagar cosas (afford, cost, bill)", "sections": [{"key": "Tema", "items": ["decir si puedes pagar algo y cuánto cuesta."]}, {"key": "Vocabulario", "items": ["afford (poder pagar), cost (costar), bill (factura), price (precio), phone (teléfono)"]}, {"key": "Lectura", "items": ["I can't afford a new phone this year. The bill was higher than usual."]}, {"key": "Notas", "items": ["*afford* = tener dinero suficiente para pagar algo.", "*cost* = el precio de algo: *It costs ten euros*.", "*bill* = factura de luz, agua, teléfono, etc."]}, {"key": "Ejercicio", "items": ["I can't ___ a new phone this year. (afford / cost) → **afford**"]}, {"key": "Habla", "items": ["\"I can't afford ___. It costs ___.\""]}], "exercise": {"stem": "I can't ___ a new phone this year.", "options": ["afford", "cost"], "answer": "afford"}}, {"n": 4, "title": "Too y enough", "sections": [{"key": "Tema", "items": ["decir que algo es demasiado o suficiente."]}, {"key": "Vocabulario", "items": ["expensive (caro), cheap (barato), enough (suficiente), too (demasiado), money (dinero)"]}, {"key": "Lectura", "items": ["The price is too high. I don't have enough money for the trip."]}, {"key": "Notas", "items": ["*too* + adjetivo: *too expensive* = demasiado caro.", "*adjetivo + enough*: *cheap enough* = lo bastante barato.", "*enough* + sustantivo: *enough money* = suficiente dinero."]}, {"key": "Ejercicio", "items": ["The phone is too ___. (expensive / expensively) → **expensive**"]}, {"key": "Habla", "items": ["\"It's too ___. I don't have enough ___.\""]}], "exercise": {"stem": "The phone is too ___.", "options": ["expensive", "expensively"], "answer": "expensive"}}, {"n": 5, "title": "Descuentos y devoluciones (discount, refund, receipt)", "sections": [{"key": "Tema", "items": ["hablar de compras, ofertas y devoluciones."]}, {"key": "Vocabulario", "items": ["discount (descuento), refund (devolución de dinero), receipt (ticket de compra), broken (roto), shop (tienda)"]}, {"key": "Lectura", "items": ["I asked for a refund because the shoes were broken. Keep the receipt in case you want a refund."]}, {"key": "Notas", "items": ["*discount* = descuento. *refund* = devolver el dinero.", "*receipt* = el ticket o la factura de la compra."]}, {"key": "Ejercicio", "items": ["Keep the ___ in case you want a refund. (receipt / recipe) → **receipt**"]}, {"key": "Habla", "items": ["\"I asked for a ___ because ___.\""]}], "exercise": {"stem": "Keep the ___ in case you want a refund.", "options": ["receipt", "recipe"], "answer": "receipt"}}, {"n": 6, "title": "So y such", "sections": [{"key": "Tema", "items": ["dar énfasis a una frase."]}, {"key": "Vocabulario", "items": ["such (tal, tan), so (tan), deal (oferta, trato), busy (ocupado), waited (esperamos)"]}, {"key": "Lectura", "items": ["It was such a good deal that I bought two. The shop was so busy that we waited an hour."]}, {"key": "Notas", "items": ["*so + adjetivo* (*so busy*) o *so + adverbio*.", "*such + a/an + adjetivo + sustantivo* (*such a good deal*).", "Las dos suelen ir con *that*: *so busy that*, *such a good deal that*."]}, {"key": "Ejercicio", "items": ["It was ___ a good deal that I bought two. (such / so) → **such**"]}, {"key": "Habla", "items": ["\"It was so ___ that ___. It was such a ___.\""]}], "exercise": {"stem": "It was ___ a good deal that I bought two.", "options": ["such", "so"], "answer": "such"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I try to save money every month. I set up a budget and cut back on eating out. Credit cards can get you into debt quickly."]}, {"key": "Repaso", "items": ["ahorrar y gastar, *lend* vs. *borrow*, *afford*, *cost*, *bill*, *too* / *enough*, descuentos y devoluciones, *so* / *such*."]}, {"key": "Actividad de habla", "items": ["cuenta una compra que hiciste y si valió la pena (*It was such a good buy that...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases sobre tu presupuesto mensual usando *too*, *enough* y *afford*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 save, 2 lend, 3 afford, 4 expensive, 5 receipt, 6 such, 7 borrowed, 8 too much, 9 that, 10 enough"]}], "exercise": null}], "exam": [{"stem": "I want to ___ money for a holiday.", "options": ["save", "waste"], "answer": "save"}, {"stem": "Can you ___ me ten euros?", "options": ["lend", "borrow"], "answer": "lend"}, {"stem": "I can't ___ a new phone this year.", "options": ["afford", "cost"], "answer": "afford"}, {"stem": "The phone is too ___.", "options": ["expensive", "expensively"], "answer": "expensive"}, {"stem": "Keep the ___ in case you want a refund.", "options": ["receipt", "recipe"], "answer": "receipt"}, {"stem": "It was ___ a good deal that I bought two.", "options": ["such", "so"], "answer": "such"}, {"stem": "He ___ money from the bank to buy a car.", "options": ["borrowed", "lent"], "answer": "borrowed"}, {"stem": "She has ___ debt that she can't pay.", "options": ["too much", "too many"], "answer": "too much"}, {"stem": "The shop was so busy ___ we waited an hour.", "options": ["that", "which"], "answer": "that"}, {"stem": "I don't have ___ money for the trip.", "options": ["enough", "enoughly"], "answer": "enough"}]}, {"id": "b2-u9", "level": "B2", "num": 9, "title": "Phrasal verbs de uso diario", "meta": "entender y usar los phrasal verbs más comunes en la vida diaria.", "lessons": [{"n": 1, "title": "Look up y look after", "sections": [{"key": "Tema", "items": ["dos phrasal verbs muy usados."]}, {"key": "Vocabulario", "items": ["look up (buscar en un libro o internet), look after (cuidar), dictionary (diccionario), grandparents (abuelos), word (palabra)"]}, {"key": "Lectura", "items": ["I looked up the word in the dictionary. She looks after her grandparents every weekend."]}, {"key": "Notas", "items": ["*look up* = buscar información (en diccionario, internet).", "*look after* = cuidar de alguien o algo.", "*look at* = mirar. Es distinto de *look up*."]}, {"key": "Ejercicio", "items": ["I'll ___ the word in the dictionary. (look up / look at) → **look up**"]}, {"key": "Habla", "items": ["\"I look after ___. I look up ___ when I don't know it.\""]}], "exercise": {"stem": "I'll ___ the word in the dictionary.", "options": ["look up", "look at"], "answer": "look up"}}, {"n": 2, "title": "Give up y give back", "sections": [{"key": "Tema", "items": ["hablar de rendirse o devolver algo."]}, {"key": "Vocabulario", "items": ["give up (rendirse, dejar de hacer algo), give back (devolver), smoking (fumar), try (intentar), book (libro)"]}, {"key": "Lectura", "items": ["Don't give up! You can do it. Please give back the book when you finish."]}, {"key": "Notas", "items": ["*give up* = dejar de intentar o de hacer algo.", "*give back* = devolver algo a su dueño."]}, {"key": "Ejercicio", "items": ["He decided to ___ smoking. (give up / give back) → **give up**"]}, {"key": "Habla", "items": ["\"I want to give up ___.\""]}], "exercise": {"stem": "He decided to ___ smoking.", "options": ["give up", "give back"], "answer": "give up"}}, {"n": 3, "title": "Put off y put on", "sections": [{"key": "Tema", "items": ["aplazar algo y ponerte algo encima."]}, {"key": "Vocabulario", "items": ["put off (aplazar), put on (ponerse, poner), meeting (reunión), party (fiesta), coat (abrigo)"]}, {"key": "Lectura", "items": ["We had to put off the party until next week. Please put on your coat before going out."]}, {"key": "Notas", "items": ["*put off* = dejar algo para más tarde. Sinónimo: *postpone*.", "*put on* = ponerte ropa o encender algo (*put on the light*)."]}, {"key": "Ejercicio", "items": ["We had to ___ the party until next week. (put off / put on) → **put off**"]}, {"key": "Habla", "items": ["\"I'll put off ___ until ___.\""]}], "exercise": {"stem": "We had to ___ the party until next week.", "options": ["put off", "put on"], "answer": "put off"}}, {"n": 4, "title": "Turn down y turn up", "sections": [{"key": "Tema", "items": ["rechazar una oferta y subir el volumen o aparecer."]}, {"key": "Vocabulario", "items": ["turn down (rechazar, bajar), turn up (subir, aparecer), job (trabajo), offer (oferta), music (música)"]}, {"key": "Lectura", "items": ["She turned down the job offer. Can you turn down the music? It's too loud."]}, {"key": "Notas", "items": ["*turn down* = rechazar (*turn down an offer*) o bajar el volumen.", "*turn up* = subir el volumen o aparecer (*he turned up late*)."]}, {"key": "Ejercicio", "items": ["Can you ___ the TV? I can't hear it. (turn up / turn out) → **turn up**"]}, {"key": "Habla", "items": ["\"I turned down ___. Can you turn ___?\""]}], "exercise": {"stem": "Can you ___ the TV? I can't hear it.", "options": ["turn up", "turn out"], "answer": "turn up"}}, {"n": 5, "title": "Run out of y get on with", "sections": [{"key": "Tema", "items": ["quedarse sin algo y seguir con algo."]}, {"key": "Vocabulario", "items": ["run out of (quedarse sin), get on with (seguir con, llevarse bien), milk (leche), work (trabajo), together (juntos)"]}, {"key": "Lectura", "items": ["We ran out of milk. Can you buy some? I want to get on with my work."]}, {"key": "Notas", "items": ["*run out of* + sustantivo: *run out of milk* = *se acabó la leche*.", "*get on with* = seguir con algo, o llevarse bien con alguien."]}, {"key": "Ejercicio", "items": ["We ran ___ milk. Can you buy some? (out of / out) → **out of**"]}, {"key": "Habla", "items": ["\"We've run out of ___. I get on well with ___.\""]}], "exercise": {"stem": "We ran ___ milk. Can you buy some?", "options": ["out of", "out"], "answer": "out of"}}, {"n": 6, "title": "Come across y find out", "sections": [{"key": "Tema", "items": ["encontrar algo por casualidad y descubrir algo."]}, {"key": "Vocabulario", "items": ["come across (encontrar por casualidad), find out (descubrir, averiguar), photo (foto), box (caja), result (resultado)"]}, {"key": "Lectura", "items": ["I came across an old photo in a box. I want to find out the result."]}, {"key": "Notas", "items": ["*come across* = encontrar algo sin buscarlo.", "*find out* = descubrir o averiguar una información."]}, {"key": "Ejercicio", "items": ["I came ___ an old photo in the box. (across / over) → **across**"]}, {"key": "Habla", "items": ["\"I came across ___. I want to find out ___.\""]}], "exercise": {"stem": "I came ___ an old photo in the box.", "options": ["across", "over"], "answer": "across"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I'll look into the problem tomorrow. Please turn off the lights when you leave. She ran into an old friend at the station."]}, {"key": "Repaso", "items": ["*look up / look after*, *give up / give back*, *put off / put on*, *turn down / turn up*, *run out of / get on with*, *come across / find out*."]}, {"key": "Regla clave", "items": ["si el objeto es un pronombre (*it, them*), va en medio: *turn it down*, *put it off*, *look it up*. No se puede decir *look up it*."]}, {"key": "Actividad de habla", "items": ["di 3 frases con phrasal verbs sobre tu día (*I came across...*, *I put off...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases usando un phrasal verb distinto en cada una."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 look up, 2 looks after, 3 give up, 4 put off, 5 turned down, 6 turn up, 7 out of, 8 across, 9 put on, 10 find out"]}], "exercise": null}], "exam": [{"stem": "I'll ___ the word in the dictionary.", "options": ["look up", "look at"], "answer": "look up"}, {"stem": "She ___ her grandparents every weekend.", "options": ["looks after", "looks for"], "answer": "looks after"}, {"stem": "Don't ___! You can do it.", "options": ["give up", "give back"], "answer": "give up"}, {"stem": "We had to ___ the meeting.", "options": ["put off", "put on"], "answer": "put off"}, {"stem": "She ___ the job offer.", "options": ["turned down", "turned up"], "answer": "turned down"}, {"stem": "Can you ___ the TV? I can't hear it.", "options": ["turn up", "turn out"], "answer": "turn up"}, {"stem": "We ran ___ milk.", "options": ["out of", "out"], "answer": "out of"}, {"stem": "I came ___ an old photo in the box.", "options": ["across", "over"], "answer": "across"}, {"stem": "Please ___ your coat before going out.", "options": ["put on", "put off"], "answer": "put on"}, {"stem": "I need to ___ how the machine works.", "options": ["find out", "find up"], "answer": "find out"}]}, {"id": "b2-u10", "level": "B2", "num": 10, "title": "Opiniones y debate", "meta": "dar opiniones, estar de acuerdo o en desacuerdo, contrastar ideas y cerrar un debate.", "lessons": [{"n": 1, "title": "Expresar opinión (In my opinion, I think, I believe)", "sections": [{"key": "Tema", "items": ["decir lo que piensas de forma clara."]}, {"key": "Vocabulario", "items": ["opinion (opinión), believe (creer), film (película), long (largo), cities (ciudades)"]}, {"key": "Lectura", "items": ["In my opinion, cities should have more parks. I believe the film was too long."]}, {"key": "Notas", "items": ["*In my opinion* = en mi opinión.", "*I think / I believe* = creo que. *believe* suena un poco más formal."]}, {"key": "Ejercicio", "items": ["___ my opinion, the film was too long. (In / On) → **In**"]}, {"key": "Habla", "items": ["\"In my opinion, ___. I think ___.\""]}], "exercise": {"stem": "___ my opinion, the film was too long.", "options": ["In", "On"], "answer": "In"}}, {"n": 2, "title": "Estar de acuerdo o en desacuerdo (agree, disagree)", "sections": [{"key": "Tema", "items": ["responder a la opinión de otra persona."]}, {"key": "Vocabulario", "items": ["agree (estar de acuerdo), disagree (no estar de acuerdo), point (punto), completely (completamente), afraid (me temo)"]}, {"key": "Lectura", "items": ["I completely agree with you on that point. I'm afraid I disagree."]}, {"key": "Notas", "items": ["*agree with* + persona: *I agree with you*.", "*disagree with*: *I disagree with him*.", "*I'm afraid* suaviza el desacuerdo: es más educado."]}, {"key": "Ejercicio", "items": ["I completely ___ with you on that point. (agree / agree to) → **agree**"]}, {"key": "Habla", "items": ["\"I (completely) agree with ___. I'm afraid I disagree.\""]}], "exercise": {"stem": "I completely ___ with you on that point.", "options": ["agree", "agree to"], "answer": "agree"}}, {"n": 3, "title": "Contrastar ideas (although, but, however)", "sections": [{"key": "Tema", "items": ["decir algo bueno y algo malo en la misma frase."]}, {"key": "Vocabulario", "items": ["although (aunque), however (sin embargo), but (pero), expensive (caro), worth it (vale la pena)"]}, {"key": "Lectura", "items": ["Although it is expensive, it is worth it. I see your point, but I disagree."]}, {"key": "Notas", "items": ["*Although + frase*, *frase*. No se usa *but* con *although* en la misma frase.", "*However* va al inicio de una frase nueva o entre comas: *However, ...*."]}, {"key": "Ejercicio", "items": ["___ it is expensive, it is worth it. (Although / Because) → **Although**"]}, {"key": "Habla", "items": ["\"Although ___, I ___.\""]}], "exercise": {"stem": "___ it is expensive, it is worth it.", "options": ["Although", "Because"], "answer": "Although"}}, {"n": 4, "title": "Matizar (It depends, To be honest)", "sections": [{"key": "Tema", "items": ["dar una respuesta sin ser absoluto."]}, {"key": "Vocabulario", "items": ["depends (depende), honest (honesto), sure (seguro), situation (situación), to some extent (hasta cierto punto)"]}, {"key": "Lectura", "items": ["It depends on the situation. To be honest, I'm not sure."]}, {"key": "Notas", "items": ["*It depends on...* = depende de...", "*To be honest* = para ser sincero.", "*to some extent* = hasta cierto punto."]}, {"key": "Ejercicio", "items": ["To be ___, I don't like it. (honest / honestly) → **honest**"]}, {"key": "Habla", "items": ["\"It depends on ___. To be honest, ___.\""]}], "exercise": {"stem": "To be ___, I don't like it.", "options": ["honest", "honestly"], "answer": "honest"}}, {"n": 5, "title": "Argumentar (because, so, first, second)", "sections": [{"key": "Tema", "items": ["dar razones para tu opinión."]}, {"key": "Vocabulario", "items": ["because (porque), so (así que), first (primero), second (segundo), saves (ahorra)"]}, {"key": "Lectura", "items": ["The city should ban cars because it reduces pollution. First, it saves money. Second, it helps the planet."]}, {"key": "Notas", "items": ["*because* + razón. *so* + consecuencia.", "Ordena tus razones con *First, Second, Finally*."]}, {"key": "Ejercicio", "items": ["The city should ban cars ___ it reduces pollution. (because / although) → **because**"]}, {"key": "Habla", "items": ["\"First, ___. Second, ___.\""]}], "exercise": {"stem": "The city should ban cars ___ it reduces pollution.", "options": ["because", "although"], "answer": "because"}}, {"n": 6, "title": "Cerrar un debate (In conclusion, To sum up)", "sections": [{"key": "Tema", "items": ["terminar tu argumento con un resumen."]}, {"key": "Vocabulario", "items": ["conclusion (conclusión), sum up (resumir), both sides (ambos lados), good points (buenos puntos), act (actuar)"]}, {"key": "Lectura", "items": ["To sum up, both sides have good points. In conclusion, we need to act now."]}, {"key": "Notas", "items": ["*In conclusion* = en conclusión.", "*To sum up* = para resumir.", "*On the other hand* = por otro lado (para contrastar)."]}, {"key": "Ejercicio", "items": ["In ___, we need to act now. (conclusion / conclude) → **conclusion**"]}, {"key": "Habla", "items": ["\"To sum up, ___.\""]}], "exercise": {"stem": "In ___, we need to act now.", "options": ["conclusion", "conclude"], "answer": "conclusion"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["In my opinion, schools should teach more practical skills. I see your point, but I disagree about the homework. Let's agree to differ."]}, {"key": "Repaso", "items": ["opinión (*In my opinion*), acuerdo y desacuerdo, contraste (*although, however*), matices (*It depends*), argumentos (*because, first, second*), cierre (*In conclusion*)."]}, {"key": "Actividad de habla", "items": ["da tu opinión sobre un tema (la tecnología, el trabajo, la ciudad). Usa al menos *In my opinion*, *although* y *To sum up*."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo corto (6 frases) con tu opinión sobre un tema y cierra con *In conclusion*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 In, 2 agree, 3 but, 4 Although, 5 on, 6 honest, 7 because, 8 In, 9 On, 10 up"]}], "exercise": null}], "exam": [{"stem": "___ my opinion, the film was too long.", "options": ["In", "On"], "answer": "In"}, {"stem": "I completely ___ with you on that point.", "options": ["agree", "agree to"], "answer": "agree"}, {"stem": "I see your point, ___ I disagree.", "options": ["but", "so"], "answer": "but"}, {"stem": "___ it is expensive, it is worth it.", "options": ["Although", "Because"], "answer": "Although"}, {"stem": "It depends ___ the situation.", "options": ["on", "in"], "answer": "on"}, {"stem": "To be ___, I'm not sure.", "options": ["honest", "honestly"], "answer": "honest"}, {"stem": "The city should ban cars ___ it reduces pollution.", "options": ["because", "although"], "answer": "because"}, {"stem": "___ conclusion, we need to act now.", "options": ["In", "On"], "answer": "In"}, {"stem": "___ the other hand, it could be expensive.", "options": ["On", "In"], "answer": "On"}, {"stem": "To sum ___, both sides have good points.", "options": ["up", "out"], "answer": "up"}]}, {"id": "c1-u1", "level": "C1", "num": 1, "title": "Inversión y énfasis", "meta": "dar énfasis a una frase cambiando el orden de las palabras (inversión).", "lessons": [{"n": 1, "title": "Adverbios negativos al inicio (Never, Rarely, Seldom)", "sections": [{"key": "Tema", "items": ["poner un adverbio negativo al inicio para dar énfasis."]}, {"key": "Vocabulario", "items": ["never (nunca), rarely (raramente), seldom (rara vez), seen (visto), eat out (comer fuera)"]}, {"key": "Lectura", "items": ["Never have I seen such a beautiful view. Rarely do we eat out on weekdays."]}, {"key": "Notas", "items": ["Adverbio negativo al inicio + auxiliar + sujeto + verbo.", "*Never have I seen...* = *Nunca he visto...* (más fuerte que *I have never seen...*).", "Con *do / does / did*: *Rarely do we eat out*."]}, {"key": "Ejercicio", "items": ["Never ___ I seen such a beautiful view. (have / had) → **have**"]}, {"key": "Habla", "items": ["\"Never have I ___. Rarely do I ___.\""]}], "exercise": {"stem": "Never ___ I seen such a beautiful view.", "options": ["have", "had"], "answer": "have"}}, {"n": 2, "title": "Not only... but also", "sections": [{"key": "Tema", "items": ["unir dos ideas positivas con énfasis."]}, {"key": "Vocabulario", "items": ["fast (rápido), cheap (barato), reliable (fiable), not only (no solo), but also (sino también)"]}, {"key": "Lectura", "items": ["Not only is it fast, but it is also very cheap."]}, {"key": "Notas", "items": ["*Not only* + auxiliar + sujeto: *Not only is it...*", "*but also* + el resto de la frase.", "El verbo *to be* se coloca antes del sujeto."]}, {"key": "Ejercicio", "items": ["Not only ___ fast, but also very cheap. (is it / it is) → **is it**"]}, {"key": "Habla", "items": ["\"Not only is ___, but it is also ___.\""]}], "exercise": {"stem": "Not only ___ fast, but also very cheap.", "options": ["is it", "it is"], "answer": "is it"}}, {"n": 3, "title": "No sooner... than, Hardly... when, Scarcely... when", "sections": [{"key": "Tema", "items": ["decir que una cosa pasó justo antes de otra."]}, {"key": "Vocabulario", "items": ["arrived (llegó), sat down (me senté), rain (llover), phone (teléfono), rang (sonó)"]}, {"key": "Lectura", "items": ["No sooner had she arrived than it started to rain. Hardly had I sat down when the phone rang."]}, {"key": "Notas", "items": ["*No sooner had... than* = *apenas... cuando*.", "*Hardly / Scarcely had... when* = *apenas... cuando*.", "Siempre se usa el pasado perfecto (*had* + participio)."]}, {"key": "Ejercicio", "items": ["No sooner had she arrived ___ it started to rain. (than / when) → **than**"]}, {"key": "Habla", "items": ["\"No sooner had I ___ than ___.\""]}], "exercise": {"stem": "No sooner had she arrived ___ it started to rain.", "options": ["than", "when"], "answer": "than"}}, {"n": 4, "title": "Only after / only when / only then", "sections": [{"key": "Tema", "items": ["decir que algo solo pasa después de otra cosa."]}, {"key": "Vocabulario", "items": ["only (solo), exam (examen), relax (relajarse), realised (me di cuenta), mistake (error)"]}, {"key": "Lectura", "items": ["Only after the exam did she relax. Only then did I realise my mistake."]}, {"key": "Notas", "items": ["*Only after / only when / only then* al inicio de la frase.", "Después va auxiliar + sujeto: *Only after the exam did she relax*."]}, {"key": "Ejercicio", "items": ["Only after the exam ___ she relax. (did / could) → **did**"]}, {"key": "Habla", "items": ["\"Only after ___ did I ___.\""]}], "exercise": {"stem": "Only after the exam ___ she relax.", "options": ["did", "could"], "answer": "did"}}, {"n": 5, "title": "Little y seldom en inversión", "sections": [{"key": "Tema", "items": ["dar énfasis con *little* y *seldom*."]}, {"key": "Vocabulario", "items": ["little (poco), seldom (rara vez), realised (se dio cuenta), agreed (aceptó), complain (quejarse)"]}, {"key": "Lectura", "items": ["Little did he know what was coming. Seldom have I heard such honest advice."]}, {"key": "Notas", "items": ["*Little did he know...* = *poco sabía él...* (sirve para ironía o sorpresa).", "*Seldom + auxiliar + sujeto*: *Seldom have I heard...*"]}, {"key": "Ejercicio", "items": ["Seldom ___ we have seen such good service. (have / had) → **have**"]}, {"key": "Habla", "items": ["\"Little did I know...\""]}], "exercise": {"stem": "Seldom ___ we have seen such good service.", "options": ["have", "had"], "answer": "have"}}, {"n": 6, "title": "Inversión condicional (Had I known, Should you need)", "sections": [{"key": "Tema", "items": ["usar inversión en lugar de *if*, en un tono formal."]}, {"key": "Vocabulario", "items": ["known (sabido), traffic (tráfico), left (salido), need (necesitar), call (llamar)"]}, {"key": "Lectura", "items": ["Had I known about the traffic, I would have left earlier. Should you need help, call me."]}, {"key": "Notas", "items": ["*Had I known* = *If I had known* (sin *if*).", "*Should you need* = *If you need* (formal).", "Así se hace la frase más formal y elegante."]}, {"key": "Ejercicio", "items": ["Should you ___ help, call me. (need / needed) → **need**"]}, {"key": "Habla", "items": ["\"Had I known, I would have ___.\""]}], "exercise": {"stem": "Should you ___ help, call me.", "options": ["need", "needed"], "answer": "need"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Never have I seen such a beautiful view. Little did we know what would happen next. Rarely do people admit their mistakes."]}, {"key": "Repaso", "items": ["adverbios negativos al inicio, *not only... but also*, *no sooner... than*, *hardly... when*, *only after / only then*, *little / seldom*, inversión condicional."]}, {"key": "Actividad de habla", "items": ["di 3 frases con inversión sobre tu vida (*Never have I...*, *Only after... did I...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con inversión sobre un tema que te guste."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have, 2 do, 3 than, 4 when, 5 did, 6 would have, 7 need, 8 is it, 9 have we seen, 10 should you open"]}], "exercise": null}], "exam": [{"stem": "Never ___ I seen such a beautiful view.", "options": ["have", "had"], "answer": "have"}, {"stem": "Rarely ___ we eat out on weekdays.", "options": ["do", "are"], "answer": "do"}, {"stem": "No sooner had she arrived ___ it started to rain.", "options": ["than", "when"], "answer": "than"}, {"stem": "Hardly had I sat down ___ the phone rang.", "options": ["when", "than"], "answer": "when"}, {"stem": "Only after the exam ___ she relax.", "options": ["did", "could"], "answer": "did"}, {"stem": "Had I known the traffic, I ___ left earlier.", "options": ["would have", "would"], "answer": "would have"}, {"stem": "Should you ___ help, call me.", "options": ["need", "needed"], "answer": "need"}, {"stem": "Not only ___ fast, but also very cheap.", "options": ["is it", "it is"], "answer": "is it"}, {"stem": "Seldom ___ such good service.", "options": ["we have seen", "have we seen"], "answer": "have we seen"}, {"stem": "Under no circumstances ___ the door.", "options": ["should you open", "you should open"], "answer": "should you open"}]}, {"id": "c1-u2", "level": "C1", "num": 2, "title": "Gerundio e infinitivo avanzados", "meta": "saber cuándo usar *-ing* o *to + verbo*, y cómo cambia el significado según el verbo.", "lessons": [{"n": 1, "title": "Verbos seguidos de -ing (avoid, consider, enjoy, mind)", "sections": [{"key": "Tema", "items": ["usar *-ing* después de verbos como *avoid, consider, enjoy, mind*."]}, {"key": "Vocabulario", "items": ["avoid (evitar), consider (considerar), enjoy (disfrutar), mind (importar, molestar), arriving (llegar)"]}, {"key": "Lectura", "items": ["I avoid arriving late to work. Would you mind opening the window? She enjoys cooking."]}, {"key": "Notas", "items": ["*avoid, consider, enjoy, mind, finish, suggest* + *-ing*.", "*Would you mind* + *-ing* = ¿te importaría...?", "Nunca se usa *to* después de estos verbos."]}, {"key": "Ejercicio", "items": ["I avoid ___ late to work. (arriving / arrive) → **arriving**"]}, {"key": "Habla", "items": ["\"I enjoy ___. I avoid ___.\""]}], "exercise": {"stem": "I avoid ___ late to work.", "options": ["arriving", "arrive"], "answer": "arriving"}}, {"n": 2, "title": "Verbos seguidos de infinitivo (decide, manage, afford, hope)", "sections": [{"key": "Tema", "items": ["usar *to + verbo* después de *decide, manage, afford, hope*."]}, {"key": "Vocabulario", "items": ["decide (decidir), manage (conseguir, lograr), afford (permitirse), hope (esperar), cancel (cancelar)"]}, {"key": "Lectura", "items": ["They decided to cancel the project. We managed to finish on time. I can't afford to buy a house."]}, {"key": "Notas", "items": ["*decide, manage, afford, hope, promise, refuse, agree* + *to*.", "*manage to* = conseguir hacer algo, aunque sea difícil."]}, {"key": "Ejercicio", "items": ["They decided ___ the project. (to cancel / cancelling) → **to cancel**"]}, {"key": "Habla", "items": ["\"I decided to ___. I managed to ___.\""]}], "exercise": {"stem": "They decided ___ the project.", "options": ["to cancel", "cancelling"], "answer": "to cancel"}}, {"n": 3, "title": "Cambio de significado (remember, forget)", "sections": [{"key": "Tema", "items": ["entender por qué cambia el significado con *-ing* o *to*."]}, {"key": "Vocabulario", "items": ["remember (recordar), forget (olvidar), seeing (ver), meet (conocer), post (enviar, correo)"]}, {"key": "Lectura", "items": ["I'll never forget seeing Paris for the first time. Please remember to post the letter."]}, {"key": "Notas", "items": ["*remember / forget + -ing*: se refiere a algo que pasó (recuerdo algo ya hecho).", "*remember / forget + to*: se refiere a algo que hay que hacer (no olvidar hacer algo)."]}, {"key": "Ejercicio", "items": ["I'll never forget ___ Paris. (seeing / to see) → **seeing**"]}, {"key": "Habla", "items": ["\"I remember ___. Don't forget to ___.\""]}], "exercise": {"stem": "I'll never forget ___ Paris.", "options": ["seeing", "to see"], "answer": "seeing"}}, {"n": 4, "title": "Stop (stop + -ing vs. stop to)", "sections": [{"key": "Tema", "items": ["diferenciar *stop -ing* y *stop to*."]}, {"key": "Vocabulario", "items": ["stop (parar), answer (responder), phone (teléfono), walking (caminando), smoking (fumar)"]}, {"key": "Lectura", "items": ["She stopped walking to answer her phone. He stopped smoking last year."]}, {"key": "Notas", "items": ["*stop + -ing* = dejar de hacer algo (*stopped smoking*).", "*stop to + verbo* = parar lo que haces para hacer otra cosa (*stopped to answer*)."]}, {"key": "Ejercicio", "items": ["She stopped ___ to answer her phone. (walking / to walk) → **walking**"]}, {"key": "Habla", "items": ["\"I stopped ___. I stopped to ___.\""]}], "exercise": {"stem": "She stopped ___ to answer her phone.", "options": ["walking", "to walk"], "answer": "walking"}}, {"n": 5, "title": "Try (try to vs. try + -ing)", "sections": [{"key": "Tema", "items": ["diferenciar *try to* y *try + -ing*."]}, {"key": "Vocabulario", "items": ["try (intentar, probar), open (abrir), stuck (atascado), new (nuevo), food (comida)"]}, {"key": "Lectura", "items": ["I tried to open the window, but it was stuck. Try using the new app."]}, {"key": "Notas", "items": ["*try to + verbo* = intentar algo (puede que no funcione).", "*try + -ing* = probar algo para ver qué pasa (un experimento)."]}, {"key": "Ejercicio", "items": ["I tried ___ the window, but it was stuck. (opening / to open) → **to open**"]}, {"key": "Habla", "items": ["\"I tried to ___. I tried ___ to see.\""]}], "exercise": {"stem": "I tried ___ the window, but it was stuck.", "options": ["opening", "to open"], "answer": "to open"}}, {"n": 6, "title": "Preposición + -ing (interested in, good at, instead of)", "sections": [{"key": "Tema", "items": ["usar *-ing* después de preposiciones."]}, {"key": "Vocabulario", "items": ["interested (interesado), good at (bueno en), instead of (en vez de), languages (idiomas), watch (ver)"]}, {"key": "Lectura", "items": ["She is good at learning languages. Instead of watching TV, we went for a walk."]}, {"key": "Notas", "items": ["Después de una preposición siempre va *-ing*: *good at learning*, *interested in reading*.", "Nunca se usa *to + verbo* después de una preposición."]}, {"key": "Ejercicio", "items": ["She is good at ___ languages. (learning / to learn) → **learning**"]}, {"key": "Habla", "items": ["\"I'm interested in ___. I'm good at ___.\""]}], "exercise": {"stem": "She is good at ___ languages.", "options": ["learning", "to learn"], "answer": "learning"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I avoid driving in the city centre. She considered moving abroad. We enjoy cooking together. He doesn't mind waiting."]}, {"key": "Repaso", "items": ["verbos + *-ing*, verbos + *to*, *remember / forget*, *stop*, *try*, preposición + *-ing*."]}, {"key": "Actividad de habla", "items": ["di 3 cosas que disfrutas hacer, 2 cosas que decidiste hacer y 1 cosa que evitas."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases usando *remember to / remember -ing* y *stop -ing / stop to*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 arriving, 2 to cancel, 3 seeing, 4 walking, 5 to open, 6 learning, 7 watching, 8 to buy, 9 taking, 10 seeing"]}], "exercise": null}], "exam": [{"stem": "I avoid ___ late to work.", "options": ["arriving", "arrive"], "answer": "arriving"}, {"stem": "They decided ___ the project.", "options": ["to cancel", "cancelling"], "answer": "to cancel"}, {"stem": "I'll never forget ___ Paris.", "options": ["seeing", "to see"], "answer": "seeing"}, {"stem": "She stopped ___ to answer her phone.", "options": ["walking", "to walk"], "answer": "walking"}, {"stem": "I tried ___ the window, but it was stuck.", "options": ["opening", "to open"], "answer": "to open"}, {"stem": "She is good at ___ languages.", "options": ["learning", "to learn"], "answer": "learning"}, {"stem": "Instead of ___ TV, we went for a walk.", "options": ["watching", "to watch"], "answer": "watching"}, {"stem": "I can't afford ___ a new car.", "options": ["to buy", "buying"], "answer": "to buy"}, {"stem": "He suggested ___ a taxi.", "options": ["taking", "to take"], "answer": "taking"}, {"stem": "We look forward to ___ you.", "options": ["seeing", "see"], "answer": "seeing"}]}, {"id": "c1-u3", "level": "C1", "num": 3, "title": "Modales en pasado", "meta": "hablar de lo que pasó, lo que probablemente pasó y lo que debiste hacer, con modales en pasado.", "lessons": [{"n": 1, "title": "Deducciones sobre el pasado (must have, can't have)", "sections": [{"key": "Tema", "items": ["decir qué crees que pasó, usando lo que ves ahora."]}, {"key": "Vocabulario", "items": ["lights (luces), home (en casa), passed (aprobado), studied (estudió), hard (duro)"]}, {"key": "Lectura", "items": ["The lights were on, so he must have been home. He studied hard, so he must have passed."]}, {"key": "Notas", "items": ["*must have* + participio = seguro que pasó (deducción positiva).", "*can't have* + participio = seguro que no pasó (deducción negativa).", "*can't have* nunca se usa para algo positivo."]}, {"key": "Ejercicio", "items": ["The lights were on, so he must ___ home. (have been / be) → **have been**"]}, {"key": "Habla", "items": ["\"She must have ___. She can't have ___.\""]}], "exercise": {"stem": "The lights were on, so he must ___ home.", "options": ["have been", "be"], "answer": "have been"}}, {"n": 2, "title": "Posibilidades en el pasado (might have, could have)", "sections": [{"key": "Tema", "items": ["decir que algo quizá pasó, pero no seguro."]}, {"key": "Vocabulario", "items": ["might (quizá), could (podría), keys (llaves), office (oficina), left (dejado)"]}, {"key": "Lectura", "items": ["I might have left the keys at the office. He could have missed the bus."]}, {"key": "Notas", "items": ["*might have* / *could have* + participio = quizá (sin estar seguro).", "*might* y *could* son parecidos aquí, pero *might* suena más incierto."]}, {"key": "Ejercicio", "items": ["I ___ have left the keys at the office. (might / must) → **might**"]}, {"key": "Habla", "items": ["\"I might have ___. He could have ___.\""]}], "exercise": {"stem": "I ___ have left the keys at the office.", "options": ["might", "must"], "answer": "might"}}, {"n": 3, "title": "Críticas y arrepentimientos (should have, shouldn't have)", "sections": [{"key": "Tema", "items": ["decir lo que debiste o no debiste hacer."]}, {"key": "Vocabulario", "items": ["should have (debiste haber), shouldn't have (no debiste haber), told (dicho), help (ayudar), called (llamado)"]}, {"key": "Lectura", "items": ["You should have told me! I would have helped. I shouldn't have said that."]}, {"key": "Notas", "items": ["*should have* + participio = debiste haber hecho algo (y no lo hiciste).", "*shouldn't have* + participio = no debiste haber hecho algo (y lo hiciste)."]}, {"key": "Ejercicio", "items": ["You ___ told me! I would have helped. (should have / should) → **should have**"]}, {"key": "Habla", "items": ["\"I should have ___. I shouldn't have ___.\""]}], "exercise": {"stem": "You ___ told me! I would have helped.", "options": ["should have", "should"], "answer": "should have"}}, {"n": 4, "title": "Innecesario (needn't have)", "sections": [{"key": "Tema", "items": ["decir que hiciste algo que no era necesario."]}, {"key": "Vocabulario", "items": ["needn't (no hacía falta), umbrella (paraguas), sun (sol), came out (salió), bought (comprado)"]}, {"key": "Lectura", "items": ["I needn't have brought an umbrella. The sun came out."]}, {"key": "Notas", "items": ["*needn't have* + participio = hiciste algo que no era necesario (pero lo hiciste).", "No confundir con *mustn't* (prohibición)."]}, {"key": "Ejercicio", "items": ["I ___ have brought an umbrella. The sun came out. (needn't / mustn't) → **needn't**"]}, {"key": "Habla", "items": ["\"I needn't have ___.\""]}], "exercise": {"stem": "I ___ have brought an umbrella. The sun came out.", "options": ["needn't", "mustn't"], "answer": "needn't"}}, {"n": 5, "title": "Deducción negativa en el pasado (can't have, couldn't have)", "sections": [{"key": "Tema", "items": ["decir que algo no pudo pasar, según la evidencia."]}, {"key": "Vocabulario", "items": ["passed (aprobado), studied (estudió), angry (enfadada), laughing (riendo), invited (invitados)"]}, {"key": "Lectura", "items": ["He can't have passed the exam. She can't have been angry. They couldn't have gone to the party."]}, {"key": "Notas", "items": ["*can't have* = seguro que no pasó (muy probable).", "*couldn't have* = no era posible que pasara."]}, {"key": "Ejercicio", "items": ["She ___ have been angry. She was laughing. (can't / needn't) → **can't**"]}, {"key": "Habla", "items": ["\"He can't have ___. They couldn't have ___.\""]}], "exercise": {"stem": "She ___ have been angry. She was laughing.", "options": ["can't", "needn't"], "answer": "can't"}}, {"n": 6, "title": "Hábitos del pasado (used to, would)", "sections": [{"key": "Tema", "items": ["hablar de hábitos o situaciones que ya no pasan."]}, {"key": "Vocabulario", "items": ["used to (solíamos), would (solía), kids (niños), summer (verano), go (ir)"]}, {"key": "Lectura", "items": ["We used to go to the beach every summer when we were kids. My father would tell us stories every night."]}, {"key": "Notas", "items": ["*used to* + verbo = hábito o situación del pasado que ya no existe.", "*would* + verbo = solo para hábitos (no para estados como *be, have*).", "Ojo: *use to* está mal escrito. Siempre es *used to*."]}, {"key": "Ejercicio", "items": ["We ___ go to the beach every summer. (used to / use to) → **used to**"]}, {"key": "Habla", "items": ["\"I used to ___. I would ___ when I was a kid.\""]}], "exercise": {"stem": "We ___ go to the beach every summer.", "options": ["used to", "use to"], "answer": "used to"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["They must have left early, because the house is empty. You needn't have brought a gift. She might have been ill."]}, {"key": "Repaso", "items": ["*must have, can't have, might have, could have, should have, shouldn't have, needn't have, used to / would*."]}, {"key": "Actividad de habla", "items": ["di 2 deducciones sobre algo que ves ahora (*He must have...*) y 2 arrepentimientos de tu pasado (*I should have...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con modales en pasado sobre una historia real o inventada."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have been, 2 might, 3 should have, 4 needn't, 5 can't, 6 used to, 7 should, 8 can't, 9 couldn't, 10 stay"]}], "exercise": null}], "exam": [{"stem": "The lights were on, so he must ___ home.", "options": ["have been", "be"], "answer": "have been"}, {"stem": "I ___ have left the keys at the office.", "options": ["might", "must"], "answer": "might"}, {"stem": "You ___ told me! I would have helped.", "options": ["should have", "should"], "answer": "should have"}, {"stem": "I ___ have brought an umbrella. The sun came out.", "options": ["needn't", "mustn't"], "answer": "needn't"}, {"stem": "He ___ have passed the exam; he studied hard.", "options": ["can't", "mustn't"], "answer": "can't"}, {"stem": "We ___ go to the beach every summer when we were kids.", "options": ["used to", "use to"], "answer": "used to"}, {"stem": "I ___ have called you, but I forgot my phone.", "options": ["should", "must"], "answer": "should"}, {"stem": "She ___ have been angry. She was laughing.", "options": ["can't", "needn't"], "answer": "can't"}, {"stem": "They ___ have gone to the party. They weren't invited.", "options": ["couldn't", "can't"], "answer": "couldn't"}, {"stem": "I'd rather ___ at home than go out tonight.", "options": ["stay", "stayed"], "answer": "stay"}]}, {"id": "c1-u4", "level": "C1", "num": 4, "title": "Condicionales mixtos", "meta": "hablar de una condición del pasado con un resultado en el presente, y al revés.", "lessons": [{"n": 1, "title": "Condicional mixto, pasado → presente", "sections": [{"key": "Tema", "items": ["una acción pasada que cambia el presente."]}, {"key": "Vocabulario", "items": ["studied (estudiado), law (derecho), lawyer (abogado), now (ahora), rich (rico)"]}, {"key": "Lectura", "items": ["If I had studied law, I would be a lawyer now."]}, {"key": "Notas", "items": ["*If* + past perfect (pasado), *would* + verbo (presente).", "Úsalo cuando la causa es pasada y el resultado es ahora."]}, {"key": "Ejercicio", "items": ["If I had studied law, I ___ a lawyer now. (would be / would have been) → **would be**"]}, {"key": "Habla", "items": ["\"If I had ___, I would be ___ now.\""]}], "exercise": {"stem": "If I had studied law, I ___ a lawyer now.", "options": ["would be", "would have been"], "answer": "would be"}}, {"n": 2, "title": "Condicional mixto, presente → pasado", "sections": [{"key": "Tema", "items": ["una situación actual que cambió algo en el pasado."]}, {"key": "Vocabulario", "items": ["shy (tímido), asked (pedí), out (salir con alguien), last night (anoche), careful (cuidadoso)"]}, {"key": "Lectura", "items": ["If I weren't so shy, I would have asked her out last night."]}, {"key": "Notas", "items": ["*If* + past simple (presente), *would have* + participio (pasado).", "Úsalo cuando la causa es actual y el resultado fue en el pasado."]}, {"key": "Ejercicio", "items": ["If I weren't so shy, I ___ asked her out last night. (would have / would) → **would have**"]}, {"key": "Habla", "items": ["\"If I were ___, I would have ___.\""]}], "exercise": {"stem": "If I weren't so shy, I ___ asked her out last night.", "options": ["would have", "would"], "answer": "would have"}}, {"n": 3, "title": "Mixto con resultado actual (wouldn't be)", "sections": [{"key": "Tema", "items": ["decir cómo sería tu vida hoy si algo hubiera pasado antes."]}, {"key": "Vocabulario", "items": ["taken (cogido), train (tren), late (tarde), now (ahora), earlier (antes)"]}, {"key": "Lectura", "items": ["If we had taken the train, we wouldn't be late now."]}, {"key": "Notas", "items": ["Para el resultado presente usamos *wouldn't be* (no *wouldn't have been*).", "La parte del *if* va en pasado perfecto."]}, {"key": "Ejercicio", "items": ["If we had taken the train, we ___ late now. (wouldn't be / wouldn't have been) → **wouldn't be**"]}, {"key": "Habla", "items": ["\"If I had ___, I wouldn't be ___ now.\""]}], "exercise": {"stem": "If we had taken the train, we ___ late now.", "options": ["wouldn't be", "wouldn't have been"], "answer": "wouldn't be"}}, {"n": 4, "title": "If + had been (cualidad pasada)", "sections": [{"key": "Tema", "items": ["hablar de una manera de ser en el pasado y su efecto."]}, {"key": "Vocabulario", "items": ["careful (cuidadoso), accident (accidente), had been (había estado), more (más), wasn't (no era)"]}, {"key": "Lectura", "items": ["If she had been more careful, she wouldn't have had the accident."]}, {"key": "Notas", "items": ["*had been* = forma del pasado perfecto de *be*.", "Así se describe una cualidad del pasado que causó un resultado."]}, {"key": "Ejercicio", "items": ["If she ___ more careful, she wouldn't have had the accident. (had been / were) → **had been**"]}, {"key": "Habla", "items": ["\"If I had been ___, I would have ___.\""]}], "exercise": {"stem": "If she ___ more careful, she wouldn't have had the accident.", "options": ["had been", "were"], "answer": "had been"}}, {"n": 5, "title": "Without (sin)", "sections": [{"key": "Tema", "items": ["usar *without* o *but for* como condición."]}, {"key": "Vocabulario", "items": ["without (sin), help (ayuda), failed (suspendido), but for (si no fuera por), support (apoyo)"]}, {"key": "Lectura", "items": ["Without your help, I would have failed. But for your support, I wouldn't be here."]}, {"key": "Notas", "items": ["*Without + sustantivo* = *si no fuera por...*", "*But for* tiene el mismo significado y suena más formal."]}, {"key": "Ejercicio", "items": ["___ your help, I would have failed. (Without / Within) → **Without**"]}, {"key": "Habla", "items": ["\"Without ___, I would ___.\""]}], "exercise": {"stem": "___ your help, I would have failed.", "options": ["Without", "Within"], "answer": "Without"}}, {"n": 6, "title": "I wish con pasado perfecto", "sections": [{"key": "Tema", "items": ["expresar arrepentimiento sobre el pasado."]}, {"key": "Vocabulario", "items": ["wish (desear), more time (más tiempo), last week (la semana pasada), knew (sabía), answer (respuesta)"]}, {"key": "Lectura", "items": ["I wish I had had more time last week. I wish I had known the answer."]}, {"key": "Notas", "items": ["*I wish* + pasado perfecto = deseo sobre algo que no pasó.", "*I wish* + pasado simple = deseo sobre el presente (*I wish I knew*)."]}, {"key": "Ejercicio", "items": ["I wish I ___ more time last week. (had had / have had) → **had had**"]}, {"key": "Habla", "items": ["\"I wish I had ___.\""]}], "exercise": {"stem": "I wish I ___ more time last week.", "options": ["had had", "have had"], "answer": "had had"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["If I had studied law, I would have a different job today. If she hadn't moved to London, she wouldn't know so many people."]}, {"key": "Repaso", "items": ["mixto pasado → presente, mixto presente → pasado, *wouldn't be* con resultado actual, *had been*, *without / but for*, *I wish* + pasado perfecto."]}, {"key": "Actividad de habla", "items": ["di 2 frases que cambian tu vida hoy (*If I had...*, *I would be...*) y 2 frases sobre tu vida pasada (*If I were..., I would have...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con condicionales mixtos."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 would be, 2 would have, 3 wouldn't be, 4 had been, 5 Without, 6 had had, 7 would have got, 8 would have helped, 9 wasn't, 10 knew"]}], "exercise": null}], "exam": [{"stem": "If I had studied law, I ___ a lawyer now.", "options": ["would be", "would have been"], "answer": "would be"}, {"stem": "If I weren't so shy, I ___ asked her out last night.", "options": ["would have", "would"], "answer": "would have"}, {"stem": "If we had taken the train, we ___ late now.", "options": ["wouldn't be", "wouldn't have been"], "answer": "wouldn't be"}, {"stem": "If she ___ more careful, she wouldn't have had the accident.", "options": ["had been", "were"], "answer": "had been"}, {"stem": "___ your help, I would have failed.", "options": ["Without", "Within"], "answer": "Without"}, {"stem": "I wish I ___ more time last week.", "options": ["had had", "have had"], "answer": "had had"}, {"stem": "If he spoke French, he ___ the job in Paris.", "options": ["would have got", "would get"], "answer": "would have got"}, {"stem": "If I were a doctor, I ___ that patient yesterday.", "options": ["would have helped", "would help"], "answer": "would have helped"}, {"stem": "If it ___ so cold yesterday, we would have gone out.", "options": ["wasn't", "hadn't been"], "answer": "wasn't"}, {"stem": "I wish I ___ the answer now.", "options": ["knew", "had known"], "answer": "knew"}]}, {"id": "c1-u5", "level": "C1", "num": 5, "title": "Vocabulario académico", "meta": "usar vocabulario de estudios, informes y artículos con las colocaciones correctas.", "lessons": [{"n": 1, "title": "Verbos académicos (analyse, indicate, assume, establish)", "sections": [{"key": "Tema", "items": ["verbos muy usados en textos académicos."]}, {"key": "Vocabulario", "items": ["analyse (analizar), indicate (indicar), assume (asumir), establish (establecer), effects (efectos)"]}, {"key": "Lectura", "items": ["The study will analyse the effects of sleep. The results indicate a strong link. We can assume that the sample is fair."]}, {"key": "Notas", "items": ["*analyse* (inglés británico) = *analyze* (inglés americano). Las dos son correctas.", "*indicate* = mostrar o señalar.", "*establish* = demostrar o crear algo firme."]}, {"key": "Ejercicio", "items": ["The study will ___ the effects of sleep. (analyse / analyse of) → **analyse**"]}, {"key": "Habla", "items": ["\"The results indicate ___. We can assume ___.\""]}], "exercise": {"stem": "The study will ___ the effects of sleep.", "options": ["analyse", "analyse of"], "answer": "analyse"}}, {"n": 2, "title": "Sustantivos académicos (hypothesis, evidence, approach)", "sections": [{"key": "Tema", "items": ["sustantivos clave en un informe o investigación."]}, {"key": "Vocabulario", "items": ["hypothesis (hipótesis), evidence (evidencia), approach (enfoque), method (método), findings (hallazgos)"]}, {"key": "Lectura", "items": ["Our hypothesis is supported by the evidence. The new approach changed our findings."]}, {"key": "Notas", "items": ["*evidence* es incontable: *some evidence*, no *an evidence*.", "*approach* = manera de abordar un problema."]}, {"key": "Ejercicio", "items": ["We need more ___ before we decide. (evidence / evidences) → **evidence**"]}, {"key": "Habla", "items": ["\"Our ___ is that ___.\""]}], "exercise": {"stem": "We need more ___ before we decide.", "options": ["evidence", "evidences"], "answer": "evidence"}}, {"n": 3, "title": "Conectores formales (furthermore, nevertheless, consequently)", "sections": [{"key": "Tema", "items": ["unir ideas en un texto académico."]}, {"key": "Vocabulario", "items": ["furthermore (además), nevertheless (sin embargo), consequently (por consiguiente), incomplete (incompleto), conclusion (conclusión)"]}, {"key": "Lectura", "items": ["The data was incomplete. Nevertheless, we reached a conclusion. Consequently, the project was cancelled."]}, {"key": "Notas", "items": ["*furthermore* = además (añade información).", "*nevertheless* = sin embargo (contraste).", "*consequently* = por eso, como consecuencia (resultado)."]}, {"key": "Ejercicio", "items": ["The data was incomplete. ___, we reached a conclusion. (Nevertheless / Furthermore) → **Nevertheless**"]}, {"key": "Habla", "items": ["\"___, I think that ___.\""]}], "exercise": {"stem": "The data was incomplete. ___, we reached a conclusion.", "options": ["Nevertheless", "Furthermore"], "answer": "Nevertheless"}}, {"n": 4, "title": "Colocaciones académicas (conduct research, draw conclusions)", "sections": [{"key": "Tema", "items": ["palabras que suelen ir juntas en textos académicos."]}, {"key": "Vocabulario", "items": ["conduct (llevar a cabo), research (investigación), draw (sacar), conclusions (conclusiones), reach (llegar a)"]}, {"key": "Lectura", "items": ["Researchers have conducted research on this topic. It is hard to draw conclusions from this data. The teams reached a consensus."]}, {"key": "Notas", "items": ["*conduct research* = hacer una investigación.", "*draw conclusions* = sacar conclusiones.", "*reach a consensus* = llegar a un acuerdo general."]}, {"key": "Ejercicio", "items": ["Researchers ___ research on this topic for years. (have conducted / have conduct) → **have conducted**"]}, {"key": "Habla", "items": ["\"We need to ___ before we ___.\""]}], "exercise": {"stem": "Researchers ___ research on this topic for years.", "options": ["have conducted", "have conduct"], "answer": "have conducted"}}, {"n": 5, "title": "Adjetivos académicos (significant, relevant, substantial)", "sections": [{"key": "Tema", "items": ["adjetivos para describir resultados e ideas."]}, {"key": "Vocabulario", "items": ["significant (significativo), relevant (relevante), substantial (considerable), difference (diferencia), data (datos)"]}, {"key": "Lectura", "items": ["The difference is significant. This data is relevant to our question. There was a substantial increase."]}, {"key": "Notas", "items": ["*significant* = importante o estadísticamente relevante.", "*relevant* = que tiene que ver con el tema.", "*substantial* = grande, considerable."]}, {"key": "Ejercicio", "items": ["The difference is ___. (significant / significantly) → **significant**"]}, {"key": "Habla", "items": ["\"This is relevant because ___.\""]}], "exercise": {"stem": "The difference is ___.", "options": ["significant", "significantly"], "answer": "significant"}}, {"n": 6, "title": "Lenguaje de cautela (tends to, appears to, seems)", "sections": [{"key": "Tema", "items": ["decir algo sin afirmarlo de forma absoluta."]}, {"key": "Vocabulario", "items": ["tends (tiende), appears (parece), seems (parece), risk (riesgo), increase (aumentar)"]}, {"key": "Lectura", "items": ["Smoking tends to increase the risk. The results appear to support our view."]}, {"key": "Notas", "items": ["*tend to* = tiende a (algo que pasa a menudo).", "*appear to / seem to* = parece que (una idea prudente).", "Este lenguaje de cautela es muy común en textos académicos."]}, {"key": "Ejercicio", "items": ["Smoking ___ to increase the risk. (tends / tend) → **tends**"]}, {"key": "Habla", "items": ["\"This seems to ___. It tends to ___.\""]}], "exercise": {"stem": "Smoking ___ to increase the risk.", "options": ["tends", "tend"], "answer": "tends"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["The study suggests a significant correlation between sleep and memory. Researchers attribute the result to several factors."]}, {"key": "Repaso", "items": ["verbos académicos, sustantivos académicos, conectores formales, colocaciones, adjetivos académicos, lenguaje de cautela."]}, {"key": "Actividad de habla", "items": ["explica un estudio o artículo que leíste usando *The study indicates...* y *The results seem to...*."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo corto (6 frases) con 3 conectores formales y 2 colocaciones."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 analyse, 2 indicate, 3 Nevertheless, 4 evidence, 5 have conducted, 6 consensus, 7 significant, 8 tends, 9 was, 10 supported"]}], "exercise": null}], "exam": [{"stem": "The study will ___ the effects of sleep.", "options": ["analyse", "analyse of"], "answer": "analyse"}, {"stem": "The results ___ a strong link.", "options": ["indicate", "indicating"], "answer": "indicate"}, {"stem": "The data was incomplete. ___, we reached a conclusion.", "options": ["Nevertheless", "Furthermore"], "answer": "Nevertheless"}, {"stem": "We need more ___ before we decide.", "options": ["evidence", "evidences"], "answer": "evidence"}, {"stem": "Researchers ___ research on this topic for years.", "options": ["have conducted", "have conduct"], "answer": "have conducted"}, {"stem": "The two teams finally reached a ___.", "options": ["consensus", "consent"], "answer": "consensus"}, {"stem": "The difference is ___.", "options": ["significant", "significantly"], "answer": "significant"}, {"stem": "Smoking ___ to increase the risk.", "options": ["tends", "tend"], "answer": "tends"}, {"stem": "Consequently, the project ___ cancelled.", "options": ["was", "were"], "answer": "was"}, {"stem": "The hypothesis was ___ by the experiment.", "options": ["supported", "supporting"], "answer": "supported"}]}, {"id": "c1-u6", "level": "C1", "num": 6, "title": "Argumentar y rebatir", "meta": "dar argumentos, reconocer el punto del otro y responder sin perder el hilo.", "lessons": [{"n": 1, "title": "Conceder un punto (admittedly, granted that)", "sections": [{"key": "Tema", "items": ["reconocer algo que es verdad antes de dar tu argumento."]}, {"key": "Vocabulario", "items": ["admittedly (es cierto que), granted that (dando por hecho que), expensive (caro), works (funciona), however (sin embargo)"]}, {"key": "Lectura", "items": ["Admittedly, the plan is expensive. However, it works. Granted that it is expensive, the plan has advantages."]}, {"key": "Notas", "items": ["*Admittedly* = es cierto que.", "*Granted that* + frase = aceptando que...", "Después de conceder, siempre viene un *however* o *but*."]}, {"key": "Ejercicio", "items": ["___, the plan is expensive. However, it works. (Admittedly / Consequently) → **Admittedly**"]}, {"key": "Habla", "items": ["\"Admittedly, ___. However, ___.\""]}], "exercise": {"stem": "___, the plan is expensive. However, it works.", "options": ["Admittedly", "Consequently"], "answer": "Admittedly"}}, {"n": 2, "title": "Rebatir (That may be true, but...)", "sections": [{"key": "Tema", "items": ["responder a un argumento sin ser agresivo."]}, {"key": "Vocabulario", "items": ["may (puede), true (verdad), prove (probar), point (punto), argument (argumento)"]}, {"key": "Lectura", "items": ["That may be true, but it doesn't prove the point."]}, {"key": "Notas", "items": ["*That may be true, but...* = puede que sea verdad, pero...", "Es una forma educada de rebatir."]}, {"key": "Ejercicio", "items": ["That may be true, ___ it doesn't prove the point. (but / so) → **but**"]}, {"key": "Habla", "items": ["\"That may be true, but ___.\""]}], "exercise": {"stem": "That may be true, ___ it doesn't prove the point.", "options": ["but", "so"], "answer": "but"}}, {"n": 3, "title": "Contraargumentos (On the contrary, Far from)", "sections": [{"key": "Tema", "items": ["decir que lo contrario es verdad."]}, {"key": "Vocabulario", "items": ["contrary (contrario), evidence (evidencia), supports (apoya), view (opinión), helping (ayudar)"]}, {"key": "Lectura", "items": ["On the contrary, the evidence supports my view. Far from helping, the policy made things worse."]}, {"key": "Notas", "items": ["*On the contrary* = al contrario.", "*Far from + -ing* = lejos de (algo), todo lo contrario."]}, {"key": "Ejercicio", "items": ["___ the contrary, the evidence supports my view. (On / In) → **On**"]}, {"key": "Habla", "items": ["\"On the contrary, ___.\""]}], "exercise": {"stem": "___ the contrary, the evidence supports my view.", "options": ["On", "In"], "answer": "On"}}, {"n": 4, "title": "Énfasis en un argumento (Above all, What's more)", "sections": [{"key": "Tema", "items": ["poner la razón más importante al final o al principio."]}, {"key": "Vocabulario", "items": ["above all (sobre todo), what's more (además), protect (proteger), children (niños), deadline (fecha límite)"]}, {"key": "Lectura", "items": ["Above all, we must protect the children. What's more, the deadline is tomorrow."]}, {"key": "Notas", "items": ["*Above all* = sobre todo, lo más importante.", "*What's more* = además (añade un argumento fuerte)."]}, {"key": "Ejercicio", "items": ["Above ___, we must protect the children. (all / every) → **all**"]}, {"key": "Habla", "items": ["\"Above all, ___. What's more, ___.\""]}], "exercise": {"stem": "Above ___, we must protect the children.", "options": ["all", "every"], "answer": "all"}}, {"n": 5, "title": "Cuestionar una afirmación (Is it really the case that...)", "sections": [{"key": "Tema", "items": ["poner en duda una idea de forma educada."]}, {"key": "Vocabulario", "items": ["really (de verdad), case (caso), market (mercado), grow (crecer), unfair (injusto)"]}, {"key": "Lectura", "items": ["Is it really the case that the market will grow? It can be argued that the rules are unfair."]}, {"key": "Notas", "items": ["*Is it really the case that...?* = ¿es de verdad así que...?", "*It can be argued that...* = se puede argumentar que..."]}, {"key": "Ejercicio", "items": ["Is it really ___ that the market will grow? (the case / true that) → **the case**"]}, {"key": "Habla", "items": ["\"Is it really the case that ___?\""]}], "exercise": {"stem": "Is it really ___ that the market will grow?", "options": ["the case", "true that"], "answer": "the case"}}, {"n": 6, "title": "Matizar en un argumento (arguably)", "sections": [{"key": "Tema", "items": ["decir algo de forma firme pero sin ser absoluto."]}, {"key": "Vocabulario", "items": ["arguably (se podría decir que), weak (débil), argument (argumento), strong (fuerte), claim (afirmación)"]}, {"key": "Lectura", "items": ["This argument is arguably weak. It is arguably the best claim we have."]}, {"key": "Notas", "items": ["*arguably* = se podría decir que (matiza la opinión).", "Es muy útil en debates y ensayos."]}, {"key": "Ejercicio", "items": ["This argument is ___ weak. (arguably / arguable) → **arguably**"]}, {"key": "Habla", "items": ["\"This is arguably ___.\""]}], "exercise": {"stem": "This argument is ___ weak.", "options": ["arguably", "arguable"], "answer": "arguably"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I admit  "C1", "num": 7, "title": "Inglés de negocios", "meta": "usar el inglés de reuniones, emails, negociaciones y presentaciones de trabajo.", "lessons": [{"n": 1, "title": "Reuniones (agenda, minutes, action points)", "sections": [{"key": "Tema", "items": ["vocabulario básico de una reunión."]}, {"key": "Vocabulario", "items": ["agenda (orden del día), minutes (acta), action points (tareas acordadas), meeting (reunión), discuss (discutir)"]}, {"key": "Lectura", "items": ["Let's go through the agenda first. I'll send the minutes after the meeting."]}, {"key": "Notas", "items": ["*agenda* = lista de temas de la reunión.", "*minutes* = resumen escrito de lo que se habló.", "*action points* = tareas que alguien debe hacer."]}, {"key": "Ejercicio", "items": ["Let's go through the ___. (agenda / agency) → **agenda**"]}, {"key": "Habla", "items": ["\"Let's discuss ___ first.\""]}], "exercise": {"stem": "Let's go through the ___.", "options": ["agenda", "agency"], "answer": "agenda"}}, {"n": 2, "title": "Emails formales (I'm writing to, Please find attached)", "sections": [{"key": "Tema", "items": ["escribir emails profesionales."]}, {"key": "Vocabulario", "items": ["writing (escribo), attached (adjunto), report (informe), find (encontrar), follow up (hacer seguimiento)"]}, {"key": "Lectura", "items": ["I'm writing to follow up on our meeting. Please find the report attached to this email."]}, {"key": "Notas", "items": ["*I'm writing to...* = Le escribo para...", "*Please find attached* = Adjunto encontrará...", "Son frases fijas en emails de trabajo."]}, {"key": "Ejercicio", "items": ["Please ___ the report attached to this email. (find / found) → **find**"]}, {"key": "Habla", "items": ["\"I'm writing to ___.\""]}], "exercise": {"stem": "Please ___ the report attached to this email.", "options": ["find", "found"], "answer": "find"}}, {"n": 3, "title": "Negociar (We'd be willing to, Would you consider)", "sections": [{"key": "Tema", "items": ["hacer propuestas y negociar un pr s (tend to, is likely to)", "sections": [{"key": "Tema", "items": ["hablar de lo que suele pasar en la sociedad."]}, {"key": "Vocabulario", "items": ["tend (tender a), likely (probable), move (mudarse), cities (ciudades), take time (tardar)"]}, {"key": "Lectura", "items": ["Young people tend to move to big cities. Integration is likely to take time."]}, {"key": "Notas", "items": ["*tend to* = suele (con plurales: *they tend to*).", "*be likely to* = es probable que."]}, {"key": "Ejercicio", "items": ["Young people ___ to move to big cities. (tend / tends) → **tend**"]}, {"key": "Habla", "items": ["\"People tend to ___. It is likely to ___.\""]}], "exercise": {"stem": "Young people ___ to move to big cities.", "options": ["tend", "tends"], "answer": "tend"}}, {"n": 5, "title": "Hablar de un tema (in terms of, as far as... is concerned)", "sections": [{"key": "Tema", "items": ["limitar o explicar sobre qué aspecto hablas."]}, {"key": "Vocabulario", "items": ["tourism (turismo), town (pueblo), changed (cambiado), jobs (trabajos), improving (mejorando)"]}, {"key": "Lectura", "items": ["As far as tourism is concerned, the town has changed a lot. In terms of jobs, the city is improving."]}, {"key": "Notas", "items": ["*As far as... is concerned* = en lo que se refiere a...", "*In terms of* = en cuanto a...", "Son muy útiles para hablar de un aspecto concreto."]}, {"key": "Ejercicio", "items": ["In terms ___ jobs, the city is improving. (of / for) → **of**"]}, {"key": "Habla", "items": ["\"As far as ___ is concerned, ___.\""]}], "exercise": {"stem": "In terms ___ jobs, the city is improving.", "options": ["of", "for"], "answer": "of"}}, {"n": 6, "title": "Colocaciones sociales (raise awareness, have an impact)", "sections": [{"key": "Tema", "items": ["palabras que van juntas en temas sociales."]}, {"key": "Vocabulario", "items": ["raise awareness (crear conciencia), campaign (campaña), problem (problema), impact (impacto), aims (busca)"]}, {"key": "Lectura", "items": ["The ar", "As long"], "answer": "As far"}, {"stem": "The campaign aims to raise ___ of the problem.", "options": ["awareness", "awake"], "answer": "awareness"}, {"stem": "Changes in technology have had a big ___ on work.", "options": ["impact", "impression"], "answer": "impact"}, {"stem": "Poverty ___ in this area for decades.", "options": ["has remained", "has remain"], "answer": "has remained"}, {"stem": "In terms ___ jobs, the city is improving.", "options": ["of", "for"], "answer": "of"}, {"stem": "Integration is likely ___ take time.", "options": ["to", "for"], "answer": "to"}]}, {"id": "c1-u9", "level": "C1", "num": 9, "title": "Matices de significado", "meta": "elegir la palabra exacta cuando dos palabras parecen iguales.", "lessons": [{"n": 1, "title": "Effect y affect", "sections": [{"key": "Tema", "items": ["diferenciar *effect* (sustantivo) y *affect* (verbo)."]}, {"key": "Vocabulario", "items": ["effect (efecto, sustantivo), affect (afectar, verbo), sales (ventas), strong (fuerte), health (salud)"]}, {"key": "Lectura", "items": ["The results had a strong effect on sales. The weather can affect your health."]}, {"key": "Notas", "items": ["*effect* = sustantivo: *the effect of...*", "*affect* = verbo: *to affect something*.", "Truco: *effect* = resultado (sustantivo); *affect* = acción (verbo)."]}, {"key": "Ejercicio", "items": ["The results had a strong ___ on sales. (effect / affect) → **effect**"]}, {"key": "Habla", "items": ["\"The ___ had an effect on ___.\""]}], "exercise": {"stem": "The results had a strong ___ on sales.", "options": ["effect", "affect"], "answer": "effect"}}, {"n": 2, "title": "Imply e infer", "sections": [{"key": "Tema", "items": ["diferenciar quien da una idea de quien la entiende."]}, {"key": "Vocabulario", "items": ["imply (insinuar, dar a entender), infer (deducir), guilty (culpable), tone (tono), angry (enfadado)"]}, {"key": "Lectura", "items": ["His answer seemed to imply that he was guilty. I infer from your tone that you were angry."]}, {"key": "Notas", "items": ["*imply* = la persona que habla da a entender algo.", "*infer* = la persona que escucha deduce algo."]}, {"key": "Ejercicio", "items": ["His answer seemed to ___ that he was guilty. (imply / infer) → **imply**"]}, {"key": "Habla", "items": ["\"You seem to ___. I infer that ___.\""]}], "exercise": {"stem": "His answer seemed to ___ that he was guilty.", "options": ["imply", "infer"], "answer": "imply"}}, {"n": 3, "title": "Infer (deducir a partir de algo)", "sections": [{"key": "Tema", "items": ["practicar *infer* con ejemplos."]}, {"key": "Vocabulario", "items": ["infer (deducir), tone (tono), voice (voz), upset (molesto), silence (silencio)"]}, {"key": "Lectura", "items": ["I infer that you were upset from your voice. From her silence, we can infer that she disagreed."]}, {"key": "Notas", "items": ["*infer from* = deducir a partir de (algo que ves u oyes).", "*imply* nunca va seguido de *from* con este sentido."]}, {"key": "Ejercicio", "items": ["I ___ that you were angry from your tone. (infer / imply) → **infer**"]}, {"key": "Habla", "items": ["\"I infer from ___ that ___.\""]}], "exercise": {"stem": "I ___ that you were angry from your tone.", "options": ["infer", "imply"], "answer": "infer"}}, {"n": 4, "title": "Few y a few (contables)", "sections": [{"key": "Tema", "items": ["usar *few* y *a few* con cosas que se cuentan."]}, {"key": "Vocabulario", "items": ["few (pocos, casi ninguno), a few (algunos, unos pocos), people (personas), room (sala), friends (amigos)"]}, {"key": "Lectura", "items": ["There are few people in the room. I have a few friends I can trust."]}, {"key": "Notas", "items": ["*few* = casi ninguno (tono negativo).", "*a few* = algunos (tono positivo).", "Se usa con sustantivos contables (*people, books, friends*)."]}, {"key": "Ejercicio", "items": ["There are ___ people in the room. (few / little) → **few**"]}, {"key": "Habla", "items": ["\"I have a few ___. There are few ___.\""]}], "exercise": {"stem": "T
