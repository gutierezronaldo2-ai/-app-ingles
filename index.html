ld.", "options": ["were", "was"], "answer": "were"}}, {"n": 2, "title": "Condicional con \"had\"", "sections": [{"key": "Tema", "items": ["hablar de lo que tendrías si tuvieras algo."]}, {"key": "Vocabulario", "items": ["money (dinero), house (casa), time (tiempo), paint (pintar), courage (valor)"]}, {"key": "Lectura", "items": ["I would buy a house if I had the money. I would move to Canada if I had the courage."]}, {"key": "Notas", "items": ["Con *had* en la condición: *if I had*.", "La parte *would* va en la conclusión: *I would buy*."]}, {"key": "Ejercicio", "items": ["I would buy a house if I ___ the money. (had / have) → **had**"]}, {"key": "Habla", "items": ["\"I would ___ if I had ___.\""]}], "exercise": {"stem": "I would buy a house if I ___ the money.", "options": ["had", "have"], "answer": "had"}}, {"n": 3, "title": "Consejos imaginarios (if I were you)", "sections": [{"key": "Tema", "items": ["dar consejos con *if I were you*."]}, {"key": "Vocabulario", "items": ["if I were you (si yo fuera tú), take (aceptar), job (trabajo), offer (oferta), decide (decidir)"]}, {"key": "Lectura", "items": ["If I were you, I would take the job. If I were you, I would think about it."]}, {"key": "Notas", "items": ["Con *I*, *he*, *she* también usamos *were* en este caso: *If I were you*.", "*would* en la conclusión."]}, {"key": "Ejercicio", "items": ["If I ___ you, I would take the job. (were / was) → **were**"]}, {"key": "Habla", "items": ["\"If I were you, I would ___.\""]}], "exercise": {"stem": "If I ___ you, I would take the job.", "options": ["were", "was"], "answer": "were"}}, {"n": 4, "title": "Deseos (I wish)", "sections": [{"key": "Tema", "items": ["expresar deseos imposibles o difíciles."]}, {"key": "Vocabulario", "items": ["wish (desear), could (poder), speak (hablar), Japanese (japonés), taller (más alto)"]}, {"key": "Lectura", "items": ["I wish I could speak Japanese. I wish I were taller."]}, {"key": "Notas", "items": ["*I wish* + pasado: *I wish I could*.", "*I wish I were* = desearía ser."]}, {"key": "Ejercicio", "items": ["I wish I ___ speak Japanese. (could / can) → **could**"]}, {"key": "Habla", "items": ["\"I wish I could ___.\""]}], "exercise": {"stem": "I wish I ___ speak Japanese.", "options": ["could", "can"], "answer": "could"}}, {"n": 5, "title": "Preguntas hipotéticas (what would you do if)", "sections": [{"key": "Tema", "items": ["preguntar qué harías en una situación imaginaria."]}, {"key": "Vocabulario", "items": ["what would you do (¿qué harías?), million (millón), win (ganar), lottery (lotería), buy (comprar)"]}, {"key": "Lectura (diálogo)", "items": ["What would you do if you won the lottery? → I would buy a house by the sea.", "What would you do if you had a million euros? → I would travel."]}, {"key": "Notas", "items": ["*What would you do if...?* = ¿Qué harías si...?", "*won* (pasado de *win*)."]}, {"key": "Ejercicio", "items": ["What would you do if you ___ a million euros? (won / win) → **won**"]}, {"key": "Habla", "items": ["\"What would you do if you ___?\""]}], "exercise": {"stem": "What would you do if you ___ a million euros?", "options": ["won", "win"], "answer": "won"}}, {"n": 6, "title": "Sueños de vida (I would love to)", "sections": [{"key": "Tema", "items": ["hablar de tus sueños."]}, {"key": "Vocabulario", "items": ["dream (sueño), would love to (me encantaría), move (mudarme), abroad (en el extranjero), own (tener, poseer)"]}, {"key": "Lectura", "items": ["My dream is to own a bookshop. I would love to move abroad one day. I would start my own business."]}, {"key": "Notas", "items": ["*would love to* + verbo base: *would love to move*.", "*my dream is to* + verbo base: *my dream is to own*."]}, {"key": "Ejercicio", "items": ["I would love ___ abroad one day. (to move / moving) → **to move**"]}, {"key": "Habla", "items": ["\"My dream is to ___. I would love to ___.\""]}], "exercise": {"stem": "I would love ___ abroad one day.", "options": ["to move", "moving"], "answer": "to move"}} bout...?* = ¿Podría contarme más sobre...?", "*What does a typical day look like?* = ¿Cómo es un día normal?"]}, {"key": "Ejercicio", "items": ["Could you tell me more ___ the team? (about / of) → **about**"]}, {"key": "Habla", "items": ["\"What does a typical ___ look like?\""]}], "exercise": {"stem": "Could you tell me more ___ the team?", "options": ["about", "of"], "answer": "about"}}, {"n": 6, "title": "Hablar del salario (was expecting, would it be possible)", "sections": [{"key": "Tema", "items": ["hablar de condiciones con educación."]}, {"key": "Vocabulario", "items": ["salary (sueldo), expect (esperar), possible (posible), flexible (flexible), start (empezar)"]}, {"key": "Lectura", "items": ["I was expecting a slightly higher salary. Would it be possible to start in May?"]}, {"key": "Notas", "items": ["*was expecting* = esperaba (pasado continuo para algo que tenía en mente).", "*Would it be possible to...?* = ¿Sería posible...?"]}, {"key": "Ejercicio", "items": ["I was ___ a higher salary. (expecting / expect) → **expecting**"]}, {"key": "Habla", "items": ["\"Would it be possible to ___?\""]}], "exercise": {"stem": "I was ___ a higher salary.", "options": ["expecting", "expect"], "answer": "expecting"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["During the interview, the manager asked about my experience. I explained that I had worked in sales for five years. I will follow up next week."]}, {"key": "Repaso", "items": ["vocabulario de entrevistas, *managed to*, *tend to*, *interested in*, preguntas al entrevistador, salario."]}, {"key": "Actividad de habla (2 minutos)", "items": ["Simula una entrevista: preséntate, cuenta un logro, di un punto a mejorar y haz 2 preguntas."]}, {"key": "Actividad escrita", "items": ["escribe tu respuesta a \"Tell me about yourself\" en 6 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 managed, 2 improve, 3 interested, 4 about, 5 day, 6 expecting, 7 possible, 8 to work, 9 opportunity, 10 working"]}], "exercise": null}], "exam": [{"stem": "I ___ to finish the project on time.", "options": ["managed", "manage"], "answer": "managed"}, {"stem": "I'm trying to ___ my time management.", "options": ["improve", "improving"], "answer": "improve"}, {"stem": "I'm really ___ in this position.", "options": ["interested", "interesting"], "answer": "interested"}, {"stem": "Could you tell me more ___ the team?", "options": ["about", "of"], "answer": "about"}, {"stem": "What does a typical ___ look like?", "options": ["day", "days"], "answer": "day"}, {"stem": "I was ___ a higher salary.", "options": ["expecting", "expect"], "answer": "expecting"}, {"stem": "Would it be ___ to start in May?", "options": ["possible", "possibly"], "answer": "possible"}, {"stem": "I tend ___ too much.", "options": ["to work", "working"], "answer": "to work"}, {"stem": "It sounds like a great ___.", "options": ["opportunity", "opportunities"], "answer": "opportunity"}, {"stem": "I'm ___ on my English.", "options": ["working", "work"], "answer": "working"}]}, {"id": "b2-u2", "level": "B2", "num": 2, "title": "Present perfect continuo", "meta": "hablar de actividades que empezaron en el pasado y siguen, o han dejado un resultado visible.", "lessons": [{"n": 1, "title": "Forma (have been + -ing)", "sections": [{"key": "Tema", "items": ["formar el present perfect continuo."]}, {"key": "Vocabulario", "items": ["working (trabajando), learning (aprendiendo), waiting (esperando), since (desde), for (durante)"]}, {"key": "Lectura", "items": ["I've been working here since 2020. She's been learning German for two years."]}, {"key": "Notas", "items": ["*have / has been* + verbo + **-ing**.", "*I've* = *I have*, *she's* = *she has*."]}, {"key": "Ejercicio", "items": ["She ___ been waiting for an hour. (has / have) → **has**"]}, {"key": "Habla", "items": ["\"I've been ___ since ___.\""]}], "exercise": {"stem": "She ___ been waiting for an hour.", "options": ["has", "have"], "answer": "has"}}, {"n": 2, "title": "Duración hasta ahora (for, since)", "sections": [{"key": "Tema", "items": ["decir cuánto tiempo llevas haciendo algo."]}, {"key": "Vocabulario", "items": ["for (durante), since (desde), two hours (dos horas), Monday (lunes), a long time (mucho tiempo)"]}, {"key": "Lectura", "items": ["We've been studying for two hours. It's been raining since Monday."]}, {"key": "Notas", "items": ["*for* + periodo: *for two hours*.", "*since* + momento: *since Monday*."]}, {"key": "Ejercicio", "items": ["It's been raining ___ Monday. (since / for) → **since**"]}, {"key": "Habla", "items": ["\"I've been ___ for ___.\""]}], "exercise": {"stem": "It's been raining ___ Monday.", "options": ["since", "for"], "answer": "since"}}, {"n": 3, "title": "Preguntar cuánto tiempo (How long)", "sections": [{"key": "Tema", "items": ["preguntar cuánto tiempo llevas haciendo algo."]}, {"key": "Vocabulario", "items": ["how long (cuánto tiempo), learn (aprender), wait (esperar), live (vivir), there (allí)"]}, {"key": "Lectura (diálogo)", "items": ["How long have you been learning English? → For about a year.", "How long has she been living there? → Since last summer."]}, {"key": "Notas", "items": ["*How long have you been...?* = ¿Cuánto tiempo llevas...?", "Respuesta con *for* (periodo) o *since* (momento)."]}, {"key": "Ejercicio", "items": ["How long ___ you been learning English? (have / has) → **have**"]}, {"key": "Habla", "items": ["\"How long have you been ___?\""]}], "exercise": {"stem": "How long ___ you been learning English?", "options": ["have", "has"], "answer": "have"}}, {"n": 4, "title": "Actividad vs. resultado (continuo vs. simple)", "sections": [{"key": "Tema", "items": ["diferenciar la actividad (continuo) del resultado (simple)."]}, {"key": "Vocabulario", "items": ["read (leído), book (libro), this year (este año), study (estudiar), all week (toda la semana)"]}, {"key": "Lectura", "items": ["I've been reading this book all week. (actividad) / I've read three books this year. (resultado)"]}, {"key": "Notas", "items": ["Continuo: se enfatiza la actividad y el tiempo: *I've been reading*.", "Simple: se enfatiza el resultado o la cantidad: *I've read three books*."]}, {"key": "Ejercicio", "items": ["I've ___ three books this year. (read / been reading) → **read**"]}, {"key": "Habla", "items": ["\"I've been ___ all ___.\""]}], "exercise": {"stem": "I've ___ three books this year.", "options": ["read", "been reading"], "answer": "read"}}, {"n": 5, "title": "Resultado visible (you've been running)", "sections": [{"key": "Tema", "items": ["explicar algo que ves ahora con el continuo."]}, {"key": "Vocabulario", "items": ["sweaty (sudado), wet (mojado), tired (cansado), dirty (sucio), swim (nadar)"]}, {"key": "Lectura", "items": ["You've been running, haven't you? You're all wet. Have you been swimming?"]}, {"key": "Notas", "items": ["Continuo para explicar una causa visible: *You're all wet. You've been swimming*.", "Las preguntas de confirmación: *haven't you?*"]}, {"key": "Ejercicio", "items": ["You're all wet. Have you been ___? (swimming / swim) → **swimming**"]}, {"key": "Habla", "items": ["\"You look ___. Have you been ___?\""]}], "exercise": {"stem": "You're all wet. Have you been ___?", "options": ["swimming", "swim"], "answer": "swimming"}}, {"n": 6, "title": "Hablar de cansancio y causas (I've been feeling)", "sections": [{"key": "Tema", "items": ["hablar de cómo te has sentido últimamente."]}, {"key": "Vocabulario", "items": ["lately (últimamente), feel (sentirse), well (bien), sleep (dormir), stress (estrés)"]}, {"key": "Lectura", "items": ["I've been feeling tired lately. I haven't been sleeping well. Maybe it's the stress at work."]}, {"key": "Notas", "items": ["*lately* = últimamente, se usa con presente perfecto.", "*haven't been sleeping* = no he estado durmiendo bien."]}, {"key": "Ejercicio", "items": ["He hasn't been ___ well lately. (feel / feeling) → **feeling**"]}, {"key": "Habla", "items": ["\"I've been ___ lately.\""]}], "exercise": {"stem": "He hasn't been ___ well lately.", "options": ["feel", "feeling"], "answer": "feeling"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I have been learning English for three years. She has been working on the report since morning. How long have you been waiting?"]}, {"key": "Repaso", "items": ["forma *have been + -ing*, *for / since*, *how long*, actividad vs. resultado, resultado visible, *lately*."]}, {"key": "Actividad de habla", "items": ["Di 2 cosas que llevas haciendo desde hace tiempo y cuánto. Luego pregunta a un amigo lo mismo."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases sobre lo que has estado haciendo esta semana."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have, 2 has, 3 have, 4 cleaning, 5 talking, 6 since, 7 read, 8 swimming, 9 feeling, 10 have"]}], "exercise": null}], "exam": [{"stem": "I ___ been working here since 2020.", "options": ["have", "has"], "answer": "have"}, {"stem": "She ___ been waiting for an hour.", "options": ["has", "have"], "answer": "has"}, {"stem": "How long ___ you been learning English?", "options": ["have", "has"], "answer": "have"}, {"stem": "We've been ___ the house all day.", "options": ["cleaning", "clean"], "answer": "cleaning"}, {"stem": "They've been ___ for two hours.", "options": ["talk", "talking"], "answer": "talking"}, {"stem": "It's been raining ___ Monday.", "options": ["since", "for"], "answer": "since"}, {"stem": "I've ___ three books this year.", "options": ["read", "reading"], "answer": "read"}, {"stem": "You're all wet. Have you been ___?", "options": ["swimming", "swim"], "answer": "swimming"}, {"stem": "He hasn't been ___ well lately.", "options": ["feel", "feeling"], "answer": "feeling"}, {"stem": "I ___ been studying all morning.", "options": ["have", "has"], "answer": "have"}]}, {"id": "b2-u3", "level": "B2", "num": 3, "title": "Condicionales 2 y 3", "meta": "hablar de situaciones imaginarias (presente) y de cosas que no pasaron (pasado).", "lessons": [{"n": 1, "title": "Segundo condicional, forma (If + past simple, would + verbo)", "sections": [{"key": "Tema", "items": ["hablar de situaciones imaginarias o poco probables en el presente o el futuro."]}, {"key": "Vocabulario", "items": ["more time (más tiempo), learn (aprender), win (ganar), buy (comprar), car (coche)"]}, {"key": "Lectura", "items": ["If I had more time, I would learn Japanese. If I won the lottery, I would buy a car."]}, {"key": "Notas", "items": ["*If* + pasado simple, *would* + verbo base.", "La idea es imaginaria: *ahora no tengo más tiempo*.", "*would* = *sería / haría* (en la frase principal)."]}, {"key": "Ejercicio", "items": ["If I ___ more money, I would buy a car. (had / have) → **had**"]}, {"key": "Habla", "items": ["\"If I had ___, I would ___.\""]}], "exercise": {"stem": "If I ___ more money, I would buy a car.", "options": ["had", "have"], "answer": "had"}}, {"n": 2, "title": "Segundo condicional, consejos (If I were you)", "sections": [{"key": "Tema", "items": ["dar consejos usando una situación imaginaria."]}, {"key": "Vocabulario", "items": ["advice (consejo), apologize (disculparse), boss (jefe), answer (respuesta), tell (decir)"]}, {"key": "Lectura", "items": ["If I were you, I would apologize to my boss. If he knew the answer, he would tell us."]}, {"key": "Notas", "items": ["*If I were you* = *yo que tú*. Con *I, he, she, it* se usa mucho *were*.", "Es una forma fija para dar consejos."]}, {"key": "Ejercicio", "items": ["If he ___ the answer, he would tell us. (knew / knows) → **knew**"]}, {"key": "Habla", "items": ["\"If I were you, I would ___.\""]}], "exercise": {"stem": "If he ___ the answer, he would tell us.", "options": ["knew", "knows"], "answer": "knew"}}, {"n": 3, "title": "Preguntas con would (What would you do if...?)", "sections": [{"key": "Tema", "items": ["preguntar qué harías en una situación imaginaria."]}, {"key": "Vocabulario", "items": ["lottery (lotería), million (millón), travel (viajar), job (trabajo), quit (dejar)"]}, {"key": "Lectura", "items": ["What would you do if you won a million euros? I would travel around the world."]}, {"key": "Notas", "items": ["Pregunta: *What would you do if* + pasado simple?", "Respuesta: *I would* + verbo base."]}, {"key": "Ejercicio", "items": ["What would you do if you ___ a million euros? (won / win) → **won**"]}, {"key": "Habla", "items": ["\"What would you do if ___?\""]}], "exercise": {"stem": "What would you do if you ___ a million euros?", "options": ["won", "win"], "answer": "won"}}, {"n": 4, "title": "Tercer condicional, forma (If + had + participio, would have + participio)", "sections": [{"key": "Tema", "items": ["hablar de cosas que no pasaron en el pasado y de sus consecuencias."]}, {"key": "Vocabulario", "items": ["studied (estudié), passed (aprobé), exam (examen), called (llamé), number (número)"]}, {"key": "Lectura", "items": ["If I had studied harder, I would have passed the exam. I would have called you if I had your number."]}, {"key": "Notas", "items": ["*If* + *had* + participio, *would have* + participio.", "Significa: *si hubiera hecho algo, habría pasado algo*.", "Es un arrepentimiento o una cosa que no pasó."]}, {"key": "Ejercicio", "items": ["If I had studied, I ___ passed the exam. (would have / would) → **would have**"]}, {"key": "Habla", "items": ["\"If I had ___, I would have ___.\""]}], "exercise": {"stem": "If I had studied, I ___ passed the exam.", "options": ["would have", "would"], "answer": "would have"}}, {"n": 5, "title": "Tercer condicional, ejemplos y arrepentimientos", "sections": [{"key": "Tema", "items": ["contar qué habría pasado si las cosas hubieran sido diferentes."]}, {"key": "Vocabulario", "items": ["earlier (antes), caught (cogí), train (tren), missed (perdí), flight (vuelo)"]}, {"key": "Lectura", "items": ["If they had left earlier, they would have caught the train. If we had missed the flight, we would have been angry."]}, {"key": "Notas", "items": ["Con *had* se usa el participio: *had left, had missed, had seen*.", "*would have caught* = *habrían cogido*."]}, {"key": "Ejercicio", "items": ["If they ___ earlier, they would have caught the train. (had left / left) → **had left**"]}, {"key": "Habla", "items": ["\"I wish I had ___. If I had ___, I would have ___.\""]}], "exercise": {"stem": "If they ___ earlier, they would have caught the train.", "options": ["had left", "left"], "answer": "had left"}}, {"n": 6, "title": "Could y might en condicionales", "sections": [{"key": "Tema", "items": ["hablar de posibilidades y capacidades en situaciones imaginarias."]}, {"key": "Vocabulario", "items": ["could (podría), might (podría, quizá), help (ayudar), asked (pedido), said yes (dije que sí)"]}, {"key": "Lectura", "items": ["If I had more time, I could help you. If she had asked, I might have said yes."]}, {"key": "Notas", "items": ["*could* = capacidad o posibilidad: *podría*.", "*might* = posibilidad menor: *quizá / a lo mejor*.", "*might have + participio* = *a lo mejor habría*."]}, {"key": "Ejercicio", "items": ["If I had more time, I ___ help you. (could / can) → **could**"]}, {"key": "Habla", "items": ["\"If I had ___, I could ___.\""]}], "exercise": {"stem": "If I had more time, I ___ help you.", "options": ["could", "can"], "answer": "could"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["If I were rich, I would buy a house by the sea. If it rains tomorrow, we will stay home. If I had studied, I would have passed."]}, {"key": "Repaso", "items": ["segundo condicional (*If + past simple, would + verbo*), tercer condicional (*If + had + participio, would have + participio*), *If I were you*, *What would you do if...?*, *could / might*."]}, {"key": "Contraste clave", "items": ["Presente imaginario → 2.º condicional: *If I had time, I would travel.*", "Pasado que no pasó → 3.er condicional: *If I had had time, I would have travelled.*"]}, {"key": "Actividad de habla", "items": ["di 2 cosas que harías si tuvieras un millón de euros (2.º condicional) y 2 cosas que habrías hecho diferente el año pasado (3.er condicional)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases: 3 con segundo condicional y 3 con tercer condicional."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 had, 2 knew, 3 rained, 4 won, 5 would have, 6 had left, 7 had, 8 missed, 9 had, 10 had"]}], "exercise": null}], "exam": [{"stem": "If I ___ more time, I would learn guitar.", "options": ["had", "have"], "answer": "had"}, {"stem": "If she ___ the answer, she would tell us.", "options": ["knew", "knows"], "answer": "knew"}, {"stem": "If it ___ tomorrow, we would cancel the picnic.", "options": ["rained", "rains"], "answer": "rained"}, {"stem": "What would you do if you ___ a million euros?", "options": ["won", "win"], "answer": "won"}, {"stem": "If I had studied, I ___ passed the exam.", "options": ["would have", "would"], "answer": "would have"}, {"stem": "If they ___ earlier, they would have caught the train.", "options": ["had left", "left"], "answer": "had left"}, {"stem": "I would have called you if I ___ your number.", "options": ["had", "have"], "answer": "had"}, {"stem": "If we ___ the train, we would be late.", "options": ["missed", "miss"], "answer": "missed"}, {"stem": "He would be happier if he ___ a job he liked.", "options": ["had", "has"], "answer": "had"}, {"stem": "I could help you if I ___ the time.", "options": ["had", "have"], "answer": "had"}]}, {"id": "b2-u4", "level": "B2", "num": 4, "title": "Voz pasiva avanzada", "meta": "usar la voz pasiva en todos los tiempos, con modales y en frases de opinión o de noticias.", "lessons": [{"n": 1, "title": "Repaso de la pasiva (be + participio)", "sections": [{"key": "Tema", "items": ["formar la voz pasiva en presente y pasado simple."]}, {"key": "Vocabulario", "items": ["cleaned (limpiada), written (escrita), built (construida), every day (cada día), last week (la semana pasada)"]}, {"key": "Lectura", "items": ["The room is cleaned every day. The letter was written last week."]}, {"key": "Notas", "items": ["Pasiva = *be + participio*. El tiempo lo marca *be*.", "Presente: *is / are + participio*. Pasado: *was / were + participio*."]}, {"key": "Ejercicio", "items": ["The room ___ cleaned every day. (is / are) → **is**"]}, {"key": "Habla", "items": ["\"The ___ is ___ every day.\""]}], "exercise": {"stem": "The room ___ cleaned every day.", "options": ["is", "are"], "answer": "is"}}, {"n": 2, "title": "Pasiva con present perfect y past perfect", "sections": [{"key": "Tema", "items": ["hablar de acciones terminadas con resultado en el presente o el pasado."]}, {"key": "Vocabulario", "items": ["signed (firmado), lost (perdido), keys (llaves), documents (documentos), sent (enviado)"]}, {"key": "Lectura", "items": ["The documents have been signed. The keys had been lost before we arrived."]}, {"key": "Notas", "items": ["Present perfect pasiva: *have / has been + participio*.", "Past perfect pasiva: *had been + participio*.", "Ejemplo: *The documents have been signed* = *Alguien ha firmado los documentos*."]}, {"key": "Ejercicio", "items": ["The documents have ___ signed. (been / be) → **been**"]}, {"key": "Habla", "items": ["\"The ___ has been ___.\""]}], "exercise": {"stem": "The documents have ___ signed.", "options": ["been", "be"], "answer": "been"}}, {"n": 3, "title": "Modales en pasiva (must be, can be, should be)", "sections": [{"key": "Tema", "items": ["dar reglas, posibilidades y consejos en pasiva."]}, {"key": "Vocabulario", "items": ["bill (factura), paid (pagada), fixed (arreglado), checked (revisado), easily (fácilmente)"]}, {"key": "Lectura", "items": ["This bill must be paid today. The problem can be fixed easily."]}, {"key": "Notas", "items": ["Modal + *be* + participio: *must be paid, can be fixed, should be checked*.", "El modal va antes de *be*. Después de modal siempre va *be*, no *been*."]}, {"key": "Ejercicio", "items": ["This bill must ___ paid today. (be / been) → **be**"]}, {"key": "Habla", "items": ["\"It must be ___. It can be ___.\""]}], "exercise": {"stem": "This bill must ___ paid today.", "options": ["be", "been"], "answer": "be"}}, {"n": 4, "title": "Pasiva con get", "sections": [{"key": "Tema", "items": ["hablar de cosas que le pasan a alguien, en un tono informal."]}, {"key": "Vocabulario", "items": ["hurt (herido), damaged (dañado), storm (tormenta), accident (accidente), injured (lesionado)"]}, {"key": "Lectura", "items": ["My car got damaged in the storm. Nobody got hurt in the accident."]}, {"key": "Notas", "items": ["*get* + participio es más informal que *be* + participio.", "Se usa mucho en accidentes y cosas inesperadas: *got hurt, got lost, got damaged*."]}, {"key": "Ejercicio", "items": ["Nobody got ___ in the accident. (hurt / hurting) → **hurt**"]}, {"key": "Habla", "items": ["\"I got ___ last week.\""]}], "exercise": {"stem": "Nobody got ___ in the accident.", "options": ["hurt", "hurting"], "answer": "hurt"}}, {"n": 5, "title": "Pasiva para opiniones y noticias (It is said that..., is believed to...)", "sections": [{"key": "Tema", "items": ["hablar de lo que dice la gente en general, de forma formal."]}, {"key": "Vocabulario", "items": ["said (dicen), believed (se cree), oldest (más antiguo), chef (chef), hotel (hotel)"]}, {"key": "Lectura", "items": ["It is said that the hotel is the oldest in the city. He is believed to be the best chef in town."]}, {"key": "Notas", "items": ["*It is said that* + frase = *dicen que*.", "*He is believed to* + infinitivo = *se cree que él*.", "Muy usado en noticias y textos formales."]}, {"key": "Ejercicio", "items": ["He is ___ to be the best chef in town. (believed / believe) → **believed**"]}, {"key": "Habla", "items": ["\"It is said that ___.\""]}], "exercise": {"stem": "He is ___ to be the best chef in town.", "options": ["believed", "believe"], "answer": "believed"}}, {"n": 6, "title": "Pasiva con -ing e infinitivo (being, to be)", "sections": [{"key": "Tema", "items": ["usar la pasiva después de verbos como *hate, like, want*."]}, {"key": "Vocabulario", "items": ["interrupted (interrumpido), told (dicho), hate (odiar), want (querer), ignored (ignorado)"]}, {"key": "Lectura", "items": ["I hate being interrupted. I want to be told the truth."]}, {"key": "Notas", "items": ["Pasiva con -ing: *being + participio* (*being interrupted*).", "Pasiva con infinitivo: *to be + participio* (*to be told*)."]}, {"key": "Ejercicio", "items": ["I hate ___ interrupted. (being / be) → **being**"]}, {"key": "Habla", "items": ["\"I hate being ___. I want to be ___.\""]}], "exercise": {"stem": "I hate ___ interrupted.", "options": ["being", "be"], "answer": "being"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["The letter was sent yesterday. The problem is being solved by the team. The new bridge was built in 1990."]}, {"key": "Repaso", "items": ["pasiva simple, present perfect pasiva, modales en pasiva, *get* + participio, *It is said that...*, *being / to be*."]}, {"key": "Actividad de habla", "items": ["di 3 cosas que se hacen en tu casa cada semana con pasiva (*The bins are taken out on Monday*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases en pasiva sobre tu trabajo, tu ciudad o tu familia."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 is, 2 was, 3 been, 4 be, 5 be, 6 hurt, 7 believed, 8 being, 9 was, 10 will be"]}], "exercise": null}], "exam": [{"stem": "The room ___ cleaned every day.", "options": ["is", "are"], "answer": "is"}, {"stem": "The letter ___ sent yesterday.", "options": ["was", "has been"], "answer": "was"}, {"stem": "The documents have ___ signed.", "options": ["been", "be"], "answer": "been"}, {"stem": "This bill must ___ paid today.", "options": ["be", "been"], "answer": "be"}, {"stem": "The problem can ___ fixed easily.", "options": ["be", "been"], "answer": "be"}, {"stem": "Nobody got ___ in the accident.", "options": ["hurt", "hurting"], "answer": "hurt"}, {"stem": "He is ___ to be the best chef in town.", "options": ["believed", "believe"], "answer": "believed"}, {"stem": "I hate ___ interrupted.", "options": ["being", "be"], "answer": "being"}, {"stem": "The house ___ built in 1900.", "options": ["was", "is"], "answer": "was"}, {"stem": "The new bridge ___ opened next year.", "options": ["will be", "is being"], "answer": "will be"}]}, {"id": "b2-u5", "level": "B2", "num": 5, "title": "Estilo indirecto avanzado", "meta": "contar lo que dijo otra persona usando verbos de habla y cambios de tiempo.", "lessons": [{"n": 1, "title": "Repaso de say y tell", "sections": [{"key": "Tema", "items": ["contar lo que dijo alguien con *said that* y *told me that*."]}, {"key": "Vocabulario", "items": ["tired (cansada), told (dijo a alguien), said (dijo), would (haría), call (llamar)"]}, {"key": "Lectura", "items": ["She said that she was tired. He told me that he would call."]}, {"key": "Notas", "items": ["*say* no lleva persona directa: *said that*, nunca *said me*.", "*tell* sí lleva persona: *told me that*."]}, {"key": "Ejercicio", "items": ["She ___ me that she was tired. (told / said) → **told**"]}, {"key": "Habla", "items": ["\"He told me that ___.\""]}], "exercise": {"stem": "She ___ me that she was tired.", "options": ["told", "said"], "answer": "told"}}, {"n": 2, "title": "Verbos con infinitivo (promise, offer, agree, refuse)", "sections": [{"key": "Tema", "items": ["contar promesas, ofrecimientos y negativas."]}, {"key": "Vocabulario", "items": ["promised (prometió), offered (ofreció), agreed (aceptó), refused (se negó), move (mudanza)"]}, {"key": "Lectura", "items": ["He promised to help me. She offered to drive us. They refused to pay the extra fee."]}, {"key": "Notas", "items": ["*promise / offer / agree / refuse* + *to* + infinitivo.", "No se usa *promise me to*. Se dice *promised to help me*."]}, {"key": "Ejercicio", "items": ["He ___ to help us with the move. (promised / told) → **promised**"]}, {"key": "Habla", "items": ["\"She offered to ___.\""]}], "exercise": {"stem": "He ___ to help us with the move.", "options": ["promised", "told"], "answer": "promised"}}, {"n": 3, "title": "Verbos con -ing (admit, deny, suggest, recommend)", "sections": [{"key": "Tema", "items": ["contar admisiones, negaciones y sugerencias."]}, {"key": "Vocabulario", "items": ["admitted (admitió), denied (negó), suggested (sugirió), recommended (recomendó), window (ventana)"]}, {"key": "Lectura", "items": ["He admitted breaking the window. She suggested going to the cinema. He denied taking the money."]}, {"key": "Notas", "items": ["*admit / deny / suggest / recommend* + *-ing*.", "*suggest* + *-ing* es correcto. *suggest to go* NO es correcto."]}, {"key": "Ejercicio", "items": ["She suggested ___ to the cinema. (going / to go) → **going**"]}, {"key": "Habla", "items": ["\"He admitted ___. She suggested ___.\""]}], "exercise": {"stem": "She suggested ___ to the cinema.", "options": ["going", "to go"], "answer": "going"}}, {"n": 4, "title": "Preguntas en estilo indirecto", "sections": [{"key": "Tema", "items": ["contar preguntas que te hicieron."]}, {"key": "Vocabulario", "items": ["where (dónde), if (si), ready (listo), lived (viví), asked (preguntó)"]}, {"key": "Lectura", "items": ["She asked me where I lived. He asked me if I was ready."]}, {"key": "Notas", "items": ["Pregunta directa: *Where do you live?* → Indirecta: *She asked me where I lived*.", "En estilo indirecto NO hay inversión: *where I lived*, no *where did I live*.", "*if* = *si* (pregunta de sí o no)."]}, {"key": "Ejercicio", "items": ["He asked me if I ___ ready. (was / am) → **was**"]}, {"key": "Habla", "items": ["\"She asked me where ___. He asked me if ___.\""]}], "exercise": {"stem": "He asked me if I ___ ready.", "options": ["was", "am"], "answer": "was"}}, {"n": 5, "title": "Órdenes y peticiones indirectas (told me to)", "sections": [{"key": "Tema", "items": ["contar órdenes, consejos y peticiones."]}, {"key": "Vocabulario", "items": ["told (dijo que hiciera), open (abrir), books (libros), drink (beber), water (agua)"]}, {"key": "Lectura", "items": ["The teacher told us to open our books. The doctor told me to drink more water."]}, {"key": "Notas", "items": ["*told + persona + to* + infinitivo.", "Orden negativa: *told me not to* + infinitivo (*told me not to smoke*)."]}, {"key": "Ejercicio", "items": ["The doctor told me ___ more water. (to drink / drink) → **to drink**"]}, {"key": "Habla", "items": ["\"My teacher told me to ___.\""]}], "exercise": {"stem": "The doctor told me ___ more water.", "options": ["to drink", "drink"], "answer": "to drink"}}, {"n": 6, "title": "Cambio de tiempos (backshift)", "sections": [{"key": "Tema", "items": ["cambiar los tiempos al contar algo que se dijo en el pasado."]}, {"key": "Vocabulario", "items": ["will (futuro), would (haría), can (poder), could (podía), finished (terminado)"]}, {"key": "Lectura", "items": ["\"I will call you.\" → He said he would call me. \"I can finish it.\" → They said they could finish it."]}, {"key": "Notas", "items": ["*will* → *would*. *can* → *could*. *am / is / are* → *was / were*.", "*present simple* → *past simple*. *present perfect* → *past perfect*.", "Si lo que se dijo sigue siendo verdad, puedes no cambiarlo."]}, {"key": "Ejercicio", "items": ["She said she ___ come. (would / will) → **would**"]}, {"key": "Habla", "items": ["\"He said he ___ / They said they ___.\""]}], "exercise": {"stem": "She said she ___ come.", "options": ["would", "will"], "answer": "would"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["She told me that she would call later. He asked where I had been. They said the train had been delayed."]}, {"key": "Repaso", "items": ["*say* vs. *tell*, verbos + infinitivo, verbos + *-ing*, preguntas indirectas, órdenes indirectas, cambio de tiempos."]}, {"key": "Actividad de habla", "items": ["cuenta algo que te dijo alguien esta semana usando *He said that...* o *She told me to...*."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases de estilo indirecto sobre una conversación real o inventada."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 told, 2 promised, 3 going, 4 breaking, 5 where, 6 was, 7 to drink, 8 would, 9 had, 10 could"]}], "exercise": null}], "exam": [{"stem": "She ___ me that she was tired.", "options": ["told", "said"], "answer": "told"}, {"stem": "He ___ to help us with the move.", "options": ["promised", "told"], "answer": "promised"}, {"stem": "She suggested ___ to the cinema.", "options": ["going", "to go"], "answer": "going"}, {"stem": "He admitted ___ the window.", "options": ["breaking", "break"], "answer": "breaking"}, {"stem": "She asked me ___ I lived.", "options": ["where", "where did"], "answer": "where"}, {"stem": "He asked me if I ___ ready.", "options": ["was", "am"], "answer": "was"}, {"stem": "The doctor told me ___ more water.", "options": ["to drink", "drink"], "answer": "to drink"}, {"stem": "She said she ___ come.", "options": ["would", "going to"], "answer": "would"}, {"stem": "\"I have finished,\" he said. He said that he ___ finished.", "options": ["had", "has"], "answer": "had"}, {"stem": "They said they ___ finish the report.", "options": ["could", "able to"], "answer": "could"}]}, {"id": "b2-u6", "level": "B2", "num": 6, "title": "Medio ambiente", "meta": "hablar de problemas ambientales, soluciones y hábitos con vocabulario y gramática de B2.", "lessons": [{"n": 1, "title": "Contaminación y residuos (pollution, emissions, waste)", "sections": [{"key": "Tema", "items": ["nombrar los problemas ambientales más comunes."]}, {"key": "Vocabulario", "items": ["pollution (contaminación), emissions (emisiones), waste (basura, residuos), cities (ciudades), cars (coches)"]}, {"key": "Lectura", "items": ["Pollution and waste are big problems in many cities. Cars produce a lot of emissions."]}, {"key": "Notas", "items": ["*pollution* = contaminación. *waste* = basura o residuos.", "*emissions* = gases que salen de coches o fábricas."]}, {"key": "Ejercicio", "items": ["Cars produce a lot of ___. (emissions / emotions) → **emissions**"]}, {"key": "Habla", "items": ["\"The biggest problem in my city is ___.\""]}], "exercise": {"stem": "Cars produce a lot of ___.", "options": ["emissions", "emotions"], "answer": "emissions"}}, {"n": 2, "title": "Reciclar, reducir y reutilizar (recycle, reduce, reuse)", "sections": [{"key": "Tema", "items": ["hablar de las tres R y de cómo aplicarlas en casa."]}, {"key": "Vocabulario", "items": ["recycle (reciclar), reduce (reducir), reuse (reutilizar), plastic (plástico), bottle (botella)"]}, {"key": "Lectura", "items": ["We should reduce, reuse and recycle. Please recycle this plastic bottle."]}, {"key": "Notas", "items": ["*reduce* = usar menos. *reuse* = usar otra vez. *recycle* = convertir en algo nuevo.", "*recyclable* es un adjetivo: *a recyclable bottle* (una botella reciclable)."]}, {"key": "Ejercicio", "items": ["Please ___ this plastic bottle. (recycle / recyclable) → **recycle**"]}, {"key": "Habla", "items": ["\"I always try to ___ my ___.\""]}], "exercise": {"stem": "Please ___ this plastic bottle.", "options": ["recycle", "recyclable"], "answer": "recycle"}}, {"n": 3, "title": "Energía renovable (renewable, solar, wind)", "sections": [{"key": "Tema", "items": ["hablar de energías limpias y de sus ventajas."]}, {"key": "Vocabulario", "items": ["renewable (renovable), solar (solar), wind (viento), energy (energía), sun (sol)"]}, {"key": "Lectura", "items": ["Solar and wind power are renewable energies. Solar panels use the energy of the sun."]}, {"key": "Notas", "items": ["*renewable* = que no se acaba. Ejemplos: *solar, wind, water*.", "*reusable* = que se puede usar otra vez (una bolsa, un vaso). No es lo mismo."]}, {"key": "Ejercicio", "items": ["Solar and wind power are ___ energies. (renewable / reusable) → **renewable**"]}, {"key": "Habla", "items": ["\"___ power is a renewable energy.\""]}], "exercise": {"stem": "Solar and wind power are ___ energies.", "options": ["renewable", "reusable"], "answer": "renewable"}}, {"n": 4, "title": "Cambio climático (climate change, global warming)", "sections": [{"key": "Tema", "items": ["explicar qué es el cambio climático y sus efectos."]}, {"key": "Vocabulario", "items": ["climate (clima), warming (calentamiento), temperatures (temperaturas), rise (subir), planet (planeta)"]}, {"key": "Lectura", "items": ["Climate change is causing temperatures to rise. Global warming makes the ice melt."]}, {"key": "Notas", "items": ["*climate change* = cambio climático. *global warming* = calentamiento global.", "*weather* = tiempo atmosférico de hoy. *climate* = clima de muchos años."]}, {"key": "Ejercicio", "items": ["___ change affects the whole planet. (Climate / Weather) → **Climate**"]}, {"key": "Habla", "items": ["\"Climate change is causing ___.\""]}], "exercise": {"stem": "___ change affects the whole planet.", "options": ["Climate", "Weather"], "answer": "Climate"}}, {"n": 5, "title": "Hábitos para ahorrar (conserve, turn off)", "sections": [{"key": "Tema", "items": ["hablar de hábitos diarios que ayudan al planeta."]}, {"key": "Vocabulario", "items": ["conserve (conservar), turn off (apagar), lights (luces), water (agua), leave (salir, dejar)"]}, {"key": "Lectura", "items": ["Let's conserve water and turn off the lights when we leave."]}, {"key": "Notas", "items": ["*turn off* = apagar. *turn on* = encender.", "*conserve* = usar con cuidado para no gastar de más."]}, {"key": "Ejercicio", "items": ["Please ___ the lights when you leave. (turn off / turn on) → **turn off**"]}, {"key": "Habla", "items": ["\"I always ___ before I leave the house.\""]}], "exercise": {"stem": "Please ___ the lights when you leave.", "options": ["turn off", "turn on"], "answer": "turn off"}}, {"n": 6, "title": "Condicional y medio ambiente (If we used less...)", "sections": [{"key": "Tema", "items": ["hablar de lo que pasaría si cambiamos hábitos (segundo condicional)."]}, {"key": "Vocabulario", "items": ["used (usáramos), less (menos), oceans (océanos), cleaner (más limpios), cut down (talar)"]}, {"key": "Lectura", "items": ["If we used less plastic, the oceans would be cleaner. If we cut down fewer trees, the air would be better."]}, {"key": "Notas", "items": ["Segundo condicional: *If + past simple, would + verbo base*.", "Usa el pasado simple para algo que no pasa ahora: *If we used* (aunque sea presente)."]}, {"key": "Ejercicio", "items": ["If we ___ less plastic, the oceans would be cleaner. (used / use) → **used**"]}, {"key": "Habla", "items": ["\"If we ___, the ___ would be ___.\""]}], "exercise": {"stem": "If we ___ less plastic, the oceans would be cleaner.", "options": ["used", "use"], "answer": "used"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Air pollution is a serious problem in big cities. Plastic waste is damaging the oceans. We must recycle more and use less energy."]}, {"key": "Repaso", "items": ["contaminación y residuos, las tres R, energías renovables, cambio climático, hábitos de ahorro, segundo condicional con medio ambiente."]}, {"key": "Actividad de habla", "items": ["explica a alguien qué haces tú para cuidar el planeta y qué harías si tuvieras más dinero para ayudar."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases sobre tu ciudad: 3 con problemas y 3 con soluciones."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 emissions, 2 recycle, 3 renewable, 4 Climate, 5 turn off, 6 used, 7 pollution, r."]}, {"key": "Vocabulario", "items": ["turn down (rechazar, bajar), turn up (subir, aparecer), job (trabajo), offer (oferta), music (música)"]}, {"key": "Lectura", "items": ["She turned down the job offer. Can you turn down the music? It's too loud."]}, {"key": "Notas", "items": ["*turn down* = rechazar (*turn down an offer*) o bajar el volumen.", "*turn up* = subir el volumen o aparecer (*he turned up late*)."]}, {"key": "Ejercicio", "items": ["Can you ___ the TV? I can't hear it. (turn up / turn out) → **turn up**"]}, {"key": "Habla", "items": ["\"I turned down ___. Can you turn ___?\""]}], "exercise": {"stem": "Can you ___ the TV? I can't hear it.", "options": ["turn up", "turn out"], "answer": "turn up"}}, {"n": 5, "title": "Run out of y get on with", "sections": [{"key": "Tema", "items": ["quedarse sin algo y seguir con algo."]}, {"key": "Vocabulario", "items": ["run out of (quedarse sin), get on with (seguir con, llevarse bien), milk (leche), work (trabajo), together (juntos)"]}, {"key": "Lectura", "items": ["We ran out of milk. Can you buy some? I want to get on with my work."]}, {"key": "Notas", "items": ["*run out of* + sustantivo: *run out of milk* = *se acabó la leche*.", "*get on with* = seguir con algo, o llevarse bien con alguien."]}, {"key": "Ejercicio", "items": ["We ran ___ milk. Can you buy some? (out of / out) → **out of**"]}, {"key": "Habla", "items": ["\"We've run out of ___. I get on well with ___.\""]}], "exercise": {"stem": "We ran ___ milk. Can you buy some?", "options": ["out of", "out"], "answer": "out of"}}, {"n": 6, "title": "Come across y find out", "sections": [{"key": "Tema", "items": ["encontrar algo por casualidad y descubrir algo."]}, {"key": "Vocabulario", "items": ["come across (encontrar por casualidad), find out (descubrir, averiguar), photo (foto), box (caja), result (resultado)"]}, {"key": "Lectura", "items": ["I came across an old photo in a box. I want to find out the result."]}, {"key": "Notas", "items": ["*come across* = encontrar algo sin buscarlo.", "*find out* = descubrir o averiguar una información."]}, {"key": "Ejercicio", "items": ["I came ___ an old photo in the box. (across / over) → **across**"]}, {"key": "Habla", "items": ["\"I came across ___. I want to find out ___.\""]}], "exercise": {"stem": "I came ___ an old photo in the box.", "options": ["across", "over"], "answer": "across"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I'll look into the problem tomorrow. Please turn off the lights when you leave. She ran into an old friend at the station."]}, {"key": "Repaso", "items": ["*look up / look after*, *give up / give back*, *put off / put on*, *turn down / turn up*, *run out of / get on with*, *come across / find out*."]}, {"key": "Regla clave", "items": ["si el objeto es un pronombre (*it, them*), va en medio: *turn it down*, *put it off*, *look it up*. No se puede decir *look up it*."]}, {"key": "Actividad de habla", "items": ["di 3 frases con phrasal verbs sobre tu día (*I came across...*, *I put off...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases usando un phrasal verb distinto en cada una."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 look up, 2 looks after, 3 give up, 4 put off, 5 turned down, 6 turn up, 7 out of, 8 across, 9 put on, 10 find out"]}], "exercise": null}], "exam": [{"stem": "I'll ___ the word in the dictionary.", "options": ["look up", "look at"], "answer": "look up"}, {"stem": "She ___ her grandparents every weekend.", "options": ["looks after", "looks for"], "answer": "looks after"}, {"stem": "Don't ___! You can do it.", "options": ["give up", "give back"], "answer": "give up"}, {"stem": "We had to ___ the meeting.", "options": ["put off", "put on"], "answer": "put off"}, {"stem": "She ___ the job offer.", "options": ["turned down", "turned up"], "answer": "turned down"}, {"stem": "Can you ___ the TV? I can't hear it.", "options": ["turn up", "turn out"], "answer": "turn up"}, {"stem": "We ran ___ milk.", "options": ["out of", "out"], "answer": "out of"}, {"stem": "I came ___ an old photo in the box.", "options": ["across", "over"], "answer": "across"}, {"stem": "Please ___ your coat before going out.", "options": ["put on", "put off"], "answer": "put on"}, {"stem": "I need to ___ how the machine works.", "options": ["find out", "find up"], "answer": "find out"}]}, {"id": "b2-u10", "level": "B2", "num": 10, "title": "Opiniones y debate", "meta": "dar opiniones, estar de acuerdo o en desacuerdo, contrastar ideas y cerrar un debate.", "lessons": [{"n": 1, "title": "Expresar opinión (In my opinion, I think, I believe)", "sections": [{"key": "Tema", "items": ["decir lo que piensas de forma clara."]}, {"key": "Vocabulario", "items": ["opinion (opinión), believe (creer), film (película), long (largo), cities (ciudades)"]}, {"key": "Lectura", "items": ["In my opinion, cities should have more parks. I believe the film was too long."]}, {"key": "Notas", "items": ["*In my opinion* = en mi opinión.", "*I think / I believe* = creo que. *believe* suena un poco más formal."]}, {"key": "Ejercicio", "items": ["___ my opinion, the film was too long. (In / On) → **In**"]}, {"key": "Habla", "items": ["\"In my opinion, ___. I think ___.\""]}], "exercise": {"stem": "___ my opinion, the film was too long.", "options": ["In", "On"], "answer": "In"}}, {"n": 2, "title": "Estar de acuerdo o en desacuerdo (agree, disagree)", "sections": [{"key": "Tema", "items": ["responder a la opinión de otra persona."]}, {"key": "Vocabulario", "items": ["agree (estar de acuerdo), disagree (no estar de acuerdo), point (punto), completely (completamente), afraid (me temo)"]}, {"key": "Lectura", "items": ["I completely agree with you on that point. I'm afraid I disagree."]}, {"key": "Notas", "items": ["*agree with* + persona: *I agree with you*.", "*disagree with*: *I disagree with him*.", "*I'm afraid* suaviza el desacuerdo: es más educado."]}, {"key": "Ejercicio", "items": ["I completely ___ with you on that point. (agree / agree to) → **agree**"]}, {"key": "Habla", "items": ["\"I (completely) agree with ___. I'm afraid I disagree.\""]}], "exercise": {"stem": "I completely ___ with you on that point.", "options": ["agree", "agree to"], "answer": "agree"}}, {"n": 3, "title": "Contrastar ideas (although, but, however)", "sections": [{"key": "Tema", "items": ["decir algo bueno y algo malo en la misma frase."]}, {"key": "Vocabulario", "items": ["although (aunque), however (sin embargo), but (pero), expensive (caro), worth it (vale la pena)"]}, {"key": "Lectura", "items": ["Although it is expensive, it is worth it. I see your point, but I disagree."]}, {"key": "Notas", "items": ["*Although + frase*, *frase*. No se usa *but* con *although* en la misma frase.", "*However* va al inicio de una frase nueva o entre comas: *However, ...*."]}, {"key": "Ejercicio", "items": ["___ it is expensive, it is worth it. (Although / Because) → **Although**"]}, {"key": "Habla", "items": ["\"Although ___, I ___.\""]}], "exercise": {"stem": "___ it is expensive, it is worth it.", "options": ["Although", "Because"], "answer": "Although"}}, {"n": 4, "title": "Matizar (It depends, To be honest)", "sections": [{"key": "Tema", "items": ["dar una respuesta sin ser absoluto."]}, {"key": "Vocabulario", "items": ["depends (depende), honest (honesto), sure (seguro), situation (situación), to some extent (hasta cierto punto)"]}, {"key": "Lectura", "items": ["It depends on the situation. To be honest, I'm not sure."]}, {"key": "Notas", "items": ["*It depends on...* = depende de...", "*To be honest* = para ser sincero.", "*to some extent* = hasta cierto punto."]}, {"key": "Ejercicio", "items": ["To be ___, I don't like it. (honest / honestly) → **honest**"]}, {"key": "Habla", "items": ["\"It depends on ___. To be honest, ___.\""]}], "exercise": {"stem": "To be ___, I don't like it.", "options": ["honest", "honestly"], "answer": "honest"}}, {"n": 5, "title": "Argumentar (because, so, first, second)", "sections": [{"key": "Tema", "items": ["dar razones para tu opinión."]}, {"key": "Vocabulario", "items": ["because (porque), so (así que), first (primero), second (segundo), saves (ahorra)"]}, {"key": "Lectura", "items": ["The city should ban cars because it reduces pollution. First, it saves money. Second, it helps the planet."]}, {"key": "Notas", "items": ["*because* + razón. *so* + consecuencia.", "Ordena tus razones con *First, Second, Finally*."]}, {"key": "Ejercicio", "items": ["The city should ban cars ___ it reduces pollution. (because / although) → **because**"]}, {"key": "Habla", "items": ["\"First, ___. Second, ___.\""]}], "exercise": {"stem": "The city should ban cars ___ it reduces pollution.", "options": ["because", "although"], "answer": "because"}}, {"n": 6, "title": "Cerrar un debate (In conclusion, To sum up)", "sections": [{"key": "Tema", "items": ["terminar tu argumento con un resumen."]}, {"key": "Vocabulario", "items": ["conclusion (conclusión), sum up (resumir), both sides (ambos lados), good points (buenos puntos), act (actuar)"]}, {"key": "Lectura", "items": ["To sum up, both sides have good points. In conclusion, we need to act now."]}, {"key": "Notas", "items": ["*In conclusion* = en conclusión.", "*To sum up* = para resumir.", "*On the other hand* = por otro lado (para contrastar)."]}, {"key": "Ejercicio", "items": ["In ___, we need to act now. (conclusion / conclude) → **conclusion**"]}, {"key": "Habla", "items": ["\"To sum up, ___.\""]}], "exercise": {"stem": "In ___, we need to act now.", "options": ["conclusion", "conclude"], "answer": "conclusion"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["In my opinion, schools should teach more practical skills. I see your point, but I disagree about the homework. Let's agree to differ."]}, {"key": "Repaso", "items": ["opinión (*In my opinion*), acuerdo y desacuerdo, contraste (*although, however*), matices (*It depends*), argumentos (*because, first, second*), cierre (*In conclusion*)."]}, {"key": "Actividad de habla", "items": ["da tu opinión sobre un tema (la tecnología, el trabajo, la ciudad). Usa al menos *In my opinion*, *although* y *To sum up*."]}, {"key": "Actividad escrita", "items": ["escribe un párrafo corto (6 frases) con tu opinión sobre un tema y cierra con *In conclusion*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 In, 2 agree, 3 but, 4 Although, 5 on, 6 honest, 7 because, 8 In, 9 On, 10 up"]}], "exercise": null}], "exam": [{"stem": "___ my opinion, the film was too long.", "options": ["In", "On"], "answer": "In"}, {"stem": "I completely ___ with you on that point.", "options": ["agree", "agree to"], "answer": "agree"}, {"stem": "I see your point, ___ I disagree.", "options": ["but", "so"], "answer": "but"}, {"stem": "___ it is expensive, it is worth it.", "options": ["Although", "Because"], "answer": "Although"}, {"stem": "It depends ___ the situation.", "options": ["on", "in"], "answer": "on"}, {"stem": "To be ___, I'm not sure.", "options": ["honest", "honestly"], "answer": "honest"}, {"stem": "The city should ban cars ___ it reduces pollution.", "options": ["because", "although"], "answer": "because"}, {"stem": "___ conclusion, we need to act now.", "options": ["In", "On"], "answer": "In"}, {"stem": "___ the other hand, it could be expensive.", "options": ["On", "In"], "answer": "On"}, {"stem": "To sum ___, both sides have good points.", "options": ["up", "out"], "answer": "up"}]}, {"id": "c1-u1", "level": "C1", "num": 1, "title": "Inversión y énfasis", "meta": "dar énfasis a una frase cambiando el orden de las palabras (inversión).", "lessons": [{"n": 1, "title": "Adverbios negativos al inicio (Never, Rarely, Seldom)", "sections": [{"key": "Tema", "items": ["poner un adverbio negativo al inicio para dar énfasis."]}, {"key": "Vocabulario", "items": ["never (nunca), rarely (raramente), seldom (rara vez), seen (visto), eat out (comer fuera)"]}, {"key": "Lectura", "items": ["Never have I seen such a beautiful view. Rarely do we eat out on weekdays."]}, {"key": "Notas", "items": ["Adverbio negativo al inicio + auxiliar + sujeto + verbo.", "*Never have I seen...* = *Nunca he visto...* (más fuerte que *I have never seen...*).", "Con *do / does / did*: *Rarely do we eat out*."]}, {"key": "Ejercicio", "items": ["Never ___ I seen such a beautiful view. (have / had) → **have**"]}, {"key": "Habla", "items": ["\"Never have I ___. Rarely do I ___.\""]}], "exercise": {"stem": "Never ___ I seen such a beautiful view.", "options": ["have", "had"], "answer": "have"}}, {"n": 2, "title": "Not only... but also", "sections": [{"key": "Tema", "items": ["unir dos ideas positivas con énfasis."]}, {"key": "Vocabulario", "items": ["fast (rápido), cheap (barato), reliable (fiable), not only (no solo), but also (sino también)"]}, {"key": "Lectura", "items": ["Not only is it fast, but it is also very cheap."]}, {"key": "Notas", "items": ["*Not only* + auxiliar + sujeto: *Not only is it...*", "*but also* + el resto de la frase.", "El verbo *to be* se coloca antes del sujeto."]}, {"key": "Ejercicio", "items": ["Not only ___ fast, but also very cheap. (is it / it is) → **is it**"]}, {"key": "Habla", "items": ["\"Not only is ___, but it is also ___.\""]}], "exercise": {"stem": "Not only ___ fast, but also very cheap.", "options": ["is it", "it is"], "answer": "is it"}}, {"n": 3, "title": "No sooner... than, Hardly... when, Scarcely... when", "sections": [{"key": "Tema", "items": ["decir que una cosa pasó justo antes de otra."]}, {"key": "Vocabulario", "items": ["arrived (llegó), sat down (me senté), rain (llover), phone (teléfono), rang (sonó)"]}, {"key": "Lectura", "items": ["No sooner had she arrived than it started to rain. Hardly had I sat down when the phone rang."]}, {"key": "Notas", "items": ["*No sooner had... than* = *apenas... cuando*.", "*Hardly / Scarcely had... when* = *apenas... cuando*.", "Siempre se usa el pasado perfecto (*had* + participio)."]}, {"key": "Ejercicio", "items": ["No sooner had she arrived ___ it started to rain. (than / when) → **than**"]}, {"key": "Habla", "items": ["\"No sooner had I ___ than ___.\""]}], "exercise": {"stem": "No sooner had she arrived ___ it started to rain.", "options": ["than", "when"], "answer": "than"}}, {"n": 4, "title": "Only after / only when / only then", "sections": [{"key": "Tema", "items": ["decir que algo solo pasa después de otra cosa."]}, {"key": "Vocabulario", "items": ["only (solo), exam (examen), relax (relajarse), realised (me di cuenta), mistake (error)"]}, {"key": "Lectura", "items": ["Only after the exam did she relax. Only then did I realise my mistake."]}, {"key": "Notas", "items": ["*Only after / only when / only then* al inicio de la frase.", "Después va auxiliar + sujeto: *Only after the exam did she relax*."]}, {"key": "Ejercicio", "items": ["Only after the exam ___ she relax. (did / could) → **did**"]}, {"key": "Habla", "items": ["\"Only after ___ did I ___.\""]}], "exercise": {"stem": "Only after the exam ___ she relax.", "options": ["did", "could"], "answer": "did"}}, {"n": 5, "title": "Little y seldom en inversión", "sections": [{"key": "Tema", "items": ["dar énfasis con *little* y *seldom*."]}, {"key": "Vocabulario", "items": ["little (poco), seldom (rara vez), realised (se dio cuenta), agreed (aceptó), complain (quejarse)"]}, {"key": "Lectura", "items": ["Little did he know what was coming. Seldom have I heard such honest advice."]}, {"key": "Notas", "items": ["*Little did he know...* = *poco sabía él...* (sirve para ironía o sorpresa).", "*Seldom + auxiliar + sujeto*: *Seldom have I heard...*"]}, {"key": "Ejercicio", "items": ["Seldom ___ we have seen such good service. (have / had) → **have**"]}, {"key": "Habla", "items": ["\"Little did I know...\""]}], "exercise": {"stem": "Seldom ___ we have seen such good service.", "options": ["have", "had"], "answer": "have"}}, {"n": 6, "title": "Inversión condicional (Had I known, Should you need)", "sections": [{"key": "Tema", "items": ["usar inversión en lugar de *if*, en un tono formal."]}, {"key": "Vocabulario", "items": ["known (sabido), traffic (tráfico), left (salido), need (necesitar), call (llamar)"]}, {"key": "Lectura", "items": ["Had I known about the traffic, I would have left earlier. Should you need help, call me."]}, {"key": "Notas", "items": ["*Had I known* = *If I had known* (sin *if*).", "*Should you need* = *If you need* (formal).", "Así se hace la frase más formal y elegante."]}, {"key": "Ejercicio", "items": ["Should you ___ help, call me. (need / needed) → **need**"]}, {"key": "Habla", "items": ["\"Had I known, I would have ___.\""]}], "exercise": {"stem": "Should you ___ help, call me.", "options": ["need", "needed"], "answer": "need"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Never have I seen such a beautiful view. Little did we know what would happen next. Rarely do people admit their mistakes."]}, {"key": "Repaso", "items": ["adverbios negativos al inicio, *not only... but also*, *no sooner... than*, *hardly... when*, *only after / only then*, *little / seldom*, inversión condicional."]}, {"key": "Actividad de habla", "items": ["di 3 frases con inversión sobre tu vida (*Never have I...*, *Only after... did I...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con inversión sobre un tema que te guste."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have, 2 do, 3 than, 4 when, 5 did, 6 would have, 7 need, 8 is it, 9 have we seen, 10 should you open"]}], "exercise": null}], "exam": [{"stem": "Never ___ I seen such a beautiful view.", "options": ["have", "had"], "answer": "have"}, {"stem": "Rarely ___ we eat out on weekdays.", "options": ["do", "are"], "answer": "do"}, {"stem": "No sooner had she arrived ___ it started to rain.", "options": ["than", "when"], "answer": "than"}, {"stem": "Hardly had I sat down ___ the phone rang.", "options": ["when", "than"], "answer": "when"}, {"stem": "Only after the exam ___ she relax.", "options": ["did", "has"], "answer": "did"}, {"stem": "Had I known the traffic, I ___ left earlier.", "options": ["would have", "would"], "answer": "would have"}, {"stem": "Should you ___ help, call me.", "options": ["need", "needed"], "answer": "need"}, {"stem": "Not only ___ fast, but also very cheap.", "options": ["is it", "it is"], "answer": "is it"}, {"stem": "Seldom ___ such good service.", "options": ["we have seen", "have we seen"], "answer": "have we seen"}, {"stem": "Under no circumstances ___ the door.", "options": ["should you open", "you should open"], "answer": "should you open"}]}, {"id": "c1-u2", "level": "C1", "num": 2, "title": "Gerundio e infinitivo avanzados", "meta": "saber cuándo usar *-ing* o *to + verbo*, y cómo cambia el significado según el verbo.", "lessons": [{"n": 1, "title": "Verbos seguidos de -ing (avoid, consider, enjoy, mind)", "sections": [{"key": "Tema", "items": ["usar *-ing* después de verbos como *avoid, consider, enjoy, mind*."]}, {"key": "Vocabulario", "items": ["avoid (evitar), consider (considerar), enjoy (disfrutar), mind (importar, molestar), arriving (llegar)"]}, {"key": "Lectura", "items": ["I avoid arriving late to work. Would you mind opening the window? She enjoys cooking."]}, {"key": "Notas", "items": ["*avoid, consider, enjoy, mind, finish, suggest* + *-ing*.", "*Would you mind* + *-ing* = ¿te importaría...?", "Nunca se usa *to* después de estos verbos."]}, {"key": "Ejercicio", "items": ["I avoid ___ late to work. (arriving / arrive) → **arriving**"]}, {"key": "Habla", "items": ["\"I enjoy ___. I avoid ___.\""]}], "exercise": {"stem": "I avoid ___ late to work.", "options": ["arriving", "arrive"], "answer": "arriving"}}, {"n": 2, "title": "Verbos seguidos de infinitivo (decide, manage, afford, hope)", "sections": [{"key": "Tema", "items": ["usar *to + verbo* después de *decide, manage, afford, hope*."]}, {"key": "Vocabulario", "items": ["decide (decidir), manage (conseguir, lograr), afford (permitirse), hope (esperar), cancel (cancelar)"]}, {"key": "Lectura", "items": ["They decided to cancel the project. We managed to finish on time. I can't afford to buy a house."]}, {"key": "Notas", "items": ["*decide, manage, afford, hope, promise, refuse, agree* + *to*.", "*manage to* = conseguir hacer algo, aunque sea difícil."]}, {"key": "Ejercicio", "items": ["They decided ___ the project. (to cancel / cancelling) → **to cancel**"]}, {"key": "Habla", "items": ["\"I decided to ___. I managed to ___.\""]}], "exercise": {"stem": "They decided ___ the project.", "options": ["to cancel", "cancelling"], "answer": "to cancel"}}, {"n": 3, "title": "Cambio de significado (remember, forget)", "sections": [{"key": "Tema", "items": ["entender por qué cambia el significado con *-ing* o *to*."]}, {"key": "Vocabulario", "items": ["remember (recordar), forget (olvidar), seeing (ver), meet (conocer), post (enviar, correo)"]}, {"key": "Lectura", "items": ["I'll never forget seeing Paris for the first time. Please remember to post the letter."]}, {"key": "Notas", "items": ["*remember / forget + -ing*: se refiere a algo que pasó (recuerdo algo ya hecho).", "*remember / forget + to*: se refiere a algo que hay que hacer (no olvidar hacer algo)."]}, {"key": "Ejercicio", "items": ["I'll never forget ___ Paris. (seeing / to see) → **seeing**"]}, {"key": "Habla", "items": ["\"I remember ___. Don't forget to ___.\""]}], "exercise": {"stem": "I'll never forget ___ Paris.", "options": ["seeing", "to see"], "answer": "seeing"}}, {"n": 4, "title": "Stop (stop + -ing vs. stop to)", "sections": [{"key": "Tema", "items": ["diferenciar *stop -ing* y *stop to*."]}, {"key": "Vocabulario", "items": ["stop (parar), answer (responder), phone (teléfono), walking (caminando), smoking (fumar)"]}, {"key": "Lectura", "items": ["She stopped walking to answer her phone. He stopped smoking last year."]}, {"key": "Notas", "items": ["*stop + -ing* = dejar de hacer algo (*stopped smoking*).", "*stop to + verbo* = parar lo que haces para hacer otra cosa (*stopped to answer*)."]}, {"key": "Ejercicio", "items": ["She stopped ___ to answer her phone. (walking / to walk) → **walking**"]}, {"key": "Habla", "items": ["\"I stopped ___. I stopped to ___.\""]}], "exercise": {"stem": "She stopped ___ to answer her phone.", "options": ["walking", "to walk"], "answer": "walking"}}, {"n": 5, "title": "Try (try to vs. try + -ing)", "sections": [{"key": "Tema", "items": ["diferenciar *try to* y *try + -ing*."]}, {"key": "Vocabulario", "items": ["try (intentar, probar), open (abrir), stuck (atascado), new (nuevo), food (comida)"]}, {"key": "Lectura", "items": ["I tried to open the window, but it was stuck. Try using the new app."]}, {"key": "Notas", "items": ["*try to + verbo* = intentar algo (puede que no funcione).", "*try + -ing* = probar algo para ver qué pasa (un experimento)."]}, {"key": "Ejercicio", "items": ["I tried ___ the window, but it was stuck. (opening / to open) → **to open**"]}, {"key": "Habla", "items": ["\"I tried to ___. I tried ___ to see.\""]}], "exercise": {"stem": "I tried ___ the window, but it was stuck.", "options": ["opening", "to open"], "answer": "to open"}}, {"n": 6, "title": "Preposición + -ing (interested in, good at, instead of)", "sections": [{"key": "Tema", "items": ["usar *-ing* después de preposiciones."]}, {"key": "Vocabulario", "items": ["interested (interesado), good at (bueno en), instead of (en vez de), languages (idiomas), watch (ver)"]}, {"key": "Lectura", "items": ["She is good at learning languages. Instead of watching TV, we went for a walk."]}, {"key": "Notas", "items": ["Después de una preposición siempre va *-ing*: *good at learning*, *interested in reading*.", "Nunca se usa *to + verbo* después de una preposición."]}, {"key": "Ejercicio", "items": ["She is good at ___ languages. (learning / to learn) → **learning**"]}, {"key": "Habla", "items": ["\"I'm interested in ___. I'm good at ___.\""]}], "exercise": {"stem": "She is good at ___ languages.", "options": ["learning", "to learn"], "answer": "learning"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I avoid driving in the city centre. She considered moving abroad. We enjoy cooking together. He doesn't mind waiting."]}, {"key": "Repaso", "items": ["verbos + *-ing*, verbos + *to*, *remember / forget*, *stop*, *try*, preposición + *-ing*."]}, {"key": "Actividad de habla", "items": ["di 3 cosas que disfrutas hacer, 2 cosas que decidiste hacer y 1 cosa que evitas."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases usando *remember to / remember -ing* y *stop -ing / stop to*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 arriving, 2 to cancel, 3 seeing, 4 walking, 5 opening, 6 learning, 7 watching, 8 to buy, 9 taking, 10 seeing"]}], "exercise": null}], "exam": [{"stem": "I avoid ___ late to work.", "options": ["arriving", "arrive"], "answer": "arriving"}, {"stem": "They decided ___ the project.", "options": ["to cancel", "cancelling"], "answer": "to cancel"}, {"stem": "I'll never forget ___ Paris.", "options": ["seeing", "to see"], "answer": "seeing"}, {"stem": "She stopped ___ to answer her phone.", "options": ["walking", "to walk"], "answer": "walking"}, {"stem": "It was too hot, so I tried ___ the window. It helped.", "options": ["opening", "to open"], "answer": "opening"}, {"stem": "She is good at ___ languages.", "options": ["learning", "to learn"], "answer": "learning"}, {"stem": "Instead of ___ TV, we went for a walk.", "options": ["watching", "to watch"], "answer": "watching"}, {"stem": "I can't afford ___ a new car.", "options": ["to buy", "buying"], "answer": "to buy"}, {"stem": "He suggested ___ a taxi.", "options": ["taking", "to take"], "answer": "taking"}, {"stem": "We look forward to ___ you.", "options": ["seeing", "see"], "answer": "seeing"}]}, {"id": "c1-u3", "level": "C1", "num": 3, "title": "Modales en pasado", "meta": "hablar de lo que pasó, lo que probablemente pasó y lo que debiste hacer, con modales en pasado.", "lessons": [{"n": 1, "title": "Deducciones sobre el pasado (must have, can't have)", "sections": [{"key": "Tema", "items": ["decir qué crees que pasó, usando lo que ves ahora."]}, {"key": "Vocabulario", "items": ["lights (luces), home (en casa), passed (aprobado), studied (estudió), hard (duro)"]}, {"key": "Lectura", "items": ["The lights were on, so he must have been home. He studied hard, so he must have passed."]}, {"key": "Notas", "items": ["*must have* + participio = seguro que pasó (deducción positiva).", "*can't have* + participio = seguro que no pasó (deducción negativa).", "*can't have* nunca se usa para algo positivo."]}, {"key": "Ejercicio", "items": ["The lights were on, so he must ___ home. (have been / be) → **have been**"]}, {"key": "Habla", "items": ["\"She must have ___. She can't have ___.\""]}], "exercise": {"stem": "The lights were on, so he must ___ home.", "options": ["have been", "be"], "answer": "have been"}}, {"n": 2, "title": "Posibilidades en el pasado (might have, could have)", "sections": [{"key": "Tema", "items": ["decir que algo quizá pasó, pero no seguro."]}, {"key": "Vocabulario", "items": ["might (quizá), could (podría), keys (llaves), office (oficina), left (dejado)"]}, {"key": "Lectura", "items": ["I might have left the keys at the office. He could have missed the bus."]}, {"key": "Notas", "items": ["*might have* / *could have* + participio = quizá (sin estar seguro).", "*might* y *could* son parecidos aquí, pero *might* suena más incierto."]}, {"key": "Ejercicio", "items": ["I ___ have left the keys at the office. (might / must) → **might**"]}, {"key": "Habla", "items": ["\"I might have ___. He could have ___.\""]}], "exercise": {"stem": "I ___ have left the keys at the office.", "options": ["might", "must"], "answer": "might"}}, {"n": 3, "title": "Críticas y arrepentimientos (should have, shouldn't have)", "sections": [{"key": "Tema", "items": ["decir lo que debiste o no debiste hacer."]}, {"key": "Vocabulario", "items": ["should have (debiste haber), shouldn't have (no debiste haber), told (dicho), help (ayudar), called (llamado)"]}, {"key": "Lectura", "items": ["You should have told me! I would have helped. I shouldn't have said that."]}, {"key": "Notas", "items": ["*should have* + participio = debiste haber hecho algo (y no lo hiciste).", "*shouldn't have* + participio = no debiste haber hecho algo (y lo hiciste)."]}, {"key": "Ejercicio", "items": ["You ___ told me! I would have helped. (should have / should) → **should have**"]}, {"key": "Habla", "items": ["\"I should have ___. I shouldn't have ___.\""]}], "exercise": {"stem": "You ___ told me! I would have helped.", "options": ["should have", "should"], "answer": "should have"}}, {"n": 4, "title": "Innecesario (needn't have)", "sections": [{"key": "Tema", "items": ["decir que hiciste algo que no era necesario."]}, {"key": "Vocabulario", "items": ["needn't (no hacía falta), umbrella (paraguas), sun (sol), came out (salió), bought (comprado)"]}, {"key": "Lectura", "items": ["I needn't have brought an umbrella. The sun came out."]}, {"key": "Notas", "items": ["*needn't have* + participio = hiciste algo que no era necesario (pero lo hiciste).", "No confundir con *mustn't* (prohibición)."]}, {"key": "Ejercicio", "items": ["I ___ have brought an umbrella. The sun came out. (needn't / mustn't) → **needn't**"]}, {"key": "Habla", "items": ["\"I needn't have ___.\""]}], "exercise": {"stem": "I ___ have brought an umbrella. The sun came out.", "options": ["needn't", "mustn't"], "answer": "needn't"}}, {"n": 5, "title": "Deducción negativa en el pasado (can't have, couldn't have)", "sections": [{"key": "Tema", "items": ["decir que algo no pudo pasar, según la evidencia."]}, {"key": "Vocabulario", "items": ["passed (aprobado), studied (estudió), angry (enfadada), laughing (riendo), invited (invitados)"]}, {"key": "Lectura", "items": ["He can't have passed the exam. She can't have been angry. They couldn't have gone to the party."]}, {"key": "Notas", "items": ["*can't have* = seguro que no pasó (muy probable).", "*couldn't have* = no era posible que pasara."]}, {"key": "Ejercicio", "items": ["She ___ have been angry. She was laughing. (can't / needn't) → **can't**"]}, {"key": "Habla", "items": ["\"He can't have ___. They couldn't have ___.\""]}], "exercise": {"stem": "She ___ have been angry. She was laughing.", "options": ["can't", "needn't"], "answer": "can't"}}, {"n": 6, "title": "Hábitos del pasado (used to, would)", "sections": [{"key": "Tema", "items": ["hablar de hábitos o situaciones que ya no pasan."]}, {"key": "Vocabulario", "items": ["used to (solíamos), would (solía), kids (niños), summer (verano), go (ir)"]}, {"key": "Lectura", "items": ["We used to go to the beach every summer when we were kids. My father would tell us stories every night."]}, {"key": "Notas", "items": ["*used to* + verbo = hábito o situación del pasado que ya no existe.", "*would* + verbo = solo para hábitos (no para estados como *be, have*).", "Ojo: *use to* está mal escrito. Siempre es *used to*."]}, {"key": "Ejercicio", "items": ["We ___ go to the beach every summer. (used to / use to) → **used to**"]}, {"key": "Habla", "items": ["\"I used to ___. I would ___ when I was a kid.\""]}], "exercise": {"stem": "We ___ go to the beach every summer.", "options": ["used to", "use to"], "answer": "used to"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["They must have left early, because the house is empty. You needn't have brought a gift. She might have been ill."]}, {"key": "Repaso", "items": ["*must have, can't have, might have, could have, should have, shouldn't _, I would ___.\""]}], "exercise": {"stem": "___ your help, I would have failed.", "options": ["Without", "Within"], "answer": "Without"}}, {"n": 6, "title": "I wish con pasado perfecto", "sections": [{"key": "Tema", "items": ["expresar arrepentimiento sobre el pasado."]}, {"key": "Vocabulario", "items": ["wish (desear), more time (más tiempo), last week (la semana pasada), knew (sabía), answer (respuesta)"]}, {"key": "Lectura", "items": ["I wish I had had more time last week. I wish I had known the answer."]}, {"key": "Notas", "items": ["*I wish* + pasado perfecto = deseo sobre algo que no pasó.", "*I wish* + pasado simple = deseo sobre el presente (*I wish I knew*)."]}, {"key": "Ejercicio", "items": ["I wish I ___ more time last week. (had had / have had) → **had had**"]}, {"key": "Habla", "items": ["\"I wish I had ___.\""]}], "exercise": {"stem": "I wish I ___ more time last week.", "options": ["had had", "have had"], "answer": "had had"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["If I had studied law, I would have a different job today. If she hadn't moved to London, she wouldn't know so many people."]}, {"key": "Repaso", "items": ["mixto pasado → presente, mixto presente → pasado, *wouldn't be* con resultado actual, *had been*, *without / but for*, *I wish* + pasado perfecto."]}, {"key": "Actividad de habla", "items": ["di 2 frases que cambian tu vida hoy (*If I had...*, *I would be...*) y 2 frases sobre tu vida pasada (*If I were..., I would have...*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con condicionales mixtos."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 would be, 2 would have, 3 wouldn't be, 4 had been, 5 Without, 6 had had, 7 would have got, 8 would have helped, 9 hadn't been, 10 knew"]}], "exercise": null}], "exam": [{"stem": "If I had studied law, I ___ a lawyer now.", "options": ["would be", "would have been"], " _.\""]}], "exercise": {"stem": "___, the plan is expensive. However, it works.", "options": ["Admittedly", "Consequently"], "answer": "Admittedly"}}, {"n": 2, "title": "Rebatir (That may be true, but...)", "sections": [{"key": "Tema", "items": ["responder a un argumento sin ser agresivo."]}, {"key": "Vocabulario", "items": ["may (puede), true (verdad), prove (probar), point (punto), argument (argumento)"]}, {"key": "Lectura", "items": ["That may be true, but it doesn't prove the point."]}, {"key": "Notas", "items": ["*That may be true, but...* = puede que sea verdad, pero...", "Es una forma educada de rebatir."]}, {"key": "Ejercicio", "items": ["That may be true, ___ it doesn't prove the point. (but / so) → **but**"]}, {"key": "Habla", "items": ["\"That may be true, but ___.\""]}], "exercise": {"stem": "That may be true, ___ it doesn't prove the point.", "options": ["but", "so"], "answer": "but"}}, {"n": 3, "title": "Contraargumentos (On the contrary, Far from)", "sections": [{"key": "Tema", "items": ["decir que lo contrario es verdad."]}, {"key": "Vocabulario", "items": ["contrary (contrario), evidence (evidencia), supports (apoya), view (opinión), helping (ayudar)"]}, {"key": "Lectura", "items": ["On the contrary, the evidence supports my view. Far from helping, the policy made things worse."]}, {"key": "Notas", "items": ["*On the contrary* = al contrario.", "*Far from + -ing* = lejos de (algo), todo lo contrario."]}, {"key": "Ejercicio", "items": ["___ the contrary, the evidence supports my view. (On / In) → **On**"]}, {"key": "Habla", "items": ["\"On the contrary, ___.\""]}], "exercise": {"stem": "___ the contrary, the evidence supports my view.", "options": ["On", "In"], "answer": "On"}}, {"n": 4, "title": "Énfasis en un argumento (Above all, What's more)", "sections": [{"key": "Tema", "items": ["poner la razón más importante al final o al principio."]}, {"key": "Vocabulario", "items": ["above all (sobre todo), what's more (además), protect (proteger), children
