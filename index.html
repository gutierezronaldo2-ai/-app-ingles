// ---------- escucha y repite ----------
const CONTR = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is",
  "that's":"that is","what's":"what is","there's":"there is","here's":"here is","let's":"let us","don't":"do not","doesn't":"does not",
  "didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","can't":"can not","cannot":"can not",
  "won't":"will not","haven't":"have not","hasn't":"has not","hadn't":"had not","wouldn't":"would not","couldn't":"could not",
  "shouldn't":"should not","i've":"i have","i'll":"i will","i'd":"i would","you've":"you have","you'll":"you will","we've":"we have",
  "we'll":"we will","they've":"they have","they'll":"they will"};
const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen',
  'fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){ return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : ''); }
// palabras normalizadas de un texto: sin mayúsculas ni signos; "I'm" = "I am"; "25" = "twenty five"
function normWords(text){
  const out = [];
  String(text).toLowerCase().replace(/[’‘`]/g, "'").replace(/[-–—\/]/g, ' ').split(/\s+/).forEach(raw => {
    let t = raw.replace(/[^\p{L}\p{N}']/gu, '').replace(/^'+|'+$/g, '');
    if (!t) return;
    if (CONTR[t]) t = CONTR[t];
    else if (/^\d{1,2}$/.test(t)) t = numWords(+t);
    t.split(' ').forEach(w => out.push(w));
  });
  return out;
}
// compara palabra por palabra (alineación LCS): cada palabra de la frase sale como bien/mal, más la puntuación 0-100
function compareSpeech(ref, said){
  const toks = [];
  const rw = [];
  String(ref).split(/\s+/).filter(Boolean).forEach(t => {
    const ws = normWords(t);
    toks.push({t, from: rw.length, n: ws.length});
    ws.forEach(w => rw.push(w));
  });
  const sw = normWords(said);
  const R = rw.length, T = sw.length;
  const L = Array.from({length: R + 1}, () => new Array(T + 1).fill(0));
  for (let i = R - 1; i >= 0; i--) for (let j = T - 1; j >= 0; j--)
    L[i][j] = rw[i] === sw[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const hit = new Array(R).fill(false);
  for (let i = 0, j = 0; i < R && j < T;) {
    if (rw[i] === sw[j]) { hit[i] = true; i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) i++; else j++;
  }
  const matched = hit.filter(Boolean).length;
  const score = R === 0 ? 0 : Math.round(100 * matched / Math.max(R, T));   // las palabras de más también restan
  const tokens = toks.filter(x => x.n > 0).map(x => ({t: x.t, ok: hit.slice(x.from, x.from + x.n).every(Boolean)}));
  return {score, tokens, missed: tokens.filter(x => !x.ok).map(x => x.t.replace(/[^\p{L}\p{N}']/gu, ''))};
}
const READY_SCORE = 80;
function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function bestText(uid, n){
  const best = (S.speak || {})[uid + '-' + n];
  return best === undefined ? '' : `Mejor puntuación: ${best}% ${best >= READY_SCORE ? '✅ Lista' : ''}`;
}
let LAST_ATTEMPT = null;   // último intento de esta pantalla: {key, said, c}
function repBlock(uid, n){
  if (!lectureText(uid, n)) return '';
  const ok = speechSupported();
  const nomic = ok ? '' : '<p class="fb bad">Tu navegador no permite escuchar tu voz. Prueba con Chrome.</p>';
  LAST_ATTEMPT = null;
  return `<div class="rep" id="rep">
    <div class="rep-title">🎧 Escucha y repite</div>
    <p class="pcap">Escucha la lectura, pulsa «Repetir» y léela en voz alta. Después pulsa «Ver resultado».</p>
    <button class="btn ghost" id="rep-listen" onclick="repListen('${uid}',${n})">🔊 Escuchar</button>
    <button class="btn" id="rep-mic" onclick="repMic('${uid}',${n})" ${ok ? '' : 'disabled'}>🎤 Repetir</button>
    <button class="btn ghost" id="rep-show" onclick="repShow('${uid}',${n})" ${ok ? '' : 'disabled'}>📊 Ver resultado</button>
    ${nomic}
    <div id="rep-out" aria-live="polite"></div>
    <div class="pcap" id="rep-best">${bestText(uid, n)}</div>
  </div>`;
}
function repListen(uid, n){
  const b = document.getElementById('rep-listen'), m = document.getElementById('rep-mic');
  b.disabled = true; if (m) m.disabled = true;
  const back = () => { b.disabled = false; if (m && speechSupported()) m.disabled = false; };
  speakLesson(uid, n, back);
}
let REC = null;
function repMic(uid, n){
  const out = document.getElementById('rep-out'), mic = document.getElementById('rep-mic');
  if (REC) { REC.stop(); return; }                                  // segundo clic = terminar
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { out.innerHTML = '<p class="fb bad">Tu navegador no permite escuchar tu voz. Prueba con Chrome.</p>'; return; }
  if (CUR_AUDIO) { try { CUR_AUDIO.pause(); } catch(e){} }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const r = new R(); r.lang = 'en-US'; r.continuous = true; r.interimResults = false;   // sin resultados parciales
  let said = '', err = '';
  r.onresult = e => { said = ''; for (let i = 0; i < e.results.length; i++) said += ' ' + e.results[i][0].transcript; };
  r.onerror = e => { err = e.error || 'error'; };
  r.onend = () => {
    REC = null; mic.textContent = '🎤 Repetir';
    if (err === 'not-allowed' || err === 'service-not-allowed') { out.innerHTML = '<p class="fb bad">Permite el micrófono en el navegador y vuelve a intentarlo.</p>'; return; }
    if (!said.trim()) { out.innerHTML = '<p class="fb bad">No te escuché. Acércate al micrófono e inténtalo otra vez.</p>'; return; }
    repGuardar(uid, n, said);
    out.innerHTML = '<p class="fb ok">Listo, ya te escuché. Pulsa «Ver resultado».</p>';
  };
  REC = r;
  mic.textContent = '⏹ Terminar';
  out.innerHTML = '<p class="fb">Escuchando... lee la lectura y pulsa «Terminar» cuando acabes.</p>';
  try { r.start(); } catch(e){ REC = null; mic.textContent = '🎤 Repetir'; }   // el navegador pide permiso de micrófono la primera vez
}
function repGuardar(uid, n, said){
  const c = compareSpeech(lectureText(uid, n), said);
  const key = uid + '-' + n;
  S.speak = S.speak || {};
  if (S.speak[key] === undefined || c.score > S.speak[key]) S.speak[key] = c.score;   // guarda la mejor; no toca el resto del progreso
  touch(); save();
  LAST_ATTEMPT = {key, said, c};
  const best = document.getElementById('rep-best');
  if (best) best.textContent = bestText(uid, n);
}
function repShow(uid, n){
  const out = document.getElementById('rep-out');
  if (!LAST_ATTEMPT || LAST_ATTEMPT.key !== uid + '-' + n) { out.innerHTML = '<p class="fb bad">Primero pulsa «Repetir» y lee la lectura en voz alta.</p>'; return; }
  const {c, said} = LAST_ATTEMPT;
  const ready = c.score >= READY_SCORE;
  const words = c.tokens.map(x => `<span class="w ${x.ok ? 'ok' : 'bad'}">${esc(x.t)}</span>`).join(' ');
  out.innerHTML = `
    <div class="rep-text">${words}</div>
    <div class="score ${ready ? 'ok' : 'bad'}">${c.score}%</div>
    ${ready ? '<p class="fb ok">✅ ¡Frase lista! Muy buena pronunciación.</p>'
            : `<p class="fb bad">¡Casi! Inténtalo otra vez, tú puedes.${c.missed.length ? ' Palabras para repasar: <b>' + esc(c.missed.join(', ')) + '</b>.' : ''}</p>`}
    <p class="pcap">Dijiste: ${esc(said.trim())}</p>`;
}

// ---------- escucha y escribe (dictado de la lectura; se guarda en S.escucha, dentro del progreso que ya se sube a la nube y a la copia) ----------
const ESC_OK = 80;
let ESC_ULT = null;   // último texto comprobado: {key, c}
function escMejor(uid, n){ const v = (S.escucha || {})[uid + '-' + n]; return v === undefined ? null : v; }
function escEstadoTexto(uid, n){
  const b = escMejor(uid, n);
  return b === null ? '' : (b >= ESC_OK ? `✅ Escucha superada · mejor: ${b}%` : `Mejor intento: ${b}%`);
}
function escBlock(uid, n){
  if (!lectureText(uid, n)) return '';
  return `<div class="rep" id="esc">
    <div class="rep-title">✍️ Escucha y escribe</div>
    <p class="pcap">Escucha la lectura y escribe lo que oyes. Puedes escucharla otra vez cuantas veces quieras.</p>
    <button class="btn" id="esc-ini" onclick="escIniciar('${uid}',${n})">✍️ Escucha y escribe</button>
    <div id="esc-panel" class="hide">
      <textarea id="esc-txt" class="esc-txt" rows="7" placeholder="Escribe aquí lo que oyes..." autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Lo que oyes"></textarea>
      <button class="btn ghost" id="esc-otra" onclick="escOir('${uid}',${n})">▶ Escuchar otra vez</button>
      <button class="btn" id="esc-comp" onclick="escComprobar('${uid}',${n})">Comprobar</button>
    </div>
    <div class="fb bad" id="esc-err" role="status"></div>
    <div id="esc-out" aria-live="polite"></div>
    <div class="pcap" id="esc-best">${escEstadoTexto(uid, n)}</div>
  </div>`;
}
function escOir(uid, n){
  const err = document.getElementById('esc-err'); if (err) err.textContent = '';
  try {
    if (CUR_AUDIO) { try { CUR_AUDIO.pause(); } catch(e){} }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const src = `audio/${uid}-lec${n}.mp3`;
    const a = new Audio(src);     // el mismo audio de la lectura, a la misma velocidad
    CUR_AUDIO = a;
    a.playbackRate = 0.8;
    const fallo = err => {
      if (CUR_AUDIO !== a || (err && err.name === 'AbortError')) return;        // un audio que se cambió por otro no es un fallo
      const msg = t => { const e = document.getElementById('esc-err'); if (e) e.textContent = t; };
      audioFalla(src, () => msg('No se pudo reproducir el audio'), () => msg('Este audio necesita conexión'));
    };
    a.onerror = () => fallo();
    const r = a.play();
    if (r && r.catch) r.catch(fallo);
  } catch(e){ const x = document.getElementById('esc-err'); if (x) x.textContent = 'No se pudo reproducir el audio'; }
}
function escIniciar(uid, n){
  const panel = document.getElementById('esc-panel'), b = document.getElementById('esc-ini');
  if (panel) panel.classList.remove('hide');
  if (b) b.classList.add('hide');
  escOir(uid, n);
  const t = document.getElementById('esc-txt'); if (t) { try { t.focus({preventScroll: true}); } catch(e){} }
}
function escComprobar(uid, n){
  const out = document.getElementById('esc-out'), txt = document.getElementById('esc-txt');
  const dicho = txt ? txt.value : '';
  if (!dicho.trim()) { out.innerHTML = '<p class="fb bad">Escribe primero lo que oyes.</p>'; return; }
  const c = compareSpeech(lectureText(uid, n), dicho);
  const key = uid + '-' + n;
  S.escucha = S.escucha || {};
  if (S.escucha[key] === undefined || c.score > S.escucha[key]) { S.escucha[key] = c.score; touch(); save(); }   // guarda el mejor intento; no toca el resto del progreso
  const ok = c.score >= ESC_OK;
  const words = c.tokens.map(x => `<span class="w ${x.ok ? 'ok' : 'bad'}">${esc(x.t)}</span>`).join(' ');
  out.innerHTML = `<div class="score ${ok ? 'ok' : 'bad'}">${c.score}%</div><p class="pcap">de palabras acertadas</p>
    <div class="rep-text">${words}</div>
    ${ok ? '<p class="fb ok">✅ ¡Escucha superada!</p>' : '<p class="fb bad">¡Casi! Escucha otra vez y vuelve a intentarlo, sin límite.</p>'}`;
  const best = document.getElementById('esc-best'); if (best) best.textContent = escEstadoTexto(uid, n);
}

// ---------- sonidos de acierto y fallo (Web Audio, sin archivos de audio) ----------
const SONIDO_KEY = 'mi-ingles-silencio';          // clave nueva y aparte del progreso: '1' = silenciado; por defecto suena
let SILENCIO = false;
try { SILENCIO = localStorage.getItem(SONIDO_KEY) === '1'; } catch(e){}
let AUDIO_CTX = null;
function tono(ctx, t0, freq, dur, vol, tipo){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);                 // entrada suave
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);          // salida suave
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function tocarSonido(ctx, ok, t0){
  if (ok) { tono(ctx, t0, 659.25, 0.16, 0.18, 'sine'); tono(ctx, t0 + 0.11, 880, 0.26, 0.18, 'sine'); }           // acierto: mi → la, alegre y agudo
  else    { tono(ctx, t0, 329.63, 0.18, 0.12, 'triangle'); tono(ctx, t0 + 0.13, 261.63, 0.30, 0.12, 'triangle'); } // fallo: mi → do, grave y suave
}
function sonandoOtraCosa(){
  try { if (CUR_AUDIO && !CUR_AUDIO.paused && !CUR_AUDIO.ended) return true; } catch(e){}      // lectura o diálogo sonando
  try { if ('speechSynthesis' in window && speechSynthesis.speaking) return true; } catch(e){}  // voz del navegador
  return !!REC;                                                                                // grabando la voz
}
function sonar(ok){
  try {
    if (SILENCIO || sonandoOtraCosa()) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!AUDIO_CTX) AUDIO_CTX = new AC();
    const ctx = AUDIO_CTX;
    const tocar = () => { try { tocarSonido(ctx, ok, ctx.currentTime + 0.01); } catch(e){} };
    if (ctx.state === 'suspended') { const r = ctx.resume(); if (r && r.then) r.then(tocar).catch(() => {}); else tocar(); }
    else tocar();
  } catch(e){}                                                    // si el navegador no deja sonar, no pasa nada
}
function aplicarSonidoBtn(){
  const b = document.getElementById('sonidobtn'); if (!b) return;
  b.textContent = SILENCIO ? '🔇' : '🔊';
  b.setAttribute('aria-pressed', SILENCIO ? 'true' : 'false');
  b.title = SILENCIO ? 'Activar sonidos' : 'Silenciar sonidos';
}
function toggleSonido(){
  SILENCIO = !SILENCIO;
  try { localStorage.setItem(SONIDO_KEY, SILENCIO ? '1' : '0'); } catch(e){}
  aplicarSonidoBtn();
}

let QID = 0;
// Las opciones se muestran en orden aleatorio, salvo conjuntos cuyo orden tiene sentido (a / an, first / second, sílabas en orden).
const OPCIONES_FIJAS = ['a|an', 'first|second', 'graph|pho|to', 'pho|ra|tog'];
function opcionesParaMostrar(opts){
  const clave = opts.map(o => String(o).trim().toLowerCase()).sort().join('|');
  return OPCIONES_FIJAS.indexOf(clave) >= 0 ? opts.slice() : shuffle(opts);
}
function quiz(q, kind, key, ref, idx){
  const id = 'q' + (++QID);
  Q[id] = {answer: q.answer, kind, key, answered: false, ref, pregunta: q, idx};   // la respuesta es el texto, no la posición: mezclar no la cambia
  const stem = esc(q.stem).replace(/___/g, '<span class="blank"></span>');
  const opts = opcionesParaMostrar(q.options).map(o =>
    `<button class="opt" data-v="${esc(o)}" onclick="answer('${id}',this.dataset.v)">${esc(o)}</button>`).join('');
  return `<div id="box-${id}">
    <div class="stem">${stem}</div>
    <div class="opts">${opts}</div>
    <div class="fb"></div>
    <button class="btn retry hide" onclick="render()">🔄 Probar otra vez</button>
    <button class="btn nextbtn hide" onclick="nextQ()">Siguiente →</button>
  </div>`;
}
function answer(id, val){
  const q = Q[id]; if (!q || q.answered) return;
  q.answered = true;
  const right = val === q.answer;
  sonar(right);
  if (q.ref) registrarError(q.ref, q.pregunta, right);   // lecciones y exámenes (no el test de nivel)
  const box = document.getElementById('box-' + id);
  box.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.answer) b.classList.add('right');
    else if (b.dataset.v === val) b.classList.add('wrong');
  });
  const fb = box.querySelector('.fb');
  if (q.kind === 'rep') {                                   // repetir una pregunta desde «Mis errores»: no toca el progreso
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.textContent = right ? '¡Correcto! ✅ Se quitó de tu lista de errores.' : 'La respuesta correcta es: ' + q.answer;
    const nb = box.querySelector('.nextbtn');
    nb.textContent = 'Volver a mis errores →'; nb.setAttribute('onclick', 'render()'); nb.classList.remove('hide');
    if (!right) { const rb = box.querySelector('.retry'); rb.setAttribute('onclick', 'repetirError(' + q.idx + ')'); rb.classList.remove('hide'); }
    return;
  }
  if (q.kind === 'repaso') {                                // repaso de hoy: acertar la quita de errores y fallar la deja (ya hecho arriba); no toca el progreso
    if (right && REP) REP.score++;
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.textContent = right ? '¡Correcto! ✅' : 'La respuesta correcta es: ' + q.answer;
    const nb = box.querySelector('.nextbtn');
    nb.textContent = REP && REP.i + 1 >= REP.items.length ? 'Ver resultado →' : 'Siguiente →';
    nb.setAttribute('onclick', 'repasoSiguiente()'); nb.classList.remove('hide');
    return;
  }
  if (q.kind === 'des') { desResponder(right, fb); return; }   // desafío de 60 segundos: no toca el progreso
  if (q.kind === 'exam') {
    if (EX.est) estRegistrar(right); else if (right) EX.score++;
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.textContent = right ? '¡Correcto! ✅' : 'La respuesta correcta es: ' + q.answer;
    box.querySelector('.nextbtn').classList.remove('hide');
  } else {
    if (right) {
      fechaLeccion(q.key); S.done[q.key] = true; touch(); save();
      fb.className = 'fb ok'; fb.textContent = '¡Muy bien! ✅ Ejercicio completado.';
    } else {
      fb.className = 'fb bad'; fb.textContent = 'La respuesta correcta es: ' + q.answer + '. Lee otra vez la lección.';
      box.querySelector('.retry').classList.remove('hide');
    }
  }
}

function nHechas(){ return Object.keys(S.done).filter(k => S.done[k]).length; }
function maxPuntos(o){ let m = -1; Object.keys(o || {}).forEach(k => { if (typeof o[k] === 'number' && o[k] > m) m = o[k]; }); return m; }
function mejorSerieRepasos(){          // la mayor cantidad de días seguidos con repaso de hoy hecho
  const f = (S.fechas && Array.isArray(S.fechas.rep)) ? S.fechas.rep.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).slice().sort() : [];
  const dia = d => { const [y, m, dd] = d.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, dd) / 864e5); };
  let mejor = 0, ya = 0, ant = null;
  f.forEach(d => {
    const n = dia(d);
    if (ant === n) return;
    ya = (ant !== null && n - ant === 1) ? ya + 1 : 1;

    ant = n;
  });

}

function mejorNivelCompleto(){ let m = 0, ok = false; DATA.levels.forEach(l => { const d = levelDone(l.code); if (d > m) m = d; if (d === levelTotal(l.code)) ok = true; }); return {m, ok}; }

function logroConseguido(l){ return !!(S.logros && S.logros[l.id]) || l.test().ok; }
let LOGRO_COLA = [], LOGRO_MOSTRANDO = false, LOGRO_INIT = false;
function persistirS(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function logrosInicio(){        // al abrir con una cuenta que aún no tiene S.logros: se apuntan en silencio los que ya estaban conseguidos

}

function primeraSinHacer(u, desde){
  for (let n = desde; n <= 7; n++) if (!S.done[u.id + '-' + n]) return n;
  return 0;
}
function siguientePaso(last){
  let u = U(last.uid);
  if (S.passed[u.id]) {                                 // unidad aprobada: la siguiente que no esté aprobada
    let i = UNITS.indexOf(u) + 1;
    while (UNITS[i] && S.passed[UNITS[i].id]) i++;
    u = UNITS[i];
    if (!u) return {u: UNITS[UNITS.length - 1], unidad: true};   // todo aprobado: la última unidad
    const n = primeraSinHacer(u, 1);
    return n ? {u, n} : {u, examen: true};
  }
  if (!S.done[u.id + '-' + last.n]) return {u, n: last.n};              // la última lección no está completa: vuelve a ella
  const n = primeraSinHacer(u, last.n + 1) || primeraSinHacer(u, 1);    // la siguiente lección sin hacer
  return n ? {u, n} : {u, examen: true};                                // si no queda ninguna, el examen
}

// ---------- palabras difíciles (clave nueva y aparte del progreso) ----------
const DIF_KEY = 'mi-ingles-dificiles';   // lista de {uid, n, w, t}: palabra, traducción, unidad y lección de origen
let DIF = [];
try {
  const x = JSON.parse(localStorage.getItem(DIF_KEY) || '[]');
  if (Array.isArray(x)) DIF = x.filter(d => d && typeof d.w === 'string' && typeof d.uid === 'string' && +d.n >= 1);
} catch(e){}
function guardarDif(){ try { localStorage.setItem(DIF_KEY, JSON.stringify(DIF)); } catch(e){} }
function difIdx(uid, n, w){ return DIF.findIndex(d => d.uid === uid && +d.n === +n && d.w === w); }
// "Países: Spain (España), Mexico (México)" → [{w:'Spain', t:'España'}, ...] (la etiqueta "Países:" se separa)
function partirVocab(txt){
  const partes = []; let prof = 0, cur = '';
  for (const c of txt) {
    if (c === '(') prof++; if (c === ')') prof--;
    if (c === ',' && prof === 0) { partes.push(cur.trim()); cur = ''; } else cur += c;
  }
  if (cur.trim()) partes.push(cur.trim());
  let etiqueta = '';
  const palabras = partes.map((t, i) => {
    let m = t;
    if (i === 0) { const e = /^([^:()]+):\s*(.+)$/.exec(t); if (e) { etiqueta = e[1].trim(); m = e[2]; } }
    const r = /^(.+?)\s*\((.+)\)\.?$/.exec(m);
    return r ? {w: r[1].trim(), t: r[2].trim()} : {w: m.replace(/\.$/, ''), t: ''};
  });
  return {etiqueta, palabras};
}
function vocabPalabras(uid, n){
  const l = U(uid).lessons.find(x => x.n === n), out = [];
  for (const s of l.sections) if (/^Vocabulario/.test(s.key)) for (const it of s.items) out.push(...partirVocab(it).palabras);
  return out;
}
function vocabHtml(uid, n, items, c){      // c.k: contador de palabras de la lección
  return items.map(it => {
    const {etiqueta, palabras} = partirVocab(it);
    const chips = palabras.map((x, i) => {
      const on = difIdx(uid, n, x.w) >= 0, k = c.k++;
      const coma = i < palabras.length - 1 ? ',' : '';
      return `<span class="vw"><button type="button" class="star ${on ? 'on' : ''}" aria-pressed="${on}" aria-label="Palabra difícil: ${esc(x.w)}" title="${on ? 'Quitar de difíciles' : 'Marcar como difícil'}" onclick="toggleDificil('${uid}',${n},${k},this)">${on ? '★' : '☆'}</button><span>${esc(x.w)}${x.t ? ' (' + esc(x.t) + ')' : ''}${coma}</span></span>`;
    }).join(' ');
    return `<p>${etiqueta ? esc(etiqueta) + ': ' : ''}${chips}</p>`;
  }).join('');
}
function toggleDificil(uid, n, k, btn){
  const x = vocabPalabras(uid, n)[k]; if (!x) return;
  const i = difIdx(uid, n, x.w);
  if (i >= 0) DIF.splice(i, 1); else DIF.push({uid, n, w: x.w, t: x.t});

  btn.title = on ? 'Quitar de difíciles' : 'Marcar como difícil';
}
function difOrdenadas(){      // por unidad, lección y orden en que se marcaron; ignora unidades que ya no existan
  return DIF.map((d, o) => ({d, o, u: U(d.uid)})).filter(x => x.u)

}

      <div class="difbody"><div><b>${esc(d.w)}</b>${d.t ? ' — ' + esc(d.t) : ''}</div>

// ---------- glosario por nivel (usa la misma lista de palabras difíciles: DIF) ----------
const GLOS_CACHE = {};
let GLOS_Q = '';
function normBusq(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function glosarioNivel(code){      // palabras únicas del nivel, en orden alfabético, con todas sus apariciones
  if (GLOS_CACHE[code]) return GLOS_CACHE[code];
  const mapa = new Map();
  UNITS.forEach(u => {
    if (u.level !== code) return;
    u.lessons.forEach(l => {
      vocabPalabras(u.id, l.n).forEach(x => {
        if (!x.w) return;
        const k = x.w.trim().toLowerCase();
        let e = mapa.get(k);
        if (!e) { e = {w: x.w, ts: [], occ: []}; mapa.set(k, e); }
        if (x.t && e.ts.indexOf(x.t) < 0) e.ts.push(x.t);
        if (!e.occ.some(o => o.uid === u.id && o.n === l.n)) e.occ.push({uid: u.id, num: u.num, n: l.n, w: x.w});
      });
    });
  });
  const L = [...mapa.values()].map(e => ({w: e.w, t: e.ts.join(' / '), occ: e.occ, bus: normBusq(e.w + ' ' + e.ts.join(' '))}));
  L.sort((a, b) => a.w.localeCompare(b.w, 'en', {sensitivity: 'base'}) || a.w.localeCompare(b.w));
  return GLOS_CACHE[code] = L;
}
function glosOn(e){ return e.occ.some(o => difIdx(o.uid, o.n, o.w) >= 0); }
function glosFila(code, e, i){
  const on = glosOn(e);
  const links = e.occ.map(o => `<button type="button" class="dorigen" onclick="go('#/lesson/${o.uid}/${o.n}')">U${o.num} · L${o.n}</button>`).join('');
  return `<div class="grow"><button type="button" class="star ${on ? 'on' : ''}" aria-pressed="${on}" aria-label="Palabra difícil: ${esc(e.w)}" title="${on ? 'Quitar de difíciles' : 'Marcar como difícil'}" onclick="glosEstrella('${code}',${i},this)">${on ? '★' : '☆'}</button>
    <div class="gbody"><div><b>${esc(e.w)}</b>${e.t ? ' — ' + esc(e.t) : ''}</div><div class="glinks">${links}</div></div>
    <button type="button" class="oir" aria-label="Escuchar: ${esc(e.w)}" title="Escuchar" onclick="glosOir('${code}',${i})">🔊</button></div>`;
}
function glosLista(code){
  const L = glosarioNivel(code), q = normBusq(GLOS_Q.trim());
  const filas = [];
  L.forEach((e, i) => { if (!q || e.bus.indexOf(q) >= 0) filas.push(glosFila(code, e, i)); });
  return {n: filas.length, html: filas.length ? filas.join('') : '<p class="pcap">No hay ninguna palabra con eso</p>'};
}
function glosFiltrar(code, v){
  GLOS_Q = v;

  if (el) el.innerHTML = r.html;

}
function glosEstrella(code, i, btn){
  const e = glosarioNivel(code)[i]; if (!e) return;
  const quitar = glosOn(e);
  e.occ.forEach(o => {                       // marcar/quitar en todas las lecciones del nivel donde aparece
    const j = difIdx(o.uid, o.n, o.w);
    if (quitar) { if (j >= 0) DIF.splice(j, 1); }
    else if (j < 0) DIF.push({uid: o.uid, n: o.n, w: o.w, t: (e.t.split(' / ')[0] || '')});
  });
  guardarDif();
  const on = !quitar;

// ---------- mis errores (clave nueva y aparte del progreso y de las palabras difíciles) ----------
const ERR_KEY = 'mi-ingles-errores';   // lista de {id, uid, n, q:{stem, options, answer}}; n = nº de lección, o 0 si es del examen
let ERR = [];
let ERR_CONFIRMAR = false;
try {
  const x = JSON.parse(localStorage.getItem(ERR_KEY) || '[]');
  if (Array.isArray(x)) ERR = x.filter(e => e && typeof e.id === 'string' && typeof e.uid === 'string' && +e.n >= 0 && e.q
    && typeof e.q.stem === 'string' && typeof e.q.answer === 'string' && Array.isArray(e.q.options));
} catch(e){}
function guardarErr(){ try { localStorage.setItem(ERR_KEY, JSON.stringify(ERR)); } catch(e){} }
function errId(ref, q){ return ref.n > 0 ? ref.uid + '|L' + ref.n : ref.uid + '|E|' + q.stem; }
function registrarError(ref, q, right){
  try {
    const id = errId(ref, q), i = ERR.findIndex(e => e.id === id);
    if (!right) contarFallo(id, ref, q);
    if (right) { if (i >= 0) { ERR.splice(i, 1); guardarErr(); } }                       // acertada: sale de la lista
    else if (i < 0) { ERR.push({id, uid: ref.uid, n: ref.n, q: {stem: q.stem, options: q.options.slice(), answer: q.answer}}); guardarErr(); }
  } catch(e){}
}
function errOrdenadas(){      // por unidad, primero las lecciones y luego el examen; ignora unidades que ya no existan
  return ERR.map((e, o) => ({e, o, u: U(e.uid)})).filter(x => x.u)
    .sort((a, b) => (UNITS.indexOf(a.u) - UNITS.indexOf(b.u)) || ((a.e.n || 99) - (b.e.n || 99)) || (a.o - b.o)).map(x => x.e);
}
function errOrigen(e){ const u = U(e.uid); return `${u.level} · Unidad ${u.num}, ${e.n ? 'lección ' + e.n : 'examen'}`; }
function viewErrores(){
  const L = errOrdenadas();
  let html = `<div class="crumb" onclick="go('#/')">← Menú</div><div class="card"><h2>❌ Mis errores (${L.length})</h2>`;
  if (!L.length) html += '<p>No tienes preguntas falladas. Aquí aparecerán las que falles en lecciones y exámenes.</p>';
  html += L.map((e, i) => `<div class="errrow"><div class="stem">${esc(e.q.stem)}</div>
      <p class="corr">Respuesta correcta: <b>${esc(e.q.answer)}</b></p>
      <button type="button" class="dorigen" onclick="go('${e.n ? '#/lesson/' + e.uid + '/' + e.n : '#/exam/' + e.uid}')">${errOrigen(e)}</button>
      <button type="button" class="btn ghost" onclick="repetirError(${i})">🔁 Repetir esta</button></div>`).join('');
  if (L.length) html += ERR_CONFIRMAR
    ? `<div class="fb bad" style="margin-top:12px">¿Seguro que quieres borrar las ${L.length} preguntas de la lista?
        <div style="margin-top:8px"><button type="button" class="btn peligro" onclick="vaciarErrores()">Sí, vaciar</button>
        <button type="button" class="btn ghost" onclick="pedirVaciar(false)">Cancelar</button></div></div>`
    : `<div style="margin-top:12px"><button type="button" class="btn peligro" onclick="pedirVaciar(true)">🗑️ Vaciar lista</button></div>`;
  return html + '</div>';
}
function pintarErrores(){
  const y = window.scrollY;                              // la lista se repinta sin saltar al principio
  document.getElementById('app').innerHTML = '<div class="leccion">' + viewErrores() + '</div>';
  window.scrollTo(0, y);
}
function pedirVaciar(si){ ERR_CONFIRMAR = !!si; pintarErrores(); }
function vaciarErrores(){ ERR = []; ERR_CONFIRMAR = false; guardarErr(); pintarErrores(); }
function repetirError(i){
  ERR_CONFIRMAR = false;
  const e = errOrdenadas()[i];
  if (!e) { render(); return; }
  document.getElementById('app').innerHTML = `<div class="leccion"><div class="crumb" onclick="render()">← Mis errores</div>
    <div class="card"><h2>Repetir esta pregunta</h2><div class="pcap" style="margin-bottom:8px">${errOrigen(e)}</div>${quiz(e.q, 'rep', null, {uid: e.uid, n: e.n}, i)}</div></div>`;
  window.scrollTo(0, 0);
}

// ---------- repaso de hoy: 5 a 10 preguntas de unidades aprobadas, primero las falladas; uno al día ----------
const REPASO_KEY = 'mi-ingles-repaso';   // clave nueva y aparte: {fecha: 'AAAA-MM-DD', aciertos, total}; viaja a la nube y a la copia de seguridad
const REPASO_MAX = 10;
let REP = null;                          // repaso en curso: {items, i, score, fin}
function repasoGuardado(){
  try {
    const r = JSON.parse(localStorage.getItem(REPASO_KEY) || 'null');
    if (r && typeof r.fecha === 'string' && Number.isInteger(r.aciertos) && Number.isInteger(r.total)) return r;
  } catch(e){}
  return null;
}
function repasoHechoHoy(){ const r = repasoGuardado(); return !!r && r.fecha === fechaHoy(); }
function hayAprobadas(){ return UNITS.some(u => S.passed[u.id]); }
function repasoPreguntas(){
  const apr = UNITS.filter(u => S.passed[u.id]);
  const ok = new Set(apr.map(u => u.id));
  const elegidas = shuffle(ERR.filter(e => ok.has(e.uid)).filter((e, i, a) => a.findIndex(x => x.id === e.id) === i))   // 1.º las falladas
    .slice(0, REPASO_MAX).map(e => ({q: e.q, ref: {uid: e.uid, n: e.n}, id: e.id}));
  const ya = new Set(elegidas.map(x => x.id));
  const resto = [];
  for (const u of apr) {
    for (const l of u.lessons) if (l.exercise) { const ref = {uid: u.id, n: l.n}; resto.push({q: l.exercise, ref, id: errId(ref, l.exercise)}); }
    for (const q of u.exam) { const ref = {uid: u.id, n: 0}; resto.push({q, ref, id: errId(ref, q)}); }
  }
  for (const x of shuffle(resto)) {                                                           // 2.º el resto, al azar
    if (elegidas.length >= REPASO_MAX) break;
    if (!ya.has(x.id)) { ya.add(x.id); elegidas.push(x); }
  }
  return shuffle(elegidas);
}
function empezarRepaso(){
  if (repasoHechoHoy() || !hayAprobadas()) { REP = null; return; }
  REP = {items: repasoPreguntas(), i: 0, score: 0, fin: false};
}
function repasoSiguiente(){
  if (!REP) { render(); return; }
  REP.i++;
  if (REP.i >= REP.items.length) terminarRepaso();
  render();
}
function terminarRepaso(){
  if (!REP || REP.fin) return;
  REP.fin = true;
  fechaRepaso();
  try { localStorage.setItem(REPASO_KEY, JSON.stringify({fecha: fechaHoy(), aciertos: REP.score, total: REP.items.length})); } catch(e){}
}
function viewRepaso(){
  if (!REP) {
    return `<div class="crumb" onclick="go('#/')">← Menú</div><div class="card center"><h2>🔁 Repaso de hoy</h2>
      <p>${repasoHechoHoy() ? 'Repaso hecho hoy ✔. Mañana habrá otro.' : 'Aprueba una unidad para empezar los repasos.'}</p></div>`;
  }
  if (!REP.items.length) { terminarRepaso(); }
  if (REP.fin) {
    const t = REP.items.length;
    return `<div class="card center"><h2>🔁 Repaso de hoy</h2><div class="big">${REP.score} / ${t}</div>
      <p>${t === 0 ? 'Hoy no hay preguntas para repasar.' : REP.score === t ? '¡Todo bien! Las acertadas salen de tu lista de errores.' : 'Las acertadas salen de tu lista de errores; las falladas se quedan para otro día.'}</p>
      <button class="btn" onclick="go('#/')">Volver al menú</button></div>`;
  }
  const x = REP.items[REP.i];
  return `<div class="crumb" onclick="go('#/')">← Menú</div>
    <div class="card"><h2>🔁 Repaso de hoy · pregunta ${REP.i + 1} de ${REP.items.length}</h2>
    <div class="pcap" style="margin-bottom:8px">${errOrigen({uid: x.ref.uid, n: x.ref.n})}</div>${quiz(x.q, 'repaso', null, x.ref)}</div>`;
}

// ---------- mi semana: fechas de lecciones, exámenes y repasos (S.fechas) y veces que se falla cada pregunta (S.fallos) ----------
// Van dentro del progreso (S), así viajan con él a la nube y a la copia de seguridad. Lo hecho antes de esta versión no tiene fecha.
function fechasS(){
  if (!S.fechas || typeof S.fechas !== 'object' || Array.isArray(S.fechas)) S.fechas = {};
  const f = S.fechas;
  if (!f.lec || typeof f.lec !== 'object' || Array.isArray(f.lec)) f.lec = {};
  if (!Array.isArray(f.rep)) f.rep = [];
  if (!f.exa || typeof f.exa !== 'object' || Array.isArray(f.exa)) f.exa = {};
  return f;
}
function fechaLeccion(key){ try { if (!S.done[key]) fechasS().lec[key] = fechaHoy(); } catch(e){} }   // solo la primera vez que se completa
function fechaExamen(uid){ try { fechasS().exa[uid] = fechaHoy(); } catch(e){} }
function fechaRepaso(){ try { const f = fechasS(), h = fechaHoy(); if (f.rep.indexOf(h) < 0) { f.rep.push(h); save(); } } catch(e){} }
function contarFallo(id, ref, q){
  try {
    if (!S.fallos || typeof S.fallos !== 'object' || Array.isArray(S.fallos)) S.fallos = {};
    const x = S.fallos[id] || (S.fallos[id] = {c: 0, uid: ref.uid, n: ref.n, stem: q.stem});
    x.c++; save();
  } catch(e){}
}
function diasSemana(){        // los últimos 7 días, de hoy hacia atrás, como AAAA-MM-DD
  const out = [], z = n => String(n).padStart(2, '0'), b = new Date();
  for (let k = 0; k < 7; k++) { const d = new Date(b.getFullYear(), b.getMonth(), b.getDate() - k); out.push(d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate())); }
  return out;
}
function resumenSemana(){
  const dias = diasSemana(), en = new Set(dias), f = fechasS();
  const activos = new Set();
  let lecciones = 0;
  Object.keys(f.lec).forEach(k => { if (S.done[k] && en.has(f.lec[k])) { lecciones++; activos.add(f.lec[k]); } });
  const antiguas = Object.keys(S.done).filter(k => S.done[k] && !f.lec[k]).length;
  const repasos = new Set(f.rep.filter(d => en.has(d)));
  repasos.forEach(d => activos.add(d));
  Object.keys(f.exa).forEach(u => { if (S.passed[u] && en.has(f.exa[u])) activos.add(f.exa[u]); });
  const st = S.streak || {last: '', count: 0};
  const z = n => String(n).padStart(2, '0');
  if (/^\d{4}-\d{2}-\d{2}$/.test(st.last || '') && st.count > 0) {           // los días de la racha también son días de estudio
    const [y, m, d] = st.last.split('-').map(Number);
    for (let k = 0; k < st.count && k < 7; k++) { const t = new Date(y, m - 1, d - k); const c = t.getFullYear() + '-' + z(t.getMonth() + 1) + '-' + z(t.getDate()); if (en.has(c)) activos.add(c); }
  }
  const racha = (st.last === dias[0] || st.last === dias[1]) ? st.count : 0;
  return {dias, activos: activos.size, racha, lecciones, antiguas, repasos: repasos.size};
}
function topFallos(){
  const m = new Map();
  Object.keys(S.fallos || {}).forEach(id => { const x = S.fallos[id]; if (x && U(x.uid) && x.c > 0) m.set(id, {id, c: x.c, uid: x.uid, n: x.n, stem: x.stem, pend: false}); });
  ERR.forEach(e => { if (!U(e.uid)) return; const x = m.get(e.id); if (x) x.pend = true; else m.set(e.id, {id: e.id, c: 1, uid: e.uid, n: e.n, stem: e.q.stem, pend: true}); });   // errores guardados antes de contar: al menos 1
  return [...m.values()].sort((a, b) => (b.c - a.c) || ((b.pend ? 1 : 0) - (a.pend ? 1 : 0)) || a.stem.localeCompare(b.stem)).slice(0, 5);
}
function siguienteUnidadMapa(){ for (let i = 0; i < UNITS.length; i++) if (!S.passed[UNITS[i].id] && unlocked(i)) return UNITS[i]; return null; }
function viewSemana(){
  const r = resumenSemana(), nErr = errOrdenadas().length, nDif = difOrdenadas().length, top = topFallos();
  const num = (n, t) => `<div class="semnum"><b>${n}</b><span>${t}</span></div>`;
  const vacio = r.activos === 0;
  let sug;
  if (vacio) sug = '';
  else if (nErr) sug = `<p class="semsug">Repasa tus errores: tienes ${nErr} pendientes</p><button class="btn" onclick="go('#/errores')">❌ Ver mis errores</button>`;
  else { const u = siguienteUnidadMapa();
    sug = u ? `<p class="semsug">Buen trabajo: ¿seguimos con la unidad ${u.num} (${esc(u.level)} · ${esc(u.title)})?</p><button class="btn" onclick="go('#/unit/${u.id}')">Ir a la unidad ${u.num}</button>`
            : '<p class="semsug">Buen trabajo: has aprobado todas las unidades.</p>'; }
  const topHtml = top.length ? top.map(x => `<div class="errrow"><div class="stem">${esc(x.stem)}</div>
      <p class="corr"><b>${x.c} ${x.c === 1 ? 'vez' : 'veces'}</b> fallada${x.pend ? ' · ❌ pendiente' : ''}</p>
      <button type="button" class="dorigen" onclick="go('${x.n ? '#/lesson/' + x.uid + '/' + x.n : '#/exam/' + x.uid}')">${errOrigen(x)}</button></div>`).join('')
    : '<p class="pcap">Todavía no has fallado ninguna pregunta.</p>';
  return `<div class="crumb" onclick="go('#/')">← Inicio</div><h2>📊 Mi semana</h2>
    <p class="pcap">Últimos 7 días, hoy incluido.</p>
    ${vacio ? `<div class="card center"><p class="semsug">Esta semana no has estudiado. Empieza con un repaso de 5 minutos</p><button class="btn" onclick="go('#/repaso')">🔁 Repaso de hoy</button></div>` : ''}
    <div class="semgrid">${num(r.activos + ' de 7', 'días con actividad')}${num(r.racha, r.racha === 1 ? 'día de racha' : 'días de racha')}
      ${num(r.lecciones, 'lecciones completadas')}${num(r.repasos, r.repasos === 1 ? 'repaso de hoy hecho' : 'repasos de hoy hechos')}</div>
    ${r.antiguas ? `<p class="pcap">Anteriores a esta versión, sin fecha: ${r.antiguas} ${r.antiguas === 1 ? 'lección' : 'lecciones'} (no se suman a la semana).</p>` : ''}
    <div class="card"><h3>Las 5 preguntas que más has fallado</h3>${topHtml}</div>
    <div class="card"><h3>⭐ Palabras difíciles</h3><p><b>${nDif}</b> ${nDif === 1 ? 'palabra marcada' : 'palabras marcadas'}.</p>${nDif ? `<button class="btn ghost" onclick="go('#/dificiles')">Ver palabras difíciles</button>` : ''}</div>
    ${sug ? `<div class="card">${sug}</div>` : ''}`;
}

// ---------- panel de códigos de invitación (solo administrador) ----------
// El botón solo se muestra con el correo del administrador; lo que de verdad protege la tabla son las reglas del servidor (RLS), no esto.
const ADMIN_MAIL = 'gutierezronaldo2@gmail.com';
const COD_TABLA = 'codigos_invitacion';
function esAdmin(){ return !!(USER && USER.email && String(USER.email).trim().toLowerCase() === ADMIN_MAIL); }
let COD = {lista: null, error: '', msg: '', ok: false, nuevo: null, conf: null, ocupado: false};
function codFecha(f){
  const d = new Date(f); if (isNaN(d)) return '';
  const z = n => String(n).padStart(2, '0');
  return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear();
}
function codAleatorio(){            // FAMILIA-XXXX con 4 letras mayúsculas o cifras, con crypto.getRandomValues (sin sesgo)
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let t = '';
  while (t.length < 4) {
    const b = new Uint8Array(8); crypto.getRandomValues(b);
    for (const x of b) if (x < 252 && t.length < 4) t += A[x % 36];       // 252 = 7 × 36
  }
  return 'FAMILIA-' + t;
}
async function codCargar(){
  COD.error = '';
  try {
    if (!SB) { COD.error = 'Sin conexión'; COD.lista = null; codPintar(); return; }
    const r = await SB.from(COD_TABLA).select('codigo,usado,usado_por,creado').order('creado', {ascending: false});
    if (r.error) { COD.error = esRed(r.error) ? 'Sin conexión' : 'No tienes permiso para ver los códigos'; COD.lista = null; }
    else {
      const l = r.data || [];
      COD.lista = l.filter(x => !x.usado).concat(l.filter(x => x.usado));      // los usados, al final
    }
  } catch(e){ COD.error = esRed(e) ? 'Sin conexión' : 'No tienes permiso para ver los códigos'; COD.lista = null; }
  codPintar();
}
function codPintar(){ const v = document.getElementById('cod-vista'); if (v) v.innerHTML = codCuerpo(); }
function codCuerpo(){
  if (COD.error) return `<div class="card"><p class="fb bad" role="status">${esc(COD.error)}</p><button class="btn ghost" onclick="codCargar()">Reintentar</button></div>`;
  if (COD.lista === null) return '<p class="pcap">Cargando…</p>';
  const nuevo = COD.nuevo ? `<div class="card codnuevo"><p class="pcap" style="margin:0">Código nuevo</p><div class="codgrande">${esc(COD.nuevo)}</div>
      <button class="btn" onclick="codCopiar('${esc(COD.nuevo)}')">📋 Copiar</button></div>` : '';
  const msg = COD.msg ? `<p class="fb ${COD.ok ? 'ok' : 'bad'}" role="status">${esc(COD.msg)}</p>` : '';
  const filas = COD.lista.map((x, i) => {
    const est = x.usado ? 'Usado por ' + esc(x.usado_por || '—') : 'Libre';
    let acc = '';
    if (!x.usado) acc = COD.conf === i
      ? `<div class="codconf">¿Borrar este código? <button class="btn peligro chico" onclick="codBorrar(${i})">Sí, borrar</button> <button class="btn ghost chico" onclick="codNoBorrar()">No</button></div>`
      : `<button class="btn ghost chico" aria-label="Borrar ${esc(x.codigo)}" title="Borrar" onclick="codPedirBorrar(${i})">🗑️</button>`;
    return `<div class="codfila ${x.usado ? 'usado' : ''}"><div class="codtxt"><b class="codmono">${esc(x.codigo)}</b>
      <div class="pcap" style="margin:0">${est}${x.creado ? ' · ' + codFecha(x.creado) : ''}</div></div>${acc}</div>`;
  }).join('');
  return `<button class="btn" ${COD.ocupado ? 'disabled' : ''} onclick="codCrear()">➕ Crear código</button>${nuevo}${msg}
    <h3>${COD.lista.length} ${COD.lista.length === 1 ? 'código' : 'códigos'}</h3>${filas || '<p class="pcap">Todavía no hay códigos.</p>'}`;
}
async function codCrear(){
  if (COD.ocupado || !SB) return;
  COD.ocupado = true; COD.msg = ''; COD.nuevo = null; COD.conf = null; codPintar();
  let hecho = null, fallo = null;
  for (let k = 0; k < 6 && !hecho; k++) {
    const c = codAleatorio();
    try {
      const r = await SB.from(COD_TABLA).insert({codigo: c});
      if (!r.error) hecho = c;
      else if (r.error.code === '23505') continue;                // ya existía: se prueba otro
      else { fallo = r.error; break; }
    } catch(e){ fallo = e; break; }
  }
  COD.ocupado = false;
  if (hecho) { COD.nuevo = hecho; COD.ok = true; COD.msg = 'Código guardado.'; }
  else { COD.ok = false; COD.msg = fallo && esRed(fallo) ? 'Sin conexión' : 'No se pudo crear el código.'; }
  await codCargar();
}
function codCopiar(c){
  const ok = () => { COD.ok = true; COD.msg = 'Copiado: ' + c; codPintar(); };
  const no = () => { COD.ok = false; COD.msg = 'No se pudo copiar. Cópialo a mano: ' + c; codPintar(); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(c).then(ok, () => { try { copiarViejo(c) ? ok() : no(); } catch(e){ no(); } }); return; }
    copiarViejo(c) ? ok() : no();
  } catch(e){ no(); }
}
function copiarViejo(t){
  const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(a); a.select();
  let r = false; try { r = document.execCommand('copy'); } catch(e){}
  a.remove(); return r;
}
function codPedirBorrar(i){ COD.conf = i; COD.msg = ''; codPintar(); }
function codNoBorrar(){ COD.conf = null; codPintar(); }
async function codBorrar(i){
  const x = COD.lista && COD.lista[i]; COD.conf = null;
  if (!x || x.usado || !SB) { codPintar(); return; }                    // los usados no se pueden borrar
  try {
    const r = await SB.from(COD_TABLA).delete().eq('codigo', x.codigo).eq('usado', false).select();
    if (r.error) { COD.ok = false; COD.msg = esRed(r.error) ? 'Sin conexión' : 'No se pudo borrar el código.'; }
    else if (!r.data || !r.data.length) { COD.ok = false; COD.msg = 'No se pudo borrar el código.'; }
    else { COD.ok = true; COD.msg = 'Código borrado.'; if (COD.nuevo === x.codigo) COD.nuevo = null; }
  } catch(e){ COD.ok = false; COD.msg = 'No se pudo borrar el código.'; }
  await codCargar();
}
function viewCodigos(){
  COD = {lista: null, error: '', msg: '', ok: false, nuevo: null, conf: null, ocupado: false};
  setTimeout(codCargar, 0);
  return `<div class="crumb" onclick="go('#/')">← Inicio</div><h2>🎟️ Códigos de invitación</h2>
    <p class="pcap">Cada código sirve para crear una cuenta, una sola vez.</p><div id="cod-vista">${codCuerpo()}</div>`;
}

// ---------- emparejar palabras: mini-juego con el vocabulario del glosario (no toca progreso, errores ni logros) ----------
// Lo único que puede cambiar son las palabras difíciles (DIF, la misma lista de las lecciones y del glosario): las que se fallan se marcan.
const PAR_N = 6;
let PAR = null;
function parPares(code){
  const usadas = new Set(), out = [];
  for (const e of shuffle(glosarioNivel(code))) {
    const t = (e.t || '').split(' / ')[0].trim();
    if (!t) continue;
    const k = normBusq(t);
    if (usadas.has(k)) continue;                       // dos palabras con la misma traducción harían la partida ambigua
    usadas.add(k); out.push({w: e.w, t, e});
    if (out.length >= PAR_N) break;
  }
  return out;
}
function parNueva(code){
  const items = parPares(code);
  const idx = items.map((_, i) => i);
  PAR = {level: code, items, izq: shuffle(idx), der: shuffle(idx), hechos: new Set(), selL: null, selR: null, bloqueo: false,
         malas: {}, fallos: 0, marcadas: [], mal: null};
}
function parMarcarDificil(e){          // igual que la estrella del glosario: se marca en todas las lecciones del nivel donde aparece
  let cambio = false;
  e.occ.forEach(o => { if (difIdx(o.uid, o.n, o.w) < 0) { DIF.push({uid: o.uid, n: o.n, w: o.w, t: (e.t.split(' / ')[0] || '')}); cambio = true; } });
  if (cambio) guardarDif();
  return cambio;
}
function parTablero(){
  const P = PAR;
  const btn = (lado, i) => {
    const ok = P.hechos.has(i), sel = (lado === 'L' ? P.selL : P.selR) === i, mal = P.mal && (lado === 'L' ? P.mal.l : P.mal.r) === i;
    const txt = lado === 'L' ? P.items[i].w : P.items[i].t;
    return `<button type="button" class="pw ${ok ? 'ok' : ''} ${sel ? 'sel' : ''} ${mal ? 'mal' : ''}" ${ok ? 'disabled' : ''} aria-pressed="${sel}" onclick="parTocar('${lado}',${i})">${esc(txt)}</button>`;
  };
  return `<div class="pcols"><div class="pcol"><div class="pcap">Inglés</div>${P.izq.map(i => btn('L', i)).join('')}</div>
    <div class="pcol"><div class="pcap">Español</div>${P.der.map(i => btn('R', i)).join('')}</div></div>`;
}
function parPintar(){
  const t = document.getElementById('par-tablero'); if (t && PAR) t.innerHTML = parTablero();
  const c = document.getElementById('par-cuenta'); if (c && PAR) c.textContent = PAR.hechos.size + ' de ' + PAR.items.length + ' unidas.';
}
function parTocar(lado, i){
  const P = PAR; if (!P || P.bloqueo || P.hechos.has(i)) return;
  if (lado === 'L') P.selL = (P.selL === i) ? null : i; else P.selR = (P.selR === i) ? null : i;
  if (P.selL === null || P.selR === null) { parPintar(); return; }
  const l = P.selL, r = P.selR;
  if (l === r) {                                              // acierto: se queda en verde y fijo
    P.hechos.add(l); P.selL = P.selR = null;
    sonar(true);
    if (P.hechos.size >= P.items.length) { render(); return; }
    parPintar();
  } else {                                                    // fallo: rojo un momento y se borra la selección, sin castigo
    P.fallos++; P.malas[l] = true;
    if (parMarcarDificil(P.items[l].e)) P.marcadas.push(P.items[l].w);
    sonar(false);
    P.bloqueo = true; P.mal = {l, r};
    parPintar();
    const q = P;
    setTimeout(() => { if (PAR !== q) return; q.bloqueo = false; q.mal = null; q.selL = q.selR = null; parPintar(); }, 700);
  }
}
function viewEmparejar(code){
  const lv = DATA.levels.find(l => l.code === code);
  if (!lv) {
    const btns = DATA.levels.map(l => `<button class="btn grande ghost" onclick="go('#/emparejar/${l.code}')">${l.icon || ''} ${l.code} · ${esc(l.name)}</button>`).join('');
    return `<div class="crumb" onclick="go('#/')">← Inicio</div><h2>🧩 Emparejar palabras</h2><p class="pcap">Une cada palabra en inglés con su traducción. Elige un nivel.</p>${btns}`;
  }
  if (!PAR || PAR.level !== code) parNueva(code);
  const P = PAR, cab = `<div class="crumb" onclick="go('#/emparejar')">← Elegir nivel</div><h2>🧩 ${lv.icon || ''} ${code} · Emparejar</h2>`;
  if (!P.items.length) return `${cab}<div class="card"><p>Este nivel todavía no tiene palabras con traducción para jugar.</p><button class="btn ghost" onclick="go('#/')">Volver al menú</button></div>`;
  if (P.hechos.size >= P.items.length) {
    const primera = P.items.filter((_, i) => !P.malas[i]).length;
    return `${cab}<div class="card center"><div class="big">${primera} de ${P.items.length}</div><p class="pcap">a la primera</p>
      <p><b>${P.fallos}</b> ${P.fallos === 1 ? 'fallo' : 'fallos'}</p>
      ${P.marcadas.length ? `<p class="pcap">Marcadas como difíciles: ${P.marcadas.map(esc).join(', ')}</p>` : ''}
      <button class="btn" onclick="parNueva('${code}');render()">🔁 Otra partida</button>
      <button class="btn ghost" onclick="go('#/')">Volver al menú</button></div>`;
  }
  return `${cab}<p class="pcap">Toca una palabra en inglés y su traducción para unirlas. <span id="par-cuenta">${P.hechos.size} de ${P.items.length} unidas.</span></p><div id="par-tablero">${parTablero()}</div>`;
}

// ---------- desafío de 60 segundos: 10 preguntas de examen de un nivel, con ranking personal (S.desafios) ----------
// Es opcional: no toca el progreso de unidades ni la racha. Lo único que se guarda es la puntuación, dentro de S (viaja a la nube y a la copia de seguridad).
const DES_SEG = 60, DES_N = 10, DES_TOP = 5;
let DES = null;
function desLista(code){
  const l = S.desafios && Array.isArray(S.desafios[code]) ? S.desafios[code] : [];
  return l.filter(x => x && typeof x.p === 'number' && typeof x.f === 'string');
}
function desFecha(f){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : esc(f || ''); }
function desPreparar(code){
  const pool = [];
  UNITS.filter(u => u.level === code).forEach(u => u.exam.forEach(q => pool.push({q, uid: u.id})));
  DES = {level: code, estado: 'listo', items: shuffle(pool).slice(0, DES_N), i: 0, ac: 0, resp: 0, fin: 0, timer: null, espera: null, res: null};
}
function desCancelar(){
  if (!DES) return;
  if (DES.timer) clearInterval(DES.timer);
  if (DES.espera) clearTimeout(DES.espera);
  DES = null;
}
function desEmpezar(){
  if (!DES || DES.estado !== 'listo') return;
  DES.estado = 'jugando'; DES.fin = Date.now() + DES_SEG * 1000;
  DES.timer = setInterval(desTick, 100);
  render();
}
function desRestante(){ return Math.max(0, DES.fin - Date.now()); }
function desTick(){
  if (!DES || DES.estado !== 'jugando') return;
  const r = desRestante();
  const b = document.getElementById('des-barra'), t = document.getElementById('des-seg');
  if (b) { b.style.width = (100 * r / (DES_SEG * 1000)).toFixed(1) + '%'; b.classList.toggle('poco', r <= 10000); }
  if (t) t.textContent = Math.ceil(r / 1000) + ' s';
  if (r <= 0) desTerminar();
}
function desPregunta(){
  const it = DES.items[DES.i];
  return `<div class="pcap">Pregunta ${DES.i + 1} de ${DES.items.length}</div>${quiz(it.q, 'des', null, {uid: it.uid, n: 0})}`;
}
function desResponder(right, fb){
  if (!DES || DES.estado !== 'jugando') return;
  DES.resp++; if (right) DES.ac++;
  fb.className = 'fb ' + (right ? 'ok' : 'bad');
  fb.textContent = right ? '¡Correcto! ✅' : 'La correcta: ' + DES.items[DES.i].q.answer;
  const d = DES;
  d.espera = setTimeout(() => {
    if (DES !== d || d.estado !== 'jugando') return;
    d.i++;
    if (d.i >= d.items.length) { desTerminar(); return; }
    const c = document.getElementById('des-q'); if (c) c.innerHTML = desPregunta();
  }, right ? 450 : 1100);
}
function desTerminar(){
  if (!DES || DES.estado !== 'jugando') return;
  if (DES.timer) { clearInterval(DES.timer); DES.timer = null; }
  if (DES.espera) { clearTimeout(DES.espera); DES.espera = null; }
  const seg = Math.floor(desRestante() / 1000);
  const p = DES.ac * 10 + seg;                                   // aciertos × 10, más 1 punto por cada segundo que sobre
  const antes = desLista(DES.level);
  const mejor = antes.length ? antes[0].p : 0;
  let nueva = false;
  if (p > 0) {
    const l = antes.concat([{p, f: fechaHoy(), a: DES.ac, n: DES.resp, s: seg}]);
    l.sort((x, y) => y.p - x.p);                                 // a igual puntuación se queda delante la más antigua (sort estable)
    S.desafios = (S.desafios && typeof S.desafios === 'object' && !Array.isArray(S.desafios)) ? S.desafios : {};
    S.desafios[DES.level] = l.slice(0, DES_TOP);
    nueva = p > mejor; save();
  }
  DES.estado = 'fin'; DES.res = {p, seg, ac: DES.ac, n: DES.resp, nueva, agotado: seg === 0 && DES.resp < DES.items.length};
  render();
}
function desRanking(code, marca){
  const l = desLista(code);
  if (!l.length) return '<p class="pcap">Todavía no tienes puntuaciones en este nivel.</p>';
  return `<ol class="desrank">${l.map((x, i) => `<li class="${marca === i ? 'es' : ''}"><b>${x.p}</b> puntos<span>${desFecha(x.f)}</span></li>`).join('')}</ol>`;
}
function viewDesafio(code){
  const niveles = DATA.levels.map(l => l.code);
  if (!code || niveles.indexOf(code) < 0) {
    const filas = DATA.levels.map(l => {
      const m = desLista(l.code);
      return `<div class="desfila" onclick="go('#/desafio/${l.code}')"><div><b>${l.icon || ''} ${l.code}</b><div class="pcap" style="margin:0">${esc(l.name)}</div></div>
        <div class="desmejor">${m.length ? `Mejor: <b>${m[0].p}</b>` : 'Sin puntuación'}</div></div>`;
    }).join('');
    return `<div class="crumb" onclick="go('#/')">← Inicio</div><h2>⏱️ Desafío de 60 segundos</h2>
      <p class="pcap">10 preguntas de examen al azar del nivel que elijas, en 60 segundos. Es opcional y no cambia tu progreso. Elige el nivel:</p>${filas}`;
  }
  if (!DES || DES.level !== code) desPreparar(code);
  const lv = DATA.levels.find(l => l.code === code);
  const cab = `<div class="crumb" onclick="go('#/desafio')">← Elegir nivel</div><h2>⏱️ Desafío · ${lv.icon || ''} ${code}</h2>`;
  if (DES.estado === 'listo') {
    return `${cab}<div class="card"><p>Tienes <b>${DES_SEG} segundos</b> para contestar hasta ${DES.items.length} preguntas. Cada acierto vale 10 puntos y cada segundo que sobre suma 1.</p>
      <p class="pcap">Si sales a mitad, el desafío se cancela y no se guarda nada.</p>
      <button class="btn" onclick="desEmpezar()">▶ Empezar</button></div>
      <div class="card"><h3>Tus mejores puntuaciones</h3>${desRanking(code)}</div>`;
  }
  if (DES.estado === 'jugando') {
    const r = desRestante();
    return `${cab}<div class="destiempo" role="timer" aria-label="Tiempo que queda"><div class="destrack"><div id="des-barra" class="desfill${r <= 10000 ? ' poco' : ''}" style="width:${(100 * r / (DES_SEG * 1000)).toFixed(1)}%"></div></div><b id="des-seg">${Math.ceil(r / 1000)} s</b></div>
      <div class="card" id="des-q">${desPregunta()}</div>`;
  }
  const R = DES.res, l = desLista(code);
  const pos = R.p > 0 ? l.findIndex(x => x.p === R.p && x.f === fechaHoy()) : -1;
  return `${cab}<div class="card center">
      <div class="big">${R.p}</div><p class="pcap">puntos</p>
      <p><b>${R.ac} de ${R.n}</b> aciertos · ${R.seg > 0 ? `sobraron <b>${R.seg} s</b>` : '<b>se acabó el tiempo</b>'}</p>
      <p class="pcap">${R.ac} × 10 + ${R.seg} = ${R.p}</p>
      ${R.nueva ? '<p class="fb ok">🏆 ¡Nueva mejor puntuación!</p>' : ''}
      <button class="btn" onclick="desPreparar('${code}');render()">🔁 Otra vez</button>
      <button class="btn ghost" onclick="go('#/desafio')">Elegir nivel</button></div>
    <div class="card"><h3>Tus 5 mejores en ${code}</h3>${desRanking(code, pos)}</div>`;
}

// ---------- audios sin conexión: descarga por nivel (caché «mi-ingles-audio», que sw.js no borra al actualizar) ----------
const AUDIO_CACHE = 'mi-ingles-audio';
const DESC_WIFI_MB = 110;           // a partir de aquí se recomienda wifi
let DESC = {nivel: null, hechos: 0, total: 0, corriendo: false, cancel: false, msg: '', ok: false, confirmar: null, borrar: false};
let DESC_CNT = {};
function descDisponible(){ return typeof caches !== 'undefined' && location.protocol.startsWith('http'); }
function descNivel(code){ return (DATA.audios || {})[code] || {n: 0, bytes: 0, files: []}; }
function fmtMB(b){ return (b / 1048576).toFixed(1).replace('.', ',') + ' MB'; }
function avisoAudio(){
  try {
    const v = document.getElementById('audio-aviso'); if (v) v.remove();
    const d = document.createElement('div');
    d.id = 'audio-aviso'; d.className = 'logro-aviso'; d.setAttribute('role', 'status'); d.setAttribute('aria-live', 'polite');
    d.innerHTML = '<div class="la-ico">📡</div><div><b>Este audio necesita conexión</b></div>';
    document.body.appendChild(d);
    setTimeout(() => { try { d.remove(); } catch(e){} }, 3500);
  } catch(e){}
}
function audioFalla(src, otro, sinCon){      // el audio no cargó: ¿falta la conexión (y no está descargado) o es otro problema?
  const sin = sinCon || avisoAudio;
  try {
    fetch(src, {headers: {Range: 'bytes=0-0'}, cache: 'no-store'}).then(r => { if (r.status === 503) sin(); else otro(); }).catch(() => sin());
  } catch(e){ sin(); }
}
async function descContar(){        // {A1: audios descargados, ...}
  const r = {};
  if (!descDisponible()) return r;
  try {
    if (!(await caches.has(AUDIO_CACHE))) return r;
    const c = await caches.open(AUDIO_CACHE), ks = await c.keys();
    const hay = new Set(ks.map(k => new URL(k.url).pathname.split('/').pop()));
    DATA.levels.forEach(l => { r[l.code] = descNivel(l.code).files.filter(f => hay.has(f)).length; });
  } catch(e){}
  return r;
}
function descCompleto(code, c){ const n = descNivel(code).n; return n > 0 && ((c || DESC_CNT)[code] || 0) >= n; }
async function descHome(){
  const el = document.getElementById('desc-home'); if (!el) return;
  if (!descDisponible()) { el.textContent = ''; return; }
  DESC_CNT = await descContar();
  const ok = DATA.levels.filter(l => descCompleto(l.code)).map(l => l.code + ' ✔');
  const el2 = document.getElementById('desc-home');
  if (el2) el2.textContent = ok.length ? 'Sin conexión: ' + ok.join(' · ') : 'Ningún nivel descargado todavía.';
}
function descCuerpo(){
  if (!descDisponible()) return '<div class="card"><p>Este navegador no permite guardar audios para usar sin conexión.</p></div>';
  const run = DESC.corriendo;
  const filas = DATA.levels.map(l => {
    const nv = descNivel(l.code), vivo = run && DESC.nivel === l.code, k = vivo ? DESC.hechos : (DESC_CNT[l.code] || 0);
    let estado, accion = '';
    if (vivo) {
      estado = `<b>${k} de ${nv.n} audios</b><div class="bar"><div style="width:${Math.round(100 * k / Math.max(1, nv.n))}%"></div></div>`;
      accion = `<button class="btn ghost chico" onclick="descCancelar()">Cancelar</button>`;
    } else {
      estado = descCompleto(l.code) ? '✔ Descargado' : k ? `${k} de ${nv.n} audios descargados` : 'Sin descargar';
      accion = descCompleto(l.code) ? '' : `<button class="btn chico" ${run || DESC.confirmar ? 'disabled' : ''} onclick="descPedir('${l.code}')">${k ? 'Seguir' : 'Descargar'}</button>`;
    }
    return `<div class="desc-fila"><div class="desc-txt"><b>${l.icon || ''} ${l.code}</b><div class="pcap" style="margin:2px 0 0">${nv.n} audios · ${fmtMB(nv.bytes).replace(' ', ' ')}</div><div class="pcap" style="margin:2px 0 0">${estado}</div></div>${accion}</div>`;
  }).join('');
  let conf = '';
  if (DESC.confirmar && !run) {
    const nv = descNivel(DESC.confirmar), k = DESC_CNT[DESC.confirmar] || 0;
    conf = `<div class="card"><h3>Nivel ${DESC.confirmar}</h3><p>${nv.n} audios · ${fmtMB(nv.bytes)}.${k ? ` Ya tienes ${k}: solo se bajarán los que faltan.` : ''}</p>
      ${nv.bytes / 1048576 > DESC_WIFI_MB ? '<p class="fb bad">Es una descarga grande: te recomiendo hacerla con wifi.</p>' : ''}
      <p>¿Descargar este nivel?</p><button class="btn" onclick="descOk()">Sí, descargar</button> <button class="btn ghost" onclick="descNo()">No</button></div>`;
  }
  const msg = DESC.msg ? `<p class="fb ${DESC.ok ? 'ok' : 'bad'}" role="status">${esc(DESC.msg)}</p>` : '';
  const borrar = DESC.borrar && !run
    ? `<div class="card"><p>¿Borrar todos los audios descargados? Para estudiar sin conexión tendrás que volver a descargarlos.</p><button class="btn" onclick="descBorrarSi()">Sí, borrar</button> <button class="btn ghost" onclick="descBorrarNo()">No</button></div>`
    : `<button class="btn ghost" ${run ? 'disabled' : ''} onclick="descBorrarPedir()">🗑️ Borrar descargas</button>`;
  return `${filas}${conf}${msg}<div class="center" style="margin-top:12px">${borrar}</div>`;
}
function descPintar(){ const v = document.getElementById('desc-vista'); if (v) v.innerHTML = descCuerpo(); }
function viewDescargas(){
  descContar().then(c => { DESC_CNT = c; descPintar(); });
  return `<div class="crumb" onclick="go('#/')">← Inicio</div><h2>📥 Estudiar sin conexión</h2>
    <p class="pcap">Descarga los audios de un nivel y podrás estudiarlo sin internet. Las lecciones, el glosario y el repaso ya funcionan sin conexión; esto añade el sonido.</p>
    <div id="desc-vista">${descCuerpo()}</div>`;
}
function descPedir(code){ if (DESC.corriendo) return; DESC.confirmar = code; DESC.msg = ''; DESC.borrar = false; descPintar(); }
function descNo(){ DESC.confirmar = null; descPintar(); }
function descOk(){ const c = DESC.confirmar; DESC.confirmar = null; if (c) descIniciar(c); }
function descCancelar(){ if (DESC.corriendo) DESC.cancel = true; }
async function descIniciar(code){
  if (DESC.corriendo) return;
  const niv = descNivel(code), est = DESC = {nivel: code, hechos: 0, total: niv.files.length, corriendo: true, cancel: false, msg: '', ok: false, confirmar: null, borrar: false};
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}   // que el móvil no borre las descargas solo
  descPintar();
  let cache;
  try { cache = await caches.open(AUDIO_CACHE); }
  catch(e){ est.corriendo = false; est.msg = 'No se pudo guardar en este navegador.'; descPintar(); return; }
  const pend = [];
  for (const f of niv.files) { let ya = false; try { ya = !!(await cache.match('audio/' + f)); } catch(e){} if (ya) est.hechos++; else pend.push(f); }
  descPintar();
  let i = 0, fallo = null;
  const hilo = async () => {
    while (!est.cancel && !fallo) {
      const k = i++; if (k >= pend.length) return;

function iniciarNube(){

      if (r.data && r.data.session) entrarConUsuario(r.data.session.user);

function cargarLib(){

    sc.onload = () => { LIB_ESTADO = 'lista'; try { iniciarNube(); } catch(e){ LIB_ESTADO = 'fallo'; } res(); pintarEntradaSiHaceFalta(); };
    sc.onerror = () => {
      LIB_ESTADO = 'fallo'; sc.remove();
      if (AUTH_COMPROBANDO) { AUTH_COMPROBANDO = false; if (USER) { UID_ACTUAL = USER.id; refrescarEstado(); } HAY_SESION = !!USER; render(); }   // sin librería: se usa la copia local

function errorCrear(e){          // el servidor comprueba el código de invitación; si rechaza la cuenta por eso, no da detalles útiles: se muestra el aviso en español
  const c = String((e && e.code) || '').toLowerCase(), m = String((e && e.message) || '').toLowerCase();
  const http = e && typeof e.status === 'number' ? e.status : 0;          // la librería llama «AuthRetryableFetchError» también a un 500 del servidor: si hubo respuesta, no es falta de conexión
  if (http === 502 || http === 503 || http === 504) return 'No se pudo completar. Inténtalo de nuevo.';
  if (!http && esRed(e)) return 'Sin conexión';
  if (c === 'user_already_exists' || c === 'email_exists' || /already registered|already been registered|already exists/.test(m)) return 'Ya existe una cuenta con ese correo';
  if (c === 'weak_password' || /password should be|weak password/.test(m)) return 'La contraseña es demasiado débil: usa al menos 6 caracteres.';
  if (c === 'email_address_invalid' || /invalid format|unable to validate email|email address .* is invalid/.test(m)) return 'El correo no es válido.';
  if (/rate limit|too many|security purposes/.test(m) || c.indexOf('rate_limit') >= 0) return 'Demasiados intentos. Espera un momento y vuelve a probar.';
  return 'Código de invitación no válido o ya usado';

async function authAccion(crear){
  if (AUTH_OCUPADO) return;
  const mail = (document.getElementById('au-mail').value || '').trim(), pass = document.getElementById('au-pass').value || '';
  const cod = crear ? (document.getElementById('au-codigo') ? document.getElementById('au-codigo').value : '') : '';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { authMsg(false, 'El correo no es válido.'); return; }
  if (!pass) { authMsg(false, 'Escribe tu contraseña.'); return; }
  if (crear && pass.length < 6) { authMsg(false, 'La contraseña debe tener al menos 6 caracteres.'); return; }
  if (crear && !cod.trim()) { authMsg(false, 'Escribe tu código de invitación'); return; }      // sin código no se envía nada
  AUTH_OCUPADO = true;
  const bs = [document.getElementById('au-entrar'), document.getElementById('au-crear')];
  bs.forEach(b => b && (b.disabled = true));
  try {
    if (!SB && LIB_ESTADO === 'cargando' && LIB_PROMESA) { authMsg(true, 'Conectando…'); await LIB_PROMESA; }
    if (!SB) { authMsg(false, crear ? 'Sin conexión' : 'Necesitas conexión para entrar.'); return; }
    if (crear) {
      const r = await SB.auth.signUp({email: mail, password: pass, options: {data: {codigo: cod}}});       // el código va tal cual lo escribió la persona
      if (r.error) throw r.error;
      if (r.data && r.data.session) { entrarConUsuario(r.data.session.user); return; }                 // sin confirmación: entra directamente
      if (r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0) authMsg(false, 'Ya existe una cuenta con ese correo');
      else authMsg(true, 'Revisa tu correo para confirmar la cuenta y luego entra.');
    } else {
      const r = await SB.auth.signInWithPassword({email: mail, password: pass});
      if (r.error) throw r.error;
      if (r.data && r.data.session) entrarConUsuario(r.data.session.user);
    }
  } catch(e){ authMsg(false, crear ? errorCrear(e) : errorAuth(e)); }
  finally { AUTH_OCUPADO = false; bs.forEach(b => b && b.isConnected && (b.disabled = false)); }
}
