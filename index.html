io", "items": ["Can I try it ___? (on / in) → **on**"]}, {"key": "Habla", "items": ["\"Can I try ___ on?\""]}], "exercise": {"stem": "Can I try it ___?", "options": ["on", "in"], "answer": "on"}}, {"n": 3, "title": "Descuentos (sale, discount)", "sections": [{"key": "Tema", "items": ["entender ofertas."]}, {"key": "Vocabulario", "items": ["sale (rebajas), discount (descuento), half price (mitad de precio), 20% off (20% de descuento)"]}, {"key": "Lectura", "items": ["This jacket is on sale. There is a 20% discount on shoes. The bag is half price."]}, {"key": "Notas", "items": ["*on sale* = en oferta.", "*off* = de descuento."]}, {"key": "Ejercicio", "items": ["This jacket is on ___. (sale / sell) → **sale**"]}, {"key": "Habla", "items": ["\"This ___ is on sale.\""]}], "exercise": {"stem": "This jacket is on ___.", "options": ["sale", "sell"], "answer": "sale"}}, {"n": 4, "title": "Devolver algo (return, receipt)", "sections": [{"key": "Tema", "items": ["pedir la factura y devolver algo."]}, {"key": "Vocabulario", "items": ["receipt (factura / ticket), return (devolver), refund (reembolso), broken (roto), size (talla)"]}, {"key": "Lectura (diálogo)", "items": ["Can I have a receipt, please? → Of course.", "I'd like to return this. It's broken. → I can give you a refund."]}, {"key": "Notas", "items": ["*I'd like to return this* = quisiera devolver esto.", "*refund* = dinero de vuelta."]}, {"key": "Ejercicio", "items": ["I'd like to ___ this. (return / refund) → **return**"]}, {"key": "Habla", "items": ["\"I'd like to return this. It's ___.\""]}], "exercise": {"stem": "I'd like to ___ this.", "options": ["return", "refund"], "answer": "return"}}, {"n": 5, "title": "Dinero y precios (expensive, afford)", "sections": [{"key": "Tema", "items": ["hablar de lo que puedes pagar."]}, {"key": "Vocabulario", "items": ["expensive (caro), cheap (barato), afford (permitirse), spend (gastar), save (ahorrar)"]}, {"key": "Lectura", "items": ["This phone is too expensive. I can't afford it. I want to save money this month."]}, {"key": "Notas", "items": ["*can't afford* = no puedo permitirme.", "*spend money on* = gastar dinero en."]}, {"key": "Ejercicio", "items": ["I can't ___ it. (afford / affordable) → **afford**"]}, {"key": "Habla", "items": ["\"I can't afford ___.\""]}], "exercise": {"stem": "I can't ___ it.", "options": ["afford", "affordable"], "answer": "afford"}}, {"n": 6, "title": "Presupuesto (budget)", "sections": [{"key": "Tema", "items": ["hablar de un presupuesto y de lo que compras."]}, {"key": "Vocabulario", "items": ["budget (presupuesto), value (calidad-precio), worth (vale la pena), monthly (mensual)"]}, {"key": "Lectura", "items": ["My budget is 100 euros a month. This coat is good value. It is worth the money."]}, {"key": "Notas", "items": ["*good value* = buena relación calidad-precio.", "*worth it* = vale la pena."]}, {"key": "Ejercicio", "items": ["My ___ is 100 euros a month. (budget / budgets) → **budget**"]}, {"key": "Habla", "items": ["\"My budget is ___.\""]}], "exercise": {"stem": "My ___ is 100 euros a month.", "options": ["budget", "budgets"], "answer": "budget"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I need a medium size, please. Do you have this shirt in blue? How much does it cost? I'll pay with my card."]}, {"key": "Repaso", "items": ["tallas, probarse, descuentos, devolver, dinero, presupuesto."]}, {"key": "Actividad de habla (role play)", "items": ["Compra una camiseta en una tienda, pide otra talla y pregunta si hay descuento."]}, {"key": "Actividad escrita", "items": ["escribe 5 frases sobre lo que compraste la última vez."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 in, 2 on, 3 fits, 4 sale, 5 return, 6 receipt, 7 expensive, 8 afford, 9 save, 10 discount"]}], "exercise": null}], "exam": [{"stem": "Do you have this ___ blue?", "options": ["in", "on"], "answer": "in"}, {"stem": "Can I try it ___?", "options": ["on", "in"], "answer": "on"}, {"stem": "It ___ me well.", "options": ["fits", "fit"], "answer": "fits"}, {"stem": "This jacket is on ___.", "options": ["sale", "sell"], "answer": "sale"}, {"stem": "I'd like to ___ this.", "options": ["return", "refund"], "answer": "return"}, {"stem": "Can I have a ___, please?", "options": ["receipt", "receive"], "answer": "receipt"}, {"stem": "It's too ___.", "options": ["expensive", "expensives"], "answer": "expensive"}, {"stem": "I can't ___ it.", "options": ["afford", "affordable"], "answer": "afford"}, {"stem": "I want to ___ money.", "options": ["save", "safe"], "answer": "save"}, {"stem": "The ___ is 20% off.", "options": ["discount", "discounts"], "answer": "discount"}]}, {"id": "a2-u9", "level": "A2", "num": 9, "title": "Futuro con will", "meta": "tomar decisiones en el momento, hacer predicciones y prometer algo.", "lessons": [{"n": 1, "title": "Decisiones en el momento (will)", "sections": [{"key": "Tema", "items": ["decidir algo justo ahora."]}, {"key": "Vocabulario", "items": ["call (llamar), later (más tarde), have (tomar, en un restaurante), soup (sopa)"]}, {"key": "Lectura (diálogo)", "items": ["What would you like? → I'll have the soup.", "The phone is ringing. → I'll answer it."]}, {"key": "Notas", "items": ["*will* + verbo base: *I'll have*, *I'll call*.", "*I'll* = *I will*. Se usa para una decisión que tomas en ese momento."]}, {"key": "Ejercicio", "items": ["I'll ___ the soup, please. (have / has) → **have**"]}, {"key": "Habla", "items": ["\"I'll ___ later.\""]}], "exercise": {"stem": "I'll ___ the soup, please.", "options": ["have", "has"], "answer": "have"}}, {"n": 2, "title": "Predicciones (will)", "sections": [{"key": "Tema", "items": ["decir lo que crees que pasará."]}, {"key": "Vocabulario", "items": ["rain (llover), pass (aprobar), win (ganar), think (pensar), tomorrow (mañana)"]}, {"key": "Lectura", "items": ["It will rain tomorrow. I think she will pass the exam. Our team will win the match."]}, {"key": "Notas", "items": ["*will* para predicciones: *It will rain*.", "*I think* + *will* para una opinión sobre el futuro."]}, {"key": "Ejercicio", "items": ["It ___ rain tomorrow. (will / is going) → **will**"]}, {"key": "Habla", "items": ["\"I think ___ will ___.\""]}], "exercise": {"stem": "It ___ rain tomorrow.", "options": ["will", "is going"], "answer": "will"}}, {"n": 3, "title": "Promesas y ofrecimientos (will)", "sections": [{"key": "Tema", "items": ["prometer y ofrecer ayuda."]}, {"key": "Vocabulario", "items": ["help (ayudar), bags (bolsas), promise (prometer), on time (a tiempo), late (tarde)"]}, {"key": "Lectura", "items": ["I'll help you with your bags. I promise I'll be on time."]}, {"key": "Notas", "items": ["*I'll help* = te ayudo (ofrecimiento).", "*I promise I'll* = te prometo que..."]}, {"key": "Ejercicio", "items": ["I ___ help you with your bags. (will / going) → **will**"]}, {"key": "Habla", "items": ["\"I'll help you ___.\""]}], "exercise": {"stem": "I ___ help you with your bags.", "options": ["will", "going"], "answer": "will"}}, {"n": 4, "title": "No... y ¿...? (won't, will you)", "sections": [{"key": "Tema", "items": ["negativos y preguntas con *will*."]}, {"key": "Vocabulario", "items": ["won't (no va a), be (estar/ser), late (tarde), call (llamar)"]}, {"key": "Lectura (diálogo)", "items": ["Will you call me later? → Yes, I will.", "I won't be late. → Good!"]}, {"key": "Notas", "items": ["*won't* = will not.", "Pregunta: **Will** + sujeto + verbo base."]}, {"key": "Ejercicio", "items": ["I won't ___ late. (be / is) → **be**"]}, {"key": "Habla", "items": ["\"I won't ___. Will you ___?\""]}], "exercise": {"stem": "I won't ___ late.", "options": ["be", "is"], "answer": "be"}}, {"n": 5, "title": "¿Plan o decisión? (going to / will)", "sections": [{"key": "Tema", "items": ["diferenciar *going to* (plan) y *will* (decisión del momento)."]}, {"key": "Vocabulario", "items": ["plan (plan), visit (visitar), next week (la semana que viene)"]}, {"key": "Lectura", "items": ["I'm going to visit my aunt next week. (plan) / I'll call her now. (decisión)"]}, {"key": "Notas", "items": ["*going to* = ya lo habíamos decidido antes.", "*will* = lo decidimos justo ahora."]}, {"key": "Ejercicio", "items": ["I'm ___ visit my aunt next week. (going to / will) → **going to**"]}, {"key": "Habla", "items": ["\"I'm going to ___. I'll ___.\""]}], "exercise": {"stem": "I'm ___ visit my aunt next week.", "options": ["going to", "will"], "answer": "going to"}}, {"n": 6, "title": "Expresiones de futuro", "sections": [{"key": "Tema", "items": ["palabras para hablar del futuro."]}, {"key": "Vocabulario", "items": ["soon (pronto), next year (el año que viene), in two weeks (dentro de dos semanas), later (más tarde)"]}, {"key": "Lectura", "items": ["We'll meet in two weeks. I'll see you soon. Next year we'll move to Barcelona."]}, {"key": "Notas", "items": ["*in + tiempo* = dentro de: *in two weeks*.", "*soon* = pronto."]}, {"key": "Ejercicio", "items": ["We'll ___ in two weeks. (meet / meets) → **meet**"]}, {"key": "Habla", "items": ["\"I'll ___ in ___.\""]}], "exercise": {"stem": "We'll ___ in two weeks.", "options": ["meet", "meets"], "answer": "meet"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I will call you tomorrow. I think it will rain later. I'll help you with your homework. We will visit grandma next week."]}, {"key": "Repaso", "items": ["*will* para decisiones, predicciones, promesas, negativos, preguntas, *going to* vs *will*."]}, {"key": "Actividad de habla", "items": ["Di 2 decisiones de hoy con *I'll*, 2 predicciones con *I think... will* y 1 promesa."]}, {"key": "Actividad escrita", "items": ["escribe tu agenda de la semana que viene en 6 frases con *will* o *going to*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have, 2 will, 3 will, 4 be, 5 Will, 6 going to, 7 soon, 8 will, 9 meet, 10 will"]}], "exercise": null}], "exam": [{"stem": "I'll ___ the soup, please.", "options": ["have", "has"], "answer": "have"}, {"stem": "It ___ rain tomorrow.", "options": ["will", "is going"], "answer": "will"}, {"stem": "I ___ help you.", "options": ["will", "going"], "answer": "will"}, {"stem": "I won't ___ late.", "options": ["be", "is"], "answer": "be"}, {"stem": "___ you call me later?", "options": ["Will", "Are"], "answer": "Will"}, {"stem": "I'm ___ visit my aunt next week.", "options": ["going to", "will"], "answer": "going to"}, {"stem": "I'll see you ___.", "options": ["soon", "soonly"], "answer": "soon"}, {"stem": "She ___ pass the exam.", "options": ["will", "is"], "answer": "will"}, {"stem": "We'll ___ in two weeks.", "options": ["meet", "meets"], "answer": "meet"}, {"stem": "The weather ___ be sunny.", "options": ["will", "is going"], "answer": "will"}]}, {"id": "a2-u10", "level": "A2", "num": 10, "title": "Experiencias", "meta": "hablar de lo que has hecho alguna vez en la vida, usando el present perfect.", "lessons": [{"n": 1, "title": "Participios irregulares", "sections": [{"key": "Tema", "items": ["formas del participio que más se usan."]}, {"key": "Vocabulario", "items": ["been (estado de ser o estar), seen (visto), done (hecho), eaten (comido), gone (ido), had (tenido), made (hecho/fabricado)"]}, {"key": "Lectura", "items": ["I have been to Italy. I have seen a whale. I have eaten sushi. I have had a lot of fun."]}, {"key": "Notas", "items": ["Los verbos regulares añaden **-ed** (*visited*). Los irregulares hay que memorizarlos.", "*been* y *gone* no significan lo mismo: *I have been to Rome* (fui y volví) / *She has gone to Rome* (se fue y no ha vuelto)."]}, {"key": "Ejercicio", "items": ["I have ___ to Italy. (been / be) → **been**"]}, {"key": "Habla", "items": ["\"I have ___ ___.\""]}], "exercise": {"stem": "I have ___ to Italy.", "options": ["been", "be"], "answer": "been"}}, {"n": 2, "title": "He estado / he hecho (present perfect)", "sections": [{"key": "Tema", "items": ["formar el present perfect: *have/has + participio*."]}, {"key": "Vocabulario", "items": ["visit (visitar), climb (escalar), try (probar), ever (alguna vez)"]}, {"key": "Lectura", "items": ["I have visited Portugal twice. She has tried sushi. We have climbed a mountain."]}, {"key": "Notas", "items": ["*I, you, we, they* + **have** + participio.", "*he, she, it* + **has** + participio."]}, {"key": "Ejercicio", "items": ["She has ___ sushi. (try / tried) → **tried**"]}, {"key": "Habla", "items": ["\"I have ___ ___.\""]}], "exercise": {"stem": "She has ___ sushi.", "options": ["try", "tried"], "answer": "tried"}}, {"n": 3, "title": "¿Alguna vez...? (have you ever)", "sections": [{"key": "Tema", "items": ["preguntar por experiencias."]}, {"key": "Vocabulario", "items": ["ever (alguna vez), shark (tiburón), London (Londres), sushi (sushi)"]}, {"key": "Lectura (diálogo)", "items": ["Have you ever been to London? → Yes, I have. Twice!", "Has she ever seen a shark? → No, she hasn't."]}, {"key": "Notas", "items": ["Pregunta: **Have/Has** + sujeto + *ever* + participio.", "Respuesta corta: *Yes, I have.* / *No, she hasn't.*"]}, {"key": "Ejercicio", "items": ["___ you ever been to London? (Have / Did) → **Have**"]}, {"key": "Habla", "items": ["\"Have you ever ___? Yes, I have. / No, I haven't.\""]}], "exercise": {"stem": "___ you ever been to London?", "options": ["Have", "Did"], "answer": "Have"}}, {"n": 4, "title": "Nunca (never)", "sections": [{"key": "Tema", "items": ["decir que nunca has hecho algo."]}, {"key": "Vocabulario", "items": ["never (nunca), snake (serpiente), before (antes)"]}, {"key": "Lectura", "items": ["I have never seen a snake. We have never been to Japan before."]}, {"key": "Notas", "items": ["*never* va entre *have* y el participio: *have never seen*.", "No uses *not* con *never*."]}, {"key": "Ejercicio", "items": ["I have ___ seen a snake. (never / not) → **never**"]}, {"key": "Habla", "items": ["\"I have never ___.\""]}], "exercise": {"stem": "I have ___ seen a snake.", "options": ["never", "not"], "answer": "never"}}, {"n": 5, "title": "Experiencia vs. fecha (present perfect vs. pasado simple)", "sections": [{"key": "Tema", "items": ["diferenciar la experiencia (sin fecha) del hecho en un momento concreto."]}, {"key": "Vocabulario", "items": ["in 2019 (en 2019), last year (el año pasado)"]}, {"key": "Lectura", "items": ["I have been to Paris. (experiencia, sin fecha) / I visited Paris in 2019. (momento concreto)"]}, {"key": "Notas", "items": ["Con fecha exacta usamos pasado simple: *in 2019*, *last year*.", "Sin fecha, pero como experiencia de vida, usamos present perfect."]}, {"key": "Ejercicio", "items": ["I ___ Paris in 2019. (visited / have visited) → **visited**"]}, {"key": "Habla", "items": ["\"I have ___. I ___ in ___.\""]}], "exercise": {"stem": "I ___ Paris in 2019.", "options": ["visited", "have visited"], "answer": "visited"}}, {"n": 6, "title": "Contar una experiencia", "sections": [{"key": "Tema", "items": ["hablar de una experiencia con más detalle."]}, {"key": "Vocabulario", "items": ["amazing (increíble), exciting (emocionante), scary (aterrador), beautiful (bonito)"]}, {"key": "Lectura", "items": ["I have done many things in my life. Skydiving was amazing. Climbing the mountain was scary but exciting."]}, {"key": "Notas", "items": ["*was* + adjetivo para opinar sobre lo que pasó.", "*the best / the most* para destacar."]}, {"key": "Ejercicio", "items": ["Skydiving was ___. (amazing / amazed) → **amazing**"]}, {"key": "Habla", "items": ["\"I have done ___. It was ___.\""]}], "exercise": {"stem": "Skydiving was ___.", "options": ["amazing", "amazed"], "answer": "amazing"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I have visited London twice. Have you ever eaten sushi? She has already finished the project. I have never seen snow."]}, {"key": "Repaso", "items": ["participios, *have/has + participio*, *have you ever*, *never*, experiencia vs. fecha, contar una experiencia."]}, {"key": "Actividad de habla", "items": ["Di 3 cosas que hayas hecho alguna vez y 1 que nunca hayas hecho."]}, {"key": "Actividad escrita", "items": ["escribe 5 frases sobre tu vida con *I have* y *I have never*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 been, 2 seen, 3 eaten, 4 never, 5 gone, 6 Have, 7 have, 8 haven't, 9 visited, 10 had"]}], "exercise": null}], "exam": [{"stem": "I have ___ to Italy.", "options": ["been", "be"], "answer": "been"}, {"stem": "Have you ___ a shark?", "options": ["seen", "see"], "answer": "seen"}, {"stem": "Have you ever ___ sushi?", "options": ["eat", "eaten"], "answer": "eaten"}, {"stem": "I have ___ seen a snake.", "options": ["never", "not"], "answer": "never"}, {"stem": "She has ___ to Japan.", "options": ["gone", "went"], "answer": "gone"}, {"stem": "___ you ever been to London?", "options": ["Have", "Did"], "answer": "Have"}, {"stem": "Yes, I ___.", "options": ["have", "did"], "answer": "have"}, {"stem": "No, I ___.", "options": ["haven't", "didn't"], "answer": "haven't"}, {"stem": "I ___ Paris in 2019.", "options": ["visited", "have visited"], "answer": "visited"}, {"stem": "He has ___ a car.", "options": ["had", "have"], "answer": "had"}]}, {"id": "b1-u1", "level": "B1", "num": 1, "title": "Sobre mí", "meta": "describir tu personalidad, tus gustos, tus hábitos de antes y de ahora, y hablar de ti con detalle durante un minuto.", "lessons": [{"n": 1, "title": "Presente simple o continuo (contraste)", "sections": [{"key": "Tema", "items": ["cuándo usar presente simple (hábitos) y presente continuo (ahora)."]}, {"key": "Vocabulario", "items": ["usually (normalmente), right now (ahora mismo), at the moment (en este momento), every day (todos los días)"]}, {"key": "Lectura", "items": ["I usually work from home. Right now I am reading a book about history. At the moment we are looking for a new flat."]}, {"key": "Notas", "items": ["Presente simple: hábitos y rutinas, *usually, every day*.", "Presente continuo: algo que pasa ahora o en este periodo, *right now, at the moment*."]}, {"key": "Ejercicio", "items": ["Right now I ___ a book. (read / am reading) → **am reading**"]}, {"key": "Habla", "items": ["\"Usually I ___. Right now I am ___.\""]}], "exercise": {"stem": "Right now I ___ a book.", "options": ["read", "am reading"], "answer": "am reading"}}, {"n": 2, "title": "Describir la personalidad", "sections": [{"key": "Tema", "items": ["adjetivos de personalidad."]}, {"key": "Vocabulario", "items": ["outgoing (sociable), shy (tímido), reliable (fiable), easy-going (tranquilo), ambitious (ambicioso), patient (paciente)"]}, {"key": "Lectura", "items": ["I'm quite outgoing and I enjoy meeting new people. My sister is shy at first, but she's very reliable. My boss is patient and easy-going."]}, {"key": "Notas", "items": ["*quite* = bastante. *very* = muy.", "Adjetivos de personalidad se usan con *is / am / are*: *She is very reliable*."]}, {"key": "Ejercicio", "items": ["She is very ___. (reliable / reliably) → **reliable**"]}, {"key": "Habla", "items": ["\"I'm quite ___. I'm ___.\""]}], "exercise": {"stem": "She is very ___.", "options": ["reliable", "reliably"], "answer": "reliable"}}, {"n": 3, "title": "Gustos fuertes (be into, can't stand)", "sections": [{"key": "Tema", "items": ["expresar gustos con más intensidad."]}, {"key": "Vocabulario", "items": ["be into (estar muy interesado en), keen on (aficionado a), can't stand (no soportar), loud (ruidoso), photography (fotografía)"]}, {"key": "Lectura", "items": ["I'm really into photography. I'm keen on hiking at weekends. I can't stand loud music."]}, {"key": "Notas", "items": ["*be into* + sustantivo o *-ing*: *I'm into reading*.", "*keen on* + sustantivo o *-ing*: *keen on hiking*.", "*can't stand* + *-ing*: *can't stand waiting*."]}, {"key": "Ejercicio", "items": ["I can't ___ loud music. (stand / standing) → **stand**"]}, {"key": "Habla", "items": ["\"I'm really into ___. I can't stand ___.\""]}], "exercise": {"stem": "I can't ___ loud music.", "options": ["stand", "standing"], "answer": "stand"}}, {"n": 4, "title": "Hábitos del pasado (used to)", "sections": [{"key": "Tema", "items": ["hablar de hábitos o situaciones que ya no existen."]}, {"key": "Vocabulario", "items": ["used to (solía), play the piano (tocar el piano), childhood (infancia), move (mudarse)"]}, {"key": "Lectura", "items": ["When I was a child, I used to play the piano every day. We used to live in a small village. Now I live in a big city."]}, {"key": "Notas", "items": ["*used to* + verbo base = solía / antes hacía.", "Ya no se hace, por eso usamos *used to* y no el presente."]}, {"key": "Ejercicio", "items": ["I ___ to play the piano. (used / use) → **used**"]}, {"key": "Habla", "items": ["\"When I was a child, I used to ___.\""]}], "exercise": {"stem": "I ___ to play the piano.", "options": ["used", "use"], "answer": "used"}}, {"n": 5, "title": "Preguntas indirectas (Do you know where...?)", "sections": [{"key": "Tema", "items": ["preguntas más educadas."]}, {"key": "Vocabulario", "items": ["know (saber), where (dónde), when (cuándo), station (estación)"]}, {"key": "Lectura (diálogo)", "items": ["Do you know where the station is? → Yes, it's next to the bank.", "Could you tell me when the shop opens? → At nine."]}, {"key": "Notas", "items": ["En preguntas indirectas el verbo va en orden normal: *where the station is*, no *where is the station*.", "Son más educadas que las directas."]}, {"key": "Ejercicio", "items": ["Do you know where the station ___? (is / it is) → **is**"]}, {"key": "Habla", "items": ["\"Do you know where ___?\""]}], "exercise": {"stem": "Do you know where the station ___?", "options": ["is", "it is"], "answer": "is"}}, {"n": 6, "title": "Frecuencia avanzada (rarely, tend to)", "sections": [{"key": "Tema", "items": ["hablar de hábitos con más matices."]}, {"key": "Vocabulario", "items": ["rarely (rara vez), hardly ever (casi nunca), tend to (tender a), late (tarde), stay up (quedarse despierto)"]}, {"key": "Lectura", "items": ["I rarely go out on weekdays. I hardly ever eat fast food. I tend to stay up late."]}, {"key": "Notas", "items": ["*rarely* y *hardly ever* son casi negativos.", "*tend to* + verbo base: *tend to stay*."]}, {"key": "Ejercicio", "items": ["I ___ go to the gym. (rarely / rarely to) → **rarely**"]}, {"key": "Habla", "items": ["\"I tend to ___. I rarely ___.\""]}], "exercise": {"stem": "I ___ go to the gym.", "options": ["rarely", "rarely to"], "answer": "rarely"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I usually take the bus to work. Right now I am reading a great book. I am living in Madrid, but I work in London."]}, {"key": "Repaso", "items": ["presente simple vs. continuo, personalidad, *be into / can't stand*, *used to*, preguntas indirectas, frecuencia avanzada."]}, {"key": "Actividad de habla (1 minuto)", "items": ["Háblate durante un minuto: quién eres, qué te gusta, qué hacías de niño y qué haces ahora."]}, {"key": "Actividad escrita", "items": ["escribe una presentación de 8 frases sobre ti."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 am reading, 2 is, 3 can't, 4 used, 5 is, 6 rarely, 7 used, 8 on, 9 reliable, 10 tend to"]}], "exercise": null}], "exam": [{"stem": "Right now I ___ a book.", "options": ["read", "am reading"], "answer": "am reading"}, {"stem": "She ___ very outgoing.", "options": ["is", "are"], "answer": "is"}, {"stem": "I ___ stand loud music.", "options": ["can", "can't"], "answer": "can't"}, {"stem": "He ___ to play the piano as a child.", "options": ["used", "use"], "answer": "used"}, {"stem": "Do you know where the station ___?", "options": ["is", "it is"], "answer": "is"}, {"stem": "I ___ go to the gym.", "options": ["rarely", "rarely to"], "answer": "rarely"}, {"stem": "We ___ to live in a flat.", "options": ["used", "use"], "answer": "used"}, {"stem": "I'm keen ___ hiking.", "options": ["on", "for"], "answer": "on"}, {"stem": "She is very ___.", "options": ["reliable", "reliably"], "answer": "reliable"}, {"stem": "I ___ stay up late.", "options": ["tend to", "tend"], "answer": "tend to"}]}, {"id": "b1-u2", "level": "B1", "num": 2, "title": "Trabajo y estudios", "meta": "contar tu historia laboral y académica: qué hiciste, cuándo y cómo cambió tu vida profesional.", "lessons": [{"n": 1, "title": "Pasado simple (regulares e irregulares)", "sections": [{"key": "Tema", "items": ["formar el pasado simple con verbos regulares e irregulares comunes."]}, {"key": "Vocabulario", "items": ["began (empezó), took (tomó), wrote (escribió), got (consiguió), found (encontró), left (dejó / salió)"]}, {"key": "Lectura", "items": ["I began my first job at 22. I took a course in marketing. Last year I got a new position and I wrote my first report."]}, {"key": "Notas", "items": ["Regulares: *worked, studied, started* (+ **-ed**).", "Irregulares: hay que memorizarlos. *began, took, wrote, got, found, left*."]}, {"key": "Ejercicio", "items": ["Last year I ___ a new job. (got / get) → **got**"]}, {"key": "Habla", "items": ["\"I began ___. Last year I ___.\""]}], "exercise": {"stem": "Last year I ___ a new job.", "options": ["got", "get"], "answer": "got"}}, {"n": 2, "title": "Contar un día de trabajo (narrar)", "sections": [{"key": "Tema", "items": ["narrar acciones en pasado en orden."]}, {"key": "Vocabulario", "items": ["arrived (llegó), had a meeting (tuve una reunión), finished (terminó), answered (contestó), emails (correos)"]}, {"key": "Lectura", "items": ["Yesterday I arrived at the office at nine. I had a meeting at ten and answered a lot of emails. I finished the report at six."]}, {"key": "Notas", "items": ["Para contar en orden usamos *then, after that, finally*.", "*had a meeting* = tuve una reunión (*have* en pasado = *had*)."]}, {"key": "Ejercicio", "items": ["Yesterday I ___ the report at six. (finish / finished) → **finished**"]}, {"key": "Habla", "items": ["\"Yesterday I ___ at ___.\""]}], "exercise": {"stem": "Yesterday I ___ the report at six.", "options": ["finish", "finished"], "answer": "finished"}}, {"n": 3, "title": "Vocabulario del trabajo", "sections": [{"key": "Tema", "items": ["palabras de trabajo de nivel intermedio."]}, {"key": "Vocabulario", "items": ["promotion (ascenso), deadline (fecha límite), responsibility (responsabilidad), team leader (líder de equipo), contract (contrato)"]}, {"key": "Lectura", "items": ["I got a promotion last year. I am now a team leader. My main responsibility is meeting the deadlines."]}, {"key": "Notas", "items": ["*a promotion* = un ascenso.", "*responsibility* es sustantivo. *responsible* es adjetivo: *I am responsible for...*"]}, {"key": "Ejercicio", "items": ["I was ___ for the project. (responsible / responsibility) → **responsible**"]}, {"key": "Habla", "items": ["\"My main responsibility is ___.\""]}], "exercise": {"stem": "I was ___ for the project.", "options": ["responsible", "responsibility"], "answer": "responsible"}}, {"n": 4, "title": "Experiencia laboral (worked as)", "sections": [{"key": "Tema", "items": ["hablar de tus trabajos anteriores."]}, {"key": "Vocabulario", "items": ["worked as (trabajé como), company (empresa), department (departamento), for (durante), in charge of (a cargo de)"]}, {"key": "Lectura", "items": ["I worked as a teacher for five years. Then I joined a marketing company. I was in charge of the social media department."]}, {"key": "Notas", "items": ["*worked as* + profesión: *worked as a teacher*.", "*joined* = empecé a trabajar en (una empresa)."]}, {"key": "Ejercicio", "items": ["I ___ as a teacher for five years. (worked / work) → **worked**"]}, {"key": "Habla", "items": ["\"I worked as a ___ for ___ years.\""]}], "exercise": {"stem": "I ___ as a teacher for five years.", "options": ["worked", "work"], "answer": "worked"}}, {"n": 5, "title": "Estudios (studied, graduated)", "sections": [{"key": "Tema", "items": ["hablar de tu formación académica."]}, {"key": "Vocabulario", "items": ["studied (estudié), graduated (me gradué), degree (título), master's (máster), studying for (estudiando para)"]}, {"key": "Lectura", "items": ["I studied English at university. I graduated in 2018. Now I am studying for a master's in business."]}, {"key": "Notas", "items": ["*graduate in* + materia: *graduated in 2018*.", "*study for* + título: *studying for a master's*."]}, {"key": "Ejercicio", "items": ["He ___ in engineering in 2018. (graduated / graduate) → **graduated**"]}, {"key": "Habla", "items": ["\"I graduated in ___. Now I'm studying ___.\""]}], "exercise": {"stem": "He ___ in engineering in 2018.", "options": ["graduated", "graduate"], "answer": "graduated"}}, {"n": 6, "title": "Cambios en la vida profesional", "sections": [{"key": "Tema", "items": ["hablar de cambios: empezar, dejar y mudarse."]}, {"key": "Vocabulario", "items": ["started (empecé), left (dejé), moved (me mudé), became (me convertí en), changed (cambió)"]}, {"key": "Lectura", "items": ["I started my new job in March. I left my old company after three years. We moved to Madrid last year. She became a team leader."]}, {"key": "Notas", "items": ["*became* + profesión: *became a team leader*.", "*left* = dejé o salí de un lugar o empresa."]}, {"key": "Ejercicio", "items": ["She ___ a team leader last month. (became / become) → **became**"]}, {"key": "Habla", "items": ["\"I started ___. I left ___.\""]}], "exercise": {"stem": "She ___ a team leader last month.", "options": ["became", "become"], "answer": "became"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Last year I worked in a hotel. I went to Berlin in June. We didn't finish the project on time. Did you study for the test?"]}, {"key": "Repaso", "items": ["pasado simple regular e irregular, narrar, vocabulario de trabajo, experiencia laboral, estudios, cambios."]}, {"key": "Actividad de habla (2 minutos)", "items": ["Cuenta tu historia laboral y académica: estudios, primer trabajo, trabajo actual y un cambio importante."]}, {"key": "Actividad escrita", "items": ["escribe tu currículum en 8 frases con pasado simple."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 got, 2 wrote, 3 missed, 4 worked, 5 graduated, 6 responsible, 7 left, 8 studied, 9 became, 10 started"]}], "exercise": null}], "exam": [{"stem": "Last year I ___ a new job.", "options": ["got", "get"], "answer": "got"}, {"stem": "She ___ the report on Monday.", "options": ["wrote", "write"], "answer": "wrote"}, {"stem": "We ___ the deadline.", "options": ["missed", "miss"], "answer": "missed"}, {"stem": "I ___ as a teacher for five years.", "options": ["worked", "work"], "answer": "worked"}, {"stem": "He ___ in engineering in 2018.", "options": ["graduated", "graduate"], "answer": "graduated"}, {"stem": "I was ___ for the project.", "options": ["responsible", "responsibility"], "answer": "responsible"}, {"stem": "They ___ the office last year.", "options": ["left", "leave"], "answer": "left"}, {"stem": "I ___ English at university.", "options": ["studied", "study"], "answer": "studied"}, {"stem": "She ___ a team leader last month.", "options": ["became", "become"], "answer": "became"}, {"stem": "We ___ the meeting early.", "options": ["started", "start"], "answer": "started"}]}, {"id": "b1-u3", "level": "B1", "num": 3, "title": "Planes y futuro", "meta": "hablar de planes, posibilidades, horarios y sugerencias sobre el futuro.", "lessons": [{"n": 1, "title": "Going to o will (repaso y contraste)", "sections": [{"key": "Tema", "items": ["diferenciar planes (*going to*) y decisiones del momento (*will*)."]}, {"key": "Vocabulario", "items": ["start (empezar), course (curso), decide (decidir), next month (el mes que viene)"]}, {"key": "Lectura", "items": ["I'm going to start a course next month. I've already booked it. (plan) / Oh, the phone is ringing. I'll answer it. (decisión)"]}, {"key": "Notas", "items": ["*going to* = plan que ya existía antes del momento.", "*will* = decisión que tomas justo ahora."]}, {"key": "Ejercicio", "items": ["I'm ___ start a course next month. (going to / will) → **going to**"]}, {"key": "Habla", "items": ["\"I'm going to ___. I'll ___.\""]}], "exercise": {"stem": "I'm ___ start a course next month.", "options": ["going to", "will"], "answer": "going to"}}, {"n": 2, "title": "Presente continuo para citas (arrangements)", "sections": [{"key": "Tema", "items": ["hablar de citas y planes con fecha usando presente continuo."]}, {"key": "Vocabulario", "items": ["meet (quedar), client (cliente), flight (vuelo), tomorrow (mañana), arrangement (cita organizada)"]}, {"key": "Lectura", "items": ["We are meeting the clients tomorrow at ten. I'm flying to Berlin on Friday. She is starting her new job on Monday."]}, {"key": "Notas", "items": ["Presente continuo para citas ya organizadas, con hora o día.", "Se usa con verbos de movimiento y de planes: *meet, fly, start*."]}, {"key": "Ejercicio", "items": ["We ___ meeting the clients tomorrow. (are / will) → **are**"]}, {"key": "Habla", "items": ["\"I'm ___ on ___.\""]}], "exercise": {"stem": "We ___ meeting the clients tomorrow.", "options": ["are", "will"], "answer": "are"}}, {"n": 3, "title": "Posibilidad (might, may)", "sections": [{"key": "Tema", "items": ["decir que algo es posible, pero no seguro."]}, {"key": "Vocabulario", "items": ["might (podría), may (puede que), rain (llover), later (más tarde), sure (seguro)"]}, {"key": "Lectura", "items": ["It might rain later. I'm not sure. We may go to the beach tomorrow, but it depends on the weather."]}, {"key": "Notas", "items": ["*might* y *may* = puede que / podría.", "Después de *might* o *may* va el verbo en forma base: *might rain*."]}, {"key": "Ejercicio", "items": ["It ___ rain later. I'm not sure. (might / must) → **might**"]}, {"key": "Habla", "items": ["\"I might ___. I may ___.\""]}], "exercise": {"stem": "It ___ rain later. I'm not sure.", "options": ["might", "must"], "answer": "might"}}, {"n": 4, "title": "Cuando pase algo (when, as soon as)", "sections": [{"key": "Tema", "items": ["hablar de cosas futuras con cláusulas de tiempo."]}, {"key": "Vocabulario", "items": ["as soon as (en cuanto), when (cuando), finish (terminar), arrive (llegar), call (llamar)"]}, {"key": "Lectura", "items": ["I'll call you as soon as I arrive. When I finish university, I'll travel for a year."]}, {"key": "Notas", "items": ["Con *when*, *as soon as*, *before*, *after*, en la cláusula con tiempo futuro usamos **presente simple**, no *will*.", "*I'll call you when I arrive*. No *when I will arrive*."]}, {"key": "Ejercicio", "items": ["I'll call you as soon as I ___. (arrive / will arrive) → **arrive**"]}, {"key": "Habla", "items": ["\"When I ___, I'll ___.\""]}], "exercise": {"stem": "I'll call you as soon as I ___.", "options": ["arrive", "will arrive"], "answer": "arrive"}}, {"n": 5, "title": "Sugerencias (let's, shall, how about)", "sections": [{"key": "Tema", "items": ["proponer planes."]}, {"key": "Vocabulario", "items": ["let's (vamos a), shall (¿...?), how about (¿qué tal si...?), cinema (cine), dinner (cena)"]}, {"key": "Lectura (diálogo)", "items": ["Shall we meet at the café? → Yes, good idea.", "How about going to the cinema tonight? → Let's do it!"]}, {"key": "Notas", "items": ["*Let's + verbo base*: *Let's watch a film*.", "*How about + -ing*: *How about going out?*"]}, {"key": "Ejercicio", "items": ["Let's ___ a film tonight. (watch / watching) → **watch**"]}, {"key": "Habla", "items": ["\"Shall we ___? How about ___?\""]}], "exercise": {"stem": "Let's ___ a film tonight.", "options": ["watch", "watching"], "answer": "watch"}}, {"n": 6, "title": "Previsto (be due to, be about to)", "sections": [{"key": "Tema", "items": ["hablar de algo que está previsto o a punto de pasar."]}, {"key": "Vocabulario", "items": ["be due to (estar previsto para), be about to (estar a punto de), leave (salir), start (empezar), announce (anunciar)"]}, {"key": "Lectura", "items": ["The train is due to arrive at nine. The meeting is about to start. The company is due to announce the results next week."]}, {"key": "Notas", "items": ["*be due to* + verbo base: *is due to arrive*.", "*be about to* + verbo base = estar a punto de: *is about to start*."]}, {"key": "Ejercicio", "items": ["She's ___ to leave soon. (about / going) → **about**"]}, {"key": "Habla", "items": ["\"The ___ is due to ___. The ___ is about to ___.\""]}], "exercise": {"stem": "She's ___ to leave soon.", "options": ["about", "going"], "answer": "about"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I am going to start a new course in January. I think it will be useful. Oh, the phone is ringing. I'll answer it."]}, {"key": "Repaso", "items": ["*going to / will*, citas con presente continuo, *might/may*, cláusulas con *when*, sugerencias, *due to / about to*."]}, {"key": "Actividad de habla (role play)", "items": ["Planifica un fin de semana con un amigo: propón planes, di qué es posible y qué ya está decidido."]}, {"key": "Actividad escrita", "items": ["escribe tu agenda de la próxima semana en 6 frases con diferentes formas de futuro."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 going, 2 are, 3 might, 4 as, 5 Shall, 6 is due, 7 finish, 8 be, 9 watch, 10 about"]}], "exercise": null}], "exam": [{"stem": "I'm ___ to start a new course next month.", "options": ["going", "will"], "answer": "going"}, {"stem": "We ___ meeting the clients tomorrow at ten.", "options": ["are", "will"], "answer": "are"}, {"stem": "It ___ rain later. I'm not sure.", "options": ["might", "must"], "answer": "might"}, {"stem": "I'll call you as soon ___ I arrive.", "options": ["as", "when"], "answer": "as"}, {"stem": "___ we meet at the café?", "options": ["Shall", "Do"], "answer": "Shall"}, {"stem": "The train ___ to arrive at nine.", "options": ["is due", "has due"], "answer": "is due"}, {"stem": "When I ___ university, I'll travel.", "options": ["finish", "will finish"], "answer": "finish"}, {"stem": "It might ___ tomorrow.", "options": ["be", "is"], "answer": "be"}, {"stem": "Let's ___ a movie tonight.", "options": ["watch", "watching"], "answer": "watch"}, {"stem": "She's ___ to leave soon.", "options": ["about", "going"], "answer": "about"}]}, {"id": "b1-u4", "level": "B1", "num": 4, "title": "Experiencias", "meta": "hablar de experiencias de vida, de cosas recientes y de cosas que aún no han pasado, usando el present perfect.", "lessons": [{"n": 1, "title": "Present perfect (experiencias)", "sections": [{"key": "Tema", "items": ["formar y usar el present perfect para experiencias."]}, {"key": "Vocabulario", "items": ["visit (visitar), climb (escalar), try (probar), ever (alguna vez), before (antes)"]}, {"key": "Lectura", "items": ["I have visited six countries. She has climbed Mount Teide. We have tried Thai food before."]}, {"key": "Notas", "items": ["*have/has* + participio: *have visited*, *has climbed*.", "Usamos present perfect cuando no importa el momento exacto."]}, {"key": "Ejercicio", "items": ["She has ___ Mount Teide. (climb / climbed) → **climbed**"]}, {"key": "Habla", "items": ["\"I have ___ before.\""]}], "exercise": {"stem": "She has ___ Mount Teide.", "options": ["climb", "climbed"], "answer": "climbed"}}, {"n": 2, "title": "Present perfect o pasado simple", "sections": [{"key": "Tema", "items": ["elegir entre present perfect (sin fecha) y pasado simple (con fecha)."]}, {"key": "Vocabulario", "items": ["last year (el año pasado), in 2019 (en 2019), yesterday (ayer), since (desde), for (durante)"]}, {"key": "Lectura", "items": ["I have been to Italy. I went to Rome in 2019. We have lived here since 2020. We lived in Madrid for two years."]}, {"key": "Notas", "items": ["Con fecha o tiempo concreto: pasado simple. *I went in 2019*.", "Sin fecha, como experiencia de vida: present perfect. *I have been*."]}, {"key": "Ejercicio", "items": ["I ___ to Rome in 2019. (went / have been) → **went**"]}, {"key": "Habla", "items": ["\"I have ___. I ___ in ___.\""]}], "exercise": {"stem": "I ___ to Rome in 2019.", "options": ["went", "have been"], "answer": "went"}}, {"n": 3, "title": "Ya (already) y todavía no (yet)", "sections": [{"key": "Tema", "items": ["hablar de algo ya hecho o todavía no."]}, {"key": "Vocabulario", "items": ["already (ya), yet (todavía / aún), homework (deberes), finish (terminar), report (informe)"]}, {"key": "Lectura", "items": ["I have already finished my homework. Have you finished the report yet? No, not yet."]}, {"key": "Notas", "items": ["*already* va entre *have* y el participio en afirmativa.", "*yet* va al final en preguntas y negativas: *Have you finished yet?*"]}, {"key": "Ejercicio", "items": ["Have you finished the report ___? (already / yet) → **yet**"]}, {"key": "Habla", "items": ["\"I have already ___. I haven't ___ yet.\""]}], "exercise": {"stem": "Have you finished the report ___?", "options": ["already", "yet"], "answer": "yet"}}, {"n": 4, "title": "Nunca y alguna vez (never, ever)", "sections": [{"key": "Tema", "items": ["preguntar y responder sobre experiencias de vida."]}, {"key": "Vocabulario", "items": ["ever (alguna vez), never (nunca), Japan (Japón), seen (visto)"]}, {"key": "Lectura (diálogo)", "items": ["Have you ever been to Japan? → No, I have never been there.", "Has she ever seen a shark? → Yes, she has."]}, {"key": "Notas", "items": ["*ever* en preguntas, *never* en respuestas negativas.", "*never* va antes del participio: *have never been*."]}, {"key": "Ejercicio", "items": ["She has ___ been to Paris. (never / ever) → **never**"]}, {"key": "Habla", "items": ["\"Have you ever ___? I have never ___.\""]}], "exercise": {"stem": "She has ___ been to Paris.", "options": ["never", "ever"], "answer": "never"}}, {"n": 5, "title": "Algo acaba de pasar (just)", "sections": [{"key": "Tema", "items": ["hablar de algo reciente."]}, {"key": "Vocabulario", "items": ["just (acabar de), arrive (llegar), finish (terminar), call (llamar), train (tren)"]}, {"key": "Lectura", "items": ["We have just arrived at the station. I have just finished my exam. She has just called me."]}, {"key": "Notas", "items": ["*just* va entre *have* y el participio: *have just finished*.", "Sirve para algo que pasó hace muy poco."]}, {"key": "Ejercicio", "items": ["They have ___ arrived home. (just / yet) → **just**"]}, {"key": "Habla", "items": ["\"I have just ___.\""]}], "exercise": {"stem": "They have ___ arrived home.", "options": ["just", "yet"], "answer": "just"}}, {"n": 6, "title": "Desde y durante (since, for)", "sections": [{"key": "Tema", "items": ["decir desde cuándo y cuánto tiempo."]}, {"key": "Vocabulario", "items": ["since (desde), for (durante), 2020 (año), two years (dos años), long time (mucho tiempo)"]}, {"key": "Lectura", "items": ["I haven't seen him since last year. We have been married for ten years. She has worked here since 2020."]}, {"key": "Notas", "items": ["*since* + momento concreto: *since 2020*.", "*for* + periodo de tiempo: *for ten years*."]}, {"key": "Ejercicio", "items": ["I haven't seen him ___ last year. (since / for) → **since**"]}, {"key": "Habla", "items": ["\"I have ___ since ___. I have ___ for ___.\""]}], "exercise": {"stem": "I haven't seen him ___ last year.", "options": ["since", "for"], "answer": "since"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I have visited five countries. Have you ever tried Thai food? I have never been to Japan, but I have read about it."]}, {"key": "Repaso", "items": ["present perfect para experiencias, present perfect vs. pasado simple, *already / yet / just*, *ever / never*, *since / for*."]}, {"key": "Actividad de habla", "items": ["Di 3 experiencias de tu vida con present perfect, 1 cosa que acabas de hacer y 1 cosa que todavía no has hecho."]}, {"key": "Actividad escrita", "items": ["escribe tu lista de experiencias en 6 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 already, 2 yet, 3 went, 4 never, 5 just, 6 eaten, 7 lost, 8 have, 9 since, 10 Have"]}], "exercise": null}], "exam": [{"stem": "I have ___ finished my homework.", "options": ["already", "yet"], "answer": "already"}, {"stem": "Have you finished the report ___?", "options": ["already", "yet"], "answer": "yet"}, {"stem": "I ___ to Japan in 2019.", "options": ["went", "have been"], "answer": "went"}, {"stem": "She has ___ been to Paris.", "options": ["never", "ever"], "answer": "never"}, {"stem": "We have ___ seen that film.", "options": ["just", "yet"], "answer": "just"}, {"stem": "Have you ever ___ sushi?", "options": ["eat", "eaten"], "answer": "eaten"}, {"stem": "I ___ my keys yesterday.", "options": ["lost", "have lost"], "answer": "lost"}, {"stem": "I ___ seen that film before.", "options": ["have", "has"], "answer": "have"}, {"stem": "I haven't seen him ___ last year.", "options": ["since", "for"], "answer": "since"}, {"stem": "___ you ever been to London?", "options": ["Have", "Did"], "answer": "Have"}]}, {"id": "b1-u5", "level": "B1", "num": 5, "title": "Opiniones y consejos", "meta": "dar consejos, expresar obligaciones y prohibiciones, y decir lo que es posible o no hace falta.", "lessons": [{"n": 1, "title": "Obligación (must)", "sections": [{"key": "Tema", "items": ["decir que algo es obligatorio."]}, {"key": "Vocabulario", "items": ["must (deber, obligación fuerte), helmet (casco), wear (llevar puesto), bike (bicicleta), seatbelt (cinturón de seguridad)"]}, {"key": "Lectura", "items": ["You must wear a helmet when you ride a bike. You must wear a seatbelt in the car."]}, {"key": "Notas", "items": ["*must* + verbo base. No cambia con *he, she, it*.", "*must* expresa una obligación fuerte, normalmente por una regla o una ley."]}, {"key": "Ejercicio", "items": ["You ___ wear a helmet on a bike. (must / might) → **must**"]}, {"key": "Habla", "items": ["\"You must ___.\""]}], "exercise": {"stem": "You ___ wear a helmet on a bike.", "options": ["must", "might"], "answer": "must"}}, {"n": 2, "title": "No hace falta (don't have to)", "sections": [{"key": "Tema", "items": ["decir que algo no es necesario."]}, {"key": "Vocabulario", "items": ["don't have to (no hace falta), day off (día libre), pay (pagar), later (más tarde)"]}, {"key": "Lectura", "items": ["You don't have to work on Sunday. It's a day off. You don't have to pay now. You can pay later."]}, {"key": "Notas", "items": ["*don't have to* = no hace falta / no es necesario.", "*he, she, it* + *doesn't have to*."]}, {"key": "Ejercicio", "items": ["You ___ work on Sunday. It's a day off. (don't have to / mustn't) → **don't have to**"]}, {"key": "Habla", "items": ["\"I don't have to ___.\""]}], "exercise": {"stem": "You ___ work on Sunday. It's a day off.", "options": ["don't have to", "mustn't"], "answer": "don't have to"}}, {"n": 3, "title": "Prohibido (mustn't)", "sections": [{"key": "Tema", "items": ["decir que algo no se puede hacer."]}, {"key": "Vocabulario", "items": ["mustn't (no debes / está prohibido), smoke (fumar), forbidden (prohibido), park (aparcar)"]}, {"key": "Lectura", "items": ["You mustn't smoke here. It's forbidden. You mustn't park in front of the door."]}, {"key": "Notas", "items": ["*mustn't* = prohibición. Es más fuerte que *shouldn't*.", "Para decir que algo no hace falta usamos *don't have to*. No los confundas."]}, {"key": "Ejercicio", "items": ["You ___ smoke here. It's forbidden. (mustn't / don't have to) → **mustn't**"]}, {"key": "Habla", "items": ["\"You mustn't ___.\""]}], "exercise": {"stem": "You ___ smoke here. It's forbidden.", "options": ["mustn't", "don't have to"], "answer": "mustn't"}}, {"n": 4, "title": "Consejos (should, shouldn't)", "sections": [{"key": "Tema", "items": ["dar consejos."]}, {"key": "Vocabulario", "items": ["should (deberías), shouldn't (no deberías), sugar (azúcar), advice (consejo), sleep (dormir)"]}, {"key": "Lectura", "items": ["You should sleep more. You shouldn't eat so much sugar. I think you should see a doctor."]}, {"key": "Notas", "items": ["*should* + verbo base.", "*I think you should* = creo que deberías."]}, {"key": "Ejercicio", "items": ["You shouldn't eat so much ___. (sugar / sugars) → **sugar**"]}, {"key": "Habla", "items": ["\"I think you should ___.\""]}], "exercise": {"stem": "You shouldn't eat so much ___.", "options": ["sugar", "sugars"], "answer": "sugar"}}, {"n": 5, "title": "Posibilidad (might, must)", "sections": [{"key": "Tema", "items": ["hacer suposiciones sobre lo que pasa."]}, {"key": "Vocabulario", "items": ["might (puede que), must (debe de ser), lights (luces), at home (en casa), cold (frío)"]}, {"key": "Lectura", "items": ["It might be cold tomorrow. The lights are on, so he must be at home."]}, {"key": "Notas", "items": ["*might* = posibilidad. *must* = deducción casi segura.", "*The lights are on, so he must be at home* = las luces están encendidas, debe de estar en casa."]}, {"key": "Ejercicio", "items": ["He ___ be at home. The lights are on. (must / might) → **must**"]}, {"key": "Habla", "items": ["\"It might ___. He must ___.\""]}], "exercise": {"stem": "He ___ be at home. The lights are on.", "options": ["must", "might"], "answer": "must"}}, {"n": 6, "title": "Recomendación (should / shouldn't) con razones", "sections": [{"key": "Tema", "items": ["dar consejos con una razón."]}, {"key": "Vocabulario", "items": ["traffic (tráfico), early (temprano), late (tarde), leave (salir), ask (preguntar), borrow (pedir prestado)"]}, {"key": "Lectura", "items": ["We should leave early. The traffic is bad. You should ask before you borrow something."]}, {"key": "Notas", "items": ["*because* / *so* para dar la razón: *The traffic is bad, so we should leave early*.", "*ask before* = preguntar antes de."]}, {"key": "Ejercicio", "items": ["We should leave early, ___ we'll be late. (or / but) → **or**"]}, {"key": "Habla", "items": ["\"You should ___, because ___.\""]}], "exercise": {"stem": "We should leave early, ___ we'll be late.", "options": ["or", "but"], "answer": "or"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["You must wear a helmet when you ride a bike. You don't have to pay for the museum on Sunday. You should drink more water."]}, {"key": "Repaso", "items": ["*must / mustn't / don't have to*, *should / shouldn't*, *might / must* para suposiciones, consejos con razón."]}, {"key": "Actividad de habla (role play)", "items": ["Un amigo tiene un examen mañana. Dale 3 consejos con *should* y 1 prohibición con *mustn't*."]}, {"key": "Actividad escrita", "items": ["escribe 5 normas de tu casa o de tu trabajo con *must, mustn't, don't have to*."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 must, 2 don't have to, 3 shouldn't, 4 might, 5 mustn't, 6 should, 7 don't have to, 8 must, 9 should, 10 should"]}], "exercise": null}], "exam": [{"stem": "You ___ wear a helmet on a bike.", "options": ["must", "might"], "answer": "must"}, {"stem": "You ___ work on Sunday. It's a day off.", "options": ["don't have to", "mustn't"], "answer": "don't have to"}, {"stem": "You ___ eat so much sugar.", "options": ["shouldn't", "mustn't"], "answer": "shouldn't"}, {"stem": "It ___ be cold tomorrow.", "options": ["might", "must"], "answer": "might"}, {"stem": "You ___ smoke here. It's forbidden.", "options": ["mustn't", "don't have to"], "answer": "mustn't"}, {"stem": "I think you ___ see a doctor.", "options": ["should", "would"], "answer": "should"}, {"stem": "You ___ pay now. You can pay later.", "options": ["don't have to", "mustn't"], "answer": "don't have to"}, {"stem": "He ___ be at home. The lights are on.", "options": ["must", "might"], "answer": "must"}, {"stem": "You ___ ask before you borrow it.", "options": ["should", "must"], "answer": "should"}, {"stem": "We ___ leave early. The traffic is bad.", "options": ["should", "shouldn't"], "answer": "should"}]}, {"id": "b1-u6", "level": "B1", "num": 6, "title": "Personas, cosas y lugares", "meta": "describir personas, cosas y lugares con oraciones de relativo (who, which, that, where).", "lessons": [{"n": 1, "title": "Personas (who)", "sections": [{"key": "Tema", "items": ["hablar de personas con *who*."]}, {"key": "Vocabulario", "items": ["who (que / quien), neighbour (vecino/a), doctor (médico/a), speak (hablar), languages (idiomas)"]}, {"key": "Lectura", "items": ["The man who lives next door is a doctor. I have a friend who speaks five languages."]}, {"key": "Notas", "items": ["*who* se usa para personas: *the man who lives*.", "*who* sustituye al sujeto de la oración de relativo."]}, {"key": "Ejercicio", "items": ["The woman ___ helped me is my teacher. (who / which) → **who**"]}, {"key": "Habla", "items": ["\"I have a friend who ___.\""]}], "exercise": {"stem": "The woman ___ helped me is my teacher.", "options": ["who", "which"], "answer": "who"}}, {"n": 2, "title": "Cosas (which, that)", "sections": [{"key": "Tema", "items": ["hablar de cosas con *which* o *that*."]}, {"key": "Vocabulario", "items": ["which (que), that (que), gift (regalo), bought (comprar en pasado), car (coche), red (rojo)"]}, {"key": "Lectura", "items": ["This is the book that I bought yesterday. The car which is parked outside is mine."]}, {"key": "Notas", "items": ["*which* o *that* para cosas: *the book that I bought*.", "En inglés actual se puede omitir *that* si es el objeto: *the book I bought*."]}, {"key": "Ejercicio", "items": ["This is the phone ___ I want. (that / who) → **that**"]}, {"key": "Habla", "items": ["\"This is the ___ that ___.\""]}], "exercise": {"stem": "This is the phone ___ I want.", "options": ["that", "who"], "answer": "that"}}, {"n": 3, "title": "Lugares (where)", "sections": [{"key": "Tema", "items": ["hablar de lugares con *where*."]}, {"key": "Vocabulario", "items": ["where (donde), café (cafetería), born (nacido), grew up (crecí), sea (mar)"]}, {"key": "Lectura", "items": ["This is the city where I was born. The café where we met is closed now. The house where I grew up is by the sea."]}, {"key": "Notas", "items": ["*where* para lugares: *the city where I was born*.", "*where* = en el/la que."]}, {"key": "Ejercicio", "items": ["This is the city ___ I was born. (where / which) → **where**"]}, {"key": "Habla", "items": ["\"This is the ___ where ___.\""]}], "exercise": {"stem": "This is the city ___ I was born.", "options": ["where", "which"], "answer": "where"}}, {"n": 4, "title": "Cosas que hacen algo (which + verbo)", "sections": [{"key": "Tema", "items": ["describir cosas con oraciones de relativo."]}, {"key": "Vocabulario", "items": ["funny (divertido), comedy (comedia), film (película), parked (aparcado), outside (fuera)"]}, {"key": "Lectura", "items": ["The car which is parked outside is red. It's a film which is very funny."]}, {"key": "Notas", "items": ["*which + verbo* describe algo: *which is very funny*.", "Para una cosa, usamos *which* o *that*."]}, {"key": "Ejercicio", "items": ["The car ___ is red is mine. (which / who) → **which**"]}, {"key": "Habla", "items": ["\"It's a ___ which is ___.\""]}], "exercise": {"stem": "The car ___ is red is mine.", "options": ["which", "who"], "answer": "which"}}, {"n": 5, "title": "Personas que ayudan (who + verbo)", "sections": [{"key": "Tema", "items": ["describir personas con *who* y un verbo."]}, {"key": "Vocabulario", "items": ["helped (ayudó), kind (amable), patient (paciente), neighbor (vecino), friendly (amable)"]}, {"key": "Lectura", "items": ["She's the teacher who helped me last year. He's a neighbour who is always friendly."]}, {"key": "Notas", "items": ["*who* + verbo describe a la persona: *who helped me*.", "*always friendly* = siempre amable."]}, {"key": "Ejercicio", "items": ["She's the teacher ___ helped me. (who / which) → **who**"]}, {"key": "Habla", "items": ["\"He's the ___ who ___.\""]}], "exercise": {"stem": "She's the teacher ___ helped me.", "options": ["who", "which"], "answer": "who"}}, {"n": 6, "title": "Lugares donde pasó algo (where + pasado)", "sections": [{"key": "Tema", "items": ["hablar de lugares donde pasó algo."]}, {"key": "Vocabulario", "items": ["closed (cerrado), met (conocí), station (estación), park (parque), first time (primera vez)"]}, {"key": "Lectura", "items": ["The park where we first met is closed now. This is the station where I got on the train."]}, {"key": "Notas", "items": ["*where* + oración en pasado: *where we first met*.", "*got on* = subir a un transporte."]}, {"key": "Ejercicio", "items": ["The café ___ we met is closed. (where / who) → **where**"]}, {"key": "Habla", "items": ["\"This is the place where ___.\""]}], "exercise": {"stem": "The café ___ we met is closed.", "options": ["where", "who"], "answer": "where"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["My friend who lives next door is a nurse. The man who called you is my boss. The city where I grew up is small."]}, {"key": "Repaso", "items": ["*who* para personas, *which / that* para cosas, *where* para lugares, relativos con verbo."]}, {"key": "Actividad de habla", "items": ["Describe a una persona importante para ti, un objeto que te guste y un lugar donde hayas estado."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases con *who, which, that, where* sobre tu vida."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 who, 2 that, 3 where, 4 which, 5 who, 6 where, 7 who, 8 that, 9 where, 10 which"]}], "exercise": null}], "exam": [{"stem": "The man ___ lives next door is a doctor.", "options": ["who", "which"], "answer": "who"}, {"stem": "This is the book ___ I bought yesterday.", "options": ["that", "who"], "answer": "that"}, {"stem": "This is the city ___ I was born.", "options": ["where", "which"], "answer": "where"}, {"stem": "The car ___ is red is mine.", "options": ["which", "who"], "answer": "which"}, {"stem": "She's the teacher ___ helped me.", "options": ["who", "which"], "answer": "who"}, {"stem": "The café ___ we met is closed.", "options": ["where", "who"], "answer": "where"}, {"stem": "I have a friend ___ speaks five languages.", "options": ["who", "which"], "answer": "who"}, {"stem": "This is the phone ___ I want.", "options": ["that", "where"], "answer": "that"}, {"stem": "The house ___ I grew up is by the sea.", "options": ["where", "which"], "answer": "where"}, {"stem": "It's a film ___ is very funny.", "options": ["which", "who"], "answer": "which"}]}, {"id": "b1-u7", "level": "B1", "num": 7, "title": "Viajes y problemas", "meta": "contar lo que estabas haciendo cuando pasó algo y narrar problemas de viaje.", "lessons": [{"n": 1, "title": "Pasado continuo (was / were + -ing)", "sections": [{"key": "Tema", "items": ["formar el pasado continuo y usarlo para acciones en curso en el pasado."]}, {"key": "Vocabulario", "items": ["was having (estaba teniendo / comiendo), were watching (estábamos viendo), cooking (cocinar), reading (leer), dinner (cena)"]}, {"key": "Lectura", "items": ["I was having dinner at eight. We were watching a film last night. She was cooking when I arrived."]}, {"key": "Notas", "items": ["*I, he, she, it* + **was** + verbo + **-ing**.", "*you, we, they* + **were** + verbo + **-ing**."]}, {"key": "Ejercicio", "items": ["We ___ watching a film last night. (was / were) → **were**"]}, {"key": "Habla", "items": ["\"I was ___ at ___.\""]}], "exercise": {"stem": "We ___ watching a film last night.", "options": ["was", "were"], "answer": "were"}}, {"n": 2, "title": "Pasado continuo con pasado simple (when)", "sections": [{"key": "Tema", "items": ["una acción larga interrumpida por otra corta."]}, {"key": "Vocabulario", "items": ["when (cuando), rang (sonó), phone (teléfono), arrived (llegué), doorbell (timbre)"]}, {"key": "Lectura", "items": ["I was having dinner when the phone rang. She was cooking when I arrived."]}, {"key": "Notas", "items": ["Acción larga en pasado continuo: *was having dinner*.", "Acción corta en pasado simple: *the phone rang*.", "Conectores: *when* (cuando) con pasado simple."]}, {"key": "Ejercicio", "items": ["I ___ dinner when the phone rang. (was having / had) → **was having**"]}, {"key": "Habla", "items": ["\"I was ___ when ___.\""]}], "exercise": {"stem": "I ___ dinner when the phone rang.", "options": ["was having", "had"], "answer": "was having"}}, {"n": 3, "title": "Mientras (while)", "sections": [{"key": "Tema", "items": ["usar *while* para acciones que pasan a la vez."]}, {"key": "Vocabulario", "items": ["while (mientras), shower (ducha), taking (tomar), doorbell (timbre), reading (leer)"]}, {"key": "Lectura", "items": ["While I was taking a shower, the doorbell rang. He was reading while she was cooking."]}, {"key": "Notas", "items": ["*while* + pasado continuo: *while I was taking*.", "*while* para dos acciones largas a la vez."]}, {"key": "Ejercicio", "items": ["While I ___ the shower, the doorbell rang. (was taking / took) → **was taking**"]}, {"key": "Habla", "items": ["\"While I was ___, ___.\""]}], "exercise": {"stem": "While I ___ the shower, the doorbell rang.", "options": ["was taking", "took"], "answer": "was taking"}}, {"n": 4, "title": "Preguntas en pasado continuo", "sections": [{"key": "Tema", "items": ["preguntar qué estabas haciendo."]}, {"key": "Vocabulario", "items": ["were you doing (¿qué estabas haciendo?), at eight (a las ocho), raining (lloviendo), left (salí)"]}, {"key": "Lectura (diálogo)", "items": ["What were you doing at eight? → I was reading.", "Was it raining when you left? → Yes, it was."]}, {"key": "Notas", "items": ["*What were you doing?* = ¿Qué estabas haciendo?", "*Was/Were* al principio de la pregunta."]}, {"key": "Ejercicio", "items": ["What ___ you doing at eight? (were / did) → **were**"]}, {"key": "Habla", "items": ["\"What were you doing when ___?\""]}], "exercise": {"stem": "What ___ you doing at eight?", "options": ["were", "did"], "answer": "were"}}, {"n": 5, "title": "Problemas de viaje (vocabulario)", "sections": [{"key": "Tema", "items": ["describir problemas típicos de viaje."]}, {"key": "Vocabulario", "items": ["delayed (retrasado), cancelled (cancelado), missed (perdí), lost (perdido), luggage (equipaje), reservation (reserva)"]}, {"key": "Lectura", "items": ["The train was delayed for an hour. My flight was cancelled. I lost my luggage at the airport."]}, {"key": "Notas", "items": ["*luggage* es incontable: *a lot of luggage*, no *luggages*.", "*was / were* + participio para describir lo que pasó."]}, {"key": "Ejercicio", "items": ["My flight was ___. (cancel / cancelled) → **cancelled**"]}, {"key": "Habla", "items": ["\"My ___ was ___.\""]}], "exercise": {"stem": "My flight was ___.", "options": ["cancel", "cancelled"], "answer": "cancelled"}}, {"n": 6, "title": "Contar un problema (pasado continuo + pasado simple)", "sections": [{"key": "Tema", "items": ["narrar un problema en un viaje."]}, {"key": "Vocabulario", "items": ["sleeping (dormir), woke up (me desperté), missed (perdí), taxi (taxi), hotel (hotel)"]}, {"key": "Lectura", "items": ["I was sleeping when the alarm didn't ring. I woke up late and missed the train. While I was waiting for a taxi, it started raining."]}, {"key": "Notas", "items": ["Pasado continuo para la situación de fondo.", "Pasado simple para lo que pasó de repente."]}, {"key": "Ejercicio", "items": ["While I was waiting for a taxi, it ___ raining. (started / starting) → **started**"]}, {"key": "Habla", "items": ["\"I was ___ when ___.\""]}], "exercise": {"stem": "While I was waiting for a taxi, it ___ raining.", "options": ["started", "starting"], "answer": "started"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["When I was walking home, it started to rain. While we were waiting for the train, the battery died. I was reading when you called."]}, {"key": "Repaso", "items": ["pasado continuo, *when / while*, preguntas en pasado continuo, problemas de viaje, narrar."]}, {"key": "Actividad de habla (2 minutos)", "items": ["Cuenta un viaje con un problema: qué estabas haciendo cuando pasó y qué hiciste después."]}, {"key": "Actividad escrita", "items": ["escribe la historia de un viaje con problema en 6 frases."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 was having, 2 was taking, 3 were watching, 4 were, 5 was, 6 were, 7 when, 8 was, 9 Was, 10 was"]}], "exercise": null}], "exam": [{"stem": "I ___ dinner when the phone rang.", "options": ["was having", "had"], "answer": "was having"}, {"stem": "While I ___ the shower, the doorbell rang.", "options": ["was taking", "took"], "answer": "was taking"}, {"stem": "They ___ TV at ten last night.", "options": ["were watching", "watched"], "answer": "were watching"}, {"stem": "What ___ you doing at eight?", "options": ["were", "did"], "answer": "were"}, {"stem": "She ___ cooking when I arrived.", "options": ["was", "were"], "answer": "was"}, {"stem": "We ___ walking home when it started to rain.", "options": ["were", "was"], "answer": "were"}, {"stem": "I was reading ___ you called.", "options": ["when", "while"], "answer": "when"}, {"stem": "He ___ working when the lights went off.", "options": ["was", "were"], "answer": "was"}, {"stem": "___ it raining when you left?", "options": ["Was", "Were"], "answer": "Was"}, {"stem": "I wasn't sleeping; I ___ reading.", "options": ["was", "were"], "answer": "was"}]}, {"id": "b1-u8", "level": "B1", "num": 8, "title": "Tecnología", "meta": "describir cómo se hacen las cosas, cuándo se hicieron y para qué se usan, con la voz pasiva.", "lessons": [{"n": 1, "title": "Voz pasiva s": ["made of (hecho de), leather (cuero), wood (madera), plastic (plástico), cotton (algodón)"]}, {"key": "Lectura", "items": ["These shoes are made of leather. The table is made of wood."]}, {"key": "Notas", "items": ["*made of* = hecho de (materia).", "*made in* = hecho en (lugar)."]}, {"key": "Ejercicio", "items": ["These shoes are made ___ leather. (of / in) → **of**"]}, {"key": "Habla", "items": ["\"It is made of ___.\""]}], "exercise": {"stem": "These shoes are made ___ leather.", "options": ["of", "in"], "answer": "of"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["English is spoken in many countries. The documents are sent every morning. The new app is used by thousands of people."]}, {"key": "Repaso", "items": ["pasiva en presente, en pasado y con *will*, *by*, *spoken*, *made of / made in*."]}, {"key": "Actividad de habla", "items": ["Describe un objeto de tu casa: de qué está hecho, dónde se fabricó y cuándo."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases sobre un invento o un aparato, usando la pasiva."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 is made, 2 was built, 3 is spoken, 4 were sent, 5 was made, 6 are, 7 was, 8 are, 9 will be built, 10 was made"]}], "exercise": null}], "exam": [{"stem": "This phone ___ in China.", "options": ["is made", "makes"], "answer": "is made"}, {"stem": "The bridge ___ in 1932.", "options": ["was built", "built"], "answer": "was built"}, {"stem": "English ___ in many countries.", "options": ["is spoken", "speaks"], "answer": "is spoken"}, {"stem": "The letters ___ yesterday.", "options": ["were sent", "sent"], "answer": "were sent"}, {"stem": "The car ___ in Germany.", "options": ["was made", "made"], "answer": "was made"}, {"stem": "Computers ___ used in schools.", "options": ["are", "is"], "answer": "are"}, {"stem": "The window ___ broken last night.", "options": ["was", "is"], "answer": "was swer": "had sold"}}, {"n": 3, "title": "Will y would (estilo indirecto)", "sections": [{"key": "Tema", "items": ["contar futuros dichos en pasado."]}, {"key": "Vocabulario", "items": ["would come (vendría), will be (estará), see (ver), later (más tarde), party (fiesta)"]}, {"key": "Lectura", "items": ["They said they would come to the party. He said he would see me later."]}, {"key": "Notas", "items": ["*will* → *would* en estilo indirecto.", "*He said he would see me later* = dijo que me vería más tarde."]}, {"key": "Ejercicio", "items": ["They said they ___ come. (will / would) → **would**"]}, {"key": "Habla", "items": ["\"He said he would ___.\""]}], "exercise": {"stem": "They said they ___ come.", "options": ["will", "would"], "answer": "would"}}, {"n": 4, "title": "Preguntas indirectas (asked me where)", "sections": [{"key": "Tema", "items": ["contar una pregunta que alguien hizo."]}, {"key": "Vocabulario", "items": ["asked (preguntó), where (dónde), lived (vivió / vivía), when (cuándo), arrived (llegó)"]}, {"key": "Lectura", "items": ["I asked her where she lived. He asked me when I arrived."]}, {"key": "Notas", "items": ["En estilo indirecto no hay signo de interrogación.", "El orden es afirmativo: *where she lived*, no *where did she live*."]}, {"key": "Ejercicio", "items": ["I asked her where she ___. (lives / lived) → **lived**"]}, {"key": "Habla", "items": ["\"I asked him where ___.\""]}], "exercise": {"stem": "I asked her where she ___.", "options": ["lives", "lived"], "answer": "lived"}}, {"n": 5, "title": "Órdenes y peticiones (told me to)", "sections": [{"key": "Tema", "items": ["contar lo que alguien te pidió que hicieras."]}, {"key": "Vocabulario", "items": ["told (dijo a), to (para que), close (cerrar), door (puerta), wait (esperar)"]}, {"key": "Lectura", "items": ["She told me to close the door. He asked us to wait outside."]}, {"key": "Notas", "items": ["*told + persona + to + verbo*: *told me to close*.", "*asked + persona + to + verbo*: *asked ould"}}, {"n": 5, "title": "Preguntas hipotéticas (what would you do if)", "sections": [{"key": "Tema", "items": ["preguntar qué harías en una situación imaginaria."]}, {"key": "Vocabulario", "items": ["what would you do (¿qué harías?), million (millón), win (ganar), lottery (lotería), buy (comprar)"]}, {"key": "Lectura (diálogo)", "items": ["What would you do if you won the lottery? → I would buy a house by the sea.", "What would you do if you had a million euros? → I would travel."]}, {"key": "Notas", "items": ["*What would you do if...?* = ¿Qué harías si...?", "*won* (pasado de *win*)."]}, {"key": "Ejercicio", "items": ["What would you do if you ___ a million euros? (won / win) → **won**"]}, {"key": "Habla", "items": ["\"What would you do if you ___?\""]}], "exercise": {"stem": "What would you do if you ___ a million euros?", "options": ["won", "win"], "answer": "won"}}, {"n": 6, "title": "Sueños de vida (I would love to)", "sections": [{"key": "Tema", "items": ["hablar de tus sueños."]}, {"key": "Vocabulario", "items": ["dream (sueño), would love to (me encantaría), move (mudarme), abroad (en el extranjero), own (tener, poseer)"]}, {"key": "Lectura", "items": ["My dream is to own a bookshop. I would love to move abroad one day. I would start my own business."]}, {"key": "Notas", "items": ["*would love to* + verbo base: *would love to move*.", "*my dream is to* + verbo base: *my dream is to own*."]}, {"key": "Ejercicio", "items": ["I would love ___ abroad one day. (to move / moving) → **to move**"]}, {"key": "Habla", "items": ["\"My dream is to ___. I would love to ___.\""]}], "exercise": {"stem": "I would love ___ abroad one day.", "options": ["to move", "moving"], "answer": "to move"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["If I had more money, I would travel around the world. If she lived near the sea, she would swim every day."]}, {"key": "Repaso", "items": ["segundo condicional, *if I were you*, *I wish*, p
