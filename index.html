"key": "Ejercicio", "items": ["I've ___ three books this year. (read / been reading) → **read**"]}, {"key": "Habla", "items": ["\"I've been ___ all ___.\""]}], "exercise": {"stem": "I've ___ three books this year.", "options": ["read", "been reading"], "answer": "read"}}, {"n": 5, "title": "Resultado visible (you've been running)", "sections": [{"key": "Tema", "items": ["explicar algo que ves ahora con el continuo."]}, {"key": "Vocabulario", "items": ["sweaty (sudado), wet (mojado), tired (cansado), dirty (sucio), swim (nadar)"]}, {"key": "Lectura", "items": ["You've been running, haven't you? You're all wet. Have you been swimming?"]}, {"key": "Notas", "items": ["Continuo para explicar una causa visible: *You're all wet. You've been swimming*.", "Las preguntas de confirmación: *haven't you?*"]}, {"key": "Ejercicio", "items": ["You're all wet. Have you been ___? (swimming / swim) → **swimming**"]}, {"key": "Habla", "items": ["\"You look ___. Have you been ___?\""]}], "exercise": {"stem": "You're all wet. Have you been ___?", "options": ["swimming", "swim"], "answer": "swimming"}}, {"n": 6, "title": "Hablar de cansancio y causas (I've been feeling)", "sections": [{"key": "Tema", "items": ["hablar de cómo te has sentido últimamente."]}, {"key": "Vocabulario", "items": ["lately (últimamente), feel (sentirse), well (bien), sleep (dormir), stress (estrés)"]}, {"key": "Lectura", "items": ["I've been feeling tired lately. I haven't been sleeping well. Maybe it's the stress at work."]}, {"key": "Notas", "items": ["*lately* = últimamente, se usa con presente perfecto.", "*haven't been sleeping* = no he estado durmiendo bien."]}, {"key": "Ejercicio", "items": ["He hasn't been ___ well lately. (feel / feeling) → **feeling**"]}, {"key": "Habla", "items": ["\"I've been ___ lately.\""]}], "exercise": {"stem": "He hasn't been ___ well lately.", "options": ["feel", "feeling"], "answer": "feeling"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["I have been learning English for three years. She has been working on the report since morning. How long have you been waiting?"]}, {"key": "Repaso", "items": ["forma *have been + -ing*, *for / since*, *how long*, actividad vs. resultado, resultado visible, *lately*."]}, {"key": "Actividad de habla", "items": ["Di 2 cosas que llevas haciendo desde hace tiempo y cuánto. Luego pregunta a un amigo lo mismo."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases sobre lo que has estado haciendo esta semana."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 have, 2 has, 3 have, 4 cleaning, 5 talking, 6 since, 7 read, 8 swimming, 9 feeling, 10 have"]}], "exercise": null}], "exam": [{"stem": "I ___ been working here since 2020.", "options": ["have", "has"], "answer": "have"}, {"stem": "She ___ been waiting for an hour.", "options": ["has", "have"], "answer": "has"}, {"stem": "How long ___ you been learning English?", "options": ["have", "has"], "answer": "have"}, {"stem": "We've been ___ the house all day.", "options": ["cleaning", "clean"], "answer": "cleaning"}, {"stem": "They've been ___ for two hours.", "options": ["talk", "talking"], "answer": "talking"}, {"stem": "It's been raining ___ Monday.", "options": ["since", "for"], "answer": "since"}, {"stem": "I've ___ three books this year.", "options": ["read", "been reading"], "answer": "read"}, {"stem": "You're all wet. Have you been ___?", "options": ["swimming", "swim"], "answer": "swimming"}, {"stem": "He hasn't been ___ well lately.", "options": ["feel", "feeling"], "answer": "feeling"}, {"stem": "I ___ been studying all morning.", "options": ["have", "had"], "answer": "have"}]}, {"id": "b2-u3", "level": "B2", "num": 3, "title": "Condicionales 2 y 3", "meta": "hablar de situaciones imaginarias (presente) y de cosas que no pasaron (pasado).", "lessons": [{"n": 1, "title": "Segundo condicional, forma (If + past simple, would + verbo)", "sections": [{"key": "Tema", "items": ["hablar de situaciones imaginarias o poco probables en el presente o el futuro."]}, {"key": "Vocabulario", "items": ["more time (más tiempo), learn (aprender), win (ganar), buy (comprar), car (coche)"]}, {"key": "Lectura", "items": ["If I had more time, I would learn Japanese. If I won the lottery, I would buy a car."]}, {"key": "Notas", "items": ["*If* + pasado simple, *would* + verbo base.", "La idea es imaginaria: *ahora no tengo más tiempo*.", "*would* = *sería / haría* (en la frase principal)."]}, {"key": "Ejercicio", "items": ["If I ___ more money, I would buy a car. (had / have) → **had**"]}, {"key": "Habla", "items": ["\"If I had ___, I would ___.\""]}], "exercise": {"stem": "If I ___ more money, I would buy a car.", "options": ["had", "have"], "answer": "had"}}, {"n": 2, "title": "Segundo condicional, consejos (If I were you)", "sections": [{"key": "Tema", "items": ["dar consejos usando una situación imaginaria."]}, {"key": "Vocabulario", "items": ["advice (consejo), apologize (disculparse), boss (jefe), answer (respuesta), tell (decir)"]}, {"key": "Lectura", "items": ["If I were you, I would apologize to my boss. If he knew the answer, he would tell us."]}, {"key": "Notas", "items": ["*If I were you* = *yo que tú*. Con *I, he, she, it* se usa mucho *were*.", "Es una forma fija para dar consejos."]}, {"key": "Ejercicio", "items": ["If he ___ the answer, he would tell us. (knew / knows) → **knew**"]}, {"key": "Habla", "items": ["\"If I were you, I would ___.\""]}], "exercise": {"stem": "If he ___ the answer, he would tell us.", "options": ["knew", "knows"], "answer": "knew"}}, {"n": 3, "title": "Preguntas con would (What would you do if...?)", "sections": [{"key": "Tema", "items": ["preguntar qué harías en una situación imaginaria."]}, {"key": "Vocabulario", "items": ["lottery (lotería), million (millón), travel (viajar), job (trabajo), quit (dejar)"]}, {"key": "Lectura", "items": ["What would you do if you won a million euros? I would travel around the world."]}, {"key": "Notas", "items": ["Pregunta: *What would you do if* + pasado simple?", "Respuesta: *I would* + verbo base."]}, {"key": "Ejercicio", "items": ["What would you do if you ___ a million euros? (won / win) → **won**"]}, {"key": "Habla", "items": ["\"What would you do if ___?\""]}], "exercise": {"stem": "What would you do if you ___ a million euros?", "options": ["won", "win"], "answer": "won"}}, {"n": 4, "title": "Tercer condicional, forma (If + had + participio, would have + participio)", "sections": [{"key": "Tema", "items": ["hablar de cosas que no pasaron en el pasado y de sus consecuencias."]}, {"key": "Vocabulario", "items": ["studied (estudié), passed (aprobé), exam (examen), called (llamé), number (número)"]}, {"key": "Lectura", "items": ["If I had studied harder, I would have passed the exam. I would have called you if I had your number."]}, {"key": "Notas", "items": ["*If* + *had* + participio, *would have* + participio.", "Significa: *si hubiera hecho algo, habría pasado algo*.", "Es un arrepentimiento o una cosa que no pasó."]}, {"key": "Ejercicio", "items": ["If I had studied, I ___ passed the exam. (would have / would) → **would have**"]}, {"key": "Habla", "items": ["\"If I had ___, I would have ___.\""]}], "exercise": {"stem": "If I had studied, I ___ passed the exam.", "options": ["would have", "would"], "answer": "would have"}}, {"n": 5, "title": "Tercer condicional, ejemplos y arrepentimientos", "sections": [{"key": "Tema", "items": ["contar qué habría pasado si las cosas hubieran sido diferentes."]}, {"key": "Vocabulario", "items": ["earlier (antes), caught (cogí), train (tren), missed (perdí), flight (vuelo)"]}, {"key": "Lectura", "items": ["If they had left earlier, they would have caught the train. If we had missed the flight, we would have been angry."]}, {"key": "Notas", "items": ["Con *had* se usa el participio: *had left, had missed, had seen*.", "*would have caught* = *habrían cogido*."]}, {"key": "Ejercicio", "items": ["If they ___ earlier, they would have caught the train. (had left / left) → **had left**"]}, {"key": "Habla", "items": ["\"I wish I had ___. If I had ___, I would have ___.\""]}], "exercise": {"stem": "If they ___ earlier, they would have caught the train.", "options": ["had left", "left"], "answer": "had left"}}, {"n": 6, "title": "Could y might en condicionales", "sections": [{"key": "Tema", "items": ["hablar de posibilidades y capacidades en situaciones imaginarias."]}, {"key": "Vocabulario", "items": ["could (podría), might (podría, quizá), help (ayudar), asked (pedido), said yes (dije que sí)"]}, {"key": "Lectura", "items": ["If I had more time, I could help you. If she had asked, I might have said yes."]}, {"key": "Notas", "items": ["*could* = capacidad o posibilidad: *podría*.", "*might* = posibilidad menor: *quizá / a lo mejor*.", "*might have + participio* = *a lo mejor habría*."]}, {"key": "Ejercicio", "items": ["If I had more time, I ___ help you. (could / can) → **could**"]}, {"key": "Habla", "items": ["\"If I had ___, I could ___.\""]}], "exercise": {"stem": "If I had more time, I ___ help you.", "options": ["could", "can"], "answer": "could"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["If I were rich, I would buy a house by the sea. If it rains tomorrow, we will stay home. If I had studied, I would have passed."]}, {"key": "Repaso", "items": ["segundo condicional (*If + past simple, would + verbo*), tercer condicional (*If + had + participio, would have + participio*), *If I were you*, *What would you do if...?*, *could / might*."]}, {"key": "Contraste clave", "items": ["Presente imaginario → 2.º condicional: *If I had time, I would travel.*", "Pasado que no pasó → 3.er condicional: *If I had had time, I would have travelled.*"]}, {"key": "Actividad de habla", "items": ["di 2 cosas que harías si tuvieras un millón de euros (2.º condicional) y 2 cosas que habrías hecho diferente el año pasado (3.er condicional)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases: 3 con segundo condicional y 3 con tercer condicional."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 had, 2 knew, 3 rained, 4 won, 5 would have, 6 had left, 7 had, 8 missed, 9 had, 10 had"]}], "exercise": null}], "exam": [{"stem": "If I ___ more time, I would learn guitar.", "options": ["had", "have"], "answer": "had"}, {"stem": "If she ___ the answer, she would tell us.", "options": ["knew", "knows"], "answer": "knew"}, {"stem": "If it ___ tomorrow, we would cancel the picnic.", "options": ["rained", "rains"], "answer": "rained"}, {"stem": "What would you do if you ___ a million euros?", "options": ["won", "win"], "answer": "won"}, {"stem": "If I had studied, I ___ passed the exam.", "options": ["would have", "would"], "answer": "would have"}, {"stem": "If they ___ earlier, they would have caught the train.", "options": ["had left", "left"], "answer": "had left"}, {"stem": "I would have called you if I ___ your number.", "options": ["had", "have"], "answer": "had"}, {"stem": "If we ___ the train, we would be late.", "options": ["missed", "miss"], "answer": "missed"}, {"stem": "He would be happier if he ___ a job he liked.", "options": ["had", "has"], "answer": "had"}, {"stem": "I could help you if I ___ the time.", "options": ["had", "have"], "answer": "had"}]}, {"id": "b2-u4", "level": "B2", "num": 4, "title": "Voz pasiva avanzada", "meta": "usar la voz pasiva en todos los tiempos, con modales y en frases de opinión o de noticias.", "lessons": [{"n": 1, "title": "Repaso de la pasiva (be + participio)", "sections": [{"key": "Tema", "items": ["formar la voz pasiva en presente y pasado simple."]}, {"key": "Vocabulario", "items": ["cleaned (limpiada), written (escrita), built (construida), every day (cada día), last week (la semana pasada)"]}, {"key": "Lectura", "items": ["The room is cleaned every day. The letter was written last week."]}, {"key": "Notas", "items": ["Pasiva = *be + participio*. El tiempo lo marca *be*.", "Presente: *is / are + participio*. Pasado: *was / were + participio*."]}, {"key": "Ejercicio", "items": ["The room ___ cleaned every day. (is / are) → **is**"]}, {"key": "Habla", "items": ["\"The ___ is ___ every day.\""]}], "exercise": {"stem": "The room ___ cleaned every day.", "options": ["is", "are"], "answer": "is"}}, {"n": 2, "title": "Pasiva con present perfect y past perfect", "sections": [{"key": "Tema", "items": ["hablar de acciones terminadas con resultado en el presente o el pasado."]}, {"key": "Vocabulario", "items": ["signed (firmado), lost (perdido), keys (llaves), documents (documentos), sent (enviado)"]}, {"key": "Lectura", "items": ["The documents have been signed. The keys had been lost before we arrived."]}, {"key": "Notas", "items": ["Present perfect pasiva: *have / has been + participio*.", "Past perfect pasiva: *had been + participio*.", "Ejemplo: *The documents have been signed* = *Alguien ha firmado los documentos*."]}, {"key": "Ejercicio", "items": ["The documents have ___ signed. (been / be) → **been**"]}, {"key": "Habla", "items": ["\"The ___ has been ___.\""]}], "exercise": {"stem": "The documents have ___ signed.", "options": ["been", "be"], "answer": "been"}}, {"n": 3, "title": "Modales en pasiva (must be, can be, should be)", "sections": [{"key": "Tema", "items": ["dar reglas, posibilidades y consejos en pasiva."]}, {"key": "Vocabulario", "items": ["bill (factura), paid (pagada), fixed (arreglado), checked (revisado), easily (fácilmente)"]}, {"key": "Lectura", "items": ["This bill must be paid today. The problem can be fixed easily."]}, {"key": "Notas", "items": ["Modal + *be* + participio: *must be paid, can be fixed, should be checked*.", "El modal va antes de *be*. Después de modal siempre va *be*, no *been*."]}, {"key": "Ejercicio", "items": ["This bill must ___ paid today. (be / been) → **be**"]}, {"key": "Habla", "items": ["\"It must be ___. It can be ___.\""]}], "exercise": {"stem": "This bill must ___ paid today.", "options": ["be", "been"], "answer": "be"}}, {"n": 4, "title": "Pasiva con get", "sections": [{"key": "Tema", "items": ["hablar de cosas que le pasan a alguien, en un tono informal."]}, {"key": "Vocabulario", "items": ["hurt (herido), damaged (dañado), storm (tormenta), accident (accidente), injured (lesionado)"]}, {"key": "Lectura", "items": ["My car got damaged in the storm. Nobody got hurt in the accident."]}, {"key": "Notas", "items": ["*get* + participio es más informal que *be* + participio.", "Se usa mucho en accidentes y cosas inesperadas: *got hurt, got lost, got damaged*."]}, {"key": "Ejercicio", "items": ["Nobody got ___ in the accident. (hurt / hurted) → **hurt**"]}, {"key": "Habla", "items": ["\"I got ___ last week.\""]}], "exercise": {"stem": "Nobody got ___ in the accident.", "options": ["hurt", "hurted"], "answer": "hurt"}}, {"n": 5, "title": "Pasiva para opiniones y noticias (It is said that..., is believed to...)", "sections": [{"key": "Tema", "items": ["hablar de lo que dice la gente en general, de forma formal."]}, {"key": "Vocabulario", "items": ["said (dicen), believed (se cree), oldest (más antiguo), chef (chef), hotel (hotel)"]}, {"key": "Lectura", "items": ["It is said that the hotel is the oldest in the city. He is believed to be the best chef in town."]}, {"key": "Notas", "items": ["*It is said that* + frase = *dicen que*.", "*He is believed to* + infinitivo = *se cree que él*.", "Muy usado en noticias y textos formales."]}, {"key": "Ejercicio", "items": ["He is ___ to be the best chef in town. (believed / believe) → **believed**"]}, {"key": "Habla", "items": ["\"It is said that ___.\""]}], "exercise": {"stem": "He is ___ to be the best chef in town.", "options": ["believed", "believe"], "answer": "believed"}}, {"n": 6, "title": "Pasiva con -ing e infinitivo (being, to be)", "sections": [{"key": "Tema", "items": ["usar la pasiva después de verbos como *hate, like, want*."]}, {"key": "Vocabulario", "items": ["interrupted (interrumpido), told (dicho), hate (odiar), want (querer), ignored (ignorado)"]}, {"key": "Lectura", "items": ["I hate being interrupted. I want to be told the truth."]}, {"key": "Notas", "items": ["Pasiva con -ing: *being + participio* (*being interrupted*).", "Pasiva con infinitivo: *to be + participio* (*to be told*)."]}, {"key": "Ejercicio", "items": ["I hate ___ interrupted. (being / be) → **being**"]}, {"key": "Habla", "items": ["\"I hate being ___. I want to be ___.\""]}], "exercise": {"stem": "I hate ___ interrupted.", "options": ["being", "be"], "answer": "being"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["The letter was sent yesterday. The problem is being solved by the team. The new bridge was built in 1990."]}, {"key": "Repaso", "items": ["pasiva simple, present perfect pasiva, modales en pasiva, *get* + participio, *It is said that...*, *being / to be*."]}, {"key": "Actividad de habla", "items": ["di 3 cosas que se hacen en tu casa cada semana con pasiva (*The bins are taken out on Monday*)."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases en pasiva sobre tu trabajo, tu ciudad o tu familia."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 is, 2 was, 3 been, 4 be, 5 be, 6 hurt, 7 believed, 8 being, 9 was, 10 will be"]}], "exercise": null}], "exam": [{"stem": "The room ___ cleaned every day.", "options": ["is", "are"], "answer": "is"}, {"stem": "The letter ___ sent yesterday.", "options": ["was", "has been"], "answer": "was"}, {"stem": "The documents have ___ signed.", "options": ["been", "be"], "answer": "been"}, {"stem": "This bill must ___ paid today.", "options": ["be", "been"], "answer": "be"}, {"stem": "The problem can ___ fixed easily.", "options": ["be", "been"], "answer": "be"}, {"stem": "Nobody got ___ in the accident.", "options": ["hurt", "hurted"], "answer": "hurt"}, {"stem": "He is ___ to be the best chef in town.", "options": ["believed", "believe"], "answer": "believed"}, {"stem": "I hate ___ interrupted.", "options": ["being", "be"], "answer": "being"}, {"stem": "The house ___ built in 1900.", "options": ["was", "is"], "answer": "was"}, {"stem": "The new bridge ___ opened next year.", "options": ["will be", "is being"], "answer": "will be"}]}, {"id": "b2-u5", "level": "B2", "num": 5, "title": "Estilo indirecto avanzado", "meta": "contar lo que dijo otra persona usando verbos de habla y cambios de tiempo.", "lessons": [{"n": 1, "title": "Repaso de say y tell", "sections": [{"key": "Tema", "items": ["contar lo que dijo alguien con *said that* y *told me that*."]}, {"key": "Vocabulario", "items": ["tired (cansada), told (dijo a alguien), said (dijo), would (haría), call (llamar)"]}, {"key": "Lectura", "items": ["She said that she was tired. He told me that he would call."]}, {"key": "Notas", "items": ["*say* no lleva persona directa: *said that*, nunca *said me*.", "*tell* sí lleva persona: *told me that*."]}, {"key": "Ejercicio", "items": ["She ___ me that she was tired. (told / said) → **told**"]}, {"key": "Habla", "items": ["\"He told me that ___.\""]}], "exercise": {"stem": "She ___ me that she was tired.", "options": ["told", "said"], "answer": "told"}}, {"n": 2, "title": "Verbos con infinitivo (promise, offer, agree, refuse)", "sections": [{"key": "Tema", "items": ["contar promesas, ofrecimientos y negativas."]}, {"key": "Vocabulario", "items": ["promised (prometió), offered (ofreció), agreed (aceptó), refused (se negó), move (mudanza)"]}, {"key": "Lectura", "items": ["He promised to help me. She offered to drive us. They refused to pay the extra fee."]}, {"key": "Notas", "items": ["*promise / offer / agree / refuse* + *to* + infinitivo.", "No se usa *promise me to*. Se dice *promised to help me*."]}, {"key": "Ejercicio", "items": ["He ___ to help us with the move. (promised / told) → **promised**"]}, {"key": "Habla", "items": ["\"She offered to ___.\""]}], "exercise": {"stem": "He ___ to help us with the move.", "options": ["promised", "told"], "answer": "promised"}}, {"n": 3, "title": "Verbos con -ing (admit, deny, suggest, recommend)", "sections": [{"key": "Tema", "items": ["contar admisiones, negaciones y sugerencias."]}, {"key": "Vocabulario", "items": ["admitted (admitió), denied (negó), suggested (sugirió), recommended (recomendó), window (ventana)"]}, {"key": "Lectura", "items": ["He admitted breaking the window. She suggested going to the cinema. He denied taking the money."]}, {"key": "Notas", "items": ["*admit / deny / suggest / recommend* + *-ing*.", "*suggest* + *-ing* es correcto. *suggest to go* NO es correcto."]}, {"key": "Ejercicio", "items": ["She suggested ___ to the cinema. (going / to go) → **going**"]}, {"key": "Habla", "items": ["\"He admitted ___. She suggested ___.\""]}], "exercise": {"stem": "She suggested ___ to the cinema.", "options": ["going", "to go"], "answer": "going"}}, {"n": 4, "title": "Preguntas en estilo indirecto", "sections": [{"key": "Tema", "items": ["contar preguntas que te hicieron."]}, {"key": "Vocabulario", "items": ["where (dónde), if (si), ready (listo), lived (viví), asked (preguntó)"]}, {"key": "Lectura", "items": ["She asked me where I lived. He asked me if I was ready."]}, {"key": "Notas", "items": ["Pregunta directa: *Where do you live?* → Indirecta: *She asked me where I lived*.", "En estilo indirecto NO hay inversión: *where I lived*, no *where did I live*.", "*if* = *si* (pregunta de sí o no)."]}, {"key": "Ejercicio", "items": ["He asked me if I ___ ready. (was / am) → **was**"]}, {"key": "Habla", "items": ["\"She asked me where ___. He asked me if ___.\""]}], "exercise": {"stem": "He asked me if I ___ ready.", "options": ["was", "am"], "answer": "was"}}, {"n": 5, "title": "Órdenes y peticiones indirectas (told me to)", "sections": [{"key": "Tema", "items": ["contar órdenes, consejos y peticiones."]}, {"key": "Vocabulario", "items": ["told (dijo que hiciera), open (abrir), books (libros), drink (beber), water (agua)"]}, {"key": "Lectura", "items": ["The teacher told us to open our books. The doctor told me to drink more water."]}, {"key": "Notas", "items": ["*told + persona + to* + infinitivo.", "Orden negativa: *told me not to* + infinitivo (*told me not to smoke*)."]}, {"key": "Ejercicio", "items": ["The doctor told me ___ more water. (to drink / drink) → **to drink**"]}, {"key": "Habla", "items": ["\"My teacher told me to ___.\""]}], "exercise": {"stem": "The doctor told me ___ more water.", "options": ["to drink", "drink"], "answer": "to drink"}}, {"n": 6, "title": "Cambio de tiempos (backshift)", "sections": [{"key": "Tema", "items": ["cambiar los tiempos al contar algo que se dijo en el pasado."]}, {"key": "Vocabulario", "items": ["will (futuro), would (haría), can (poder), could (podía), finished (terminado)"]}, {"key": "Lectura", "items": ["\"I will call you.\" → He said he would call me. \"I can finish it.\" → They said they could finish it."]}, {"key": "Notas", "items": ["*will* → *would*. *can* → *could*. *am / is / are* → *was / were*.", "*present simple* → *past simple*. *present perfect* → *past perfect*.", "Si lo que se dijo sigue siendo verdad, puedes no cambiarlo."]}, {"key": "Ejercicio", "items": ["She said she ___ come. (would / will) → **would**"]}, {"key": "Habla", "items": ["\"He said he ___ / They said they ___.\""]}], "exercise": {"stem": "She said she ___ come.", "options": ["would", "will"], "answer": "would"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["She told me that she would call later. He asked where I had been. They said the train had been delayed."]}, {"key": "Repaso", "items": ["*say* vs. *tell*, verbos + infinitivo, verbos + *-ing*, preguntas indirectas, órdenes indirectas, cambio de tiempos."]}, {"key": "Actividad de habla", "items": ["cuenta algo que te dijo alguien esta semana usando *He said that...* o *She told me to...*."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases de estilo indirecto sobre una conversación real o inventada."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 told, 2 promised, 3 going, 4 breaking, 5 where, 6 was, 7 to drink, 8 would, 9 had, 10 could"]}], "exercise": null}], "exam": [{"stem": "She ___ me that she was tired.", "options": ["told", "said"], "answer": "told"}, {"stem": "He ___ to help us with the move.", "options": ["promised", "told"], "answer": "promised"}, {"stem": "She suggested ___ to the cinema.", "options": ["going", "to go"], "answer": "going"}, {"stem": "He admitted ___ the window.", "options": ["breaking", "break"], "answer": "breaking"}, {"stem": "She asked me ___ I lived.", "options": ["where", "where did"], "answer": "where"}, {"stem": "He asked me if I ___ ready.", "options": ["was", "am"], "answer": "was"}, {"stem": "The doctor told me ___ more water.", "options": ["to drink", "drink"], "answer": "to drink"}, {"stem": "She said she ___ come.", "options": ["would", "will"], "answer": "would"}, {"stem": "\"I have finished,\" he said. He said that he ___ finished.", "options": ["had", "has"], "answer": "had"}, {"stem": "They said they ___ finish the report.", "options": ["could", "can"], "answer": "could"}]}, {"id": "b2-u6", "level": "B2", "num": 6, "title": "Medio ambiente", "meta": "hablar de problemas ambientales, soluciones y hábitos con vocabulario y gramática de B2.", "lessons": [{"n": 1, "title": "Contaminación y residuos (pollution, emissions, waste)", "sections": [{"key": "Tema", "items": ["nombrar los problemas ambientales más comunes."]}, {"key": "Vocabulario", "items": ["pollution (contaminación), emissions (emisiones), waste (basura, residuos), cities (ciudades), cars (coches)"]}, {"key": "Lectura", "items": ["Pollution and waste are big problems in many cities. Cars produce a lot of emissions."]}, {"k wable**"]}, {"key": "Habla", "items": ["\"___ power is a renewable energy.\""]}], "exercise": {"stem": "Solar and wind power are ___ energies.", "options": ["renewable", "reusable"], "answer": "renewable"}}, {"n": 4, "title": "Cambio climático (climate change, global warming)", "sections": [{"key": "Tema", "items": ["explicar qué es el cambio climático y sus efectos."]}, {"key": "Vocabulario", "items": ["climate (clima), warming (calentamiento), temperatures (temperaturas), rise (subir), planet (planeta)"]}, {"key": "Lectura", "items": ["Climate change is causing temperatures to rise. Global warming makes the ice melt."]}, {"key": "Notas", "items": ["*climate change* = cambio climático. *global warming* = calentamiento global.", "*weather* = tiempo atmosférico de hoy. *climate* = clima de muchos años."]}, {"key": "Ejercicio", "items": ["___ change affects the whole planet. (Climate / Weather) → **Climate**"]}, {"key": "Habla", "items": ["\"Climate change is causing ___.\""]}], "exercise": {"stem": "___ change affects the whole planet.", "options": ["Climate", "Weather"], "answer": "Climate"}}, {"n": 5, "title": "Hábitos para ahorrar (conserve, turn off)", "sections": [{"key": "Tema", "items": ["hablar de hábitos diarios que ayudan al planeta."]}, {"key": "Vocabulario", "items": ["conserve (conservar), turn off (apagar), lights (luces), water (agua), leave (salir, dejar)"]}, {"key": "Lectura", "items": ["Let's conserve water and turn off the lights when we leave."]}, {"key": "Notas", "items": ["*turn off* = apagar. *turn on* = encender.", "*conserve* = usar con cuidado para no gastar de más."]}, {"key": "Ejercicio", "items": ["Please ___ the lights when you leave. (turn off / turn on) → **turn off**"]}, {"key": "Habla", "items": ["\"I always ___ before I leave the house.\""]}], "exercise": {"stem": "Please ___ the lights when you leave.", "options": ["turn off", "turn on"], "answer": "turn off"}}, {"n": 6, "title": "Condicional y medio ambiente (If we used less...)", "sections": [{"key": "Tema", "items": ["hablar de lo que pasaría si cambiamos hábitos (segundo condicional)."]}, {"key": "Vocabulario", "items": ["used (usáramos), less (menos), oceans (océanos), cleaner (más limpios), cut down (talar)"]}, {"key": "Lectura", "items": ["If we used less plastic, the oceans would be cleaner. If we cut down fewer trees, the air would be better."]}, {"key": "Notas", "items": ["Segundo condicional: *If + past simple, would + verbo base*.", "Usa el pasado simple para algo que no pasa ahora: *If we used* (aunque sea presente)."]}, {"key": "Ejercicio", "items": ["If we ___ less plastic, the oceans would be cleaner. (used / use) → **used**"]}, {"key": "Habla", "items": ["\"If we ___, the ___ would be ___.\""]}], "exercise": {"stem": "If we ___ less plastic, the oceans would be cleaner.", "options": ["used", "use"], "answer": "used"}}, {"n": 7, "title": "Repaso y hablar", "sections": [{"key": "Lectura de repaso", "items": ["Air pollution is a serious problem in big cities. Plastic waste is damaging the oceans. We must recycle more and use less energy."]}, {"key": "Repaso", "items": ["contaminación y residuos, las tres R, energías renovables, cambio climático, hábitos de ahorro, segundo condicional con medio ambiente."]}, {"key": "Actividad de habla", "items": ["explica a alguien qué haces tú para cuidar el planeta y qué harías si tuvieras más dinero para ayudar."]}, {"key": "Actividad escrita", "items": ["escribe 6 frases sobre tu ciudad: 3 con problemas y 3 con soluciones."]}], "exercise": null}, {"n": 8, "title": "Examen de la unidad", "sections": [{"key": "Respuestas", "items": ["1 emissions, 2 recycle, 3 renewable, 4 Climate, 5 turn off, 6 used, 7 pollution, 8 conserve, 9 warming, 10 reuse"]}], "exercise": null}], "exam": [{"stem": "Cars produce a lot of ___.", "options": ["emissions", "emotions"], "answer": "emissions"}, {"stem": "Please ___ this plastic bottle.", "options": ["recycle", "recyclable"], "answer": "recycle"}, {"stem": "Sola ", "items": ["prescription (receta médica), pharmacy (farmacia), recover (recuperarse), medicine (medicina), doctor (médico)"]}, {"key": "Lectura", "items": ["The doctor gave me a prescription. I need to go to the pharmacy. I hope I recover quickly."]}, {"key": "Notas", "items": ["*prescription* = receta del médico. *description* = descripción (¡son palabras distintas!).", "*recover* = recuperarse de una enfermedad."]}, {"key": "Ejercicio", "items": ["I need to go to the ___ to buy the medicine. (pharmacy / library) → **pharmacy**"]}, {"key": "Habla", "items": ["\"The doctor gave me ___.\""]}], "exercise": {"stem": "I need to go to the ___ to buy the medicine.", "options": ["pharmacy", "library"], "answer": "pharmacy"}}, {"n": 3, "title": "Consejos con should y ought to", "sections": [{"key": "Tema", "items": ["dar consejos sobre salud."]}, {"key": "Vocabulario", "items": ["should (deberías), ought to (deberías), rest (descansar), drink (beber), doctor (médico)"]}, {"key": "Lectura", "items": ["You should rest. You ought to see a doctor."]}, {"key": "Notas", "items": ["*should* + verbo base: *You should rest*.", "*ought to* + verbo base: *You ought to see a doctor*. Tiene el mismo significado que *should*.", "En negativo: *shouldn't* (no deberías)."]}, {"key": "Ejercicio", "items": ["You ___ drink more water. (should / shall) → **should**"]}, {"key": "Habla", "items": ["\"You should ___. You shouldn't ___.\""]}], "exercise": {"stem": "You ___ drink more water.", "options": ["should", "shall"], "answer": "should"}}, {"n": 4, "title": "Consejos urgentes con had better", "sections": [{"key": "Tema", "items": ["dar avisos o consejos fuertes."]}, {"key": "Vocabulario", "items": ["had better (más te vale), take (tomar), break (descanso), rest (descansar), today (hoy)"]}, {"key": "Lectura", "items": ["You'd better rest today. You'd better take a break."]}, {"key": "Notas", "items": ["*had better* + verbo base: *You'd better rest* = *más te vale descansar*.", "Es más fuerte
